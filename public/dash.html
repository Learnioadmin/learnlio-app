<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard · Learnlio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Global CSS -->
  <link rel="stylesheet" href="/assets/css/app.css">

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    window.PAGE = "dash";
  </script>
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container">
    <nav class="navbar">
      <a class="brand" href="/dash.html">
        <img src="https://assets.softr-files.com/applications/67a2863a-6210-4748-a054-0d80961b8e92/assets/383bd953-a636-47a6-8894-3e7e90d6c00c.webp" alt="Learnlio">
        <div class="brand-text">
          <strong>Learnlio</strong>
          <span>Friendly learning support</span>
        </div>
      </a>

      <button class="menu-btn" id="menuBtn">☰ Menu</button>

      <div class="nav-links" id="navLinks">
        <a class="nav-link active" href="/dash.html">Dashboard</a>
        <a class="nav-link" href="/chat.html">Learnlio Tutor</a>
        <a class="nav-link" href="/screener.html">Dyslexia Screener</a>
        <a class="nav-link" href="/reports.html">Reports</a>
        <a class="nav-cta" href="/chat.html">Start Tutor</a>
      </div>
    </nav>
  </div>
</header>

<!-- ================= PAGE ================= -->
<main class="page">
  <div class="container">

    <div class="page-title">
      <div>
        <h1>Dashboard</h1>
        <p>Add and manage your children</p>
      </div>
    </div>

    <!-- ADD CHILD CARD -->
    <div class="card stack-16">

      <h3>Add a child</h3>

      <div class="stack-12">
        <input id="childName" class="input" placeholder="Child’s name" />
        <input id="childDob" class="input" type="date" />
        <button id="addChildBtn" class="btn">Add child</button>
        <p id="formMessage" style="color:#dc2626;font-size:14px;"></p>
      </div>

    </div>

    <!-- CHILD LIST -->
    <div class="card stack-16" style="margin-top:20px;">
      <h3>Your children</h3>
      <div id="childrenList" class="stack-12">
        <p style="color:#6b7280;">Loading…</p>
      </div>
    </div>

  </div>
</main>

<!-- ================= SCRIPTS ================= -->
<script>
/* ---------- Mobile menu ---------- */
const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");
menuBtn.addEventListener("click", () => navLinks.classList.toggle("open"));

/* ---------- Supabase ---------- */
const supabase = window.supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_ANON_KEY"
);

/* ---------- Elements ---------- */
const addBtn = document.getElementById("addChildBtn");
const nameInput = document.getElementById("childName");
const dobInput = document.getElementById("childDob");
const listEl = document.getElementById("childrenList");
const msgEl = document.getElementById("formMessage");

/* ---------- Load user ---------- */
let currentUser = null;

async function init() {
  const { data, error } = await supabase.auth.getUser();
  if (error || !data.user) {
    window.location.href = "/login.html";
    return;
  }
  currentUser = data.user;
  loadChildren();
}

/* ---------- Load children ---------- */
async function loadChildren() {
  listEl.innerHTML = "<p style='color:#6b7280;'>Loading…</p>";

  const { data, error } = await supabase
    .from("children")
    .select("*")
    .eq("parent_id", currentUser.id)
    .order("created_at", { ascending: true });

  if (error) {
    listEl.innerHTML = "<p style='color:#dc2626;'>Failed to load children.</p>";
    return;
  }

  if (!data.length) {
    listEl.innerHTML = "<p style='color:#6b7280;'>No children added yet.</p>";
    return;
  }

  listEl.innerHTML = "";
  data.forEach(child => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <strong>${child.name}</strong><br>
      <span style="color:#6b7280;">Born ${child.dob}</span>
    `;
    listEl.appendChild(div);
  });
}

/* ---------- Add child ---------- */
addBtn.addEventListener("click", async () => {
  msgEl.textContent = "";

  const name = nameInput.value.trim();
  const dob = dobInput.value;

  if (!name || !dob) {
    msgEl.textContent = "Please enter a name and date of birth.";
    return;
  }

  const { error } = await supabase
    .from("children")
    .insert({
      parent_id: currentUser.id,
      name: name,
      dob: dob
    });

  if (error) {
    msgEl.textContent = error.message;
    return;
  }

  nameInput.value = "";
  dobInput.value = "";
  loadChildren();
});

/* ---------- Start ---------- */
init();
</script>

</body>
</html>
