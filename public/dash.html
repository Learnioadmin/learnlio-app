<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Dashboard</title>

  <!-- App CSS (must exist at public/assets/css/app.css) -->
  <link rel="stylesheet" href="/assets/css/app.css" />

  <!-- Minimal fallback styles (in case CSS path breaks) -->
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .container { max-width: 980px; margin: 0 auto; padding: 18px; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .row { display:flex; gap:14px; flex-wrap:wrap; }
    .col { flex:1 1 320px; }
    .label { display:block; font-size: 13px; color:#333; margin: 10px 0 6px; }
    .input { width:100%; padding:12px; border-radius:12px; border:1px solid #d6d6e3; font-size:16px; }
    .btn { background:#0b5cff; border:none; color:#fff; padding:12px 14px; border-radius:12px; cursor:pointer; font-size:15px; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .btn.secondary { background:#111827; }
    .btn.light { background:#e5e7eb; color:#111; }
    .muted { color:#6b7280; font-size: 14px; }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; }
    .brand img { height:34px; width:auto; display:block; }
    .links { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .links a { text-decoration:none; color:#111; padding:10px 12px; border-radius:12px; }
    .links a.active { background:#eef2ff; }
    .children-list .child-card { border:1px solid #eef2f7; border-radius:14px; padding:12px; margin:10px 0; background:#fff; }
    .child-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#f3f4f6; font-size:12px; color:#111; }
    .status { margin-top:10px; font-size:14px; }
    .status.good { color:#16a34a; }
    .status.bad { color:#dc2626; }
    .banner { background:#fff7ed; border:1px solid #fed7aa; border-radius:16px; padding:14px; }
    .banner h3 { margin:0 0 6px; }
  </style>

  <!-- Supabase JS (must be loaded once) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a class="active" href="/dash.html">Dashboard</a>
        <a href="/chat.html">Learnlio Tutor</a>
        <a href="/screener.html">Dyslexia Screener</a>
        <a href="/reports.html">Reports</a>
        <button id="logoutBtn" class="btn light" type="button">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="trialBanner" class="banner" style="display:none; margin-bottom:14px;"></div>

    <div class="row" id="dashGrid">
      <section class="col">
        <div class="card">
          <h2 style="margin:0 0 6px;">Add a child</h2>
          <p class="muted" style="margin:0 0 14px;">
            Create a child profile. Then select them for Learnlio Tutor.
          </p>

          <label class="label" for="childName">Child name</label>
          <input id="childName" class="input" placeholder="e.g. Ava" autocomplete="off"/>

          <label class="label" for="childDob">Date of birth</label>
          <input id="childDob" class="input" type="date"/>

          <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
            <button id="addChildBtn" class="btn" type="button">Add child</button>
            <button id="refreshBtn" class="btn secondary" type="button">Refresh list</button>
          </div>

          <div id="formMessage" class="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="col">
        <div class="card">
          <h2 style="margin:0 0 6px;">Your children</h2>
          <p class="muted" style="margin:0 0 14px;">
            Click <strong>Select</strong> to set the active child for the Tutor.
          </p>

          <div id="childrenList" class="children-list">
            <div class="muted">Loading…</div>
          </div>

          <div style="margin-top:14px;">
            <div class="muted">Selected child:</div>
            <div id="selectedChildLabel" class="pill">None selected</div>
          </div>

          <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn" href="/chat.html" style="text-decoration:none; display:inline-block;">Go to Tutor</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
  (() => {
    // ====== CONFIG (PASTE YOUR VALUES) ======
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    // =======================================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (!sb) {
      console.error("Supabase JS failed to load.");
      return;
    }

    // Elements
    const addBtn = document.getElementById("addChildBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const nameInput = document.getElementById("childName");
    const dobInput = document.getElementById("childDob");
    const listEl = document.getElementById("childrenList");
    const msgEl = document.getElementById("formMessage");
    const selectedChildLabel = document.getElementById("selectedChildLabel");
    const logoutBtn = document.getElementById("logoutBtn");

    const trialBanner = document.getElementById("trialBanner");
    const dashGrid = document.getElementById("dashGrid");

    let currentUser = null;
    let trialAllowed = true;

    function setMsg(text, good=false) {
      msgEl.textContent = text || "";
      msgEl.className = "status " + (text ? (good ? "good" : "bad") : "");
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[s]));
    }

    function setSelectedChildUI() {
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) { selectedChildLabel.textContent = "None selected"; return; }
        const obj = JSON.parse(raw);
        selectedChildLabel.textContent = obj?.name ? `${obj.name} (DOB: ${obj.dob})` : "None selected";
      } catch {
        selectedChildLabel.textContent = "None selected";
      }
    }

    function disableDashboard(disabled) {
      addBtn.disabled = disabled;
      refreshBtn.disabled = disabled;
      nameInput.disabled = disabled;
      dobInput.disabled = disabled;
      if (disabled) {
        // prevent accidental selection when expired
        Array.from(document.querySelectorAll("#childrenList button")).forEach(b => b.disabled = true);
      }
    }

    async function requireAuth() {
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) {
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    // -----------------------
    // TRIAL GATE (Dash)
    // -----------------------
    async function enforceTrialGate() {
      // If you decide later to allow "active" subs, this already does.
      // Allowed statuses: trialing, active
      // Blocks: expired trial (trial_ends_at < now) and status not allowed.

      const { data, error } = await sb
        .from("subscriptions")
        .select("user_id, status, trial_ends_at, plan")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (error) {
        // If subscriptions table is missing or RLS blocks, surface clearly
        trialBanner.style.display = "block";
        trialBanner.innerHTML = `
          <h3>We can’t check your trial right now.</h3>
          <div class="muted">Error: ${escapeHtml(error.message)}</div>
        `;
        // Don’t hard-block if it’s a temporary check issue — but you can change this to block if you prefer.
        return true;
      }

      // If no row exists yet, treat as allowed for MVP (or block if you prefer).
      if (!data) return true;

      const status = (data.status || "").toLowerCase();
      const allowedStatus = (status === "trialing" || status === "active");

      let endsOk = true;
      if (data.trial_ends_at) {
        const ends = new Date(data.trial_ends_at);
        if (!isNaN(ends.getTime())) {
          endsOk = ends.getTime() >= Date.now();
        }
      }

      if (!allowedStatus || !endsOk) {
        trialAllowed = false;
        trialBanner.style.display = "block";
        trialBanner.innerHTML = `
          <h3>Your free trial has ended</h3>
          <div class="muted" style="margin-top:6px;">
            Please upgrade to keep using Learnlio.
          </div>
          <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn" href="/billing.html" style="text-decoration:none; display:inline-block;">Upgrade</a>
            <button id="logoutExpiredBtn" class="btn light" type="button">Log out</button>
          </div>
        `;

        // Disable dashboard actions
        disableDashboard(true);

        // optional: hide the grid interaction feel
        dashGrid.style.opacity = "0.6";

        const lo = document.getElementById("logoutExpiredBtn");
        if (lo) lo.addEventListener("click", async () => {
          await sb.auth.signOut();
          localStorage.removeItem("selectedChild");
          window.location.href = "/login.html";
        });

        return false;
      }

      // Trial allowed — optionally show remaining days
      if (data.trial_ends_at && status === "trialing") {
        const ends = new Date(data.trial_ends_at);
        const daysLeft = Math.ceil((ends.getTime() - Date.now()) / (1000*60*60*24));
        if (!isNaN(daysLeft) && daysLeft >= 0) {
          trialBanner.style.display = "block";
          trialBanner.innerHTML = `
            <h3>Trial active</h3>
            <div class="muted" style="margin-top:6px;">
              You have <strong>${daysLeft}</strong> day${daysLeft === 1 ? "" : "s"} left.
            </div>
          `;
        }
      }

      return true;
    }

    async function loadChildren() {
      setMsg("");
      listEl.innerHTML = `<div class="muted">Loading…</div>`;

      const { data, error } = await sb
        .from("children")
        .select("id, child_name, child_dob, created_at")
        .eq("parent_user_id", currentUser.id)
        .order("created_at", { ascending: true });

      if (error) {
        listEl.innerHTML = `<div class="status bad">Couldn’t load children: ${escapeHtml(error.message)}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = `<div class="muted">No children added yet.</div>`;
        return;
      }

      listEl.innerHTML = "";
      data.forEach(ch => {
        const card = document.createElement("div");
        card.className = "child-card";

        const name = ch.child_name ?? "(No name)";
        const dob = ch.child_dob ?? "(No DOB)";

        card.innerHTML = `
          <div class="child-top">
            <div>
              <div style="font-weight:700;">${escapeHtml(name)}</div>
              <div class="muted" style="margin-top:4px;">DOB: ${escapeHtml(dob)}</div>
            </div>
            <button class="btn" type="button" data-id="${ch.id}">Select</button>
          </div>
        `;

        const btn = card.querySelector("button[data-id]");
        btn.addEventListener("click", () => {
          localStorage.setItem("selectedChild", JSON.stringify({ id: ch.id, name, dob }));
          setSelectedChildUI();
          setMsg(`Selected child: ${name}`, true);
        });

        listEl.appendChild(card);
      });

      // If trial is not allowed, disable select buttons too
      if (!trialAllowed) disableDashboard(true);
    }

    async function addChild() {
      setMsg("");

      if (!trialAllowed) {
        setMsg("Your trial has ended. Please upgrade to add children.");
        return;
      }

      const name = nameInput.value.trim();
      const dob = dobInput.value;

      if (!name || !dob) {
        setMsg("Please enter a child name and date of birth.");
        return;
      }

      addBtn.disabled = true;

      const { error } = await sb.from("children").insert({
        parent_user_id: currentUser.id,
        child_name: name,
        child_dob: dob
      });

      addBtn.disabled = false;

      if (error) {
        setMsg("Couldn’t add child: " + error.message);
        return;
      }

      nameInput.value = "";
      dobInput.value = "";
      setMsg("Child added ✅", true);

      await loadChildren();
    }

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    addBtn.addEventListener("click", addChild);
    refreshBtn.addEventListener("click", loadChildren);

    // Init
    (async () => {
      const ok = await requireAuth();
      if (!ok) return;

      setSelectedChildUI();

      // Trial gate must run BEFORE loading
      const trialOk = await enforceTrialGate();
      if (!trialOk) {
        // still load children list so they can see profiles, but disable actions
        await loadChildren();
        return;
      }

      await loadChildren();
    })();
  })();
  </script>
</body>
</html>
