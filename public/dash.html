<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --ink:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --bg:#f3f4f6;
      --blue:#007bff;
      --blue2:#0056b3;
      --border:#e5e7eb;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* NAV (same as screener / reports) */
    .nav{
      position:sticky; top:0; z-index:10;
      background:#fff;
      border-bottom:1px solid var(--border);
    }
    .nav-inner{
      max-width:1100px;
      margin:0 auto;
      padding:10px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      text-decoration:none; color:var(--ink);
    }
    .brand img{
      height:34px; width:auto;
      border-radius:8px;
      display:block;
    }
    .brand-title{
      font-weight:800;
    }
    .nav-links{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .nav-links a, .nav-links button{
      font-size:14px;
      text-decoration:none;
      color:var(--ink);
      padding:8px 10px;
      border-radius:10px;
      border:1px solid transparent;
      background:transparent;
      cursor:pointer;
    }
    .nav-links a:hover, .nav-links button:hover{
      background:#f9fafb;
      border-color:var(--border);
    }

    .page{
      max-width:1100px;
      margin:0 auto;
      padding:20px 14px 40px;
    }

    h1{
      margin:0 0 6px;
      font-size:26px;
    }
    .sub{
      color:var(--muted);
      margin-bottom:20px;
    }

    /* Cards */
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap:16px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow:0 4px 14px rgba(0,0,0,0.05);
    }

    .child-name{
      font-size:18px;
      font-weight:700;
      margin-bottom:4px;
    }
    .child-age{
      color:var(--muted);
      font-size:14px;
      margin-bottom:12px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .btn{
      border:none;
      border-radius:12px;
      padding:10px 14px;
      font-size:14px;
      cursor:pointer;
      color:#fff;
      background:var(--blue);
    }
    .btn:hover{ background:var(--blue2); }
    .btn.secondary{
      background:#374151;
    }
    .btn.secondary:hover{
      background:#1f2937;
    }

    /* Add child form */
    .add-child{
      margin-top:30px;
      max-width:420px;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:4px;
      margin-bottom:12px;
    }
    .field label{
      font-size:14px;
      color:#374151;
    }
    .field input{
      padding:12px;
      border-radius:10px;
      border:1px solid var(--border);
      font-size:15px;
    }

    .notice{
      margin-top:12px;
      font-size:14px;
      color:#374151;
    }

    @media(max-width:480px){
      .brand-title{ display:none; }
    }
  </style>
</head>

<body>
  <!-- NAV -->
  <div class="nav">
    <div class="nav-inner">
      <a class="brand" href="dash.html">
        <img src="assets/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <div class="brand-title">Learnlio</div>
      </a>
      <div class="nav-links">
        <a href="dash.html" style="border-color:var(--border); background:#f9fafb;">Dashboard</a>
        <a href="chat.html">Tutor</a>
        <a href="screener.html">Screener</a>
        <a href="reports.html">Reports</a>
        <button id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>

  <!-- PAGE -->
  <div class="page">
    <h1>Your children</h1>
    <div class="sub">Choose a child to start learning</div>

    <div id="childrenGrid" class="grid"></div>

    <!-- Add child -->
    <div class="add-child card">
      <h2 style="margin-top:0;">Add a child</h2>

      <div class="field">
        <label>Child’s name</label>
        <input id="childName" placeholder="e.g. Ava">
      </div>

      <div class="field">
        <label>Date of birth</label>
        <input id="childDob" type="date">
      </div>

      <button id="addChildBtn" class="btn">Add child</button>
      <div id="formNotice" class="notice"></div>
    </div>
  </div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY";
const LOGIN_PAGE = "login.html";

/* ================= CLIENT ================= */
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= ELEMENTS ================= */
const grid = document.getElementById("childrenGrid");
const addBtn = document.getElementById("addChildBtn");
const nameInput = document.getElementById("childName");
const dobInput = document.getElementById("childDob");
const notice = document.getElementById("formNotice");
const logoutBtn = document.getElementById("logoutBtn");

let user = null;

/* ================= HELPERS ================= */
function ageFromDob(dob){
  const d = new Date(dob);
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age;
}

function childCard(child){
  const age = child.dob ? ageFromDob(child.dob) : "—";

  return `
    <div class="card">
      <div class="child-name">${child.name}</div>
      <div class="child-age">Age ${age}</div>
      <div class="actions">
        <button class="btn" onclick="goTutor('${child.id}')">Tutor</button>
        <button class="btn secondary" onclick="goScreener('${child.id}')">Screener</button>
      </div>
    </div>
  `;
}

window.goTutor = (id) => {
  window.location.href = `chat.html?child_id=${id}`;
};
window.goScreener = (id) => {
  window.location.href = `screener.html?child_id=${id}`;
};

/* ================= LOAD ================= */
async function loadChildren(){
  const { data, error } = await supabase
    .from("children")
    .select("*")
    .eq("owner_id", user.id)
    .order("created_at", { ascending: true });

  if (error){
    grid.innerHTML = "<p>Could not load children.</p>";
    return;
  }

  if (!data.length){
    grid.innerHTML = "<p>No children added yet.</p>";
    return;
  }

  grid.innerHTML = data.map(childCard).join("");
}

/* ================= ADD CHILD ================= */
addBtn.onclick = async () => {
  notice.innerText = "";

  const name = nameInput.value.trim();
  const dob = dobInput.value;

  if (!name || !dob){
    notice.innerText = "Please enter name and date of birth.";
    return;
  }

  const { error } = await supabase
    .from("children")
    .insert({
      owner_id: user.id,
      name,
      dob
    });

  if (error){
    notice.innerText = "Could not add child.";
    return;
  }

  nameInput.value = "";
  dobInput.value = "";
  notice.innerText = "Child added ✔";

  loadChildren();
};

/* ================= INIT ================= */
async function init(){
  const { data, error } = await supabase.auth.getUser();
  user = data?.user || null;

  if (!user){
    window.location.href = LOGIN_PAGE;
    return;
  }

  logoutBtn.onclick = async () => {
    await supabase.auth.signOut();
    window.location.href = LOGIN_PAGE;
  };

  loadChildren();
}

init();
</script>
</body>
</html>
