<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Learnlio</title>

  <!-- Global CSS (must exist at /public/assets/css/app.css) -->
  <link rel="stylesheet" href="/assets/css/app.css">

  <!-- FAILSAFE (prevents huge logo / ugly nav if CSS fails to load) -->
  <style>
    .site-header{position:sticky;top:0;z-index:50;background:rgba(246,248,251,.86);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}
    .container{width:min(1060px,calc(100% - 32px));margin:0 auto}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;min-width:180px;text-decoration:none;color:#111827}
    .brand img{height:34px;max-height:34px;width:auto;display:block} /* hard lock logo */
    .brand-text{display:flex;flex-direction:column;line-height:1.1}
    .brand-text strong{font-size:14px}
    .brand-text span{font-size:12px;color:#6b7280}
    .nav-links{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .nav-link{padding:10px 12px;border-radius:12px;color:#111827;font-weight:700;font-size:14px;border:1px solid transparent;text-decoration:none}
    .nav-link:hover{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.18)}
    .nav-link.active{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.22)}
    .nav-cta{padding:10px 14px;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;font-size:14px;text-decoration:none}
    .nav-cta:hover{background:#1d4ed8}
    .menu-btn{display:none;padding:10px 12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:800}
    @media (max-width:820px){
      .menu-btn{display:inline-flex;align-items:center;gap:8px}
      .nav-links{display:none;width:100%;padding:12px;margin-top:10px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 10px 30px rgba(17,24,39,.08);justify-content:flex-start}
      .nav-links.open{display:flex}
    }
    body{margin:0;background:#f6f8fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111827}
    .page{padding:22px 0 42px}
    .page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 18px}
    .page-title h1{font-size:26px;margin:0}
    .page-title p{margin:6px 0 0;color:#6b7280;font-size:14px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 10px 30px rgba(17,24,39,.08);padding:18px}
    .stack-12>*+*{margin-top:12px}
    .stack-16>*+*{margin-top:16px}
    .input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #e5e7eb;outline:none;font-size:15px}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}
    .btn:hover{background:#1d4ed8}
  </style>

  <!-- Supabase JS v2 -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>window.PAGE="dash";</script>
</head>

<body>

<header class="site-header">
  <div class="container">
    <nav class="navbar">
      <a class="brand" href="/dash.html">
        <img src="https://assets.softr-files.com/applications/67a2863a-6210-4748-a054-0d80961b8e92/assets/383bd953-a636-47a6-8894-3e7e90d6c00c.webp" alt="Learnlio">
        <div class="brand-text">
          <strong>Learnlio</strong>
          <span>Friendly learning support</span>
        </div>
      </a>

      <button class="menu-btn" id="menuBtn" type="button">☰ Menu</button>

      <div class="nav-links" id="navLinks">
        <a class="nav-link active" href="/dash.html">Dashboard</a>
        <a class="nav-link" href="/chat.html">Learnlio Tutor</a>
        <a class="nav-link" href="/screener.html">Dyslexia Screener</a>
        <a class="nav-link" href="/reports.html">Reports</a>
        <a class="nav-cta" href="/chat.html">Start Tutor</a>
      </div>
    </nav>
  </div>
</header>

<main class="page">
  <div class="container">

    <div class="page-title">
      <div>
        <h1>Dashboard</h1>
        <p>Add and manage your children.</p>
      </div>
    </div>

    <div class="card stack-16">
      <h3 style="margin:0;">Add a child</h3>

      <div class="stack-12">
        <input id="childName" class="input" placeholder="Child’s name" autocomplete="off" />
        <input id="childDob" class="input" type="date" />
        <button id="addChildBtn" class="btn" type="button">Add child</button>
        <div id="formMessage" style="font-size:14px;color:#dc2626;"></div>
      </div>
    </div>

    <div class="card stack-16" style="margin-top:18px;">
      <h3 style="margin:0;">Your children</h3>
      <div id="childrenList" class="stack-12">
        <div style="color:#6b7280;">Loading…</div>
      </div>
    </div>

  </div>
</main>

<script>
(() => {
  // Mobile menu
  const menuBtn = document.getElementById("menuBtn");
  const navLinks = document.getElementById("navLinks");
  if (menuBtn && navLinks) menuBtn.addEventListener("click", () => navLinks.classList.toggle("open"));

  // IMPORTANT: do NOT declare "supabase" again (it may already exist globally)
  const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

  // Use a different variable name to avoid collisions
  const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if (!sb) {
    console.error("Supabase library not found. Check the supabase-js script tag.");
    return;
  }

  // Elements
  const addBtn = document.getElementById("addChildBtn");
  const nameInput = document.getElementById("childName");
  const dobInput = document.getElementById("childDob");
  const listEl = document.getElementById("childrenList");
  const msgEl = document.getElementById("formMessage");

  let currentUser = null;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[s]));
  }
  function escapeHtmlAttr(str){ return escapeHtml(str).replace(/"/g,"&quot;"); }

  async function init() {
    const { data, error } = await sb.auth.getUser();
    if (error || !data?.user) {
      window.location.href = "/login.html";
      return;
    }
    currentUser = data.user;
    await loadChildren();
  }

  async function loadChildren() {
    listEl.innerHTML = `<div style="color:#6b7280;">Loading…</div>`;

    const { data, error } = await sb
      .from("children")
      .select("id,name,dob,created_at")
      .eq("parent_id", currentUser.id)
      .order("created_at", { ascending: true });

    if (error) {
      listEl.innerHTML = `<div style="color:#dc2626;">Couldn’t load children: ${error.message}</div>`;
      return;
    }

    if (!data || data.length === 0) {
      listEl.innerHTML = `<div style="color:#6b7280;">No children added yet.</div>`;
      return;
    }

    listEl.innerHTML = "";
    data.forEach(ch => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.boxShadow = "none";
      card.style.border = "1px solid #eef2f7";
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;">
          <div>
            <strong>${escapeHtml(ch.name)}</strong><br>
            <span style="color:#6b7280;font-size:13px;">DOB: ${ch.dob}</span>
          </div>
          <button class="btn" type="button" style="padding:10px 12px;font-size:13px;"
            data-child-id="${ch.id}"
            data-child-name="${escapeHtmlAttr(ch.name)}"
            data-child-dob="${ch.dob}">
            Select
          </button>
        </div>
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll("button[data-child-id]").forEach(btn => {
      btn.addEventListener("click", () => {
        const child = {
          id: btn.getAttribute("data-child-id"),
          name: btn.getAttribute("data-child-name"),
          dob: btn.getAttribute("data-child-dob"),
        };
        localStorage.setItem("selectedChild", JSON.stringify(child));
        msgEl.style.color = "#16a34a";
        msgEl.textContent = `Selected child: ${child.name}. You can open Learnlio Tutor now.`;
      });
    });
  }

  addBtn.addEventListener("click", async () => {
    msgEl.style.color = "#dc2626";
    msgEl.textContent = "";

    const name = nameInput.value.trim();
    const dob = dobInput.value;

    if (!name || !dob) {
      msgEl.textContent = "Please enter a child name and date of birth.";
      return;
    }

    const { error } = await sb.from("children").insert({
      parent_id: currentUser.id,
      name,
      dob
    });

    if (error) {
      msgEl.textContent = `Couldn’t add child: ${error.message}`;
      return;
    }

    nameInput.value = "";
    dobInput.value = "";
    msgEl.style.color = "#16a34a";
    msgEl.textContent = "Child added ✅";

    await loadChildren();
  });

  init();
})();
</script>


</body>
</html>
