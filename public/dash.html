<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Dashboard</title>

  <!-- App CSS (must exist at public/assets/css/app.css) -->
  <link rel="stylesheet" href="/assets/css/app.css" />

  <!-- Minimal fallback styles (in case CSS path breaks) -->
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .container { max-width: 980px; margin: 0 auto; padding: 18px; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .row { display:flex; gap:14px; flex-wrap:wrap; }
    .col { flex:1 1 320px; }
    .label { display:block; font-size: 13px; color:#333; margin: 10px 0 6px; }
    .input { width:100%; padding:12px; border-radius:12px; border:1px solid #d6d6e3; font-size:16px; }
    .btn { background:#0b5cff; border:none; color:#fff; padding:12px 14px; border-radius:12px; cursor:pointer; font-size:15px; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .btn.secondary { background:#111827; }
    .btn.light { background:#e5e7eb; color:#111; }
    .muted { color:#6b7280; font-size: 14px; }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; }
    .brand img { height:34px; width:auto; display:block; }
    .links { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .links a { text-decoration:none; color:#111; padding:10px 12px; border-radius:12px; }
    .links a.active { background:#eef2ff; }
    .children-list .child-card { border:1px solid #eef2f7; border-radius:14px; padding:12px; margin:10px 0; background:#fff; }
    .child-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#f3f4f6; font-size:12px; color:#111; }
    .status { margin-top:10px; font-size:14px; }
    .status.good { color:#16a34a; }
    .status.bad { color:#dc2626; }
    .banner { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:14px; background:#fff7ed; border:1px solid #fed7aa; margin-bottom:14px; }
    .banner strong { font-weight:700; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a class="active" href="/dash.html">Dashboard</a>
        <a href="/chat.html">Learnlio Tutor</a>
        <a href="/screener.html">Dyslexia Screener</a>
        <a href="/reports.html">Reports</a>
        <a href="/billing.html">Billing</a>
        <button id="logoutBtn" class="btn light" type="button">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- Access banner -->
    <div id="accessBanner" class="banner" style="display:none;">
      <div>
        <div class="pill" id="accessPill">Checking…</div>
        <div class="muted" id="accessText" style="margin-top:6px;"></div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="refreshAccessBtn" class="btn light" type="button">Refresh access</button>
        <a class="btn" href="/billing.html" style="text-decoration:none; display:none;" id="goBillingBtn">Go to Billing</a>
      </div>
    </div>

    <div class="row">
      <section class="col">
        <div class="card">
          <h2 style="margin:0 0 6px;">Add a child</h2>
          <p class="muted" style="margin:0 0 14px;">
            Create a child profile. Then select them for Learnlio Tutor.
          </p>

          <label class="label" for="childName">Child name</label>
          <input id="childName" class="input" placeholder="e.g. Ava" autocomplete="off"/>

          <label class="label" for="childDob">Date of birth</label>
          <input id="childDob" class="input" type="date"/>

          <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
            <button id="addChildBtn" class="btn" type="button">Add child</button>
            <button id="refreshBtn" class="btn secondary" type="button">Refresh list</button>
          </div>

          <div id="formMessage" class="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="col">
        <div class="card">
          <h2 style="margin:0 0 6px;">Your children</h2>
          <p class="muted" style="margin:0 0 14px;">
            Click <strong>Select</strong> to set the active child for the Tutor.
          </p>

          <div id="childrenList" class="children-list">
            <div class="muted">Loading…</div>
          </div>

          <div style="margin-top:14px;">
            <div class="muted">Selected child:</div>
            <div id="selectedChildLabel" class="pill">None selected</div>
          </div>

          <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn" href="/chat.html" style="text-decoration:none; display:inline-block;">Go to Tutor</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
  (() => {
    // ========= CONFIG =========
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const BILLING_API_BASE = "https://learnlio-billing.falling-grass-34ab.workers.dev"; // Worker
    // ==========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (!sb) { console.error("Supabase failed to load"); return; }

    // Elements
    const addBtn = document.getElementById("addChildBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const nameInput = document.getElementById("childName");
    const dobInput = document.getElementById("childDob");
    const listEl = document.getElementById("childrenList");
    const msgEl = document.getElementById("formMessage");
    const selectedChildLabel = document.getElementById("selectedChildLabel");
    const logoutBtn = document.getElementById("logoutBtn");

    const accessBanner = document.getElementById("accessBanner");
    const accessPill = document.getElementById("accessPill");
    const accessText = document.getElementById("accessText");
    const refreshAccessBtn = document.getElementById("refreshAccessBtn");
    const goBillingBtn = document.getElementById("goBillingBtn");

    let currentUser = null;

    function setMsg(text, good=false) {
      msgEl.textContent = text || "";
      msgEl.className = "status " + (good ? "good" : "bad");
      if (!text) msgEl.className = "status";
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[s]));
    }

    function setSelectedChildUI() {
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) { selectedChildLabel.textContent = "None selected"; return; }
        const obj = JSON.parse(raw);
        selectedChildLabel.textContent = obj?.name ? `${obj.name} (DOB: ${obj.dob})` : "None selected";
      } catch {
        selectedChildLabel.textContent = "None selected";
      }
    }

    async function requireAuth() {
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) {
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    function formatDateDDMMYYYY(isoLike) {
      if (!isoLike) return "";
      const d = new Date(isoLike);
      if (isNaN(d.getTime())) {
        const s = String(isoLike).slice(0,10);
        const parts = s.split("-");
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        return s;
      }
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth()+1).padStart(2, "0");
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    async function getAccessTokenOrThrow() {
      let { data: sessionData } = await sb.auth.getSession();
      let accessToken = sessionData?.session?.access_token;

      if (!accessToken) {
        const refreshed = await sb.auth.refreshSession();
        accessToken = refreshed?.data?.session?.access_token;
      }
      if (!accessToken) throw new Error("No Supabase session token. Please log out and log in again.");
      return accessToken;
    }

    async function fetchMeNoCache() {
      const token = await getAccessTokenOrThrow();
      const res = await fetch(`${BILLING_API_BASE}/me`, {
        method: "GET",
        headers: {
          "Accept": "application/json",
          "Authorization": `Bearer ${token}`,
          "Cache-Control": "no-store",
          "Pragma": "no-cache"
        }
      });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch { throw new Error("Billing /me did not return JSON"); }
      if (!res.ok) throw new Error(json?.error || `HTTP ${res.status}`);
      return json;
    }

    function setAccessUi(pill, text, showBilling=false) {
      accessBanner.style.display = "flex";
      accessPill.textContent = pill;
      accessText.textContent = text || "";
      goBillingBtn.style.display = showBilling ? "inline-block" : "none";
    }

    // ✅ The important bit:
    // Treat status=active as the override even if trial_ends_at is in the past.
    function isAllowedByMe(me) {
      const status = me?.status || "none";

      if (status === "active") return { ok:true, reason:"Paid active" };

      if (status === "trialing") {
        if (!me.trial_ends_at) return { ok:true, reason:"Trial active" };
        const end = new Date(me.trial_ends_at);
        if (!isNaN(end.getTime()) && end.getTime() > Date.now()) return { ok:true, reason:"Trial active" };
        return { ok:false, reason:"Trial ended" };
      }

      if (status === "expired") return { ok:false, reason:"Trial ended" };

      // status "none" -> allowed for now (keep friction low)
      return { ok:true, reason:"No trial yet" };
    }

    async function enforceAccessGate() {
      // If you want dash to ALWAYS require active/trialing, change the "none" handling above.
      try {
        const me = await fetchMeNoCache();
        const verdict = isAllowedByMe(me);

        if (me.status === "active") {
          setAccessUi("Access active", me.plan ? `Plan: ${me.plan}` : "Paid account ✅", false);
          return true;
        }

        if (me.status === "trialing") {
          setAccessUi("Trial active", me.trial_ends_at ? `Ends: ${formatDateDDMMYYYY(me.trial_ends_at)}` : "", false);
          return true;
        }

        if (!verdict.ok) {
          setAccessUi("Trial ended", "Please activate access to continue.", true);
          // NOTE: We do NOT auto-redirect on dashboard (less annoying).
          // Tutor page can redirect if you prefer.
          return false;
        }

        // none/unknown
        setAccessUi("Free access", "You can start a trial or activate paid access anytime in Billing.", false);
        return true;

      } catch (e) {
        // If billing is down, don't lock people out from dashboard creation.
        setAccessUi("Access check failed", String(e.message || e), true);
        return true;
      }
    }

    async function loadChildren() {
      setMsg("");
      listEl.innerHTML = `<div class="muted">Loading…</div>`;

      const { data, error } = await sb
        .from("children")
        .select("id, child_name, child_dob, created_at")
        .eq("parent_user_id", currentUser.id)
        .order("created_at", { ascending: true });

      if (error) {
        listEl.innerHTML = `<div class="status bad">Couldn’t load children: ${escapeHtml(error.message)}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = `<div class="muted">No children added yet.</div>`;
        return;
      }

      listEl.innerHTML = "";
      data.forEach(ch => {
        const card = document.createElement("div");
        card.className = "child-card";

        const name = ch.child_name ?? "(No name)";
        const dob = ch.child_dob ?? "(No DOB)";

        card.innerHTML = `
          <div class="child-top">
            <div>
              <div style="font-weight:700;">${escapeHtml(name)}</div>
              <div class="muted" style="margin-top:4px;">DOB: ${escapeHtml(dob)}</div>
            </div>
            <button class="btn" type="button" data-id="${ch.id}">Select</button>
          </div>
        `;

        const btn = card.querySelector("button[data-id]");
        btn.addEventListener("click", () => {
          localStorage.setItem("selectedChild", JSON.stringify({ id: ch.id, name, dob }));
          setSelectedChildUI();
          setMsg(`Selected child: ${name}`, true);
        });

        listEl.appendChild(card);
      });
    }

    async function addChild() {
      setMsg("");

      const name = nameInput.value.trim();
      const dob = dobInput.value;

      if (!name || !dob) {
        setMsg("Please enter a child name and date of birth.");
        return;
      }

      addBtn.disabled = true;

      const { error } = await sb.from("children").insert({
        parent_user_id: currentUser.id,
        child_name: name,
        child_dob: dob
      });

      addBtn.disabled = false;

      if (error) {
        setMsg("Couldn’t add child: " + error.message);
        return;
      }

      nameInput.value = "";
      dobInput.value = "";
      setMsg("Child added ✅", true);

      await loadChildren();
    }

    refreshAccessBtn.addEventListener("click", enforceAccessGate);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    addBtn.addEventListener("click", addChild);
    refreshBtn.addEventListener("click", loadChildren);

    (async () => {
      const ok = await requireAuth();
      if (!ok) return;

      // Access check first (so banner shows immediately)
      await enforceAccessGate();

      setSelectedChildUI();
      await loadChildren();
    })();
  })();
  </script>
</body>
</html>
