<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Log in</title>

  <!-- App CSS -->
  <link rel="stylesheet" href="/assets/css/app.css" />

  <!-- Fallback styling if app.css path ever breaks -->
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:800; }
    .brand img { height:34px; width:auto; display:block; }
    .container { max-width: 560px; margin: 0 auto; padding: 22px 18px; }
    .card { background:#fff; border-radius:16px; padding:18px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .muted { color:#6b7280; font-size:14px; margin:0 0 18px; line-height:1.5; }
    label { display:block; font-size:14px; margin: 12px 0 6px; color:#111; }
    input { width:100%; box-sizing:border-box; padding:12px 12px; border:1px solid #d1d5db; border-radius:12px; font-size:15px; outline:none; }
    input:focus { border-color:#0b5cff; box-shadow:0 0 0 3px rgba(11,92,255,.12); }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top: 14px; }
    .btn { background:#0b5cff; border:none; color:#fff; padding:12px 14px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:700; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .btn.light { background:#e5e7eb; color:#111; font-weight:700; }
    .links { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top: 12px; }
    .link { background:transparent; border:none; padding:0; color:#0b5cff; cursor:pointer; font-size:14px; font-weight:700; }
    .status { margin-top:14px; font-size:14px; line-height:1.5; }
    .status.bad { color:#dc2626; }
    .status.good { color:#16a34a; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#eef2ff; color:#111; font-size:12px; font-weight:800; }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <span class="pill">Beta</span>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1 id="title">Log in</h1>
      <p class="muted" id="subtitle">
        Welcome back. Log in to continue.
      </p>

      <!-- IMPORTANT: prevent page refresh -->
      <form id="authForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required />

        <div class="row">
          <button id="primaryBtn" type="submit" class="btn">Log in</button>
          <button id="toggleBtn" type="button" class="btn light">Create account</button>
        </div>

        <div class="links">
          <button id="forgotBtn" type="button" class="link">Forgot password?</button>
        </div>

        <div id="status" class="status" style="display:none;"></div>
      </form>
    </div>
  </main>

  <script>
    (() => {
      // =========================
      // CONFIG (PASTE YOUR VALUES)
      // =========================
      const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

      const DASH_URL = "/dash.html";
      const RESET_PASSWORD_URL = "/reset-password.html"; // ✅ make sure this file exists
      // =========================

      const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      if (!sb) {
        alert("Supabase failed to load. Check the supabase script tag.");
        return;
      }

      const form = document.getElementById("authForm");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const emailEl = document.getElementById("email");
      const passEl = document.getElementById("password");
      const primaryBtn = document.getElementById("primaryBtn");
      const toggleBtn = document.getElementById("toggleBtn");
      const forgotBtn = document.getElementById("forgotBtn");
      const statusEl = document.getElementById("status");

      let mode = "login"; // "login" | "signup"

      function setStatus(msg, type="good") {
        statusEl.style.display = "block";
        statusEl.className = "status " + (type === "bad" ? "bad" : "good");
        statusEl.textContent = msg;
      }

      function clearStatus() {
        statusEl.style.display = "none";
        statusEl.textContent = "";
      }

      function setBusy(busy) {
        primaryBtn.disabled = busy;
        toggleBtn.disabled = busy;
        forgotBtn.disabled = busy;
      }

      function setMode(nextMode) {
        mode = nextMode;
        clearStatus();

        if (mode === "login") {
          title.textContent = "Log in";
          subtitle.textContent = "Welcome back. Log in to continue.";
          primaryBtn.textContent = "Log in";
          toggleBtn.textContent = "Create account";
          passEl.autocomplete = "current-password";
        } else {
          title.textContent = "Create account";
          subtitle.textContent = "Start your 7-day trial. No card needed.";
          primaryBtn.textContent = "Create account";
          toggleBtn.textContent = "Back to log in";
          passEl.autocomplete = "new-password";
        }
      }

      // ✅ Detect Supabase recovery / PKCE callback and route to reset page
      function isRecoveryOrPkceCallback() {
        const u = new URL(window.location.href);
        const hash = (u.hash || "").toLowerCase();
        if (hash.includes("type=recovery")) return true; // recovery link
        if (u.searchParams.get("code")) return true;     // PKCE callback
        return false;
      }

      function redirectToResetPassword() {
        const u = new URL(window.location.href);
        // preserve query + hash because Supabase uses them for the session exchange
        window.location.replace(`${RESET_PASSWORD_URL}${u.search}${u.hash}`);
      }

      // Create or update trial row (runs only when user is authenticated)
      async function ensureSubscriptionRow(userId) {
        if (!userId) return;

        // 7-day trial window
        const start = new Date();
        const end = new Date(start.getTime() + 7 * 24 * 60 * 60 * 1000);

        const payload = {
          user_id: userId,
          trial_starts_at: start.toISOString(),
          trial_ends_at: end.toISOString(),
          plan: "trial",
          status: "trialing",
          updated_at: new Date().toISOString()
        };

        // Upsert so it’s safe if the row already exists
        const { error } = await sb
          .from("subscriptions")
          .upsert(payload, { onConflict: "user_id" });

        if (error) {
          // Don't hard-fail auth
          console.error("ensureSubscriptionRow error:", error);
          setStatus("Logged in, but trial record could not be saved (RLS/policy). We can fix this next.", "bad");
        }
      }

      async function loginFlow(email, password) {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const userId = data?.user?.id;
        await ensureSubscriptionRow(userId);

        window.location.href = DASH_URL;
      }

      async function signupFlow(email, password) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;

        const userId = data?.user?.id;
        const session = data?.session;

        if (session && userId) {
          await ensureSubscriptionRow(userId);
          window.location.href = DASH_URL;
          return;
        }

        setStatus("Account created. Please check your email to confirm, then come back and log in.", "good");
        setMode("login");
      }

      // Handle submit
      form.addEventListener("submit", async (e) => {
        e.preventDefault(); // critical: prevents refresh
        clearStatus();

        const email = emailEl.value.trim();
        const password = passEl.value;

        if (!email || !password) {
          setStatus("Please enter your email and password.", "bad");
          return;
        }

        setBusy(true);
        try {
          if (mode === "login") {
            await loginFlow(email, password);
          } else {
            await signupFlow(email, password);
          }
        } catch (err) {
          console.error(err);
          setStatus(err?.message || "Something went wrong. Please try again.", "bad");
        } finally {
          setBusy(false);
        }
      });

      // Toggle login/signup
      toggleBtn.addEventListener("click", () => {
        setMode(mode === "login" ? "signup" : "login");
      });

      // Forgot password
      forgotBtn.addEventListener("click", async () => {
        clearStatus();
        const email = emailEl.value.trim();
        if (!email) {
          setStatus("Type your email first, then press Forgot password.", "bad");
          return;
        }

        setBusy(true);
        try {
          // ✅ IMPORTANT: send users to reset-password page, NOT login
          const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + RESET_PASSWORD_URL
          });
          if (error) throw error;

          setStatus("Password reset email sent. Check your inbox.", "good");
        } catch (err) {
          console.error(err);
          setStatus(err?.message || "Could not send reset email.", "bad");
        } finally {
          setBusy(false);
        }
      });

      // Init
      (async () => {
        // ✅ If they arrived via recovery link, go straight to reset page
        if (isRecoveryOrPkceCallback()) {
          redirectToResetPassword();
          return;
        }

        // Normal behaviour: if already logged in, go to dash
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          window.location.href = DASH_URL;
          return;
        }

        setMode("login");
      })();
    })();
  </script>
</body>
</html>
