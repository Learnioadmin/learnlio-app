<!doctype html>
<html lang="en-GB">
<head>
  <link rel="icon" type="image/x-icon" href="/assets/img/Flavicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/assets/img/Flavicon.ico">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Log in</title>

  <link rel="stylesheet" href="/assets/css/app.css" />

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:800; }
    .brand img { height:34px; }
    .container { max-width:560px; margin:0 auto; padding:24px 18px; }
    .card { background:#fff; border-radius:18px; padding:22px; box-shadow:0 6px 20px rgba(0,0,0,.08); }
    h1 { margin:0 0 6px; font-size:22px; }
    .muted { color:#6b7280; font-size:14px; line-height:1.6; margin-bottom:18px; }
    label { display:block; margin-top:12px; font-size:14px; }
    input { width:100%; padding:12px; border-radius:12px; border:1px solid #d1d5db; font-size:15px; }
    input:focus { border-color:#0b5cff; box-shadow:0 0 0 3px rgba(11,92,255,.12); outline:none; }
    .row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .btn { background:#0b5cff; color:#fff; border:none; padding:12px 16px; border-radius:12px; font-weight:700; cursor:pointer; }
    .btn.light { background:#e5e7eb; color:#111; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .link { background:none; border:none; color:#0b5cff; font-weight:700; cursor:pointer; padding:0; }
    .status { margin-top:14px; font-size:14px; line-height:1.6; }
    .status.good { color:#16a34a; }
    .status.bad { color:#dc2626; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
      <span>Learnlio</span>
    </a>
  </div>
</header>

<main class="container">
  <div class="card">
    <h1 id="title">Log in</h1>
    <p class="muted" id="subtitle">Welcome back. Log in to continue.</p>

    <form id="authForm" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" required />

      <div class="row">
        <button id="primaryBtn" class="btn" type="submit">Log in</button>
        <button id="toggleBtn" class="btn light" type="button">Create account</button>
      </div>

      <div class="row">
        <button id="forgotBtn" class="link" type="button">Forgot password?</button>
      </div>

      <div id="status" class="status" style="display:none;"></div>
    </form>
  </div>
  <footer class="footer" role="contentinfo">
    <div class="footer-inner">
      <div>
        <div style="font-weight:950; color:var(--ink); margin-bottom:6px;">Learnlio</div>
        <div style="max-width:560px; line-height:1.7;">
          Calm, dyslexia-friendly learning support for UK children who feel pressured, anxious, or stuck.
        </div>
        <div style="margin-top:10px; font-size:13px;">
          © <span id="year"></span> Learnlio. All rights reserved.
        </div>
      </div>

      <div class="footer-links" aria-label="Footer links">
        <a href="/contact.html">Contact us</a>
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms &amp; Conditions</a>
        <a href="/cookies.html">Cookies</a>
        <a href="/ethics.html">Ethics</a>
        <a href="/safeguarding.html">Safeguarding</a>
      </div>
    </div>
  </footer>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("authForm");
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const primaryBtn = document.getElementById("primaryBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const forgotBtn = document.getElementById("forgotBtn");
  const statusEl = document.getElementById("status");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");

  let mode = "login";

  function setStatus(msg, type="good") {
    statusEl.style.display = "block";
    statusEl.className = "status " + type;
    statusEl.textContent = msg;
  }

  function clearStatus() {
    statusEl.style.display = "none";
    statusEl.textContent = "";
  }

  function setMode(m) {
    mode = m;
    clearStatus();
    if (m === "login") {
      title.textContent = "Log in";
      subtitle.textContent = "Welcome back. Log in to continue.";
      primaryBtn.textContent = "Log in";
      toggleBtn.textContent = "Create account";
    } else {
      title.textContent = "Create account";
      subtitle.textContent = "Start your 7-day trial. No card required.";
      primaryBtn.textContent = "Create account";
      toggleBtn.textContent = "Back to log in";
    }
  }

  function setSelectedChild(child){
    const payload = { id: child.id, child_name: child.child_name || "Child" };
    localStorage.setItem("selectedChild", JSON.stringify(payload));
  }

  function ensureChildPickerStyles(){
    if (document.getElementById("childPickerStyles")) return;
    const style = document.createElement("style");
    style.id = "childPickerStyles";
    style.textContent = `
      .lh-modal-backdrop{
        position:fixed; inset:0; background:rgba(15,23,42,.45);
        display:flex; align-items:center; justify-content:center;
        padding:16px; z-index:9999;
        backdrop-filter: blur(6px);
      }
      .lh-modal{
        width:min(520px, 100%);
        background: rgba(255,255,255,.92);
        border:1px solid rgba(15,23,42,.10);
        border-radius:20px;
        box-shadow: 0 24px 60px rgba(2,6,23,.20);
        overflow:hidden;
      }
      .lh-modal-head{
        padding:16px 16px 12px;
        background: linear-gradient(180deg, rgba(238,242,255,.95), rgba(255,255,255,.92));
        border-bottom:1px solid rgba(15,23,42,.08);
      }
      .lh-modal-title{ font-weight:950; letter-spacing:-.3px; font-size:18px; margin:0; }
      .lh-modal-sub{ margin-top:6px; color:#64748b; font-size:13.5px; line-height:1.5; }
      .lh-modal-body{ padding:14px 16px 16px; display:grid; gap:10px; }
      .lh-child-btn{
        width:100%;
        display:flex; align-items:center; justify-content:space-between;
        gap:12px;
        background:#fff;
        border:1px solid rgba(15,23,42,.12);
        border-radius:16px;
        padding:12px 12px;
        cursor:pointer;
        font-weight:950;
        box-shadow: 0 10px 18px rgba(2,6,23,.08);
        transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
        text-align:left;
      }
      .lh-child-btn:hover{
        transform: translateY(-1px);
        box-shadow: 0 14px 26px rgba(2,6,23,.12);
        border-color: rgba(11,92,255,.22);
      }
      .lh-child-left{ display:flex; align-items:center; gap:10px; min-width:0; }
      .lh-badge{
        width:34px; height:34px; border-radius:12px;
        display:flex; align-items:center; justify-content:center;
        background:#eef2ff;
        border:1px solid rgba(15,23,42,.10);
        font-weight:1000;
        flex:0 0 auto;
      }
      .lh-child-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .lh-arrow{ color:#0b5cff; font-weight:1000; }
      .lh-modal-foot{
        padding:12px 16px 14px;
        border-top:1px solid rgba(15,23,42,.08);
        display:flex; justify-content:flex-end; gap:10px;
        background: rgba(255,255,255,.92);
      }
      .lh-ghost{
        background:transparent;
        border:1px solid rgba(15,23,42,.14);
        border-radius:14px;
        padding:10px 12px;
        cursor:pointer;
        font-weight:900;
        color:#0f172a;
      }
    `;
    document.head.appendChild(style);
  }

  function showChildPickerModal(children){
    return new Promise((resolve) => {
      ensureChildPickerStyles();

      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const backdrop = document.createElement("div");
      backdrop.className = "lh-modal-backdrop";

      const modal = document.createElement("div");
      modal.className = "lh-modal";

      modal.innerHTML = `
        <div class="lh-modal-head">
          <h2 class="lh-modal-title">Who is learning today?</h2>
          <div class="lh-modal-sub">Choose a child to open their Learning Hub. (You can switch later.)</div>
        </div>
        <div class="lh-modal-body" id="lhModalBody"></div>
        <div class="lh-modal-foot">
          <button class="lh-ghost" id="lhGoDash" type="button">Go to parent dashboard</button>
        </div>
      `;

      const body = modal.querySelector("#lhModalBody");

      children.forEach((c, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lh-child-btn";
        btn.innerHTML = `
          <span class="lh-child-left">
            <span class="lh-badge">${letters[idx] || (idx + 1)}</span>
            <span class="lh-child-name">${String(c.child_name || "Child")}</span>
          </span>
          <span class="lh-arrow">›</span>
        `;
        btn.addEventListener("click", () => {
          cleanup();
          resolve(c);
        });
        body.appendChild(btn);
      });

      const goDash = modal.querySelector("#lhGoDash");
      goDash.addEventListener("click", () => {
        cleanup();
        resolve(null);
      });

      backdrop.appendChild(modal);
      document.body.appendChild(backdrop);

      function cleanup(){
        try{ backdrop.remove(); }catch{}
      }
    });
  }

  async function routeAfterLogin(){
    const { data: userData } = await sb.auth.getUser();
    const u = userData?.user;
    if (!u){ window.location.href = "/login.html"; return; }

    const { data: kids, error } = await sb
      .from("children")
      .select("id, child_name, created_at, parent_user_id")
      .eq("parent_user_id", u.id)
      .order("created_at", { ascending: true });

    if (error){
      console.error("children list error", error);
      window.location.href = "/dash.html";
      return;
    }

    const children = kids || [];

    if (children.length === 0){
      localStorage.removeItem("selectedChild");
      window.location.href = "/dash.html";
      return;
    }

    if (children.length === 1){
      setSelectedChild(children[0]);
      window.location.href = "/learning-hub.html";
      return;
    }

    const chosen = await showChildPickerModal(children);
    if (!chosen){
      localStorage.removeItem("selectedChild");
      window.location.href = "/dash.html";
      return;
    }

    setSelectedChild(chosen);
    window.location.href = "/learning-hub.html";
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    clearStatus();

    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({
          email: emailEl.value,
          password: passEl.value
        });
        if (error) throw error;
        localStorage.setItem("learnlio_just_logged_in", "1");
        await routeAfterLogin();
      } else {
        const { error } = await sb.auth.signUp({
          email: emailEl.value,
          password: passEl.value
        });
        if (error) throw error;
        setStatus("Account created. Check your email to confirm, then log in.", "good");
        setMode("login");
      }
    } catch (err) {
      setStatus(err.message, "bad");
    }
  });

  toggleBtn.onclick = () => setMode(mode === "login" ? "signup" : "login");

  forgotBtn.onclick = async () => {
    clearStatus();
    const email = emailEl.value.trim();
    if (!email) {
      setStatus("Enter your email first.", "bad");
      return;
    }

    forgotBtn.disabled = true;

    try {
      await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/login.html"
      });

      setStatus(
        `Check your inbox. If an account exists for ${email}, we've sent a password reset link. ` +
        `It may take up to 2 minutes — please check spam/junk too.`,
        "good"
      );

      let seconds = 60;
      const original = "Forgot password?";
      forgotBtn.textContent = `Resend in ${seconds}s`;

      const timer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          forgotBtn.disabled = false;
          forgotBtn.textContent = original;
        } else {
          forgotBtn.textContent = `Resend in ${seconds}s`;
        }
      }, 1000);

    } catch (err) {
      setStatus("Could not send reset email. Try again later.", "bad");
      forgotBtn.disabled = false;
    }
  };

  setMode("login");

  sb.auth.getUser().then(({ data }) => {
    if (data?.user) routeAfterLogin();
  });
})();
</script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
