<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
    }
    .mcq-text{ line-height:1.45; }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }

    /* Mobile tweaks */
    @media (max-width: 520px){
      .controls{ gap:8px; }
      .pill{ width:auto; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <button id="helpBtn" class="btn ghost" type="button">Help</button>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>
            <div id="mcq" class="mcq" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>

            <!-- Helper-ready (not fully implemented yet) -->
            <button id="hintBtn" class="pill" type="button" title="Gentle hint">💡 Hint</button>

            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Just steady effort. No pressure.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Back to Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // CONFIG (match your chat)
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Allow subject/area to be driven by URL (future proof)
    // Example: /lesson.html?subject=Maths&area=Addition
    const qs = new URLSearchParams(location.search);
    const SUBJECT = (qs.get("subject") || "Maths").trim();
    const AREA = (qs.get("area") || "Addition").trim();

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const hintLine = document.getElementById("hintLine");

    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const hintBtn = document.getElementById("hintBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // Child + auth
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Skill row (reuse your chat table)
    let skillRow = null;
    let targetDifficulty = 1;

    // Lesson runtime
    let lesson = null;           // row from lessons_catalog
    let steps = [];              // parsed steps list
    let idx = 0;                 // current step index
    let xp = 0;

    // lesson_progress
    let progressRow = null;      // row in lesson_progress for this child+lesson
    let completedIds = new Set(); // completed_step_ids
    let attemptsByStep = {};     // json object

    // For MCQ answers in current UI session (we also persist into attemptsByStep)
    let localAnswers = {};       // stepId -> {pickedIndex,isCorrect}

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);

      return true;
    }

    async function loadOrCreateSkillRow(){
      // Uses your existing table: child_skill_progress
      const { data: existing, error } = await sb
        .from("child_skill_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", SUBJECT)
        .eq("area", AREA)
        .maybeSingle();

      if (error){
        console.warn("child_skill_progress load error", error);
      }
      if (existing?.id){
        skillRow = existing;
        return skillRow;
      }

      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject: SUBJECT,
        area: AREA,
        level: 1,
        confidence: 0.5,
        accuracy: 0.0,
        total_attempts: 0,
        correct_attempts: 0,
        streak_correct: 0,
        streak_wrong: 0,
        last_session_id: null,
        last_seen_at: new Date().toISOString()
      };

      const { data: up, error: upErr } = await sb
        .from("child_skill_progress")
        .upsert(payload, { onConflict: "owner_id,child_id,subject,area" })
        .select("*")
        .single();

      if (upErr){
        console.warn("child_skill_progress upsert error", upErr);
        return null;
      }
      skillRow = up;
      return skillRow;
    }

    function computeTargetDifficulty(){
      const level = Number(skillRow?.level || 1);
      const conf = (typeof skillRow?.confidence === "number") ? skillRow.confidence : 0.5;

      // calm + predictable
      if (conf < 0.45) return Math.max(1, level - 1);
      if (conf > 0.70) return Math.min(10, level + 1);
      return level;
    }

    function parseStepsFromLessonRow(row){
      // Prefer new jsonb column "steps"
      if (row?.steps && typeof row.steps === "object") return row.steps;

      // Fall back to text column "steps_json" (stored as string in your DB)
      if (row?.steps_json){
        try {
          if (typeof row.steps_json === "string") return JSON.parse(row.steps_json);
          if (typeof row.steps_json === "object") return row.steps_json; // just in case
        } catch {}
      }
      return null;
    }

    function ensureStepIds(stepsList){
      // Future-proof: if any steps are missing an id, we generate stable-ish ones.
      // (But best practice: always store step.id in the DB like we did.)
      return (stepsList || []).map((s, i) => {
        const id = (s && s.id) ? String(s.id) : `step_${i+1}`;
        return { ...s, id };
      });
    }

    async function pickNextLesson(){
      // Pull all active lessons that match subject/area and age band.
      // Then skip anything completed in lesson_progress.
      const { data: lessonRows, error } = await sb
        .from("lessons_catalog")
        .select("id, lesson_key, version, subject, area, title, age_min, age_max, difficulty, steps, steps_json, is_active")
        .eq("subject", SUBJECT)
        .eq("area", AREA)
        .eq("is_active", true);

      if (error) throw error;
      if (!lessonRows?.length) return null;

      const ageFit = lessonRows.filter(l => Number(childAge) >= Number(l.age_min) && Number(childAge) <= Number(l.age_max));
      if (!ageFit.length) return null;

      const { data: prog, error: pErr } = await sb
        .from("lesson_progress")
        .select("lesson_id, is_complete")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id);

      if (pErr) throw pErr;
      const doneSet = new Set((prog || []).filter(r => r.is_complete).map(r => r.lesson_id));

      const available = ageFit.filter(l => !doneSet.has(l.id));
      if (!available.length) return null;

      const target = targetDifficulty || 1;
      available.sort((a,b) => Math.abs(Number(a.difficulty) - target) - Math.abs(Number(b.difficulty) - target));

      return available[0];
    }

    async function loadOrCreateProgressRow(lessonId, firstStepId){
      const { data: existing, error } = await sb
        .from("lesson_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("lesson_id", lessonId)
        .maybeSingle();

      if (error) throw error;
      if (existing?.id) return existing;

      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        lesson_id: lessonId,
        current_step_id: firstStepId || null,
        is_complete: false,
        completed_step_ids: [],
        attempts_by_step: {}
      };

      const { data: created, error: cErr } = await sb
        .from("lesson_progress")
        .insert(payload)
        .select("*")
        .single();

      if (cErr) throw cErr;
      return created;
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;

      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";

      xpLine.textContent = `XP: ${xp}`;
    }

    function currentStep(){
      return steps[idx] || null;
    }

    function findIndexByStepId(stepId){
      if (!stepId) return 0;
      const i = steps.findIndex(s => String(s.id) === String(stepId));
      return i >= 0 ? i : 0;
    }

    function renderStep(){
      if (!steps.length){
        lessonTextEl.textContent = "No lesson steps found.";
        mcqEl.style.display = "none";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      const step = currentStep();
      setProgressUI();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";

      // Buttons default
      nextBtn.disabled = false;
      backBtn.disabled = (idx <= 0);

      if (!step){
        lessonTextEl.textContent = "Finished.";
        nextBtn.disabled = true;
        return;
      }

      // Intro/teach/finish
      if (step.type === "intro" || step.type === "teach" || step.type === "finish"){
        lessonTextEl.textContent = step.text || "";
        nextBtn.textContent = (step.type === "finish") ? "✅ Complete" : "➡️ Next";

        // Gentle note if step already completed
        if (completedIds.has(step.id)){
          hintLine.textContent = "Saved ✅";
        } else {
          hintLine.textContent = "";
        }
        return;
      }

      // MCQ
      if (step.type === "mcq"){
        lessonTextEl.textContent = step.prompt || "";
        mcqEl.style.display = "grid";
        nextBtn.textContent = "➡️ Next";

        const letters = ["A","B","C","D"];
        (step.choices || []).forEach((choice, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-opt";
          btn.innerHTML = `<span class="mcq-letter">${letters[i] || ""}</span><span class="mcq-text">${escapeHtml(choice)}</span>`;
          btn.addEventListener("click", async () => chooseMCQ(i));
          mcqEl.appendChild(btn);
        });

        // If already answered, show status
        const saved = localAnswers[step.id] || getSavedAnswerForStep(step.id);
        if (saved){
          hintLine.textContent = saved.isCorrect ? "Nice — that was correct ✅" : "That one was tricky — keep going 💛";
        } else {
          hintLine.textContent = "Tap an answer when you’re ready.";
        }
        return;
      }

      lessonTextEl.textContent = "Unknown step type.";
    }

    function escapeHtml(s){
      return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

    function getSavedAnswerForStep(stepId){
      const s = attemptsByStep?.[stepId];
      if (!s) return null;
      if (typeof s === "object" && s !== null && ("pickedIndex" in s)){
        return { pickedIndex: s.pickedIndex, isCorrect: !!s.isCorrect };
      }
      return null;
    }

    async function persistProgressPatch(patch){
      if (!progressRow?.id) return;

      const { data, error } = await sb
        .from("lesson_progress")
        .update(patch)
        .eq("id", progressRow.id)
        .select("*")
        .single();

      if (error) throw error;
      progressRow = data;

      // refresh local mirrors
      completedIds = new Set(Array.isArray(progressRow.completed_step_ids) ? progressRow.completed_step_ids : []);
      attemptsByStep = (progressRow.attempts_by_step && typeof progressRow.attempts_by_step === "object") ? progressRow.attempts_by_step : {};
    }

    function computeLessonScore(){
      const mcqSteps = steps.filter(s => s.type === "mcq");
      if (!mcqSteps.length) return null;

      let correct = 0;
      let graded = 0;

      mcqSteps.forEach(s => {
        const ans = localAnswers[s.id] || getSavedAnswerForStep(s.id);
        if (!ans) return;
        graded += 1;
        if (ans.isCorrect) correct += 1;
      });

      if (!graded) return null;
      return correct / graded;
    }

    async function chooseMCQ(pickedIndex){
      const step = currentStep();
      if (!step || step.type !== "mcq") return;

      const correctIndex = Number(step.correctIndex);
      const isCorrect = pickedIndex === correctIndex;

      // Gentle XP (effort-first, not “points hunting”)
      xp += isCorrect ? 10 : 6;

      localAnswers[step.id] = { pickedIndex, isCorrect };

      // Save in attempts_by_step
      attemptsByStep = attemptsByStep || {};
      attemptsByStep[step.id] = {
        pickedIndex,
        isCorrect,
        at: new Date().toISOString()
      };

      hintLine.textContent = isCorrect ? "Nice work ✅" : "Good try 💛";
      setProgressUI();

      // Persist immediately so they can resume later
      try{
        await persistProgressPatch({
          attempts_by_step: attemptsByStep
        });
      }catch(e){
        console.warn("progress save failed", e);
      }
    }

    async function markStepCompleted(stepId){
      if (!stepId) return;

      if (!completedIds.has(stepId)){
        completedIds.add(stepId);
      }

      const arr = Array.from(completedIds);

      // Save current step pointer too (resume)
      const nextStep = steps[idx+1] || null;
      const nextId = nextStep ? nextStep.id : null;

      await persistProgressPatch({
        completed_step_ids: arr,
        current_step_id: nextId
      });
    }

    async function completeLesson(){
      // Mark as complete in lesson_progress and store a small summary in attempts_by_step._summary
      const score = computeLessonScore();
      attemptsByStep = attemptsByStep || {};
      attemptsByStep._summary = {
        completedAt: new Date().toISOString(),
        score,
        xp,
        subject: SUBJECT,
        area: AREA,
        lessonId: lesson?.id,
        lessonKey: lesson?.lesson_key || null,
        version: lesson?.version || 1
      };

      await persistProgressPatch({
        is_complete: true,
        completed_at: new Date().toISOString(),
        current_step_id: null,
        attempts_by_step: attemptsByStep,
        completed_step_ids: Array.from(completedIds)
      });

      // Also update child_skill_progress (slow, calm movement)
      if (skillRow?.id && typeof score === "number"){
        const total_attempts = (skillRow.total_attempts || 0) + 1;
        const correct_attempts = (skillRow.correct_attempts || 0) + (score >= 0.7 ? 1 : 0);
        const accuracy = total_attempts ? (correct_attempts / total_attempts) : 0.0;

        const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;

        let confDelta = 0;
        if (score >= 0.85) confDelta = +0.06;
        else if (score >= 0.70) confDelta = +0.04;
        else if (score >= 0.50) confDelta = +0.02;
        else confDelta = -0.02;

        const confidence = Math.max(0, Math.min(1, oldConf + confDelta));

        let level = Number(skillRow.level || 1);
        if (total_attempts >= 6 && confidence > 0.70) level = Math.min(10, level + 1);
        if (total_attempts >= 6 && confidence < 0.35) level = Math.max(1, level - 1);

        const { data: updated, error } = await sb
          .from("child_skill_progress")
          .update({
            total_attempts,
            correct_attempts,
            accuracy,
            confidence,
            level,
            last_seen_at: new Date().toISOString()
          })
          .eq("id", skillRow.id)
          .select("*")
          .single();

        if (!error && updated) skillRow = updated;
      }

      // Final UI
      contextLine.textContent = `Saved ✅ ${childName} finished "${lesson.title}".`;
      lessonTextEl.textContent =
        `Nice work, ${childName}.\n\nThat lesson is saved.\n\nNext time, Learnlio will choose a new lesson that fits you.`;
      mcqEl.style.display = "none";
      nextBtn.disabled = true;
      backBtn.disabled = true;
      hintLine.textContent = "You can go back to the dashboard.";
    }

    function showHint(){
      const step = currentStep();
      if (!step){
        hintLine.textContent = "";
        return;
      }

      // Helper-ready behaviour:
      // - If MCQ: show one hint from step.hints
      // - If teach/intro: show step.say if present (later we can read it out loud)
      if (step.type === "mcq"){
        const hints = Array.isArray(step.hints) ? step.hints : [];
        if (!hints.length){
          hintLine.textContent = "Try it one step at a time 💛";
          return;
        }

        // rotate through hints per step
        const key = `hintCount_${step.id}`;
        const prev = Number(attemptsByStep?.[key] || 0);
        const next = prev + 1;
        attemptsByStep[key] = next;

        const hint = hints[(next - 1) % hints.length];
        hintLine.textContent = hint;
        // Save hint usage (cheap + helpful for reports later)
        persistProgressPatch({ attempts_by_step: attemptsByStep }).catch(()=>{});
        return;
      }

      if (step.say){
        hintLine.textContent = String(step.say);
        return;
      }

      hintLine.textContent = "Take it slowly. You’re doing fine.";
    }

    // Navigation
    backBtn.addEventListener("click", () => {
      if (idx > 0){
        idx -= 1;
        renderStep();
      }
    });

    nextBtn.addEventListener("click", async () => {
      const step = currentStep();
      if (!step) return;

      // If MCQ step, require answer before moving on
      if (step.type === "mcq"){
        const ans = localAnswers[step.id] || getSavedAnswerForStep(step.id);
        if (!ans){
          hintLine.textContent = "Tap an answer first 💛";
          return;
        }
      }

      // Mark this step completed
      try{
        await markStepCompleted(step.id);
      }catch(e){
        console.warn("markStepCompleted failed", e);
      }

      // If finish step, complete lesson
      if (step.type === "finish"){
        await completeLesson();
        return;
      }

      // Move forward
      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      }
    });

    hintBtn.addEventListener("click", () => showHint());

    finishBtn.addEventListener("click", async () => {
      // Soft finish: save current position and go back.
      // (Do NOT mark complete)
      try{
        const step = currentStep();
        await persistProgressPatch({
          current_step_id: step?.id || null
        });
      }catch(e){
        console.warn("save position failed", e);
      }
      window.location.href = "/dash.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Read one step\n" +
        "• Tap an answer when you see choices\n" +
        "• Press Next\n\n" +
        "No pressure.\nYou can stop any time and come back later."
      );
    });

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      clearError();
      contextLine.textContent = `Loading a lesson for ${childName}…`;

      await loadOrCreateSkillRow();
      targetDifficulty = computeTargetDifficulty();

      // Pick lesson (skip completed)
      lesson = await pickNextLesson();
      if (!lesson){
        contextLine.textContent = "No new lessons available.";
        lessonTextEl.textContent =
          "You’ve done the available lessons in this area for now.\n\nTry another area later.";
        mcqEl.style.display = "none";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        hintBtn.disabled = true;
        return;
      }

      // Parse steps (steps jsonb preferred, fallback to steps_json string)
      const obj = parseStepsFromLessonRow(lesson);
      const list = Array.isArray(obj?.steps) ? obj.steps : [];
      steps = ensureStepIds(list);

      if (!steps.length){
        showError("This lesson has no steps yet.");
        return;
      }

      // Load/create lesson_progress row so we can resume + prevent repeats
      progressRow = await loadOrCreateProgressRow(lesson.id, steps[0]?.id || null);
      completedIds = new Set(Array.isArray(progressRow.completed_step_ids) ? progressRow.completed_step_ids : []);
      attemptsByStep = (progressRow.attempts_by_step && typeof progressRow.attempts_by_step === "object") ? progressRow.attempts_by_step : {};

      // Resume from current_step_id if present
      idx = findIndexByStepId(progressRow.current_step_id || steps[0]?.id);

      // Restore XP if present in summary
      xp = Number(attemptsByStep?._summary?.xp || 0);

      contextLine.textContent = `${SUBJECT} • ${AREA} — ${lesson.title}`;
      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
</body>
