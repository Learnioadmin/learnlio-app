<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio – Tutor</title>

  <!-- Your app theme -->
  <link rel="stylesheet" href="/assets/app.css" />

  <!-- Dyslexia-friendly font -->
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <!-- jsPDF for parent summary -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <!-- Header -->
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/dash.html">
        <img class="brand-logo"
             src="https://assets.softr-files.com/applications/67a2863a-6210-4748-a054-0d80961b8e92/assets/383bd953-a636-47a6-8894-3e7e90d6c00c.webp"
             alt="Learnlio logo" />
        <div class="brand-name">Learnlio</div>
      </a>

      <div class="nav">
        <a href="/dash.html" data-nav="dash">Dash</a>
        <a href="/chat.html" data-nav="chat">Learnlio Tutor</a>
        <a href="/screener.html" data-nav="screener">Dyslexia Screener</a>
        <a href="/reports.html" data-nav="reports">Reports</a>
        <a href="/login.html" class="btn btn-secondary" style="padding:10px 12px;">Log in</a>
      </div>
    </div>
  </div>

  <!-- Page -->
  <div class="container page">
    <div class="card card-pad">
      <h1 class="h1">Learnlio Tutor</h1>
      <p class="small">Step-by-step tutoring for Maths and English.</p>

      <div class="spacer"></div>

      <!-- ===== Chatbot UI ===== -->
      <div id="chat-wrapper">
        <div id="chat-container">

          <!-- Progress header -->
          <div id="progress-header" style="display:none; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
              <div id="progress-label" style="font-family:'OpenDyslexic', Arial, sans-serif; font-size:14px; color:#333;">
                Progress: 0 / 0
              </div>
              <div id="badge-label" style="font-family:'OpenDyslexic', Arial, sans-serif; font-size:14px; color:#333;">
                Badges: —
              </div>
            </div>
            <div style="height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:8px;">
              <div id="progress-bar" style="height:10px; width:0%; background:#10b981;"></div>
            </div>
          </div>

          <div id="messages"></div>
          <div id="typing-indicator" style="display:none; margin-bottom:10px;">Learnlio AI is typing...</div>

          <!-- Calculator for Maths (shows after area is selected) -->
          <div id="calculator" style="display:none;">
            <div class="calc-grid">
              <button onclick="calcInput('7')">7</button>
              <button onclick="calcInput('8')">8</button>
              <button onclick="calcInput('9')">9</button>
              <button onclick="calcInput('÷')">÷</button>

              <button onclick="calcInput('4')">4</button>
              <button onclick="calcInput('5')">5</button>
              <button onclick="calcInput('6')">6</button>
              <button onclick="calcInput('×')">×</button>

              <button onclick="calcInput('1')">1</button>
              <button onclick="calcInput('2')">2</button>
              <button onclick="calcInput('3')">3</button>
              <button onclick="calcInput('-')">−</button>

              <button onclick="calcInput('0')">0</button>
              <button onclick="calcClear()">C</button>
              <button onclick="calcInput('+')">+</button>
              <button onclick="calcInput('=')">=</button>
            </div>
          </div>

          <!-- Subject selection -->
          <div id="subject-selection" style="display:none;">
            <p>Select a subject to start:</p>
            <button onclick="selectSubject('Maths')">Maths</button>
            <button onclick="selectSubject('English')">English</button>
          </div>

          <!-- Area selection / Action buttons -->
          <div id="area-selection" style="display:none;"></div>

          <!-- Input -->
          <div id="input-container" style="display:flex; gap:10px; margin-top:10px;">
            <input id="input" placeholder="Type your answer here…" style="flex:1; padding:14px; font-size:16px; border-radius:12px; border:1px solid #ccc;" />
            <button id="sendBtn" type="button" style="padding:14px 20px; font-size:16px; border-radius:12px; border:none; background:#007bff; color:#fff; cursor:pointer;">Send</button>
          </div>
        </div>
      </div>

      <style>
        #chat-wrapper { width: 100%; display: flex; justify-content: center; }
        #chat-container { width: 100%; max-width: 680px; background: #ffffff; border-radius: 18px; padding: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); display: flex; flex-direction: column; }

        #messages {
          background: #fafafa; border-radius: 14px; padding: 12px; border: 1px solid #ddd;
          max-height: 480px; overflow-y: auto; margin-bottom: 12px;
          display: flex; flex-direction: column; align-items: flex-start;
        }

        .msg {
          padding: 14px 16px; margin-bottom: 14px; border-radius: 16px; max-width: 85%;
          font-size: 18px; line-height: 1.85; white-space: pre-wrap;
          font-family: 'OpenDyslexic', Arial, sans-serif;
          overflow-wrap: break-word; display: inline-block;
        }
        .user { background: #007bff; color: #ffffff; margin: 0 0 14px auto; text-align: right; word-break: break-word; }
        .bot  { background: #fef3c7; color: #000000; margin-right: auto; }

        .bot-controls { margin-top: 8px; display:flex; gap:8px; flex-wrap:wrap; }
        .btn-small { border: none; border-radius: 10px; padding: 6px 12px; font-size: 14px; cursor: pointer; color: #fff; }

        .speak-btn { background: #007bff; }
        .speak-btn:hover { background: #0056b3; }

        .hint-btn { background: #10b981; }
        .hint-btn:hover { background: #059669; }

        .next-btn { background: #7c3aed; }
        .next-btn:hover { background: #6d28d9; }

        #calculator { margin-bottom: 12px; background: #eef2ff; padding: 10px; border-radius: 14px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-grid button { padding: 14px; font-size: 18px; border-radius: 10px; border: none; background: #ffffff; cursor: pointer; }
        .calc-grid button:hover { background: #dbeafe; }

        #subject-selection button, #area-selection button {
          padding: 10px 18px; font-size: 16px; border-radius: 12px; border: none;
          background: #007bff; color: #fff; cursor: pointer; margin-right: 8px; margin-bottom: 8px;
        }
        #subject-selection button:hover, #area-selection button:hover { background: #0056b3; }

        #typing-indicator { font-style: italic; color: #555; margin-bottom:10px; }

        @media (max-width: 480px) {
          #chat-container { padding: 14px; }
          .msg { font-size: 16px; }
        }
      </style>

      <script>
      document.addEventListener("DOMContentLoaded", function() {
        const BACKEND_URL = "https://softr-chat-backend.onrender.com";

        // Elements
        const progressHeader = document.getElementById("progress-header");
        const progressLabel = document.getElementById("progress-label");
        const badgeLabel = document.getElementById("badge-label");
        const progressBar = document.getElementById("progress-bar");

        const input = document.getElementById("input");
        const sendBtn = document.getElementById("sendBtn");
        const messagesDiv = document.getElementById("messages");
        const calculator = document.getElementById("calculator");
        const subjectSelection = document.getElementById("subject-selection");
        const areaSelection = document.getElementById("area-selection");
        const inputContainer = document.getElementById("input-container");
        const typingIndicator = document.getElementById("typing-indicator");

        // State
        let stage = "askName";
        let childName = "";
        let childAge = "";
        let subject = null;
        let area = null;

        // Maths state
        let currentQuestion = null; // { displayText, correctAnswer }
        let hintUsedForCurrent = false;
        let waitingForNextButton = false;

        // Guided step mode (prevents mismatch between “step answers” and “final answer”)
        let guided = { active: false, steps: [], idx: 0 };

        // Session/progress
        let maxQuestions = 10;
        let questionsAnswered = 0; // Maths counts completed questions (resolved correctly)
        let correctCount = 0;
        let badges = [];

        // Logs for parent PDF
        let sessionLog = [];

        const userId = window.currentUser?.id || "guest";

        function ageNum() {
          const a = parseInt(childAge);
          return isNaN(a) ? 10 : a;
        }

        function kidTonePrefix() {
          const a = ageNum();
          if (a <= 7) return "🙂";
          if (a <= 10) return "😊";
          return "👍";
        }

        function shortLineBreaks(text) {
          return String(text || "").replace(/\.\s+/g, ".\n\n");
        }

        // Voice (best available free)
        let _cachedVoice = null;

        function pickBestUKVoice() {
          const voices = window.speechSynthesis.getVoices() || [];
          if (!voices.length) return null;

          const preferred = [
            "Samantha","Daniel",
            "Google UK English Female","Google UK English Male",
            "Microsoft Sonia Online","Microsoft Ryan Online","Microsoft Libby Online"
          ];
          for (const name of preferred) {
            const v = voices.find(x => x.name === name);
            if (v) return v;
          }

          const uk = voices.find(v => (v.lang || "").toLowerCase().startsWith("en-gb"));
          if (uk) return uk;

          return voices.find(v => (v.lang || "").toLowerCase().startsWith("en")) || null;
        }

        function speak(text) {
          if (!("speechSynthesis" in window)) return;
          window.speechSynthesis.cancel();

          const u = new SpeechSynthesisUtterance(String(text || ""));
          u.lang = "en-GB";
          u.rate = 0.9;
          u.pitch = 1.0;

          const voice = _cachedVoice || pickBestUKVoice();
          if (voice) { _cachedVoice = voice; u.voice = voice; }

          window.speechSynthesis.speak(u);
        }

        window.speechSynthesis.onvoiceschanged = () => { _cachedVoice = pickBestUKVoice(); };

        // Calculator
        window.calcInput = (value) => { input.value += value; };
        window.calcClear = () => { input.value = ""; };

        function cleanBotText(t) { return String(t || "").replace(/\*\*/g, ""); }
        function nowTs() { return new Date().toLocaleString("en-GB"); }

        function disableInput(disabled) {
          input.disabled = disabled;
          sendBtn.disabled = disabled;
          sendBtn.style.opacity = disabled ? "0.6" : "1";
          input.style.opacity = disabled ? "0.6" : "1";
        }

        function addUserMessage(text) {
          const div = document.createElement("div");
          div.className = "msg user";
          div.innerText = String(text || "").trim();
          messagesDiv.appendChild(div);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addBotMessage(text, opts={showHint:false, showNext:false}) {
          const safeText = cleanBotText(text);

          const div = document.createElement("div");
          div.className = "msg bot";

          const content = document.createElement("span");
          content.innerText = safeText;

          const controls = document.createElement("div");
          controls.className = "bot-controls";

          const speakBtn = document.createElement("button");
          speakBtn.className = "btn-small speak-btn";
          speakBtn.innerText = "🔊 Listen";
          speakBtn.onclick = () => speak(safeText);
          controls.appendChild(speakBtn);

          if (opts.showHint) {
            const hintBtn = document.createElement("button");
            hintBtn.className = "btn-small hint-btn";
            hintBtn.innerText = "💡 Hint";
            hintBtn.onclick = () => requestHint();
            controls.appendChild(hintBtn);
          }

          if (opts.showNext) {
            const nextBtn = document.createElement("button");
            nextBtn.className = "btn-small next-btn";
            nextBtn.innerText = "➡️ Next question";
            nextBtn.onclick = () => handleNextQuestion();
            controls.appendChild(nextBtn);
          }

          div.appendChild(content);
          div.appendChild(controls);

          messagesDiv.appendChild(div);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function callBackend(promptText) {
          try {
            typingIndicator.style.display = "block";
            const response = await axios.post(
              BACKEND_URL,
              { userId, messages: [{ role: "user", content: promptText }], subject, childName, childAge }
            );
            typingIndicator.style.display = "none";
            return response.data.reply;
          } catch (err) {
            typingIndicator.style.display = "none";
            return "Sorry, I couldn’t connect right now. Please try again.";
          }
        }

        function baseRules() {
          return `
Rules:
- British English only.
- Short, clear sentences.
- Explain step by step.
- Dyslexia-friendly.
- Positive encouragement.
- Do NOT give the final answer immediately.
- End with a gentle, supportive question.
- Child-safe tutoring only.
`;
        }

        // Session limit by age
        function computeMaxQuestions() {
          const a = ageNum();
          if (a <= 7) return 5;
          if (a <= 10) return 8;
          if (a <= 13) return 10;
          return 12;
        }

        function sessionComplete() {
          return questionsAnswered >= maxQuestions;
        }

        function resetSessionProgress() {
          maxQuestions = computeMaxQuestions();
          questionsAnswered = 0;
          correctCount = 0;
          badges = [];
          sessionLog = [];
          updateProgressUI();
        }

        function updateProgressUI() {
          progressHeader.style.display = "block";
          progressLabel.innerText = `Progress: ${questionsAnswered} / ${maxQuestions}`;
          badgeLabel.innerText = `Badges: ${badges.length ? badges.join(" ") : "—"}`;
          const pct = maxQuestions ? Math.min(100, Math.round((questionsAnswered / maxQuestions) * 100)) : 0;
          progressBar.style.width = pct + "%";
        }

        function maybeAwardBadge() {
          if (correctCount === 3 && !badges.includes("⭐")) badges.push("⭐");
          if (correctCount === 5 && !badges.includes("🏅")) badges.push("🏅");
          if (correctCount === 10 && !badges.includes("🏆")) badges.push("🏆");
        }

        function maybeRewardMessage() {
          if (questionsAnswered === 1) addBotMessage("🌟 Nice start! You’re doing really well.", {showHint:false});
          if (questionsAnswered === Math.ceil(maxQuestions/2)) addBotMessage("🔥 Halfway there! Keep going!", {showHint:false});
          if (correctCount === 3 && badges.includes("⭐")) addBotMessage("⭐ Badge unlocked: Star Helper!", {showHint:false});
          if (correctCount === 5 && badges.includes("🏅")) addBotMessage("🏅 Badge unlocked: Steady Learner!", {showHint:false});
          if (correctCount === 10 && badges.includes("🏆")) addBotMessage("🏆 Badge unlocked: Learning Champion!", {showHint:false});
        }

        // Maths generation + marking (deterministic)
        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generateMathQuestion() {
          const age = ageNum();

          let min = 0, max = 10;
          if (age <= 7) { min = 0; max = 10; }
          else if (age <= 9) { min = 5; max = 30; }
          else if (age <= 11) { min = 10; max = 80; }
          else { min = 20; max = 200; }

          if (area === "Addition") {
            const x = randInt(min, max);
            const y = randInt(min, max);
            return { displayText: `${x} + ${y} = ?`, correctAnswer: x + y };
          }
          if (area === "Subtraction") {
            let x = randInt(min, max);
            let y = randInt(min, max);
            if (y > x) [x, y] = [y, x];
            return { displayText: `${x} - ${y} = ?`, correctAnswer: x - y };
          }
          if (area === "Multiplication") {
            const tableMax = age <= 7 ? 5 : age <= 9 ? 8 : 12;
            const x = randInt(2, tableMax);
            const y = randInt(2, tableMax);
            return { displayText: `${x} × ${y} = ?`, correctAnswer: x * y };
          }
          if (area === "Division") {
            const divMax = age <= 7 ? 5 : age <= 9 ? 8 : 12;
            const divisor = randInt(2, divMax);
            const quotient = randInt(2, divMax);
            const dividend = divisor * quotient;
            return { displayText: `${dividend} ÷ ${divisor} = ?`, correctAnswer: quotient };
          }
          return null;
        }

        function parseChildNumber(text) {
          const m = String(text || "").match(/-?\d+(\.\d+)?/);
          if (!m) return null;
          return Number(m[0]);
        }

        function showMathQuestion(q) {
          guided.active = false;
          guided.steps = [];
          guided.idx = 0;

          hintUsedForCurrent = false;
          waitingForNextButton = false;

          const a = ageNum();
          const intro = (a <= 7)
            ? `✏️ New question:\n\n${q.displayText}\n\nTake your time.\nYou can use the buttons if you want.\n\nWhat do you think?`
            : `✏️ Question:\n\n${q.displayText}\n\nTake your time.\nWhat do you think the answer is?`;

          addBotMessage(intro, { showHint:true, showNext:false });
        }

        // Guided steps
        function buildGuidedSteps(q) {
          const raw = q.displayText.replace("= ?", "").trim();
          let op = null;
          if (raw.includes("+")) op = "+";
          else if (raw.includes("-")) op = "-";
          else if (raw.includes("×")) op = "×";
          else if (raw.includes("÷")) op = "÷";
          if (!op) return [];

          const parts = raw.split(op).map(s => parseInt(s.trim(), 10));
          const a = parts[0], b = parts[1];
          if (Number.isNaN(a) || Number.isNaN(b)) return [];

          const age = ageNum();
          const emoji = kidTonePrefix();

          const ones = n => n % 10;
          const tens = n => Math.floor((n % 100) / 10);
          const hundreds = n => Math.floor((n % 1000) / 100);

          // Addition
          if (op === "+") {
            if (age <= 7 && a <= 20 && b <= 20) {
              return [
                { prompt: shortLineBreaks(`${emoji} Step time.\n\nStart at ${a}.\nCount up ${b}.\n\nWhat number do you land on?`), expected: a + b }
              ];
            }

            const a1 = ones(a), b1 = ones(b);
            const a10 = tens(a), b10 = tens(b);
            const a100 = hundreds(a), b100 = hundreds(b);

            const onesSum = a1 + b1;
            const carry1 = Math.floor(onesSum / 10);
            const onesDigit = onesSum % 10;

            const tensSum = a10 + b10 + carry1;
            const carry10 = Math.floor(tensSum / 10);
            const tensDigit = tensSum % 10;

            const hundredsSum = a100 + b100 + carry10;
            const usesHundreds = (a >= 100 || b >= 100);

            const steps = [];

            steps.push({ prompt: shortLineBreaks(`${emoji} Add the ones.\n\n${a1} + ${b1} = ?\n\n(These are the last digits.)`), expected: onesSum });
            steps.push({ prompt: shortLineBreaks(`${emoji} Now we only need the ones digit.\n\nFrom ${onesSum}, the ones digit is ${onesDigit}.\n\nType ${onesDigit}.`), expected: onesDigit });

            steps.push({ prompt: shortLineBreaks(`${emoji} Add the tens.\n\n${a10} + ${b10}` + (carry1 ? ` + ${carry1}` : ``) + ` = ?`), expected: tensSum });
            steps.push({ prompt: shortLineBreaks(`${emoji} Now the tens digit.\n\nFrom ${tensSum}, the tens digit is ${tensDigit}.\n\nType ${tensDigit}.`), expected: tensDigit });

            if (usesHundreds) {
              const final = hundredsSum * 100 + tensDigit * 10 + onesDigit;

              steps.push({ prompt: shortLineBreaks(`${emoji} Add the hundreds.\n\n${a100} + ${b100}` + (carry10 ? ` + ${carry10}` : ``) + ` = ?`), expected: hundredsSum });
              steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nHundreds: ${hundredsSum}\nTens digit: ${tensDigit}\nOnes digit: ${onesDigit}\n\nWhat is ${a} + ${b}?`), expected: final });
            } else {
              const final = tensDigit * 10 + onesDigit;
              steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nTens digit: ${tensDigit}\nOnes digit: ${onesDigit}\n\nWhat is ${a} + ${b}?`), expected: final });
            }

            return steps;
          }

          // Subtraction
          if (op === "-") {
            const a1 = ones(a), b1 = ones(b);
            const a10 = tens(a), b10 = tens(b);
            const a100 = hundreds(a), b100 = hundreds(b);
            const usesHundreds = (a >= 100 || b >= 100);

            if (age <= 7 && a <= 20 && b <= 20) {
              return [
                { prompt: shortLineBreaks(`${emoji} Step time.\n\nStart at ${a}.\nCount back ${b}.\n\nWhere do you land?`), expected: a - b }
              ];
            }

            if (a1 >= b1) {
              const onesRes = a1 - b1;
              const tensRes = a10 - b10;
              const hundredsRes = a100 - b100;

              const steps = [
                { prompt: shortLineBreaks(`${emoji} Subtract the ones.\n\n${a1} - ${b1} = ?`), expected: onesRes },
                { prompt: shortLineBreaks(`${emoji} Subtract the tens.\n\n${a10} - ${b10} = ?`), expected: tensRes }
              ];

              if (usesHundreds) {
                steps.push({ prompt: shortLineBreaks(`${emoji} Subtract the hundreds.\n\n${a100} - ${b100} = ?`), expected: hundredsRes });
                const final = hundredsRes * 100 + tensRes * 10 + onesRes;
                steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${a} - ${b}?`), expected: final });
              } else {
                const final = tensRes * 10 + onesRes;
                steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${a} - ${b}?`), expected: final });
              }
              return steps;
            }

            const newOnes = a1 + 10;
            const newTens = a10 - 1;
            const onesRes = newOnes - b1;
            const tensRes = newTens - b10;

            const steps = [
              { prompt: shortLineBreaks(`${emoji} The ones are tricky.\n\nWe can swap 1 ten for 10 ones.\n\nOnes become ${newOnes}.\n\nType ${newOnes}.`), expected: newOnes },
              { prompt: shortLineBreaks(`${emoji} Now subtract the ones.\n\n${newOnes} - ${b1} = ?`), expected: onesRes },
              { prompt: shortLineBreaks(`${emoji} Now subtract the tens.\n\n${newTens} - ${b10} = ?`), expected: tensRes }
            ];

            if (usesHundreds) {
              const hundredsRes = a100 - b100;
              steps.push({ prompt: shortLineBreaks(`${emoji} Now subtract the hundreds.\n\n${a100} - ${b100} = ?`), expected: hundredsRes });
              const final = hundredsRes * 100 + tensRes * 10 + onesRes;
              steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${a} - ${b}?`), expected: final });
            } else {
              const final = tensRes * 10 + onesRes;
              steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${a} - ${b}?`), expected: final });
            }

            return steps;
          }

          // Multiplication
          if (op === "×") {
            if (age <= 7 && b <= 4) {
              let total = 0;
              const steps = [];
              for (let i = 1; i <= b; i++) {
                const prev = total;
                total += a;
                steps.push({ prompt: shortLineBreaks(`${emoji} Step ${i}:\n\nAdd ${a}.\n\n${prev} + ${a} = ?`), expected: total });
              }
              steps.push({ prompt: shortLineBreaks(`${emoji} Final step:\n\nSo what is ${a} × ${b}?`), expected: a * b });
              return steps;
            }

            if (b === 2) return [{ prompt: shortLineBreaks(`${emoji} ×2 means double.\n\nWhat is double ${a}?`), expected: a*2 }];
            if (b === 4) return [
              { prompt: shortLineBreaks(`${emoji} Step 1:\n\nDouble ${a}.\n${a} × 2 = ?`), expected: a*2 },
              { prompt: shortLineBreaks(`${emoji} Step 2:\n\nDouble that.\n(${a*2}) × 2 = ?`), expected: a*4 },
              { prompt: shortLineBreaks(`${emoji} Final step:\n\nSo what is ${a} × 4?`), expected: a*4 }
            ];
            if (b === 8) return [
              { prompt: shortLineBreaks(`${emoji} Step 1:\n\nDouble ${a}.\n${a} × 2 = ?`), expected: a*2 },
              { prompt: shortLineBreaks(`${emoji} Step 2:\n\nDouble that.\n(${a*2}) × 2 = ?`), expected: a*4 },
              { prompt: shortLineBreaks(`${emoji} Step 3:\n\nDouble that.\n(${a*4}) × 2 = ?`), expected: a*8 },
              { prompt: shortLineBreaks(`${emoji} Final step:\n\nSo what is ${a} × 8?`), expected: a*8 }
            ];

            return [
              { prompt: shortLineBreaks(`${emoji} Think of groups.\n\n${a} × ${b} means ${b} groups of ${a}.\n\nWhat is ${a} × ${b}?`), expected: a*b }
            ];
          }

          // Division
          if (op === "÷") {
            const final = a / b;
            if (age <= 7) {
              return [
                { prompt: shortLineBreaks(`${emoji} Sharing time.\n\nShare ${a} sweets into groups of ${b}.\n\nHow many groups do you get?`), expected: final }
              ];
            }

            return [
              { prompt: shortLineBreaks(`${emoji} Step 1:\n\nHow many groups of ${b} fit into ${a}?`), expected: final },
              { prompt: shortLineBreaks(`${emoji} Step 2:\n\nQuick check.\n\n${final} × ${b} = ?`), expected: a }
            ];
          }

          return [];
        }

        // AI feedback for correct answers
        async function giveMathFeedback_AI(q, childAnswerText) {
          const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}

Question: "${q.displayText}"
Child answered: "${childAnswerText}"
Correct answer: ${q.correctAnswer}

Write a short response:
- Praise (1 short sentence).
- Give one tiny explanation step (1 short sentence).
- End with: "Ready for the next one?"
- Do NOT ask a new question.
${baseRules()}
`;
          return await callBackend(prompt);
        }

        async function requestHint() {
          if (!currentQuestion) {
            addBotMessage("I can give a hint once you have a question on the screen. 😊", {showHint:false});
            return;
          }
          if (guided.active) {
            addBotMessage("We’re already doing this step by step.\n\nTry the step on the screen first. 😊", {showHint:false});
            return;
          }
          if (hintUsedForCurrent) {
            addBotMessage("You’ve already got the hint for this one.\n\nHave another try! 😊", {showHint:false});
            return;
          }
          hintUsedForCurrent = true;

          const hintPrompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}

The child wants a hint for:
"${currentQuestion.displayText}"

Give ONE short hint only.
Use very simple words.
Do NOT give the final answer.
End with a gentle question.
${baseRules()}
`;
          const hintReply = await callBackend(hintPrompt);
          addBotMessage(hintReply, {showHint:false, showNext:false});
        }

        function handleNextQuestion() {
          if (!waitingForNextButton) return;
          if (sessionComplete()) {
            waitingForNextButton = false;
            endSessionUI();
            return;
          }
          waitingForNextButton = false;
          currentQuestion = generateMathQuestion();
          if (!currentQuestion) {
            addBotMessage("Sorry — I couldn’t make a new question right now. Please try again.", {showHint:false});
            return;
          }
          showMathQuestion(currentQuestion);
        }

        function showActionButtons(buttons) {
          areaSelection.innerHTML = "";
          buttons.forEach(b => {
            const btn = document.createElement("button");
            btn.innerText = b.label;
            btn.onclick = b.onClick;
            areaSelection.appendChild(btn);
          });
          areaSelection.style.display = "block";
        }

        function endSessionUI() {
          calculator.style.display = "none";
          waitingForNextButton = false;
          currentQuestion = null;
          hintUsedForCurrent = false;

          guided.active = false;
          guided.steps = [];
          guided.idx = 0;

          addBotMessage(`✅ That’s the end for today, ${childName}.\n\nYou did really well.`, {showHint:false, showNext:false});

          const nextSubject = (subject === "Maths") ? "English" : "Maths";

          showActionButtons([
            {
              label: `Try ${nextSubject} next`,
              onClick: () => {
                addUserMessage(`Try ${nextSubject}`);
                areaSelection.style.display = "none";
                disableInput(false);
                selectSubject(nextSubject);
              }
            },
            {
              label: "Finished for today ✅",
              onClick: () => {
                addUserMessage("Finished for today");
                areaSelection.style.display = "none";
                showFinishOptions();
              }
            }
          ]);

          disableInput(true);
        }

        function showFinishOptions() {
          addBotMessage("Would you like a parent summary?", {showHint:false, showNext:false});

          showActionButtons([
            {
              label: "Download parent summary (PDF) 📄",
              onClick: () => {
                addUserMessage("Download parent summary (PDF)");
                areaSelection.style.display = "none";
                downloadParentSummaryPDF();
              }
            },
            {
              label: "Start a new session 🔄",
              onClick: () => {
                addUserMessage("Start a new session");
                areaSelection.style.display = "none";
                resetSessionProgress();
                progressHeader.style.display = "none";
                subject = null; area = null;
                disableInput(false);
                stage = "subjectSelect";
                addBotMessage(`What would you like to work on now, ${childName}?`, {showHint:false});
                subjectSelection.style.display = "block";
              }
            }
          ]);
        }

        async function downloadParentSummaryPDF() {
          try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 14;

            doc.setFontSize(18);
            doc.text("Learnlio Parent Summary", 14, y); y += 10;

            doc.setFontSize(12);
            doc.text(`Child: ${childName}`, 14, y); y += 7;
            doc.text(`Age: ${childAge}`, 14, y); y += 7;
            doc.text(`Subject: ${subject || "-"}`, 14, y); y += 7;
            doc.text(`Area: ${area || "-"}`, 14, y); y += 7;
            doc.text(`Date: ${nowTs()}`, 14, y); y += 10;

            doc.text(`Questions completed: ${questionsAnswered} / ${maxQuestions}`, 14, y); y += 7;
            if (subject === "Maths") { doc.text(`Correct answers: ${correctCount}`, 14, y); y += 7; }
            doc.text(`Badges: ${badges.length ? badges.join(" ") : "None"}`, 14, y); y += 10;

            doc.setFontSize(13);
            doc.text("Suggested next steps:", 14, y); y += 8;
            doc.setFontSize(12);

            const plan = (subject === "Maths")
              ? [
                  "1) Practise number facts for 5 minutes (calm and slow).",
                  "2) Do 3 easy questions, then 2 medium questions.",
                  "3) Encourage step-by-step working."
                ]
              : [
                  "1) Read together for 10 minutes (short, calm paragraphs).",
                  "2) Practise 5 spellings using “look, cover, write, check”.",
                  "3) Write 3 short sentences using one new word."
                ];
            plan.forEach(line => { doc.text(line, 14, y); y += 7; });

            y += 6;
            doc.text("Session notes:", 14, y); y += 7;

            const lines = [];
            for (const entry of sessionLog.slice(0, 12)) {
              const q = entry.question ? `Q: ${entry.question}` : "";
              const a = entry.childAnswer ? `A: ${entry.childAnswer}` : "";
              const c = (subject === "Maths" && entry.correct !== null) ? `(${entry.correct ? "Correct" : "Try again"})` : "";
              const line = `${q} ${a} ${c}`.trim();
              if (line) lines.push(line);
            }
            if (!lines.length) lines.push("No detailed log saved.");

            lines.forEach(line => {
              const wrapped = doc.splitTextToSize(line, 180);
              wrapped.forEach(w => {
                if (y > 280) { doc.addPage(); y = 14; }
                doc.text(w, 14, y);
                y += 6;
              });
            });

            doc.save(`Learnlio-Parent-Summary-${childName || "Child"}.pdf`);
            addBotMessage("✅ Download started.\n\nWould you like to start a new session?", {showHint:false});
          } catch (e) {
            addBotMessage("Sorry — I couldn’t create the PDF on this device/browser.\n\nPlease try another browser.", {showHint:false});
          }
        }

        function showAreaSelection(options) {
          areaSelection.innerHTML = "";
          options.forEach(opt => {
            const btn = document.createElement("button");
            btn.innerText = opt.label;
            btn.onclick = async () => {
              addUserMessage(opt.label);
              areaSelection.style.display = "none";

              area = opt.area;

              resetSessionProgress();
              disableInput(false);

              guided.active = false;
              guided.steps = [];
              guided.idx = 0;

              if (subject === "Maths") {
                calculator.style.display = "block";
                currentQuestion = generateMathQuestion();
                if (!currentQuestion) {
                  addBotMessage("Sorry — I couldn’t make a question right now.", {showHint:false});
                  return;
                }
                showMathQuestion(currentQuestion);
              } else {
                calculator.style.display = "none";
                currentQuestion = null;

                const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

Start ONE simple activity (not a list).
Keep it dyslexia-friendly.
End with a gentle question to begin.
${baseRules()}
`;
                const reply = await callBackend(prompt);
                addBotMessage(reply, {showHint:false, showNext:false});
              }
            };
            areaSelection.appendChild(btn);
          });
          areaSelection.style.display = "block";
        }

        window.selectSubject = function(selected) {
          subject = selected;
          subjectSelection.style.display = "none";
          inputContainer.style.display = "flex";
          stage = "normalChat";

          area = null;
          currentQuestion = null;
          waitingForNextButton = false;
          hintUsedForCurrent = false;

          guided.active = false;
          guided.steps = [];
          guided.idx = 0;

          progressHeader.style.display = "none";
          disableInput(false);

          if (selected === "Maths") {
            calculator.style.display = "none";
            addBotMessage("✏️ Great!\n\nWhich Maths area would you like to try first?", {showHint:false});
            showAreaSelection([
              { label: "Addition ➕", area: "Addition" },
              { label: "Subtraction ➖", area: "Subtraction" },
              { label: "Multiplication ✖️", area: "Multiplication" },
              { label: "Division ➗", area: "Division" }
            ]);
          } else {
            calculator.style.display = "none";
            addBotMessage("📚 Great!\n\nWhich English area would you like to practise?", {showHint:false});
            showAreaSelection([
              { label: "Reading aloud 📖", area: "Reading" },
              { label: "Spelling 📝", area: "Spelling" },
              { label: "Sentence building ✍️", area: "Sentence building" },
              { label: "Fun word games 🎲", area: "Word games" }
            ]);
          }
        };

        async function handleInput() {
          const text = input.value.trim();
          if (!text) return;

          if (stage === "askName") {
            childName = text;
            localStorage.setItem("childName", childName);
            stage = "askAge";
            input.value = "";
            addBotMessage(`Hi ${childName}!\n\nHow old are you?`, {showHint:false});
            return;
          }

          if (stage === "askAge") {
            childAge = text;
            localStorage.setItem("childAge", childAge);
            stage = "subjectSelect";
            input.value = "";
            addBotMessage(`Thanks, ${childName}!\n\nWhat are we working on today?`, {showHint:false});
            subjectSelection.style.display = "block";
            return;
          }

          if (stage === "subjectSelect") {
            input.value = "";
            addBotMessage("Please choose Maths or English using the buttons below.", {showHint:false});
            return;
          }

          if (input.disabled) return;

          addUserMessage(text);
          input.value = "";

          // Maths
          if (subject === "Maths") {
            if (!area || !currentQuestion) {
              addBotMessage("Please choose a Maths area first using the buttons.", {showHint:false});
              return;
            }

            if (sessionComplete()) {
              endSessionUI();
              return;
            }

            if (guided.active) {
              const n = parseChildNumber(text);
              const step = guided.steps[guided.idx];
              const ok = (n !== null && Math.abs(n - step.expected) < 1e-9);

              sessionLog.push({
                ts: nowTs(),
                subject, area,
                question: `[Guided step ${guided.idx + 1}/${guided.steps.length}]`,
                childAnswer: text,
                correct: ok
              });

              if (ok) {
                guided.idx += 1;

                if (guided.idx < guided.steps.length) {
                  addBotMessage(
                    `✅ Nice work!\n\nStep ${guided.idx + 1} of ${guided.steps.length}:\n\n${guided.steps[guided.idx].prompt}`,
                    {showHint:false, showNext:false}
                  );
                  return;
                }

                guided.active = false;
                guided.steps = [];
                guided.idx = 0;

                questionsAnswered += 1;
                correctCount += 1;
                maybeAwardBadge();
                updateProgressUI();
                maybeRewardMessage();

                sessionLog.push({
                  ts: nowTs(),
                  subject, area,
                  question: currentQuestion.displayText,
                  childAnswer: "(completed via guided steps)",
                  correct: true
                });

                if (sessionComplete()) {
                  endSessionUI();
                  return;
                }

                waitingForNextButton = true;
                addBotMessage(
                  `Brilliant, ${childName}!\n\nThat is correct.\n\nReady for the next one?`,
                  {showHint:false, showNext:true}
                );
                return;
              } else {
                addBotMessage(
                  `Good try, ${childName}.\n\nLet’s do the same step again.\n\nStep ${guided.idx + 1} of ${guided.steps.length}:\n\n${step.prompt}`,
                  {showHint:false, showNext:false}
                );
                return;
              }
            }

            const n = parseChildNumber(text);
            const correct = (n !== null && Math.abs(n - currentQuestion.correctAnswer) < 1e-9);

            sessionLog.push({
              ts: nowTs(),
              subject, area,
              question: currentQuestion.displayText,
              childAnswer: text,
              correct
            });

            if (correct) {
              questionsAnswered += 1;
              correctCount += 1;
              maybeAwardBadge();
              updateProgressUI();
              maybeRewardMessage();

              const reply = await giveMathFeedback_AI(currentQuestion, text);
              waitingForNextButton = true;

              if (sessionComplete()) {
                addBotMessage(reply, {showHint:false, showNext:false});
                endSessionUI();
                return;
              }

              addBotMessage(reply, {showHint:false, showNext:true});
              return;
            }

            const steps = buildGuidedSteps(currentQuestion);

            if (steps.length) {
              guided.active = true;
              guided.steps = steps;
              guided.idx = 0;

              addBotMessage(
                `Good try, ${childName}.\n\nLet’s go slowly.\nOne small step at a time.\n\nStep 1 of ${guided.steps.length}:\n\n${guided.steps[0].prompt}`,
                {showHint:false, showNext:false}
              );
              return;
            }

            addBotMessage("Good try.\n\nLet’s try again.\n\nWhat do you think the answer is?", {showHint:true, showNext:false});
            return;
          }

          // English
          if (subject === "English") {
            if (!area) {
              addBotMessage("Please choose an English area first using the buttons.", {showHint:false});
              return;
            }

            if (sessionComplete()) {
              endSessionUI();
              return;
            }

            questionsAnswered += 1;
            updateProgressUI();

            sessionLog.push({
              ts: nowTs(),
              subject, area,
              question: "(English turn)",
              childAnswer: text,
              correct: null
            });

            const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

The child replied: "${text}"

Respond with short, clear help.
Use very simple words.
Keep it dyslexia-friendly (extra spacing, short lines).
Give one next step only.
End with a gentle question.

${baseRules()}
`;
            const reply = await callBackend(prompt);
            addBotMessage(reply, {showHint:false, showNext:false});

            if (sessionComplete()) {
              endSessionUI();
            }
            return;
          }
        }

        sendBtn.addEventListener("click", handleInput);
        input.addEventListener("keypress", e => { if (e.key === "Enter") handleInput(); });

        // On load
        const savedName = localStorage.getItem("childName");
        const savedAge = localStorage.getItem("childAge");

        if (savedName && savedAge) {
          childName = savedName;
          childAge = savedAge;
          stage = "subjectSelect";
          addBotMessage(`👋 Welcome back ${childName}!\n\nWhat are we working on today?`, {showHint:false});
          subjectSelection.style.display = "block";
        } else {
          addBotMessage("👋 Hi!\n\nI’m Learnlio AI.\n\nCan I get your name?", {showHint:false});
        }
      });
      </script>

    </div>
  </div>

  <script>
    // Highlight active nav link
    (function () {
      const path = location.pathname || "";
      const map = { "/dash.html":"dash", "/chat.html":"chat", "/screener.html":"screener", "/reports.html":"reports" };
      const key = map[path];
      if (!key) return;
      const el = document.querySelector(`[data-nav="${key}"]`);
      if (el) el.classList.add("active");
    })();
  </script>

</body>
