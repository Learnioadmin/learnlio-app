<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Tutor</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg: #f7f7fb;
      --card: #ffffff;
      --border: #ececf4;
      --text: #111827;
      --muted: #6b7280;
      --brand: #0b5cff;
      --soft: #eef2ff;
      --bot: #fff4cc;
      --shadow: 0 10px 30px rgba(17, 24, 39, .10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    /* Nav (kept as your app nav) */
    .nav { background:#fff; border-bottom:1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .nav-inner { max-width: 1040px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-weight:800; }
    .brand img { height:34px; width:auto; display:block; }
    .links { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a { text-decoration:none; color:var(--text); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active { background: var(--soft); }
    .btn { background:var(--brand); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:700; }
    .btn.light { background:#e5e7eb; color:#111; }
    .btn.ghost { background:transparent; border:1px solid #d1d5db; color:#111; }

    /* Layout */
    .container { max-width: 1040px; margin: 0 auto; padding: 14px 16px 18px; }

    /* Make it feel like a real product panel that fits the screen */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;

      /* This is the key: height fits viewport without becoming huge */
      height: calc(100dvh - 78px - 14px - 18px); /* nav + container padding */
      min-height: 520px;
    }
    @media (max-width: 520px){
      .panel{
        height: calc(100dvh - 78px - 10px);
        min-height: 520px;
      }
      .container{ padding: 10px 12px 14px; }
    }

    /* Header inside panel */
    .panel-top {
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fbfbff 100%);
    }

    .status { margin-top:8px; font-size:13px; }
    .status.bad { color:#dc2626; }
    .status.good { color:#16a34a; }

    /* Progress bar area is compact */
    .ph-wrap { display:none; }
    .ph-top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .ph-kpi { font-size:13px; color:#374151; }
    .ph-kpi strong { color:#111827; }
    .ph-bar { height:8px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:8px; }
    .ph-bar > div { height:8px; width:0%; background:#10b981; }

    /* Messages area */
    .panel-mid {
      padding: 12px;
      flex: 1 1 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #messages {
      flex: 1 1 auto;
      overflow-y: auto;
      background:#fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      scroll-behavior: smooth;
    }

    /* More premium: slightly smaller bubbles + responsive font */
    .msg {
      padding: 12px 14px;
      margin: 0 0 10px;
      border-radius: 16px;
      max-width: 86%;
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.3vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      display:inline-block;
    }
    .msg.user { background: var(--brand); color:#fff; margin-left:auto; text-align:right; }
    .msg.bot  { background: var(--bot); color:#111; border: 1px solid rgba(0,0,0,.05); }

    .bot-controls { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn-small {
      border:none; border-radius:12px; padding:7px 10px;
      font-size:13px; cursor:pointer; color:#fff; font-weight:800;
    }
    .speak-btn { background: var(--brand); }
    .hint-btn  { background: #10b981; }
    .next-btn  { background: #7c3aed; }

    /* Typing */
    #typing-indicator { display:none; margin-top: 2px; color: var(--muted); font-style: italic; font-size: 13px; }

    /* MCQ */
    .mcq-wrap { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
    .mcq-btn {
      border:1px solid #d1d5db; background:#fff; color:#111;
      padding:12px; border-radius:14px; cursor:pointer; text-align:left;
      font-size:15px; font-weight:700;
    }
    .mcq-btn:hover { background:#f3f4f6; }

    /* Bottom dock: selection + input */
    .panel-bottom {
      border-top: 1px solid var(--border);
      padding: 12px;
      background: #fff;
    }

    #subject-selection { display:none; }
    #area-selection { display:none; margin-top:10px; }

    .dock-row { display:flex; gap:10px; align-items:center; }
    #input {
      flex:1; padding: 12px 12px;
      font-size: 15px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      outline: none;
    }
    #input:focus { border-color: rgba(11,92,255,.55); box-shadow: 0 0 0 4px rgba(11,92,255,.10); }
    #sendBtn {
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 14px;
      border:none;
      background: var(--brand);
      color:#fff;
      cursor:pointer;
      font-weight: 800;
      white-space: nowrap;
    }

    /* Calculator (kept but tucked away nicely) */
    #calculator { display:none; margin-top:10px; background: var(--soft); padding:10px; border-radius: 16px; border: 1px solid rgba(11,92,255,.12); }
    .calcBtn { padding:14px; font-size:18px; border-radius:12px; border:none; background:#fff; cursor:pointer; font-weight:800; }
    .calcBtn:hover { background:#f3f4f6; }

    /* Reward toast */
    #rewardToast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #111;
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: 0 12px 26px rgba(0,0,0,.25);
      display: none;
      max-width: min(560px, calc(100vw - 24px));
      font-size: 14px;
      z-index: 9999;
    }
    #rewardToast strong { display:block; font-size: 15px; margin-bottom: 2px; }

    /* Make bottom dock stack nicely on small screens */
    @media (max-width: 520px){
      .dock-row { flex-direction: column; align-items: stretch; }
      #sendBtn { width: 100%; }
      .links a { padding:8px 9px; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a class="active" href="/chat.html">Learnlio Tutor</a>
        <a href="/screener.html">Dyslexia Screener</a>
        <a href="/reports.html">Reports</a>
        <a href="/billing.html">Billing</a>
        <button id="logoutBtn" class="btn light" type="button">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="panel" aria-label="Learnlio Tutor session">

      <div class="panel-top">
        <div id="pageError" class="status bad" style="display:none;"></div>

        <div id="progressHeader" class="ph-wrap">
          <div class="ph-top">
            <div id="progressLabel" class="ph-kpi"><strong>Progress</strong>: 0 / 0</div>
            <div id="skillLabel" class="ph-kpi"><strong>Skill</strong>: —</div>
            <div id="badgeLabel" class="ph-kpi"><strong>Badges</strong>: —</div>
          </div>
          <div class="ph-bar"><div id="progressBar"></div></div>
        </div>
      </div>

      <div class="panel-mid">
        <div id="messages"></div>
        <div id="typing-indicator">Learnlio is typing…</div>
      </div>

      <div class="panel-bottom">
        <div id="subject-selection">
          <p class="muted" style="margin:0 0 10px;">Choose a subject to start:</p>
          <button class="btn" id="mathsBtn" type="button">➕ Maths</button>
          <button class="btn" id="englishBtn" type="button">📚 English</button>
        </div>

        <div id="area-selection"></div>

        <div id="calculator">
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;">
            <button type="button" class="calcBtn">7</button>
            <button type="button" class="calcBtn">8</button>
            <button type="button" class="calcBtn">9</button>
            <button type="button" class="calcBtn">÷</button>

            <button type="button" class="calcBtn">4</button>
            <button type="button" class="calcBtn">5</button>
            <button type="button" class="calcBtn">6</button>
            <button type="button" class="calcBtn">×</button>

            <button type="button" class="calcBtn">1</button>
            <button type="button" class="calcBtn">2</button>
            <button type="button" class="calcBtn">3</button>
            <button type="button" class="calcBtn">−</button>

            <button type="button" class="calcBtn">0</button>
            <button type="button" id="calcClearBtn" class="calcBtn">C</button>
            <button type="button" class="calcBtn">+</button>
            <button type="button" class="calcBtn">=</button>
          </div>
        </div>

        <div class="dock-row" style="margin-top:10px;">
          <input id="input" placeholder="Type your answer here…" />
          <button id="sendBtn" type="button">Send</button>
        </div>
      </div>

    </section>
  </main>

  <div id="rewardToast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const BACKEND_URL = "https://softr-chat-backend.onrender.com";
    const TTS_WORKER_BASE = "https://learnlio-tts.falling-grass-34ab.workers.dev";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elements
    const pageError = document.getElementById("pageError");
    const logoutBtn = document.getElementById("logoutBtn");
    const messagesDiv = document.getElementById("messages");
    const typingIndicator = document.getElementById("typing-indicator");

    const progressHeader = document.getElementById("progressHeader");
    const progressLabel  = document.getElementById("progressLabel");
    const skillLabel     = document.getElementById("skillLabel");
    const badgeLabel     = document.getElementById("badgeLabel");
    const progressBar    = document.getElementById("progressBar");

    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const calculator = document.getElementById("calculator");
    const subjectSelection = document.getElementById("subject-selection");
    const areaSelection = document.getElementById("area-selection");
    const mathsBtn = document.getElementById("mathsBtn");
    const englishBtn = document.getElementById("englishBtn");
    const rewardToast = document.getElementById("rewardToast");

    // Auth + child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Tutor state
    let subject = null; // "Maths" | "English"
    let area = null;

    // Session + skill tracking
    let sessionDbId = null;
    let maxQuestions = 10;
    let questionsAnswered = 0;
    let correctCount = 0;
    let badges = [];

    // Skill row
    let skillRow = null;
    let difficultyLevel = 1;
    let streakCorrect = 0;
    let streakWrong = 0;

    // Current task
    let currentQuestion = null; // { displayText, correctAnswer, choices?, kind? }
    let hintUsedForCurrent = false;
    let waitingForNextButton = false;
    let guided = { active:false, steps:[], idx:0 };

    // Single audio player
    const ttsAudio = new Audio();
    ttsAudio.preload = "none";

    // ---------------- UI helpers ----------------
    function showError(msg) {
      pageError.style.display = "block";
      pageError.textContent = msg;
    }
    function clearError() {
      pageError.style.display = "none";
      pageError.textContent = "";
    }
    function disableInput(disabled) {
      input.disabled = disabled;
      sendBtn.disabled = disabled;
      sendBtn.style.opacity = disabled ? "0.6" : "1";
      input.style.opacity = disabled ? "0.6" : "1";
    }
    function scrollBottom(){ messagesDiv.scrollTop = messagesDiv.scrollHeight; }
    function cleanBotText(t){ return String(t || "").replace(/\*\*/g, ""); }

    function addUserMessage(text) {
      const div = document.createElement("div");
      div.className = "msg user";
      div.innerText = String(text || "").trim();
      messagesDiv.appendChild(div);
      scrollBottom();
    }

    // Only strip emojis for TTS, NOT for UI
    function stripForTTS(text) {
      let t = String(text || "");
      t = t.replace(/[\u{1F300}-\u{1FAFF}]/gu, "");
      t = t.replace(/[\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, "");
      t = t.replace(/[•★🏅🏆⭐✅➡️🔊💡📚✏️🎲➕➖✖️➗]/g, "");
      t = t.replace(/\s{2,}/g, " ").trim();
      return t;
    }

    async function speakViaWorker(text) {
      const clean = stripForTTS(text);
      if (!clean) return;

      try { ttsAudio.pause(); } catch {}
      ttsAudio.currentTime = 0;

      const res = await fetch(`${TTS_WORKER_BASE}/speak`, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({
          text: clean,
          languageCode: "en-GB",
          speakingRate: 1.03,
          pitch: 0
        })
      });

      if (!res.ok) {
        const msg = await res.text().catch(()=> "");
        throw new Error(`TTS worker failed (${res.status}): ${msg}`);
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      ttsAudio.src = url;
      await ttsAudio.play();
      ttsAudio.onended = () => { URL.revokeObjectURL(url); };
    }

    function speakFallbackBrowser(text) {
      if (!("speechSynthesis" in window)) return;
      try { window.speechSynthesis.cancel(); } catch {}
      const u = new SpeechSynthesisUtterance(stripForTTS(text));
      u.lang = "en-GB";
      u.rate = 0.95;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }

    async function speak(text) {
      try { await speakViaWorker(text); }
      catch (e) { console.warn("Worker TTS failed; fallback:", e); speakFallbackBrowser(text); }
    }

    function addBotMessage(text, opts={showHint:false, showNext:false, choices:null}) {
      const safeText = cleanBotText(text);
      const div = document.createElement("div");
      div.className = "msg bot";

      const content = document.createElement("div");
      content.innerText = safeText;
      div.appendChild(content);

      if (Array.isArray(opts.choices) && opts.choices.length) {
        const wrap = document.createElement("div");
        wrap.className = "mcq-wrap";
        opts.choices.forEach((c, idx) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "mcq-btn";
          const letter = ["A","B","C","D"][idx] || "";
          b.textContent = `${letter}) ${c}`;
          b.addEventListener("click", async () => {
            input.value = String(c);
            await handleSend();
          });
          wrap.appendChild(b);
        });
        div.appendChild(wrap);
      }

      const controls = document.createElement("div");
      controls.className = "bot-controls";

      const speakBtn = document.createElement("button");
      speakBtn.type = "button";
      speakBtn.className = "btn-small speak-btn";
      speakBtn.innerText = "🔊 Listen";
      speakBtn.onclick = () => speak(safeText);
      controls.appendChild(speakBtn);

      if (opts.showHint) {
        const hintBtn = document.createElement("button");
        hintBtn.type = "button";
        hintBtn.className = "btn-small hint-btn";
        hintBtn.innerText = "💡 Hint";
        hintBtn.onclick = () => requestHint();
        controls.appendChild(hintBtn);
      }

      if (opts.showNext) {
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn-small next-btn";
        nextBtn.innerText = "➡️ Next";
        nextBtn.onclick = () => handleNextQuestion();
        controls.appendChild(nextBtn);
      }

      div.appendChild(controls);
      messagesDiv.appendChild(div);
      scrollBottom();
    }

    function showActionButtons(buttons) {
      areaSelection.innerHTML = "";
      buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";
        btn.style.marginRight = "8px";
        btn.style.marginBottom = "8px";
        btn.innerText = b.label;
        btn.addEventListener("click", b.onClick);
        areaSelection.appendChild(btn);
      });
      areaSelection.style.display = "block";
    }

    function computeAgeFromDob(dobStr) {
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function computeMaxQuestions() {
      const a = childAge;
      if (a <= 7) return 5;
      if (a <= 10) return 8;
      if (a <= 13) return 10;
      return 12;
    }

    function updateProgressUI() {
      progressHeader.style.display = "block";
      progressLabel.innerText = `Progress: ${questionsAnswered} / ${maxQuestions}`;

      const lvl = skillRow?.level || difficultyLevel || 1;
      const acc = (typeof skillRow?.accuracy === "number") ? Math.round(skillRow.accuracy * 100) : null;

      skillLabel.innerText = (subject && area)
        ? `Skill: ${subject} • ${area} — Level ${lvl}${acc !== null ? ` • ${acc}%` : ""}`
        : "Skill: —";

      badgeLabel.innerText = `Badges: ${badges.length ? badges.join(" ") : "—"}`;

      const pct = maxQuestions ? Math.min(100, Math.round((questionsAnswered / maxQuestions) * 100)) : 0;
      progressBar.style.width = pct + "%";
    }

    function resetSessionCounters() {
      sessionDbId = null;
      maxQuestions = computeMaxQuestions();
      questionsAnswered = 0;
      correctCount = 0;
      badges = [];
      updateProgressUI();
    }

    function sessionComplete() { return questionsAnswered >= maxQuestions; }

    function showRewardToast(title, body) {
      rewardToast.innerHTML = `<strong>${title}</strong>${body || ""}`;
      rewardToast.style.display = "block";
      setTimeout(() => { rewardToast.style.display = "none"; }, 2600);
    }

    function maybeAwardBadge() {
      // Keep emojis (premium friendly, rewarding)
      if (correctCount === 3 && !badges.includes("⭐")) { badges.push("⭐"); showRewardToast("⭐ New badge", "Three correct answers — lovely work."); }
      if (correctCount === 5 && !badges.includes("🏅")) { badges.push("🏅"); showRewardToast("🏅 New badge", "Five correct — you’re on a roll."); }
      if (correctCount === 10 && !badges.includes("🏆")) { badges.push("🏆"); showRewardToast("🏆 New badge", "Ten correct — brilliant effort."); }
    }

    // Save last context per child for “carry on” feeling
    function ctxKey() { return child?.id ? `learnlio_last_ctx_${child.id}` : "learnlio_last_ctx"; }
    function saveLastContext() {
      if (!child?.id) return;
      localStorage.setItem(ctxKey(), JSON.stringify({ subject, area, at: new Date().toISOString() }));
    }
    function loadLastContext() {
      if (!child?.id) return null;
      try { const raw = localStorage.getItem(ctxKey()); return raw ? JSON.parse(raw) : null; } catch { return null; }
    }

    // ---------------- Backend (AI) ----------------
    async function callBackend(promptText) {
      try {
        typingIndicator.style.display = "block";
        const response = await axios.post(
          BACKEND_URL,
          {
            userId: currentUser?.id || "guest",
            messages: [{ role: "user", content: promptText }],
            subject,
            childName,
            childAge: String(childAge)
          }
        );
        typingIndicator.style.display = "none";
        return response.data.reply;
      } catch (err) {
        typingIndicator.style.display = "none";
        return "Sorry — I couldn’t connect right now. Please try again. 🙁";
      }
    }

    // ---------------- Database: Sessions + Items + Skill ----------------
    async function ensureSessionRow() {
      if (sessionDbId) return sessionDbId;
      if (!currentUser?.id || !child?.id || !subject) return null;

      const payload = {
        owner_id: currentUser.id,
        parent_user_id: currentUser.id,
        child_id: child.id,
        subject: subject,
        area: area || null,
        questions_done: 0,
        correct_count: 0,
        badges: badges,
        summary: null,
        raw_log: null
      };

      const { data, error } = await sb.from("sessions").insert(payload).select("id").single();
      if (error) { console.error("sessions insert failed:", error); throw error; }
      sessionDbId = data.id;
      return sessionDbId;
    }

    async function insertSessionItem({ item_type, prompt_text=null, child_text=null, is_correct=null, meta=null }) {
      await ensureSessionRow();
      if (!sessionDbId || !currentUser?.id || !child?.id) return;

      const payload = { session_id: sessionDbId, owner_id: currentUser.id, child_id: child.id, item_type, prompt_text, child_text, is_correct, meta: meta || {} };
      const { error } = await sb.from("session_items").insert(payload);
      if (error) { console.error("session_items insert failed:", error); throw error; }
    }

    async function updateSessionRollups() {
      if (!sessionDbId) return;
      const { error } = await sb.from("sessions").update({
        area: area || null,
        questions_done: questionsAnswered,
        correct_count: correctCount,
        badges: badges
      }).eq("id", sessionDbId);
      if (error) console.error("sessions update failed:", error);
    }

    async function loadOrCreateSkillRow() {
      if (!currentUser?.id || !child?.id || !subject || !area) return null;

      const { data: existing } = await sb
        .from("child_skill_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", subject)
        .eq("area", area)
        .maybeSingle();

      if (existing?.id) {
        skillRow = existing;
        difficultyLevel = skillRow.level || 1;
        streakCorrect = skillRow.streak_correct || 0;
        streakWrong = skillRow.streak_wrong || 0;
        updateProgressUI();
        return skillRow;
      }

      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject,
        area,
        level: 1,
        confidence: 0.5,
        accuracy: 0.0,
        total_attempts: 0,
        correct_attempts: 0,
        streak_correct: 0,
        streak_wrong: 0,
        last_session_id: sessionDbId || null,
        last_seen_at: new Date().toISOString()
      };

      const { data: up, error: upErr } = await sb
        .from("child_skill_progress")
        .upsert(payload, { onConflict: "owner_id,child_id,subject,area" })
        .select("*")
        .single();

      if (upErr) { console.error("child_skill_progress upsert failed:", upErr); throw upErr; }
      skillRow = up;
      difficultyLevel = skillRow.level || 1;
      streakCorrect = 0;
      streakWrong = 0;
      updateProgressUI();
      return skillRow;
    }

    function computeNewLevel({ level, accuracy, streak_correct, streak_wrong, total_attempts }) {
      let newLevel = level || 1;
      const att = total_attempts || 0;
      if (att >= 6 && streak_correct >= 3 && accuracy >= 0.70) newLevel = Math.min(10, newLevel + 1);
      if (att >= 6 && streak_wrong >= 3 && accuracy < 0.40) newLevel = Math.max(1, newLevel - 1);
      return newLevel;
    }

    async function recordAttemptToSkill({ isCorrect, meta }) {
      if (!skillRow?.id) return;

      const total_attempts = (skillRow.total_attempts || 0) + 1;
      const correct_attempts = (skillRow.correct_attempts || 0) + (isCorrect ? 1 : 0);
      const accuracy = total_attempts ? (correct_attempts / total_attempts) : 0.0;

      const newStreakCorrect = isCorrect ? (streakCorrect + 1) : 0;
      const newStreakWrong = isCorrect ? 0 : (streakWrong + 1);

      const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;
      const confidence = Math.max(0, Math.min(1, oldConf * 0.85 + accuracy * 0.15));

      const level = computeNewLevel({
        level: skillRow.level || 1,
        accuracy,
        streak_correct: newStreakCorrect,
        streak_wrong: newStreakWrong,
        total_attempts
      });

      streakCorrect = newStreakCorrect;
      streakWrong = newStreakWrong;
      difficultyLevel = level;

      const patch = {
        level,
        confidence,
        accuracy,
        total_attempts,
        correct_attempts,
        streak_correct: newStreakCorrect,
        streak_wrong: newStreakWrong,
        last_session_id: sessionDbId || null,
        last_seen_at: new Date().toISOString()
      };

      const { data, error } = await sb.from("child_skill_progress").update(patch).eq("id", skillRow.id).select("*").single();
      if (error) { console.error("child_skill_progress update failed:", error); throw error; }

      skillRow = data;
      updateProgressUI();
    }

    // ---------------- Maths MCQ helpers ----------------
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function boundsForAgeAndDifficulty() {
      const age = childAge;
      const d = Math.max(1, Math.min(10, difficultyLevel || 1));
      const band = (d <= 3) ? 1 : (d <= 6) ? 2 : 3;

      if (age <= 7) {
        if (band === 1) return { min: 0, max: 10 };
        if (band === 2) return { min: 5, max: 15 };
        return { min: 10, max: 20 };
      }
      if (age <= 9) {
        if (band === 1) return { min: 5, max: 25 };
        if (band === 2) return { min: 10, max: 40 };
        return { min: 20, max: 60 };
      }
      if (age <= 11) {
        if (band === 1) return { min: 10, max: 60 };
        if (band === 2) return { min: 20, max: 120 };
        return { min: 50, max: 200 };
      }
      if (band === 1) return { min: 20, max: 120 };
      if (band === 2) return { min: 50, max: 300 };
      return { min: 100, max: 600 };
    }

    function generateMathQuestion() {
      const { min, max } = boundsForAgeAndDifficulty();

      if (area === "Addition") {
        const x = randInt(min, max), y = randInt(min, max);
        return { kind:"math", displayText: `${x} + ${y} = ?`, correctAnswer: x + y };
      }
      if (area === "Subtraction") {
        let x = randInt(min, max), y = randInt(min, max);
        if (y > x) [x, y] = [y, x];
        return { kind:"math", displayText: `${x} − ${y} = ?`, correctAnswer: x - y };
      }
      if (area === "Multiplication") {
        const base = (childAge <= 7) ? 5 : (childAge <= 9) ? 8 : 12;
        const band = (difficultyLevel <= 3) ? 0 : (difficultyLevel <= 6) ? 1 : 2;
        const tableMax = Math.min(12, base + band * 2);
        const x = randInt(2, tableMax), y = randInt(2, tableMax);
        return { kind:"math", displayText: `${x} × ${y} = ?`, correctAnswer: x * y };
      }
      if (area === "Division") {
        const base = (childAge <= 7) ? 5 : (childAge <= 9) ? 8 : 12;
        const band = (difficultyLevel <= 3) ? 0 : (difficultyLevel <= 6) ? 1 : 2;
        const divMax = Math.min(12, base + band * 2);
        const divisor = randInt(2, divMax), quotient = randInt(2, divMax);
        return { kind:"math", displayText: `${divisor * quotient} ÷ ${divisor} = ?`, correctAnswer: quotient };
      }
      return null;
    }

    function makeMCQChoices(correct) {
      const choices = new Set([correct]);
      while (choices.size < 4) {
        const delta = randInt(1, 6);
        const sign = Math.random() < 0.5 ? -1 : 1;
        const candidate = Math.max(0, correct + sign * delta);
        choices.add(candidate);
      }
      const arr = Array.from(choices).map(n => String(n));
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function parseChildNumber(text) {
      const m = String(text || "").match(/-?\d+(\.\d+)?/);
      if (!m) return null;
      return Number(m[0]);
    }

    // ---------------- English MCQ (young kids) ----------------
    function shuffle(arr){
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateEnglishMCQ() {
      // Only for younger children, and only for certain areas
      if (childAge > 8) return null;

      // Small, safe word bank (UK spelling)
      const spellingPairs = [
        ["because", ["becos", "becuase", "because"]],
        ["beautiful", ["beatiful", "beautiful", "beutiful"]],
        ["friend", ["freind", "friend", "frend"]],
        ["school", ["scool", "school", "schol"]],
        ["their", ["there", "their", "thier"]],
        ["were", ["where", "were", "wer"]],
        ["said", ["sed", "said", "saied"]],
        ["little", ["littel", "little", "litle"]],
      ];

      const synonyms = [
        ["happy", ["happy", "sad", "angry", "tired"], "Which word means the same as cheerful? 😊", "happy"],
        ["quick", ["slow", "quick", "quiet", "late"], "Which word means fast? ⚡", "quick"],
        ["big", ["tiny", "big", "soft", "kind"], "Which word means large? 🐘", "big"],
        ["cold", ["hot", "cold", "bright", "loud"], "Which word is the opposite of hot? ❄️", "cold"],
      ];

      if (area === "Spelling") {
        const [correct, opts] = spellingPairs[randInt(0, spellingPairs.length - 1)];
        const choices = shuffle(opts).slice(0,4);
        return {
          kind:"english",
          prompt: `📝 Pick the correct spelling:`,
          question: `Which one is right?`,
          choices,
          correctAnswer: correct
        };
      }

      if (area === "Word games") {
        const s = synonyms[randInt(0, synonyms.length - 1)];
        const prompt = s[2];
        const correct = s[3];
        const choices = shuffle(s[1]).slice(0,4);
        return {
          kind:"english",
          prompt,
          question: `Choose one:`,
          choices,
          correctAnswer: correct
        };
      }

      // For Reading / Sentence building: keep as normal tutor chat for now
      return null;
    }

    // ---------------- Show questions ----------------
    function showQuestion(q) {
      hintUsedForCurrent = false;
      waitingForNextButton = false;

      const useMCQ = (childAge <= 8) && (q?.choices && q.choices.length);

      if (q.kind === "math") {
        const emoji = (area === "Addition") ? "➕" :
                      (area === "Subtraction") ? "➖" :
                      (area === "Multiplication") ? "✖️" :
                      (area === "Division") ? "➗" : "✏️";
        addBotMessage(
          `${emoji} Question:\n\n${q.displayText}\n\nTake your time.\nWhat do you think the answer is?`,
          { showHint: !useMCQ, choices: useMCQ ? q.choices : null }
        );

        insertSessionItem({
          item_type: "question",
          prompt_text: q.displayText,
          child_text: null,
          is_correct: null,
          meta: { subject, area, difficultyLevel, mode: useMCQ ? "mcq" : "free" }
        }).catch(console.error);
      } else {
        // English MCQ
        addBotMessage(
          `${q.prompt}\n\n${q.question}`,
          { showHint:false, choices: q.choices }
        );

        insertSessionItem({
          item_type: "question",
          prompt_text: `${q.prompt} ${q.question}`,
          child_text: null,
          is_correct: null,
          meta: { subject, area, difficultyLevel, mode: "mcq" }
        }).catch(console.error);
      }
    }

    // ---------------- Guided steps (math) ----------------
    function buildGuidedSteps(q) {
      const raw = q.displayText.replace("= ?", "").trim();
      let op = null;
      if (raw.includes("+")) op = "+";
      else if (raw.includes("−") || raw.includes("-")) op = "−";
      else if (raw.includes("×")) op = "×";
      else if (raw.includes("÷")) op = "÷";
      if (!op) return [];

      const parts = raw.split(op).map(s => parseInt(s.trim(), 10));
      const a = parts[0], b = parts[1];
      if (Number.isNaN(a) || Number.isNaN(b)) return [];

      if (childAge <= 7) {
        if (op === "+") return [{ prompt: `Start at ${a}.\nCount up ${b}.\n\nWhere do you land?`, expected: a+b }];
        if (op === "−") return [{ prompt: `Start at ${a}.\nCount back ${b}.\n\nWhere do you land?`, expected: a-b }];
        if (op === "×") return [{ prompt: `${a} × ${b} means add ${a}, ${b} times.\n\nWhat do you get?`, expected: a*b }];
        if (op === "÷") return [{ prompt: `How many groups of ${b} fit into ${a}?\n\nWhat do you get?`, expected: a/b }];
      }

      return [{ prompt: `Let’s do it slowly.\n\nWork it out step by step.\n\nWhat answer do you get?`, expected: q.correctAnswer }];
    }

    async function requestHint() {
      if (!currentQuestion) { addBotMessage("💡 I can give a hint once a question is on the screen."); return; }
      if (guided.active) { addBotMessage("💡 We’re already doing it step by step.\n\nTry this step first."); return; }
      if (hintUsedForCurrent) { addBotMessage("💡 You’ve already got a hint for this one.\n\nHave another try."); return; }
      hintUsedForCurrent = true;

      const hintPrompt = `
You are Learnlio AI, a child-safe UK tutor.

Maths area: ${area}
Question: "${currentQuestion.displayText}"

Give ONE short hint only.
Do NOT give the final answer.
End with a gentle question.
British English.
Short lines.
`;
      const hintReply = await callBackend(hintPrompt);
      addBotMessage(hintReply);
    }

    function handleNextQuestion() {
      if (!waitingForNextButton) return;

      if (sessionComplete()) {
        waitingForNextButton = false;
        endSessionUI();
        return;
      }

      waitingForNextButton = false;

      if (subject === "Maths") {

        if (childAge <= 8) currentQuestion.choices = makeMCQChoices(currentQuestion.correctAnswer);

      currentQuestion = null;

    // ---------------- Main send handler ----------------
    async function handleSend() {
      const text = input.value.trim();
      if (!text || input.disabled) return;

      addUserMessage(text);
      input.value = "";

      // evidence
      try {
        await insertSessionItem({
          item_type: "answer",
          prompt_text: currentQuestion?.displayText || currentQuestion?.question || null,
          child_text: text,
          is_correct: null,
          meta: { subject, area, difficultyLevel }
        });
      } catch (e) { console.error(e); }

      if (!subject) { addBotMessage("Please choose Maths or English using the buttons below. 😊"); subjectSelection.style.display = "block"; return; }
      if (!area) { addBotMessage("Please choose an area first using the buttons. 🙂"); return; }
      if (sessionComplete()) { endSessionUI(); return; }

      // ---------------- Maths ----------------
      if (subject === "Maths") {
        if (!currentQuestion) { addBotMessage("Please choose a Maths area first."); return; }

        // Guided mode
        if (guided.active) {
          const n = parseChildNumber(text);
          const step = guided.steps[guided.idx];
          const ok = (n !== null && Math.abs(n - step.expected) < 1e-9);

          if (ok) {
            guided.idx += 1;
            if (guided.idx < guided.steps.length) {
              addBotMessage(`✅ Nice work!\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${guided.steps[guided.idx].prompt}`);
              return;
            }

            guided.active = false; guided.steps = []; guided.idx = 0;

            questionsAnswered += 1;
            correctCount += 1;
            streakCorrect += 1;
            streakWrong = 0;

            maybeAwardBadge();
            updateProgressUI();

            await insertSessionItem({
              item_type: "feedback",
              prompt_text: currentQuestion.displayText,
              child_text: "(completed via guided steps)",
              is_correct: true,
              meta: { subject, area, difficultyLevel, guided: true }
            });

            await recordAttemptToSkill({ isCorrect: true, meta: { guided: true } });
            await updateSessionRollups();

            if (sessionComplete()) { endSessionUI(); return; }

            waitingForNextButton = true;
            addBotMessage(`🎉 Brilliant, ${childName}!\n\nThat is correct.\n\nReady for the next one? 😊`, { showNext:true });
            return;
          } else {
            streakWrong += 1;
            streakCorrect = 0;

            await insertSessionItem({
              item_type: "feedback",
              prompt_text: currentQuestion.displayText,
              child_text: text,
              is_correct: false,
              meta: { subject, area, difficultyLevel, guided: true, step: guided.idx+1 }
            });

            await recordAttemptToSkill({ isCorrect: false, meta: { guided: true, step: guided.idx+1 } });
            await updateSessionRollups();

            addBotMessage(`Good try. 🙂\n\nLet’s do the same step again.\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${step.prompt}`);
            return;
          }
        }

        const n = parseChildNumber(text);
        const correct = (n !== null && Math.abs(n - currentQuestion.correctAnswer) < 1e-9);

        if (correct) {
          questionsAnswered += 1;
          correctCount += 1;
          streakCorrect += 1;
          streakWrong = 0;

          maybeAwardBadge();
          updateProgressUI();

          await insertSessionItem({
            item_type: "feedback",
            prompt_text: currentQuestion.displayText,
            child_text: text,
            is_correct: true,
            meta: { subject, area, difficultyLevel }
          });

          await recordAttemptToSkill({ isCorrect: true, meta: {} });
          await updateSessionRollups();

          const reply = await giveMathFeedback_AI(currentQuestion, text);

          if (sessionComplete()) { addBotMessage(reply); endSessionUI(); return; }

          waitingForNextButton = true;
          addBotMessage(reply, { showNext:true });
          return;
        }

        // Incorrect => guided steps
        streakWrong += 1;
        streakCorrect = 0;

        await insertSessionItem({
          item_type: "feedback",
          prompt_text: currentQuestion.displayText,
          child_text: text,
          is_correct: false,
          meta: { subject, area, difficultyLevel }
        });

        await recordAttemptToSkill({ isCorrect: false, meta: {} });
        await updateSessionRollups();

        const steps = buildGuidedSteps(currentQuestion);
        if (steps.length) {
          guided.active = true;
          guided.steps = steps;
          guided.idx = 0;
          addBotMessage(`Good try, ${childName}. 🙂\n\nLet’s go slowly.\n\nStep 1 of ${guided.steps.length}:\n\n${guided.steps[0].prompt}`);
          return;
        }

        addBotMessage("Good try. 🙂\n\nLet’s try again.\n\nWhat do you think the answer is?", { showHint:true });
        return;
      }

      // ---------------- English ----------------
      if (subject === "English") {
        // If we are in English MCQ mode (currentQuestion has correctAnswer + choices)
        if (currentQuestion?.kind === "english" && currentQuestion?.correctAnswer) {
          const isCorrect = String(text).trim().toLowerCase() === String(currentQuestion.correctAnswer).trim().toLowerCase();

          questionsAnswered += 1;
          if (isCorrect) correctCount += 1;
          maybeAwardBadge();
          updateProgressUI();

          await insertSessionItem({
            item_type: "feedback",
            prompt_text: currentQuestion.question,
            child_text: text,
            is_correct: isCorrect,
            meta: { subject, area, difficultyLevel, mode: "mcq" }
          });

          // Use the same skill tracking rules for MCQ English attempts
          await recordAttemptToSkill({ isCorrect, meta: { mode: "mcq" } });
          await updateSessionRollups();

          if (isCorrect) addBotMessage("✅ Yes! Great choice. 🎉", { showNext: true });
          else addBotMessage(`🙂 Good try.\n\nThe right answer was: ${currentQuestion.correctAnswer}\n\nReady for the next one?`, { showNext: true });

          if (sessionComplete()) { endSessionUI(); }
          return;
        }

        // Normal English tutor chat
        questionsAnswered += 1;
        updateProgressUI();

        await insertSessionItem({
          item_type: "turn",
          prompt_text: `English: ${area}`,
          child_text: text,
          is_correct: null,
          meta: { subject, area, difficultyLevel }
        });

        try {
          if (skillRow?.id) {
            const total_attempts = (skillRow.total_attempts || 0) + 1;
            const correct_attempts = (skillRow.correct_attempts || 0);
            const accuracy = total_attempts ? (correct_attempts / total_attempts) : 0.0;
            const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;
            const confidence = Math.max(0, Math.min(1, oldConf * 0.90 + 0.10 * 0.55));

            const { data } = await sb.from("child_skill_progress").update({
              total_attempts, accuracy, confidence,
              last_session_id: sessionDbId || null,
              last_seen_at: new Date().toISOString()
            }).eq("id", skillRow.id).select("*").single();

            if (data) skillRow = data;
            updateProgressUI();
          }
        } catch (e) { console.error(e); }

        await updateSessionRollups();

        const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

The child replied: "${text}"

Respond with short, clear help.
Use very simple words.
Dyslexia-friendly spacing (short lines).
Give one next step only.
Use friendly emojis sometimes (not too many).
End with a gentle question.
British English.
`;
        const reply = await callBackend(prompt);
        addBotMessage(reply);

        if (sessionComplete()) endSessionUI();
      }
    }

    // ---------------- Calculator wiring ----------------
    function setupCalculator() {
      const btns = Array.from(document.querySelectorAll(".calcBtn"));
      btns.forEach(b => {
        b.addEventListener("click", () => {
          const val = b.textContent;
          if (val === "C") return;
          input.value += val;
          input.focus();
        });
      });
      document.getElementById("calcClearBtn").addEventListener("click", () => {
        input.value = "";
        input.focus();
      });
    }

    // ---------------- Auth + child loading ----------------
    async function requireAuth() {
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) {
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    function getSelectedChildFromLocalStorage() {
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    async function loadChildProfile() {
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id) {
        showError("No child selected. Go to Dashboard and click Select on a child.");
        addBotMessage("I can’t find a child profile yet.\n\nPlease go back to the Dashboard and select a child. 🙂");
        showActionButtons([{ label: "Go to Dashboard", onClick: () => window.location.href = "/dash.html" }]);
        disableInput(true);
        subjectSelection.style.display = "none";
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data) {
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        disableInput(true);
        return false;
      }

      if (data.parent_user_id !== currentUser.id) {
        showError("This child profile does not belong to this account. Please re-select a child.");
        disableInput(true);
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);

      clearError();
      disableInput(false);

      const last = loadLastContext();
      if (last?.subject) {
        addBotMessage(`👋 Hi ${childName}!\n\nLast time we did ${last.subject}${last.area ? ` • ${last.area}` : ""}.\n\nWhat are we working on today? 😊`);
      } else {
        addBotMessage(`👋 Hi ${childName}!\n\nI’ll help you calmly, step by step.\n\nWhat are we working on today? 😊`);
      }

      subjectSelection.style.display = "block";
      return true;
    }

    // ---------------- Logout ----------------
    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    // ---------------- Buttons ----------------
    mathsBtn.addEventListener("click", () => { addUserMessage("Maths"); selectSubject("Maths"); });
    englishBtn.addEventListener("click", () => { addUserMessage("English"); selectSubject("English"); });
    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keydown", e => { if (e.key === "Enter") handleSend(); });

    // ---------------- Init ----------------
    (async () => {
      if (!sb) { showError("Supabase did not load."); return; }
      setupCalculator();
      disableInput(false);

      const ok = await requireAuth();
      if (!ok) return;

      await loadChildProfile();
    })();
  })();
  </script>
</body>
</html>
