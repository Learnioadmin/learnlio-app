<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio Tutor</title>

  <!-- Dyslexia-friendly font (optional; if blocked, page still works) -->
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- jsPDF for parent summary -->

  <style>
    :root{
      --ink:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --bg:#f3f4f6;
      --blue:#007bff;
      --blue2:#0056b3;
      --amber:#fef3c7;
      --green:#10b981;
      --green2:#059669;
      --purple:#7c3aed;
      --purple2:#6d28d9;
      --border:#e5e7eb;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* NAV (simple + consistent) */
    .nav{
      position:sticky; top:0; z-index:10;
      background:#fff;
      border-bottom:1px solid var(--border);
    }
    .nav-inner{
      max-width:1100px;
      margin:0 auto;
      padding:10px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      text-decoration:none; color:var(--ink);
    }
    .brand img{
      height:34px; width:auto; display:block;
      border-radius:8px;
    }
    .brand-title{
      font-weight:800; letter-spacing:.2px;
    }
    .nav-links{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .nav-links a, .nav-links button{
      font-size:14px;
      text-decoration:none;
      color:var(--ink);
      padding:8px 10px;
      border-radius:10px;
      border:1px solid transparent;
      background:transparent;
      cursor:pointer;
    }
    .nav-links a:hover, .nav-links button:hover{
      background:#f9fafb;
      border-color:var(--border);
    }

    /* PAGE LAYOUT */
    .page{
      max-width:1100px;
      margin:0 auto;
      padding:16px 14px 40px;
    }

    /* CHAT WRAPPER */
    #chat-wrapper { width: 100%; display: flex; justify-content: center; }
    #chat-container {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      border:1px solid var(--border);
    }

    /* Progress header */
    #progress-header {
      display:none;
      margin-bottom:10px;
      padding:10px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
    }
    #progress-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size:14px;
      color:#333;
    }
    #progress-track{
      height:10px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin-top:8px;
    }
    #progress-bar{
      height:10px;
      width:0%;
      background:var(--green);
    }

    /* Messages */
    #messages {
      background: #fafafa;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #ddd;
      max-height: 520px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .msg {
      padding: 14px 16px;
      margin-bottom: 14px;
      border-radius: 16px;
      max-width: 85%;
      font-size: 18px;
      line-height: 1.85;
      white-space: pre-wrap;
      font-family: 'OpenDyslexic', Arial, sans-serif;
      overflow-wrap: break-word;
      display: inline-block;
    }
    .user {
      background: var(--blue);
      color: #ffffff;
      margin: 0 0 14px auto;
      text-align: right;
      word-break: break-word;
    }
    .bot  { background: var(--amber); color: #000000; margin-right: auto; }

    /* Typing */
    #typing-indicator {
      font-style: italic;
      color: #555;
      margin-bottom:10px;
      display:none;
      font-family: 'OpenDyslexic', Arial, sans-serif;
    }

    /* Controls under bot messages */
    .bot-controls {
      margin-top: 10px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .btn-small {
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      font-family: 'OpenDyslexic', Arial, sans-serif;
    }
    .speak-btn { background: var(--blue); }
    .speak-btn:hover { background: var(--blue2); }
    .hint-btn { background: var(--green); }
    .hint-btn:hover { background: var(--green2); }
    .next-btn { background: var(--purple); }
    .next-btn:hover { background: var(--purple2); }

    /* Calculator */
    #calculator {
      margin-bottom: 12px;
      background: #eef2ff;
      padding: 12px;
      border-radius: 14px;
      border:1px solid var(--border);
      display:none;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .calc-grid button {
      padding: 14px;
      font-size: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      font-family: 'OpenDyslexic', Arial, sans-serif;
    }
    .calc-grid button:hover { background: #dbeafe; }

    /* Subject + area buttons */
    #subject-selection, #area-selection { display:none; }
    #subject-selection p {
      margin:6px 0 10px;
      font-family:'OpenDyslexic', Arial, sans-serif;
    }
    #subject-selection button, #area-selection button {
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 10px;
      font-family:'OpenDyslexic', Arial, sans-serif;
    }
    #subject-selection button:hover, #area-selection button:hover { background: var(--blue2); }

    /* Input */
    #input-container {
      display:flex;
      gap:10px;
      margin-top:10px;
    }
    #input {
      flex:1;
      padding:14px;
      font-size:16px;
      border-radius:12px;
      border:1px solid #ccc;
      font-family:'OpenDyslexic', Arial, sans-serif;
    }
    #sendBtn {
      padding:14px 20px;
      font-size:16px;
      border-radius:12px;
      border:none;
      background:var(--blue);
      color:#fff;
      cursor:pointer;
      font-family:'OpenDyslexic', Arial, sans-serif;
    }
    #sendBtn:hover { background:var(--blue2); }
    #sendBtn:disabled { opacity:.6; cursor:not-allowed; }

    /* Small helper card */
    .notice{
      margin:10px 0 0;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#fff;
      font-family:'OpenDyslexic', Arial, sans-serif;
      color:var(--muted);
      font-size:14px;
      display:none;
    }

    @media (max-width: 480px) {
      #chat-container { padding: 14px; }
      .msg { font-size: 16px; }
      .brand-title{ display:none; }
      .brand img{ height:30px; }
    }
  </style>
</head>

<script>
/* =======================
   CONFIG — UPDATE THESE
======================= */
const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

/* Your Render backend that talks to OpenAI */
const BACKEND_URL = "https://softr-chat-backend.onrender.com";

/* If your login page is different, change this */
const LOGIN_PAGE = "login.html";

/* =======================
   SUPABASE CLIENT
======================= */
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =======================
   ELEMENTS
======================= */
const progressHeader = document.getElementById("progress-header");
const progressLabel  = document.getElementById("progress-label");
const badgeLabel     = document.getElementById("badge-label");
const progressBar    = document.getElementById("progress-bar");

const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const messagesDiv = document.getElementById("messages");
const calculator = document.getElementById("calculator");
const subjectSelection = document.getElementById("subject-selection");
const areaSelection = document.getElementById("area-selection");
const typingIndicator = document.getElementById("typing-indicator");
const notice = document.getElementById("notice");
const logoutBtn = document.getElementById("logoutBtn");

/* =======================
   STATE
======================= */
let user = null;

let childId = null;
let childName = "";
let childAge = ""; // stored as string for display, parse when needed
let subject = null;
let area = null;

let sessionId = null;

/* Maths */
let currentQuestion = null;   // { displayText, correctAnswer }
let hintUsedForCurrent = false;
let waitingForNextButton = false;

/* Guided step mode */
let guided = { active:false, steps:[], idx:0 };

/* Progress */
let maxQuestions = 10;
let questionsAnswered = 0; // counts “completed questions” for the session (Maths = correct question; English = turn)
let correctCount = 0;
let badges = [];

/* Adaptive difficulty (stored per child/subject/area) */
let difficulty = 1;
let streakCorrect = 0;
let streakWrong = 0;

/* Report log */
let sessionLog = []; // for PDF

/* =======================
   HELPERS
======================= */
function getParam(name){
  const p = new URLSearchParams(window.location.search);
  return p.get(name);
}
function nowTs(){ return new Date().toLocaleString("en-GB"); }
function cleanBotText(t){ return String(t || "").replace(/\*\*/g, ""); }
function parseChildNumber(text){
  const m = String(text || "").match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  return Number(m[0]);
}
function ageNum(){
  const a = parseInt(childAge, 10);
  return isNaN(a) ? 10 : a;
}
function kidTonePrefix(){
  const a = ageNum();
  if (a <= 7) return "🙂";
  if (a <= 10) return "😊";
  return "👍";
}
function shortLineBreaks(text){
  return String(text || "").replace(/\.\s+/g, ".\n\n");
}
function disableInput(disabled){
  input.disabled = disabled;
  sendBtn.disabled = disabled;
  input.style.opacity = disabled ? "0.6" : "1";
  sendBtn.style.opacity = disabled ? "0.6" : "1";
}
function showNotice(text){
  notice.style.display = "block";
  notice.innerText = text;
}
function hideNotice(){
  notice.style.display = "none";
  notice.innerText = "";
}

/* =======================
   CHAT UI
======================= */
function addUserMessage(text){
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerText = String(text || "").trim();
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function speak(text){
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(String(text || ""));
  u.lang = "en-GB";
  u.rate = 0.9;
  u.pitch = 1.0;

  const voices = window.speechSynthesis.getVoices() || [];
  const prefer = [
    "Google UK English Female","Google UK English Male",
    "Microsoft Sonia Online","Microsoft Ryan Online","Microsoft Libby Online",
    "Samantha","Daniel"
  ];
  let chosen = null;
  for (const name of prefer){
    const v = voices.find(x => x.name === name);
    if (v) { chosen = v; break; }
  }
  if (!chosen){
    chosen = voices.find(v => (v.lang||"").toLowerCase().startsWith("en-gb")) ||
             voices.find(v => (v.lang||"").toLowerCase().startsWith("en")) ||
             null;
  }
  if (chosen) u.voice = chosen;

  window.speechSynthesis.speak(u);
}

function addBotMessage(text, opts={showHint:false, showNext:false}){
  const safeText = cleanBotText(text);

  const div = document.createElement("div");
  div.className = "msg bot";

  const content = document.createElement("span");
  content.innerText = safeText;

  const controls = document.createElement("div");
  controls.className = "bot-controls";

  const speakBtn = document.createElement("button");
  speakBtn.className = "btn-small speak-btn";
  speakBtn.innerText = "🔊 Listen";
  speakBtn.onclick = () => speak(safeText);
  controls.appendChild(speakBtn);

  if (opts.showHint){
    const hintBtn = document.createElement("button");
    hintBtn.className = "btn-small hint-btn";
    hintBtn.innerText = "💡 Hint";
    hintBtn.onclick = () => requestHint();
    controls.appendChild(hintBtn);
  }

  if (opts.showNext){
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn-small next-btn";
    nextBtn.innerText = "➡️ Next question";
    nextBtn.onclick = () => handleNextQuestion();
    controls.appendChild(nextBtn);
  }

  div.appendChild(content);
  div.appendChild(controls);

  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showActionButtons(buttons){
  areaSelection.innerHTML = "";
  buttons.forEach(b => {
    const btn = document.createElement("button");
    btn.innerText = b.label;
    btn.onclick = b.onClick;
    areaSelection.appendChild(btn);
  });
  areaSelection.style.display = "block";
}

/* =======================
   CALCULATOR
======================= */
window.calcInput = (value) => { input.value += value; };
window.calcClear = () => { input.value = ""; };

/* =======================
   BACKEND CALL
======================= */
async function callBackend(promptText){
  try{
    typingIndicator.style.display = "block";
    const res = await axios.post(BACKEND_URL, {
      userId: user.id,
      messages: [{ role:"user", content: promptText }],
      subject,
      childName,
      childAge
    });
    typingIndicator.style.display = "none";
    return res.data.reply;
  }catch(e){
    typingIndicator.style.display = "none";
    return "Sorry, I couldn’t connect right now. Please try again.";
  }
}

function baseRules(){
  return `
Rules:
- British English only.
- Short, clear sentences.
- Explain step by step.
- Dyslexia-friendly.
- Positive encouragement.
- Do NOT give the final answer immediately.
- End with a gentle, supportive question.
- Child-safe tutoring only.
`;
}

/* =======================
   SESSION LIMIT BY AGE
======================= */
function computeMaxQuestions(){
  const a = ageNum();
  if (a <= 7) return 5;
  if (a <= 10) return 8;
  if (a <= 13) return 10;
  return 12;
}
function sessionComplete(){
  return questionsAnswered >= maxQuestions;
}
function resetSessionProgress(){
  maxQuestions = computeMaxQuestions();
  questionsAnswered = 0;
  correctCount = 0;
  badges = [];
  sessionLog = [];
  updateProgressUI();
}
function updateProgressUI(){
  progressHeader.style.display = "block";
  progressLabel.innerText = `Progress: ${questionsAnswered} / ${maxQuestions}`;
  badgeLabel.innerText = `Badges: ${badges.length ? badges.join(" ") : "—"}`;
  const pct = maxQuestions ? Math.min(100, Math.round((questionsAnswered / maxQuestions) * 100)) : 0;
  progressBar.style.width = pct + "%";
}
function maybeAwardBadge(){
  if (correctCount === 3 && !badges.includes("⭐")) badges.push("⭐");
  if (correctCount === 5 && !badges.includes("🏅")) badges.push("🏅");
  if (correctCount === 10 && !badges.includes("🏆")) badges.push("🏆");
}
function maybeRewardMessage(){
  // only after a real completed question, never right after generating a question list
  if (questionsAnswered === 1) addBotMessage("🌟 Nice start! You’re doing really well.");
  if (questionsAnswered === Math.ceil(maxQuestions/2)) addBotMessage("🔥 Halfway there! Keep going!");
  if (correctCount === 3 && badges.includes("⭐")) addBotMessage("⭐ Badge unlocked: Star Helper!");
  if (correctCount === 5 && badges.includes("🏅")) addBotMessage("🏅 Badge unlocked: Steady Learner!");
  if (correctCount === 10 && badges.includes("🏆")) addBotMessage("🏆 Badge unlocked: Learning Champion!");
}

/* =======================
   DIFFICULTY (ADAPTIVE)
======================= */
function ageDifficultyMax(){
  const a = ageNum();
  if (a <= 7) return 2;
  if (a <= 10) return 3;
  if (a <= 13) return 4;
  return 5;
}
function clampDifficulty(d){
  const maxD = ageDifficultyMax();
  return Math.max(1, Math.min(maxD, d));
}
function updateDifficultyAfterResult(isCorrect){
  if (isCorrect){
    streakCorrect += 1;
    streakWrong = 0;
    if (streakCorrect >= 3){
      difficulty = clampDifficulty(difficulty + 1);
      streakCorrect = 0;
    }
  }else{
    streakWrong += 1;
    streakCorrect = 0;
    if (streakWrong >= 2){
      difficulty = clampDifficulty(difficulty - 1);
      streakWrong = 0;
    }
  }
}

/* =======================
   MATHS GENERATION (DETERMINISTIC)
   Uses age + difficulty to scale ranges.
======================= */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function getRangeForAgeAndDifficulty(){
  const a = ageNum();
  const d = clampDifficulty(difficulty);

  // Base ranges by age, then widen a bit by difficulty.
  if (a <= 7){
    // keep simple
    const max = 10 + (d-1)*5; // 10, 15
    return { min:0, max };
  }
  if (a <= 9){
    const max = 30 + (d-1)*15; // 30,45,60
    return { min:5, max };
  }
  if (a <= 11){
    const max = 80 + (d-1)*30; // 80,110,140
    return { min:10, max };
  }
  // 12+
  const max = 200 + (d-1)*80; // 200,280,360,440,520
  return { min:20, max };
}

function generateMathQuestion(){
  const { min, max } = getRangeForAgeAndDifficulty();

  if (area === "Addition"){
    const x = randInt(min, max);
    const y = randInt(min, max);
    return { displayText:`${x} + ${y} = ?`, correctAnswer: x + y };
  }

  if (area === "Subtraction"){
    let x = randInt(min, max);
    let y = randInt(min, max);
    if (y > x) [x,y] = [y,x];
    return { displayText:`${x} - ${y} = ?`, correctAnswer: x - y };
  }

  if (area === "Multiplication"){
    // avoid “all 5s / all 7s” by using varied factors + difficulty
    const a = ageNum();
    const d = clampDifficulty(difficulty);
    const tableMax = (a <= 7) ? (5 + d) : (a <= 9 ? (8 + d) : (12));
    const x = randInt(2, Math.min(12, tableMax));
    const y = randInt(2, Math.min(12, tableMax));
    return { displayText:`${x} × ${y} = ?`, correctAnswer: x * y };
  }

  if (area === "Division"){
    const a = ageNum();
    const d = clampDifficulty(difficulty);
    const divMax = (a <= 7) ? (5 + d) : (a <= 9 ? (8 + d) : 12);
    const divisor = randInt(2, Math.min(12, divMax));
    const quotient = randInt(2, Math.min(12, divMax));
    const dividend = divisor * quotient;
    return { displayText:`${dividend} ÷ ${divisor} = ?`, correctAnswer: quotient };
  }

  return null;
}

function showMathQuestion(q){
  guided.active = false; guided.steps = []; guided.idx = 0;
  hintUsedForCurrent = false;
  waitingForNextButton = false;

  const a = ageNum();
  const intro = (a <= 7)
    ? `✏️ New question:\n\n${q.displayText}\n\nTake your time.\nYou can use the buttons if you want.\n\nWhat do you think?`
    : `✏️ Question:\n\n${q.displayText}\n\nTake your time.\nWhat do you think the answer is?`;

  addBotMessage(intro, { showHint:true, showNext:false });

  // Log question to Supabase (B1)
  logSessionItemSafe({
    itemType: "question",
    promptText: q.displayText
  });
}

/* =======================
   GUIDED STEPS (for wrong answers)
======================= */
function buildGuidedSteps(q){
  const raw = q.displayText.replace("= ?", "").trim();
  let op = null;
  if (raw.includes("+")) op = "+";
  else if (raw.includes("-")) op = "-";
  else if (raw.includes("×")) op = "×";
  else if (raw.includes("÷")) op = "÷";
  if (!op) return [];

  const parts = raw.split(op).map(s => parseInt(s.trim(), 10));
  const A = parts[0], B = parts[1];
  if (Number.isNaN(A) || Number.isNaN(B)) return [];

  const age = ageNum();
  const emoji = kidTonePrefix();

  const ones = n => n % 10;
  const tens = n => Math.floor((n % 100) / 10);
  const hundreds = n => Math.floor((n % 1000) / 100);

  if (op === "+"){
    if (age <= 7 && A <= 20 && B <= 20){
      return [{ prompt: shortLineBreaks(`${emoji} Start at ${A}.\nCount up ${B}.\n\nWhat number do you land on?`), expected: A+B }];
    }

    const a1=ones(A), b1=ones(B), a10=tens(A), b10=tens(B), a100=hundreds(A), b100=hundreds(B);
    const onesSum = a1+b1;
    const carry1 = Math.floor(onesSum/10);
    const onesDigit = onesSum%10;

    const tensSum = a10+b10+carry1;
    const carry10 = Math.floor(tensSum/10);
    const tensDigit = tensSum%10;

    const hundredsSum = a100+b100+carry10;
    const usesHundreds = (A>=100 || B>=100);

    const steps = [];
    steps.push({ prompt: shortLineBreaks(`${emoji} Add the ones.\n\n${a1} + ${b1} = ?`), expected: onesSum });
    steps.push({ prompt: shortLineBreaks(`${emoji} Ones digit only.\n\nType ${onesDigit}.`), expected: onesDigit });
    steps.push({ prompt: shortLineBreaks(`${emoji} Add the tens.\n\n${a10} + ${b10}`+(carry1?` + ${carry1}`:"")+` = ?`), expected: tensSum });
    steps.push({ prompt: shortLineBreaks(`${emoji} Tens digit only.\n\nType ${tensDigit}.`), expected: tensDigit });

    if (usesHundreds){
      const final = hundredsSum*100 + tensDigit*10 + onesDigit;
      steps.push({ prompt: shortLineBreaks(`${emoji} Add the hundreds.\n\n${a100} + ${b100}`+(carry10?` + ${carry10}`:"")+` = ?`), expected: hundredsSum });
      steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${A} + ${B}?`), expected: final });
    }else{
      const final = tensDigit*10 + onesDigit;
      steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${A} + ${B}?`), expected: final });
    }
    return steps;
  }

  if (op === "-"){
    if (age <= 7 && A <= 20 && B <= 20){
      return [{ prompt: shortLineBreaks(`${emoji} Start at ${A}.\nCount back ${B}.\n\nWhere do you land?`), expected: A-B }];
    }

    const a1=ones(A), b1=ones(B), a10=tens(A), b10=tens(B), a100=hundreds(A), b100=hundreds(B);
    const usesHundreds = (A>=100 || B>=100);

    if (a1 >= b1){
      const onesRes = a1-b1;
      const tensRes = a10-b10;
      const hundredsRes = a100-b100;
      const steps = [
        { prompt: shortLineBreaks(`${emoji} Subtract the ones.\n\n${a1} - ${b1} = ?`), expected: onesRes },
        { prompt: shortLineBreaks(`${emoji} Subtract the tens.\n\n${a10} - ${b10} = ?`), expected: tensRes }
      ];
      if (usesHundreds){
        steps.push({ prompt: shortLineBreaks(`${emoji} Subtract the hundreds.\n\n${a100} - ${b100} = ?`), expected: hundredsRes });
        steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${A} - ${B}?`), expected: hundredsRes*100 + tensRes*10 + onesRes });
      }else{
        steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${A} - ${B}?`), expected: tensRes*10 + onesRes });
      }
      return steps;
    }

    const newOnes = a1 + 10;
    const newTens = a10 - 1;
    const onesRes = newOnes - b1;
    const tensRes = newTens - b10;

    const steps = [
      { prompt: shortLineBreaks(`${emoji} Swap 1 ten for 10 ones.\n\nOnes become ${newOnes}.\n\nType ${newOnes}.`), expected: newOnes },
      { prompt: shortLineBreaks(`${emoji} Now subtract the ones.\n\n${newOnes} - ${b1} = ?`), expected: onesRes },
      { prompt: shortLineBreaks(`${emoji} Now subtract the tens.\n\n${newTens} - ${b10} = ?`), expected: tensRes },
    ];
    if (usesHundreds){
      const hundredsRes = a100 - b100;
      steps.push({ prompt: shortLineBreaks(`${emoji} Subtract the hundreds.\n\n${a100} - ${b100} = ?`), expected: hundredsRes });
      steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${A} - ${B}?`), expected: hundredsRes*100 + tensRes*10 + onesRes });
    }else{
      steps.push({ prompt: shortLineBreaks(`${emoji} Put it together.\n\nWhat is ${A} - ${B}?`), expected: tensRes*10 + onesRes });
    }
    return steps;
  }

  if (op === "×"){
    const emoji = kidTonePrefix();
    if (age <= 7 && B <= 4){
      let total = 0;
      const steps = [];
      for (let i=1;i<=B;i++){
        const prev = total;
        total += A;
        steps.push({ prompt: shortLineBreaks(`${emoji} Step ${i}:\n\n${prev} + ${A} = ?`), expected: total });
      }
      steps.push({ prompt: shortLineBreaks(`${emoji} Final step:\n\nSo what is ${A} × ${B}?`), expected: A*B });
      return steps;
    }
    return [{ prompt: shortLineBreaks(`${emoji} Think of groups.\n\n${A} × ${B} means ${B} groups of ${A}.\n\nWhat is ${A} × ${B}?`), expected: A*B }];
  }

  if (op === "÷"){
    const emoji = kidTonePrefix();
    const final = A / B;
    if (age <= 7){
      return [{ prompt: shortLineBreaks(`${emoji} Sharing time.\n\nShare ${A} into groups of ${B}.\n\nHow many in each group?`), expected: final }];
    }
    return [
      { prompt: shortLineBreaks(`${emoji} How many groups of ${B} fit into ${A}?`), expected: final },
      { prompt: shortLineBreaks(`${emoji} Quick check.\n\n${final} × ${B} = ?`), expected: A }
    ];
  }

  return [];
}

async function requestHint(){
  if (!currentQuestion){
    addBotMessage("I can give a hint once you have a question on the screen. 😊");
    return;
  }
  if (guided.active){
    addBotMessage("We’re already doing this step by step.\n\nTry the step on the screen first. 😊");
    return;
  }
  if (hintUsedForCurrent){
    addBotMessage("You’ve already got the hint for this one.\n\nHave another try! 😊");
    return;
  }
  hintUsedForCurrent = true;

  // Log hint request
  logSessionItemSafe({
    itemType: "hint",
    promptText: `Hint requested for: ${currentQuestion.displayText}`
  });

  const hintPrompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}

The child wants a hint for:
"${currentQuestion.displayText}"

Give ONE short hint only.
Use very simple words.
Do NOT give the final answer.
End with a gentle question.
${baseRules()}
`;
  const hintReply = await callBackend(hintPrompt);
  addBotMessage(hintReply, { showHint:false, showNext:false });
}

async function downloadParentSummaryPDF(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 14;

    doc.setFontSize(18);
    doc.text("Learnlio Parent Summary", 14, y); y += 10;

    doc.setFontSize(12);
    doc.text(`Child: ${childName}`, 14, y); y += 7;
    doc.text(`Age: ${childAge}`, 14, y); y += 7;
    doc.text(`Subject: ${subject || "-"}`, 14, y); y += 7;
    doc.text(`Area: ${area || "-"}`, 14, y); y += 7;
    doc.text(`Date: ${nowTs()}`, 14, y); y += 10;

    doc.text(`Questions completed: ${questionsAnswered} / ${maxQuestions}`, 14, y); y += 7;
    if (subject === "Maths") { doc.text(`Correct answers: ${correctCount}`, 14, y); y += 7; }
    doc.text(`Badges: ${badges.length ? badges.join(" ") : "None"}`, 14, y); y += 10;

    doc.setFontSize(13);
    doc.text("Suggested next steps:", 14, y); y += 8;
    doc.setFontSize(12);

    const plan = (subject === "Maths")
      ? [
          "1) Practise number facts for 5 minutes (calm and slow).",
          "2) Do 3 easy questions, then 2 medium questions.",
          "3) Encourage step-by-step working."
        ]
      : [
          "1) Read together for 10 minutes (short, calm paragraphs).",
          "2) Practise 5 spellings using “look, cover, write, check”.",
          "3) Write 3 short sentences using one new word."
        ];
    plan.forEach(line => { doc.text(line, 14, y); y += 7; });

    y += 6;
    doc.text("Session notes:", 14, y); y += 7;

    const lines = [];
    for (const entry of sessionLog.slice(0, 14)){
      const q = entry.question ? `Q: ${entry.question}` : "";
      const a = entry.childAnswer ? `A: ${entry.childAnswer}` : "";
      const c = (subject === "Maths" && entry.correct !== null) ? `(${entry.correct ? "Correct" : "Try again"})` : "";
      const line = `${q} ${a} ${c}`.trim();
      if (line) lines.push(line);
    }
    if (!lines.length) lines.push("No detailed log saved.");

    lines.forEach(line => {
      const wrapped = doc.splitTextToSize(line, 180);
      wrapped.forEach(w => {
        if (y > 280) { doc.addPage(); y = 14; }
        doc.text(w, 14, y);
        y += 6;
      });
    });

    doc.save(`Learnlio-Parent-Summary-${childName || "Child"}.pdf`);
    addBotMessage("✅ Download started.\n\nWould you like to start a new session?");
  }catch(e){
    addBotMessage("Sorry — I couldn’t create the PDF on this device/browser.\n\nPlease try another browser.");
  }
}

/* =======================
   SUPABASE: B1 FUNCTIONS
======================= */
async function startSessionSafe({ childId, subject, area, questionsTarget }){
  try{
    const payload = {
      child_id: childId,
      owner_id: user.id,
      subject,
      area,
      questions_target: questionsTarget,
      questions_answered: 0,
      correct_count: 0,
      badges: []
    };
    const { data, error } = await supabase
      .from("sessions")
      .insert(payload)
      .select("id")
      .single();
    if (error) throw error;
    return data.id;
  }catch(e){
    console.error("startSession failed:", e);
    return null;
  }
}

async function logSessionItemSafe({ itemType, promptText=null, childText=null, isCorrect=null, meta={} }){
  try{
    if (!sessionId) return;
    const payload = {
      session_id: sessionId,
      child_id: childId,
      owner_id: user.id,
      item_type: itemType,
      prompt_text: promptText,
      child_text: childText,
      is_correct: isCorrect,
      meta
    };
    const { error } = await supabase.from("session_items").insert(payload);
    if (error) throw error;
  }catch(e){
    console.error("logSessionItem failed:", e);
  }
}

async function updateSessionCountersSafe(){
  try{
    if (!sessionId) return;
    const { error } = await supabase
      .from("sessions")
      .update({
        questions_answered: questionsAnswered,
        correct_count: correctCount,
        badges: badges
      })
      .eq("id", sessionId);
    if (error) throw error;
  }catch(e){
    console.error("updateSessionCounters failed:", e);
  }
}

async function endSessionSafe(id){
  try{
    const { error } = await supabase
      .from("sessions")
      .update({ ended_at: new Date().toISOString() })
      .eq("id", id);
    if (error) throw error;
  }catch(e){
    console.error("endSession failed:", e);
  }
}

async function loadProgressSafe({ subject, area }){
  try{
    const { data, error } = await supabase
      .from("child_progress")
      .select("difficulty, streak_correct, streak_wrong")
      .eq("owner_id", user.id)
      .eq("child_id", childId)
      .eq("subject", subject)
      .eq("area", area)
      .maybeSingle();
    if (error) throw error;
    return data || null;
  }catch(e){
    console.error("loadProgress failed:", e);
    return null;
  }
}

async function upsertProgressSafe(){
  try{
    const payload = {
      owner_id: user.id,
      child_id: childId,
      subject,
      area,
      difficulty: clampDifficulty(difficulty),
      streak_correct: streakCorrect,
      streak_wrong: streakWrong,
      last_session_id: sessionId,
      last_seen_at: new Date().toISOString()
    };
    const { error } = await supabase
      .from("child_progress")
      .upsert(payload, { onConflict: "child_id,subject,area" });
    if (error) throw error;
  }catch(e){
    console.error("upsertProgress failed:", e);
  }
}

/* =======================
   MAIN INPUT HANDLER
======================= */
async function handleInput(){
  const text = input.value.trim();
  if (!text) return;
  if (input.disabled) return;

  addUserMessage(text);
  input.value = "";

  // Must have chosen subject+area
  if (!subject){
    addBotMessage("Please choose Maths or English using the buttons.");
    subjectSelection.style.display = "block";
    return;
  }
  if (!area){
    addBotMessage("Please choose an area using the buttons.");
    return;
  }

  /* --------- MATHS --------- */
  if (subject === "Maths"){
    if (!currentQuestion){
      addBotMessage("Please start a Maths area first using the buttons.");
      return;
    }

    // If session done
    if (sessionComplete()){
      await endSessionUI();
      return;
    }

    // Guided mode checks “step answers”
    if (guided.active){
      const n = parseChildNumber(text);
      const step = guided.steps[guided.idx];
      const ok = (n !== null && Math.abs(n - step.expected) < 1e-9);

      sessionLog.push({
        ts: nowTs(),
        subject, area,
        question: `[Guided step ${guided.idx + 1}/${guided.steps.length}]`,
        childAnswer: text,
        correct: ok
      });

      await logSessionItemSafe({
        itemType: "answer",
        promptText: `[Guided step ${guided.idx + 1}/${guided.steps.length}]`,
        childText: text,
        isCorrect: ok
      });

      if (ok){
        guided.idx += 1;

        if (guided.idx < guided.steps.length){
          addBotMessage(
            `✅ Nice work!\n\nStep ${guided.idx + 1} of ${guided.steps.length}:\n\n${guided.steps[guided.idx].prompt}`
          );
          return;
        }

        // Question completed via guided steps
        guided.active = false; guided.steps = []; guided.idx = 0;

        questionsAnswered += 1;
        correctCount += 1;

        maybeAwardBadge();
        updateProgressUI();
        maybeRewardMessage();

        updateDifficultyAfterResult(true);
        await upsertProgressSafe();
        await updateSessionCountersSafe();

        if (sessionComplete()){
          await endSessionUI();
          return;
        }

        waitingForNextButton = true;
        addBotMessage(
          `Brilliant, ${childName}!\n\nThat is correct.\n\nReady for the next one?`,
          { showHint:false, showNext:true }
        );
        return;
      }else{
        updateDifficultyAfterResult(false);
        await upsertProgressSafe();

        addBotMessage(
          `Good try, ${childName}.\n\nLet’s do the same step again.\n\nStep ${guided.idx + 1} of ${guided.steps.length}:\n\n${step.prompt}`
        );
        return;
      }
    }

    // Normal marking (final answer)
    const n = parseChildNumber(text);
    const correct = (n !== null && Math.abs(n - currentQuestion.correctAnswer) < 1e-9);

    sessionLog.push({
      ts: nowTs(),
      subject, area,
      question: currentQuestion.displayText,
      childAnswer: text,
      correct
    });

    await logSessionItemSafe({
      itemType: "answer",
      promptText: currentQuestion.displayText,
      childText: text,
      isCorrect: correct
    });

    if (correct){
      questionsAnswered += 1;
      correctCount += 1;

      maybeAwardBadge();
      updateProgressUI();
      maybeRewardMessage();

      updateDifficultyAfterResult(true);
      await upsertProgressSafe();
      await updateSessionCountersSafe();

      const reply = await giveMathFeedback_AI(currentQuestion, text);
      waitingForNextButton = true;

      if (sessionComplete()){
        addBotMessage(reply);
        await endSessionUI();
        return;
      }

      addBotMessage(reply, { showHint:false, showNext:true });
      return;
    }

    // Incorrect -> start guided mode
    updateDifficultyAfterResult(false);
    await upsertProgressSafe();

    const steps = buildGuidedSteps(currentQuestion);
    if (steps.length){
      guided.active = true;
      guided.steps = steps;
      guided.idx = 0;

      addBotMessage(
        `Good try, ${childName}.\n\nLet’s go slowly.\nOne small step at a time.\n\nStep 1 of ${guided.steps.length}:\n\n${guided.steps[0].prompt}`
      );
      return;
    }

    addBotMessage("Good try.\n\nLet’s try again.\n\nWhat do you think the answer is?", { showHint:true, showNext:false });
    return;
  }

  /* --------- ENGLISH --------- */
  if (subject === "English"){
    if (sessionComplete()){
      await endSessionUI();
      return;
    }

    questionsAnswered += 1;
    updateProgressUI();
    await updateSessionCountersSafe();

    sessionLog.push({
      ts: nowTs(),
      subject, area,
      question: "(English turn)",
      childAnswer: text,
      correct: null
    });

    await logSessionItemSafe({
      itemType: "answer",
      promptText: "(English turn)",
      childText: text,
      isCorrect: null
    });

    const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

The child replied: "${text}"

Respond with short, clear help.
Use very simple words.
Keep it dyslexia-friendly (extra spacing, short lines).
Give one next step only.
End with a gentle question.
${baseRules()}
`;
    const reply = await callBackend(prompt);
    addBotMessage(reply);

    if (sessionComplete()){
      await endSessionUI();
    }
  }
}

======================= */
function computeAgeFromDob(dobStr){
  if (!dobStr) return null;
  const d = new Date(dobStr);
  if (isNaN(d.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age;
}

async function loadChildProfile(){
  // expects public.children has at least: id, owner_id, name (or child_name), dob or age
  const { data, error } = await supabase
    .from("children")
    .select("*")
    .eq("id", childId)
    .eq("owner_id", user.id)
    .maybeSingle();

  if (error) throw error;
  if (!data) return null;

  const name = data.name || data.child_name || data.childName || "";
  let age = data.age || data.child_age || data.childAge || null;

  if (!age && data.dob){
    const computed = computeAgeFromDob(data.dob);
    if (computed !== null) age = computed;
  }

  return { raw:data, name, age: age !== null ? String(age) : "" };
}

/* If child name/age missing, ask once and save to children table */
async function promptAndSaveMissingChildFields(existing){
  // We do a simple “two-step” prompt in chat UI.
  childName = existing.name || "";
  childAge  = existing.age || "";

  if (childName && childAge) return;

  disableInput(false);
  subjectSelection.style.display = "none";
  areaSelection.style.display = "none";
  calculator.style.display = "none";
  progressHeader.style.display = "none";

  if (!childName){
    addBotMessage("Hi!\n\nI’m Learnlio AI.\n\nWhat is the child’s first name?");
    await waitForOneUserReply(async (reply) => {
      childName = reply.trim();
      addBotMessage(`Thanks!\n\nHow old is ${childName}?`);
    });

    await waitForOneUserReply(async (reply) => {
      childAge = reply.trim();
    });
  }else if (!childAge){
    addBotMessage(`Hi ${childName}!\n\nHow old are you?`);
    await waitForOneUserReply(async (reply) => {
      childAge = reply.trim();
    });
  }

  // Save back to children table
  try{
    const update = {};
    if (childName) update.name = childName;
    // store either "age" field if exists; if your table uses different field name, change this:
    if (childAge) update.age = parseInt(childAge, 10);

    const { error } = await supabase
      .from("children")
      .update(update)
      .eq("id", childId)
      .eq("owner_id", user.id);

    if (error) throw error;
  }catch(e){
    console.error("Saving child fields failed:", e);
    addBotMessage("I saved what I could.\n\nIf anything looks wrong, please update the child on the Dashboard.");
  }
}

/* Wait for exactly one user reply, temporarily overriding handlers */
function waitForOneUserReply(onReply){
  return new Promise((resolve) => {
    const oldClick = sendBtn.onclick;

    const handler = async () => {
      const t = input.value.trim();
      if (!t) return;
      addUserMessage(t);
      input.value = "";
      await onReply(t);
      sendBtn.removeEventListener("click", handler);
      input.removeEventListener("keypress", keyHandler);
      resolve();
    };

    const keyHandler = (e) => { if (e.key === "Enter") handler(); };

    sendBtn.addEventListener("click", handler);
    input.addEventListener("keypress", keyHandler);
  });
}

/* =======================
   AUTH + INIT
======================= */
async function init(){
  hideNotice();
  disableInput(true);
  subjectSelection.style.display = "none";
  areaSelection.style.display = "none";
  calculator.style.display = "none";

  // Auth
  const { data: u, error: uErr } = await supabase.auth.getUser();
  user = u?.user || null;

  if (uErr || !user){
    window.location.href = LOGIN_PAGE;
    return;
  }

  // Logout
  logoutBtn.onclick = async () => {
    await supabase.auth.signOut();
    window.location.href = LOGIN_PAGE;
  };

  // Child selection
  childId = getParam("child_id");
  if (!childId){
    showNotice("No child selected.\n\nGo back to the Dashboard and choose a child first.");
    addBotMessage("I can’t find a child profile.\n\nPlease go back to the Dashboard to add or select a child.");
    disableInput(true);
    return;
  }

  // Load child profile
  let child = null;
  try{
    child = await loadChildProfile();
  }catch(e){
    console.error(e);
  }

  if (!child){
    showNotice("Child not found.\n\nMake sure you selected the correct child on the Dashboard.");
    addBotMessage("I can’t find a child profile.\n\nPlease go back to the Dashboard to add a child.");
    disableInput(true);
    return;
  }

  // Save name+age into runtime (and prompt if missing)
  childName = child.name || "";
  childAge  = child.age || "";

  disableInput(false);

  if (!childName || !childAge){
    await promptAndSaveMissingChildFields(child);
  }

  // Welcome
  addBotMessage(`👋 Hello ${childName}!\n\nWhat are we working on today?`);
  subjectSelection.style.display = "block";
  disableInput(false);

  // Wire default handlers
  sendBtn.addEventListener("click", handleInput);
  input.addEventListener("keypress", (e) => { if (e.key === "Enter") handleInput(); });
}

init();
</script>
