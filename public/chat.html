<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Tutor</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .container { max-width: 980px; margin: 0 auto; padding: 18px; }

    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; }
    .brand img { height:34px; width:auto; display:block; }
    .links { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .links a { text-decoration:none; color:#111; padding:10px 12px; border-radius:12px; }
    .links a.active { background:#eef2ff; }

    .btn { background:#0b5cff; border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:700; }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
    .btn.light { background:#e5e7eb; color:#111; }
    .btn.ghost { background:transparent; border:1px solid #d1d5db; color:#111; }
    .muted { color:#6b7280; font-size: 14px; line-height:1.55; }
    .status { margin-top:10px; font-size:14px; }
    .status.bad { color:#dc2626; }
    .status.good { color:#16a34a; }

    /* Focused tutor layout */
    .tutor-shell{
      display:flex;
      flex-direction:column;
      gap:12px;
      /* Fill viewport without “page-scroll”, inside stays stable */
      min-height: calc(100vh - 74px);
    }

    /* Progress header (pinned at top of card) */
    .ph-wrap{
      display:none;
      border:1px solid #ececf4;
      background:#fafafa;
      border-radius:14px;
      padding:12px;
    }
    .ph-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .ph-kpi{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size:13px;
      color:#333;
      font-weight:700;
    }
    .ph-bar{
      height:10px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin-top:8px;
    }
    .ph-bar > div{ height:10px; width:0%; background:#10b981; }

    /* Main stage (no endless chat) */
    .stage{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    @media (min-width: 860px){
      .stage{ grid-template-columns: 1.2fr .8fr; }
    }

    .panel{
      border:1px solid #ececf4;
      background:#fff;
      border-radius:16px;
      padding:14px;
    }

    .prompt-card{
      background:#fff7ed;
      border:1px solid #fed7aa;
      border-radius:16px;
      padding:16px;
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size:18px;
      line-height:1.85;
      overflow-wrap:break-word;
    }

    .feedback-card{
      background:#eef2ff;
      border:1px solid #c7d2fe;
      border-radius:16px;
      padding:14px;
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size:16px;
      line-height:1.75;
      overflow-wrap:break-word;
      min-height: 88px;
    }

    .controls-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:12px;
    }

    .bot-controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn-small { border:none; border-radius:10px; padding:8px 12px; font-size:14px; cursor:pointer; color:#fff; font-weight:800; }
    .speak-btn { background:#0b5cff; }
    .hint-btn  { background:#10b981; }
    .next-btn  { background:#7c3aed; }

    .typing {
      display:none;
      font-style:italic;
      color:#555;
      margin-top:10px;
    }

    /* Subject/area chooser */
    .chooser{
      display:none;
      border:1px solid #ececf4;
      background:#fafafa;
      border-radius:16px;
      padding:12px;
    }
    .chooser .btn{ margin-right:8px; margin-bottom:8px; }

    /* Input */
    .input-wrap{
      display:flex;
      gap:10px;
      align-items:stretch;
      margin-top:12px;
    }
    .input{
      flex:1;
      padding:14px;
      font-size:16px;
      border-radius:12px;
      border:1px solid #ccc;
    }

    /* Recap */
    details.recap{
      border:1px solid #ececf4;
      background:#fafafa;
      border-radius:14px;
      padding:10px 12px;
    }
    details.recap summary{
      cursor:pointer;
      font-weight:800;
      color:#111;
      user-select:none;
    }
    .recap-lines{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:13px;
      color:#374151;
    }
    .recap-line{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
    }
    .recap-line .who{ font-weight:900; margin-right:6px; }
    .recap-line.kid{ border-color:#c7d2fe; }
    .recap-line.tutor{ border-color:#fed7aa; }

    /* Calculator */
    #calculator{ display:none; background:#eef2ff; padding:10px; border-radius:14px; border:1px solid #dbeafe; }
    .calcBtn { padding:14px; font-size:18px; border-radius:10px; border:none; background:#fff; cursor:pointer; }

    /* Make the whole card feel “app-like” */
    .card.app {
      padding: 14px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a class="active" href="/chat.html">Learnlio Tutor</a>
        <a href="/screener.html">Dyslexia Screener</a>
        <a href="/reports.html">Reports</a>
        <a href="/billing.html">Billing</a>
        <button id="logoutBtn" class="btn light" type="button">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card app">
      <div id="pageError" class="status bad" style="display:none;"></div>

      <div class="tutor-shell">
        <!-- Progress header -->
        <div id="progressHeader" class="ph-wrap">
          <div class="ph-top">
            <div id="progressLabel" class="ph-kpi">Progress: 0 / 0</div>
            <div id="skillLabel" class="ph-kpi">Skill: —</div>
            <div id="badgeLabel" class="ph-kpi">Badges: —</div>
          </div>
          <div class="ph-bar"><div id="progressBar"></div></div>
        </div>

        <div class="stage">
          <!-- LEFT: Focused prompt + input -->
          <section class="panel">
            <div id="promptCard" class="prompt-card">Loading…</div>

            <div class="controls-row" style="justify-content:space-between;">
              <div class="bot-controls">
                <button id="listenBtn" type="button" class="btn-small speak-btn">🔊 Listen</button>
                <button id="hintBtn" type="button" class="btn-small hint-btn" style="display:none;">💡 Hint</button>
              </div>

              <div class="bot-controls">
                <button id="nextBtn" type="button" class="btn-small next-btn" style="display:none;">➡️ Next question</button>
              </div>
            </div>

            <div id="typingIndicator" class="typing">Learnlio is typing…</div>

            <!-- Calculator -->
            <div id="calculator" style="margin-top:12px;">
              <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;">
                <button type="button" class="calcBtn">7</button>
                <button type="button" class="calcBtn">8</button>
                <button type="button" class="calcBtn">9</button>
                <button type="button" class="calcBtn">÷</button>

                <button type="button" class="calcBtn">4</button>
                <button type="button" class="calcBtn">5</button>
                <button type="button" class="calcBtn">6</button>
                <button type="button" class="calcBtn">×</button>

                <button type="button" class="calcBtn">1</button>
                <button type="button" class="calcBtn">2</button>
                <button type="button" class="calcBtn">3</button>
                <button type="button" class="calcBtn">−</button>

                <button type="button" class="calcBtn">0</button>
                <button type="button" id="calcClearBtn" class="calcBtn">C</button>
                <button type="button" class="calcBtn">+</button>
                <button type="button" class="calcBtn">=</button>
              </div>
            </div>

            <!-- Choosers -->
            <div id="subjectChooser" class="chooser" style="margin-top:12px;">
              <div class="muted" style="margin:0 0 10px;">Select a subject to start:</div>
              <button class="btn" id="mathsBtn" type="button">Maths</button>
              <button class="btn" id="englishBtn" type="button">English</button>
            </div>

            <div id="areaChooser" class="chooser" style="margin-top:12px;"></div>

            <!-- Input -->
            <div class="input-wrap">
              <input id="input" class="input" placeholder="Type your answer here…" />
              <button id="sendBtn" type="button" class="btn" style="padding:14px 18px; font-size:16px;">Send</button>
            </div>

            <div id="miniStatus" class="status muted"></div>
          </section>

          <!-- RIGHT: Feedback + recap -->
          <aside class="panel">
            <div class="muted" style="font-weight:900; margin-bottom:8px;">Feedback</div>
            <div id="feedbackCard" class="feedback-card">Your feedback will appear here.</div>

            <div style="height:12px;"></div>

            <details class="recap" open>
              <summary>Session recap (short)</summary>
              <div id="recapLines" class="recap-lines"></div>
            </details>

            <div style="height:12px;"></div>

            <div class="muted" style="font-size:13px;">
              Tip: short sessions are best. 5–10 minutes is plenty.
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <script>
  (() => {
    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const BACKEND_URL = "https://softr-chat-backend.onrender.com";

    // Your TTS Worker (Google voice + caching)
    const TTS_WORKER_BASE = "https://learnlio-tts.falling-grass-34ab.workers.dev";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (!sb) return;

    // Elements
    const pageError = document.getElementById("pageError");
    const logoutBtn = document.getElementById("logoutBtn");

    const progressHeader = document.getElementById("progressHeader");
    const progressLabel  = document.getElementById("progressLabel");
    const skillLabel     = document.getElementById("skillLabel");
    const badgeLabel     = document.getElementById("badgeLabel");
    const progressBar    = document.getElementById("progressBar");

    const promptCard = document.getElementById("promptCard");
    const feedbackCard = document.getElementById("feedbackCard");
    const typingIndicator = document.getElementById("typingIndicator");

    const listenBtn = document.getElementById("listenBtn");
    const hintBtn = document.getElementById("hintBtn");
    const nextBtn = document.getElementById("nextBtn");

    const subjectChooser = document.getElementById("subjectChooser");
    const areaChooser = document.getElementById("areaChooser");
    const mathsBtn = document.getElementById("mathsBtn");
    const englishBtn = document.getElementById("englishBtn");

    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const calculator = document.getElementById("calculator");

    const recapLines = document.getElementById("recapLines");
    const miniStatus = document.getElementById("miniStatus");

    // Auth + child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Tutor state
    let subject = null; // "Maths" | "English"
    let area = null;

    // Session + skill tracking
    let sessionDbId = null; // UUID from sessions table
    let sessionLocalId = (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()));
    let maxQuestions = 10;
    let questionsAnswered = 0;
    let correctCount = 0;
    let badges = [];

    // Skill row (child_skill_progress)
    let skillRow = null; // { id, level, accuracy, ... }
    let difficultyLevel = 1; // derived from skillRow.level
    let streakCorrect = 0;
    let streakWrong = 0;

    // Maths question
    let currentQuestion = null; // { displayText, correctAnswer }
    let hintUsedForCurrent = false;
    let waitingForNextButton = false;
    let guided = { active:false, steps:[], idx:0 };

    // Focused UI state
    let lastPromptText = "";
    let lastFeedbackText = "";
    let lastSpokenText = "";

    // ---------------- UI helpers ----------------
    function showError(msg) {
      pageError.style.display = "block";
      pageError.textContent = msg;
    }
    function clearError() {
      pageError.style.display = "none";
      pageError.textContent = "";
    }
    function disableInput(disabled) {
      input.disabled = disabled;
      sendBtn.disabled = disabled;
      sendBtn.style.opacity = disabled ? "0.6" : "1";
      input.style.opacity = disabled ? "0.6" : "1";
    }
    function setTyping(on) {
      typingIndicator.style.display = on ? "block" : "none";
    }
    function cleanBotText(t) {
      return String(t || "").replace(/\*\*/g, "").trim();
    }
    function setPrompt(text, opts={ showHint:false, showNext:false }) {
      lastPromptText = cleanBotText(text);
      promptCard.textContent = lastPromptText || "…";

      hintBtn.style.display = opts.showHint ? "inline-flex" : "none";
      nextBtn.style.display = opts.showNext ? "inline-flex" : "none";

      // Keep the “Listen” always visible (it reads the current prompt)
      lastSpokenText = lastPromptText;
    }
    function setFeedback(text) {
      lastFeedbackText = cleanBotText(text);
      feedbackCard.textContent = lastFeedbackText || "…";
    }

    function addRecapLine(who, text) {
      const line = document.createElement("div");
      line.className = "recap-line " + (who === "Kid" ? "kid" : "tutor");
      const whoSpan = document.createElement("span");
      whoSpan.className = "who";
      whoSpan.textContent = who + ":";
      const tSpan = document.createElement("span");
      tSpan.textContent = " " + cleanBotText(text);

      line.appendChild(whoSpan);
      line.appendChild(tSpan);
      recapLines.appendChild(line);

      // Keep recap short
      while (recapLines.children.length > 6) {
        recapLines.removeChild(recapLines.firstChild);
      }
    }

    function setMiniStatus(text) {
      miniStatus.textContent = text || "";
    }

    // ---------------- TTS (Worker-first, no robot fallback unless needed) ----------------
    let currentAudio = null;

    function stopAudio() {
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
      } catch {}
    }

    async function speakViaWorker(text) {
      const clean = String(text || "").trim();
      if (!clean) return false;

      stopAudio();

      try {
        const res = await fetch(`${TTS_WORKER_BASE}/speak`, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({
            text: clean,
            // ensure en-GB defaults from your worker, but explicit is fine
            languageCode: "en-GB"
          })
        });

        if (!res.ok) {
          const t = await res.text().catch(() => "");
          console.warn("TTS worker error", res.status, t);
          return false;
        }

        const buf = await res.arrayBuffer();
        if (!buf || buf.byteLength < 50) return false;

        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          URL.revokeObjectURL(url);
          currentAudio = null;
        };
        audio.onerror = () => {
          URL.revokeObjectURL(url);
          currentAudio = null;
        };

        await audio.play();
        return true;
      } catch (e) {
        console.warn("TTS worker fetch/play failed:", e);
        return false;
      }
    }

    // Absolute fallback (only if worker fails)
    function speakViaBrowserFallback(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text || ""));
      u.lang = "en-GB";
      u.rate = 0.95;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }

    async function speak(text) {
      const ok = await speakViaWorker(text);
      if (!ok) speakViaBrowserFallback(text);
    }

    listenBtn.addEventListener("click", () => {
      speak(lastSpokenText || lastPromptText || lastFeedbackText || "");
    });

    // ---------------- Progress helpers ----------------
    function computeAgeFromDob(dobStr) {
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }
    function computeMaxQuestions() {
      const a = childAge;
      if (a <= 7) return 5;
      if (a <= 10) return 8;
      if (a <= 13) return 10;
      return 12;
    }

    function updateProgressUI() {
      progressHeader.style.display = "block";
      progressLabel.textContent = `Progress: ${questionsAnswered} / ${maxQuestions}`;
      badgeLabel.textContent = `Badges: ${badges.length ? badges.join(" ") : "—"}`;

      const lvl = skillRow?.level || difficultyLevel || 1;
      const acc = (typeof skillRow?.accuracy === "number")
        ? Math.round(skillRow.accuracy * 100)
        : null;

      skillLabel.textContent = (subject && area)
        ? `${subject} • ${area} — Level ${lvl}${acc !== null ? ` • ${acc}%` : ""}`
        : "Skill: —";

      const pct = maxQuestions ? Math.min(100, Math.round((questionsAnswered / maxQuestions) * 100)) : 0;
      progressBar.style.width = pct + "%";
    }

    function resetSessionCounters() {
      sessionLocalId = (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()));
      sessionDbId = null;
      maxQuestions = computeMaxQuestions();
      questionsAnswered = 0;
      correctCount = 0;
      badges = [];
      updateProgressUI();
    }

    function sessionComplete() { return questionsAnswered >= maxQuestions; }

    function maybeAwardBadge() {
      if (correctCount === 3 && !badges.includes("⭐")) badges.push("⭐");
      if (correctCount === 5 && !badges.includes("🏅")) badges.push("🏅");
      if (correctCount === 10 && !badges.includes("🏆")) badges.push("🏆");
    }

    // ---------------- Backend (AI) ----------------
    async function callBackend(promptText) {
      try {
        setTyping(true);
        const response = await axios.post(
          BACKEND_URL,
          {
            userId: currentUser?.id || "guest",
            messages: [{ role: "user", content: promptText }],
            subject,
            childName,
            childAge: String(childAge)
          }
        );
        setTyping(false);
        return response.data.reply;
      } catch (err) {
        setTyping(false);
        return "Sorry, I couldn’t connect right now. Please try again.";
      }
    }

    // ---------------- Database: Sessions + Items + Skill ----------------
    async function ensureSessionRow() {
      if (sessionDbId) return sessionDbId;
      if (!currentUser?.id || !child?.id || !subject) return null;

      const payload = {
        owner_id: currentUser.id,
        parent_user_id: currentUser.id,
        child_id: child.id,
        subject: subject,
        area: area || null,
        questions_done: 0,
        correct_count: 0,
        badges: badges,
        summary: null,
        raw_log: null
      };

      const { data, error } = await sb
        .from("sessions")
        .insert(payload)
        .select("id")
        .single();

      if (error) {
        console.error("sessions insert failed:", error);
        throw error;
      }

      sessionDbId = data.id;
      return sessionDbId;
    }

    async function insertSessionItem({ item_type, prompt_text=null, child_text=null, is_correct=null, meta=null }) {
      await ensureSessionRow();
      if (!sessionDbId || !currentUser?.id || !child?.id) return;

      const payload = {
        session_id: sessionDbId,
        owner_id: currentUser.id,
        child_id: child.id,
        item_type,
        prompt_text,
        child_text,
        is_correct,
        meta: meta || {}
      };

      const { error } = await sb.from("session_items").insert(payload);
      if (error) {
        console.error("session_items insert failed:", error);
        throw error;
      }
    }

    async function updateSessionRollups() {
      if (!sessionDbId) return;

      const { error } = await sb
        .from("sessions")
        .update({
          area: area || null,
          questions_done: questionsAnswered,
          correct_count: correctCount,
          badges: badges
        })
        .eq("id", sessionDbId);

      if (error) console.error("sessions update failed:", error);
    }

    async function loadOrCreateSkillRow() {
      if (!currentUser?.id || !child?.id || !subject || !area) return null;

      const { data: existing, error: selErr } = await sb
        .from("child_skill_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", subject)
        .eq("area", area)
        .maybeSingle();

      if (selErr) console.error("child_skill_progress select failed:", selErr);

      if (existing?.id) {
        skillRow = existing;
        difficultyLevel = skillRow.level || 1;
        streakCorrect = skillRow.streak_correct || 0;
        streakWrong = skillRow.streak_wrong || 0;
        updateProgressUI();
        return skillRow;
      }

      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject,
        area,
        level: 1,
        confidence: 0.5,
        accuracy: 0.0,
        total_attempts: 0,
        correct_attempts: 0,
        streak_correct: 0,
        streak_wrong: 0,
        last_session_id: sessionDbId || null,
        last_seen_at: new Date().toISOString()
      };

      const { data: up, error: upErr } = await sb
        .from("child_skill_progress")
        .upsert(payload, { onConflict: "owner_id,child_id,subject,area" })
        .select("*")
        .single();

      if (upErr) {
        console.error("child_skill_progress upsert failed:", upErr);
        throw upErr;
      }

      skillRow = up;
      difficultyLevel = skillRow.level || 1;
      streakCorrect = 0;
      streakWrong = 0;
      updateProgressUI();
      return skillRow;
    }

    function computeNewLevel({ level, accuracy, streak_correct, streak_wrong, total_attempts }) {
      let newLevel = level || 1;
      const att = total_attempts || 0;

      if (att >= 6 && streak_correct >= 3 && accuracy >= 0.70) {
        newLevel = Math.min(10, newLevel + 1);
      }
      if (att >= 6 && streak_wrong >= 3 && accuracy < 0.40) {
        newLevel = Math.max(1, newLevel - 1);
      }
      return newLevel;
    }

    async function recordAttemptToSkill({ isCorrect, meta }) {
      if (!skillRow?.id) return;

      const total_attempts = (skillRow.total_attempts || 0) + 1;
      const correct_attempts = (skillRow.correct_attempts || 0) + (isCorrect ? 1 : 0);
      const accuracy = total_attempts ? (correct_attempts / total_attempts) : 0.0;

      const newStreakCorrect = isCorrect ? (streakCorrect + 1) : 0;
      const newStreakWrong = isCorrect ? 0 : (streakWrong + 1);

      const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;
      const confidence = Math.max(0, Math.min(1, oldConf * 0.85 + accuracy * 0.15));

      const level = computeNewLevel({
        level: skillRow.level || 1,
        accuracy,
        streak_correct: newStreakCorrect,
        streak_wrong: newStreakWrong,
        total_attempts
      });

      streakCorrect = newStreakCorrect;
      streakWrong = newStreakWrong;
      difficultyLevel = level;

      const patch = {
        level,
        confidence,
        accuracy,
        total_attempts,
        correct_attempts,
        streak_correct: newStreakCorrect,
        streak_wrong: newStreakWrong,
        last_session_id: sessionDbId || null,
        last_seen_at: new Date().toISOString()
      };

      const { data, error } = await sb
        .from("child_skill_progress")
        .update(patch)
        .eq("id", skillRow.id)
        .select("*")
        .single();

      if (error) {
        console.error("child_skill_progress update failed:", error);
        throw error;
      }

      skillRow = data;
      updateProgressUI();
    }

    // ---------------- Maths generation ----------------
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function boundsForAgeAndDifficulty() {
      const age = childAge;
      const d = Math.max(1, Math.min(10, difficultyLevel || 1));
      const band = (d <= 3) ? 1 : (d <= 6) ? 2 : 3;

      if (age <= 7) {
        if (band === 1) return { min: 0, max: 10 };
        if (band === 2) return { min: 5, max: 15 };
        return { min: 10, max: 20 };
      }
      if (age <= 9) {
        if (band === 1) return { min: 5, max: 25 };
        if (band === 2) return { min: 10, max: 40 };
        return { min: 20, max: 60 };
      }
      if (age <= 11) {
        if (band === 1) return { min: 10, max: 60 };
        if (band === 2) return { min: 20, max: 120 };
        return { min: 50, max: 200 };
      }
      if (band === 1) return { min: 20, max: 120 };
      if (band === 2) return { min: 50, max: 300 };
      return { min: 100, max: 600 };
    }

    function generateMathQuestion() {
      const { min, max } = boundsForAgeAndDifficulty();

      if (area === "Addition") {
        const x = randInt(min, max);
        const y = randInt(min, max);
        return { displayText: `${x} + ${y} = ?`, correctAnswer: x + y };
      }
      if (area === "Subtraction") {
        let x = randInt(min, max);
        let y = randInt(min, max);
        if (y > x) [x, y] = [y, x];
        return { displayText: `${x} - ${y} = ?`, correctAnswer: x - y };
      }
      if (area === "Multiplication") {
        const base = (childAge <= 7) ? 5 : (childAge <= 9) ? 8 : 12;
        const band = (difficultyLevel <= 3) ? 0 : (difficultyLevel <= 6) ? 1 : 2;
        const tableMax = Math.min(12, base + band * 2);
        const x = randInt(2, tableMax);
        let y = randInt(2, tableMax);
        if (y === x) y = randInt(2, tableMax);
        return { displayText: `${x} × ${y} = ?`, correctAnswer: x * y };
      }
      if (area === "Division") {
        const base = (childAge <= 7) ? 5 : (childAge <= 9) ? 8 : 12;
        const band = (difficultyLevel <= 3) ? 0 : (difficultyLevel <= 6) ? 1 : 2;
        const divMax = Math.min(12, base + band * 2);

        const divisor = randInt(2, divMax);
        const quotient = randInt(2, divMax);
        const dividend = divisor * quotient;
        return { displayText: `${dividend} ÷ ${divisor} = ?`, correctAnswer: quotient };
      }
      return null;
    }

    function parseChildNumber(text) {
      const m = String(text || "").match(/-?\d+(\.\d+)?/);
      if (!m) return null;
      return Number(m[0]);
    }

    function showMathQuestion(q) {
      guided.active = false;
      guided.steps = [];
      guided.idx = 0;
      hintUsedForCurrent = false;
      waitingForNextButton = false;

      setPrompt(
        `✏️ Question:\n\n${q.displayText}\n\nTake your time.\nWhat do you think the answer is?`,
        { showHint:true, showNext:false }
      );

      setFeedback("Type your answer below. If you’re stuck, tap Hint.");
      addRecapLine("Tutor", q.displayText);

      insertSessionItem({
        item_type: "question",
        prompt_text: q.displayText,
        child_text: null,
        is_correct: null,
        meta: { subject, area, difficultyLevel }
      }).catch(console.error);
    }

    function buildGuidedSteps(q) {
      const raw = q.displayText.replace("= ?", "").trim();
      let op = null;
      if (raw.includes("+")) op = "+";
      else if (raw.includes("-")) op = "-";
      else if (raw.includes("×")) op = "×";
      else if (raw.includes("÷")) op = "÷";
      if (!op) return [];

      const parts = raw.split(op).map(s => parseInt(s.trim(), 10));
      const a = parts[0], b = parts[1];
      if (Number.isNaN(a) || Number.isNaN(b)) return [];

      if (childAge <= 7) {
        if (op === "+") return [{ prompt: `Start at ${a}.\nCount up ${b}.\n\nWhere do you land?`, expected: a+b }];
        if (op === "-") return [{ prompt: `Start at ${a}.\nCount back ${b}.\n\nWhere do you land?`, expected: a-b }];
        if (op === "×") return [{ prompt: `${a} × ${b} means add ${a}, ${b} times.\n\nWhat do you get?`, expected: a*b }];
        if (op === "÷") return [{ prompt: `How many groups of ${b} fit into ${a}?\n\nWhat do you get?`, expected: a/b }];
      }

      return [{ prompt: `Let’s do it slowly.\n\nWork it out step by step.\n\nWhat answer do you get?`, expected: q.correctAnswer }];
    }

    async function requestHint() {
      if (!currentQuestion) { setFeedback("I can give a hint once a question is on the screen."); return; }
      if (guided.active) { setFeedback("We’re already doing it step by step. Try this step first."); return; }
      if (hintUsedForCurrent) { setFeedback("You’ve already got a hint for this one. Have another try."); return; }

      hintUsedForCurrent = true;

      const hintPrompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}
Question: "${currentQuestion.displayText}"

Give ONE short hint only.
Do NOT give the final answer.
End with a gentle question.
British English.
Short lines.
`;
      const hintReply = await callBackend(hintPrompt);
      const t = cleanBotText(hintReply);
      setFeedback(t);
      addRecapLine("Tutor", "Hint: " + t);
    }

    async function giveMathFeedback_AI(q, childAnswerText) {
      const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}

Question: "${q.displayText}"
Child answered: "${childAnswerText}"
Correct answer: ${q.correctAnswer}

Write a short response:
- Praise (1 short sentence).
- One tiny explanation step (1 short sentence).
- End with: "Ready for the next one?"
Do NOT ask a new question.
British English.
Short lines.
`;
      return await callBackend(prompt);
    }

    function handleNextQuestion() {
      if (!waitingForNextButton) return;

      if (sessionComplete()) {
        waitingForNextButton = false;
        endSessionUI();
        return;
      }

      waitingForNextButton = false;
      currentQuestion = generateMathQuestion();
      if (!currentQuestion) { setFeedback("Sorry — I couldn’t make a new question right now."); return; }
      showMathQuestion(currentQuestion);
    }

    // ---------------- Chooser helpers ----------------
    function showAreaSelection(options) {
      areaChooser.innerHTML = `
        <div class="muted" style="margin:0 0 10px;">Choose an area:</div>
      `;
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";
        btn.textContent = opt.label;
        btn.addEventListener("click", opt.onClick);
        areaChooser.appendChild(btn);
      });
      areaChooser.style.display = "block";
    }

    function selectSubject(selected) {
      subject = selected;
      subjectChooser.style.display = "none";
      areaChooser.style.display = "none";

      area = null;
      currentQuestion = null;
      waitingForNextButton = false;
      hintUsedForCurrent = false;
      guided.active = false; guided.steps = []; guided.idx = 0;

      calculator.style.display = "none";
      progressHeader.style.display = "none";

      setPrompt(
        selected === "Maths"
          ? "✏️ Great!\n\nWhich Maths area would you like to try first?"
          : "📚 Great!\n\nWhich English area would you like to practise?",
        { showHint:false, showNext:false }
      );
      setFeedback("Pick one option below to begin.");
      addRecapLine("Kid", selected);

      if (selected === "Maths") {
        showAreaSelection([
          { label: "Addition ➕", onClick: async () => chooseArea("Addition") },
          { label: "Subtraction ➖", onClick: async () => chooseArea("Subtraction") },
          { label: "Multiplication ✖️", onClick: async () => chooseArea("Multiplication") },
          { label: "Division ➗", onClick: async () => chooseArea("Division") }
        ]);
      } else {
        showAreaSelection([
          { label: "Reading aloud 📖", onClick: async () => chooseArea("Reading") },
          { label: "Spelling 📝", onClick: async () => chooseArea("Spelling") },
          { label: "Sentence building ✍️", onClick: async () => chooseArea("Sentence building") },
          { label: "Fun word games 🎲", onClick: async () => chooseArea("Word games") }
        ]);
      }
    }

    async function chooseArea(chosenArea) {
      area = chosenArea;
      areaChooser.style.display = "none";
      addRecapLine("Kid", chosenArea);

      resetSessionCounters();
      await ensureSessionRow();
      await loadOrCreateSkillRow();
      updateProgressUI();

      guided.active = false; guided.steps = []; guided.idx = 0;

      if (subject === "Maths") {
        calculator.style.display = "block";
        currentQuestion = generateMathQuestion();
        showMathQuestion(currentQuestion);
      } else {
        calculator.style.display = "none";
        currentQuestion = null;

        setPrompt(`📚 ${childName}, let’s practise ${area}.\n\nReady?`, { showHint:false, showNext:false });
        setFeedback("Type your answer below. Keep it simple. One step at a time.");

        const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

Start ONE simple activity.
Keep it dyslexia-friendly.
End with a gentle question.
British English.
Short lines.
`;
        const reply = await callBackend(prompt);
        const t = cleanBotText(reply);
        setPrompt(t, { showHint:false, showNext:false });
        setFeedback("Type your answer below.");

        await insertSessionItem({
          item_type: "prompt",
          prompt_text: `English activity start: ${area}`,
          child_text: null,
          is_correct: null,
          meta: { subject, area, difficultyLevel }
        });
      }
    }

    // ---------------- End session ----------------
    function endSessionUI() {
      calculator.style.display = "none";
      waitingForNextButton = false;
      currentQuestion = null;
      hintUsedForCurrent = false;
      guided.active = false;
      guided.steps = [];
      guided.idx = 0;

      setPrompt(`✅ That’s the end for today, ${childName}.\n\nYou did really well.`, { showHint:false, showNext:false });
      setFeedback("All saved. See you next time.");

      hintBtn.style.display = "none";
      nextBtn.style.display = "none";
      disableInput(true);

      setMiniStatus("Session complete ✅");
    }

    // ---------------- Main send handler ----------------
    async function handleSend() {
      const text = input.value.trim();
      if (!text || input.disabled) return;

      // Recap (short)
      addRecapLine("Kid", text);
      input.value = "";

      // Record evidence
      try {
        await insertSessionItem({
          item_type: "answer",
          prompt_text: currentQuestion?.displayText || lastPromptText || null,
          child_text: text,
          is_correct: null,
          meta: { subject, area, difficultyLevel }
        });
      } catch (e) {
        console.error(e);
      }

      if (!subject) {
        setFeedback("Please choose Maths or English using the buttons below.");
        subjectChooser.style.display = "block";
        return;
      }

      if (!area) {
        setFeedback("Please choose an area first using the buttons.");
        return;
      }

      if (sessionComplete()) {
        endSessionUI();
        return;
      }

      // ---------------- Maths ----------------
      if (subject === "Maths") {
        if (!currentQuestion) {
          setFeedback("Please choose a Maths area first.");
          return;
        }

        // Guided mode
        if (guided.active) {
          const n = parseChildNumber(text);
          const step = guided.steps[guided.idx];
          const ok = (n !== null && Math.abs(n - step.expected) < 1e-9);

          if (ok) {
            guided.idx += 1;
            if (guided.idx < guided.steps.length) {
              const nextStepText = `✅ Nice work!\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${guided.steps[guided.idx].prompt}`;
              setPrompt(nextStepText, { showHint:false, showNext:false });
              setFeedback("Type your answer for this step.");
              addRecapLine("Tutor", "Step: " + guided.steps[guided.idx].prompt);
              return;
            }

            // Guided complete => correct
            guided.active = false; guided.steps = []; guided.idx = 0;

            questionsAnswered += 1;
            correctCount += 1;
            streakCorrect += 1;
            streakWrong = 0;

            maybeAwardBadge();
            updateProgressUI();

            await insertSessionItem({
              item_type: "feedback",
              prompt_text: currentQuestion.displayText,
              child_text: "(completed via guided steps)",
              is_correct: true,
              meta: { subject, area, difficultyLevel, guided: true }
            });

            await recordAttemptToSkill({ isCorrect: true, meta: { guided: true } });
            await updateSessionRollups();

            if (sessionComplete()) { endSessionUI(); return; }

            waitingForNextButton = true;
            setPrompt(`Brilliant, ${childName}!\n\nThat is correct.\n\nReady for the next one?`, { showHint:false, showNext:true });
            setFeedback("Tap Next question when you’re ready.");
            addRecapLine("Tutor", "Correct ✅");
            return;
          } else {
            // guided wrong
            streakWrong += 1;
            streakCorrect = 0;

            await insertSessionItem({
              item_type: "feedback",
              prompt_text: currentQuestion.displayText,
              child_text: text,
              is_correct: false,
              meta: { subject, area, difficultyLevel, guided: true, step: guided.idx+1 }
            });

            await recordAttemptToSkill({ isCorrect: false, meta: { guided: true, step: guided.idx+1 } });
            await updateSessionRollups();

            const retryText = `Good try, ${childName}.\n\nLet’s do the same step again.\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${step.prompt}`;
            setPrompt(retryText, { showHint:false, showNext:false });
            setFeedback("Try this step once more. You’ve got this.");
            addRecapLine("Tutor", "Try again (guided)");
            return;
          }
        }

        // Normal marking
        const n = parseChildNumber(text);
        const correct = (n !== null && Math.abs(n - currentQuestion.correctAnswer) < 1e-9);

        if (correct) {
          questionsAnswered += 1;
          correctCount += 1;
          streakCorrect += 1;
          streakWrong = 0;

          maybeAwardBadge();
          updateProgressUI();

          await insertSessionItem({
            item_type: "feedback",
            prompt_text: currentQuestion.displayText,
            child_text: text,
            is_correct: true,
            meta: { subject, area, difficultyLevel }
          });

          await recordAttemptToSkill({ isCorrect: true, meta: {} });
          await updateSessionRollups();

          const reply = await giveMathFeedback_AI(currentQuestion, text);
          const t = cleanBotText(reply);

          if (sessionComplete()) {
            setPrompt(t, { showHint:false, showNext:false });
            setFeedback("Nice work today. That’s the session done.");
            addRecapLine("Tutor", t);
            endSessionUI();
            return;
          }

          waitingForNextButton = true;
          setPrompt(t, { showHint:false, showNext:true });
          setFeedback("Tap Next question when you’re ready.");
          addRecapLine("Tutor", t);
          return;
        }

        // Incorrect => guided steps
        streakWrong += 1;
        streakCorrect = 0;

        await insertSessionItem({
          item_type: "feedback",
          prompt_text: currentQuestion.displayText,
          child_text: text,
          is_correct: false,
          meta: { subject, area, difficultyLevel }
        });

        await recordAttemptToSkill({ isCorrect: false, meta: {} });
        await updateSessionRollups();

        const steps = buildGuidedSteps(currentQuestion);
        if (steps.length) {
          guided.active = true;
          guided.steps = steps;
          guided.idx = 0;

          const stepText = `Good try, ${childName}.\n\nLet’s go slowly.\n\nStep 1 of ${guided.steps.length}:\n\n${guided.steps[0].prompt}`;
          setPrompt(stepText, { showHint:false, showNext:false });
          setFeedback("Answer this step. One small step at a time.");
          addRecapLine("Tutor", "Guided steps started");
          return;
        }

        setPrompt("Good try.\n\nLet’s try again.\n\nWhat do you think the answer is?", { showHint:true, showNext:false });
        setFeedback("If you want, tap Hint.");
        addRecapLine("Tutor", "Try again");
        return;
      }

      // ---------------- English ----------------
      if (subject === "English") {
        questionsAnswered += 1;
        updateProgressUI();

        await insertSessionItem({
          item_type: "turn",
          prompt_text: `English: ${area}`,
          child_text: text,
          is_correct: null,
          meta: { subject, area, difficultyLevel }
        });

        // Nudge engagement confidence
        try {
          if (skillRow?.id) {
            const total_attempts = (skillRow.total_attempts || 0) + 1;
            const correct_attempts = (skillRow.correct_attempts || 0);
            const accuracy = total_attempts ? (correct_attempts / total_attempts) : 0.0;
            const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;
            const confidence = Math.max(0, Math.min(1, oldConf * 0.90 + 0.10 * 0.55));

            const { data } = await sb
              .from("child_skill_progress")
              .update({
                total_attempts,
                accuracy,
                confidence,
                last_session_id: sessionDbId || null,
                last_seen_at: new Date().toISOString()
              })
              .eq("id", skillRow.id)
              .select("*")
              .single();

            if (data) skillRow = data;
            updateProgressUI();
          }
        } catch (e) { console.error(e); }

        await updateSessionRollups();

        const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

The child replied: "${text}"

Respond with short, clear help.
Use very simple words.
Dyslexia-friendly spacing (short lines).
Give one next step only.
End with a gentle question.
British English.
`;
        const reply = await callBackend(prompt);
        const t = cleanBotText(reply);

        setPrompt(t, { showHint:false, showNext:false });
        setFeedback("Type your next answer below.");
        addRecapLine("Tutor", t);

        if (sessionComplete()) {
          endSessionUI();
        }
      }
    }

    // ---------------- Calculator wiring ----------------
    function setupCalculator() {
      const btns = Array.from(document.querySelectorAll(".calcBtn"));
      btns.forEach(b => {
        b.addEventListener("click", () => {
          const val = b.textContent;
          if (val === "C") return;
          input.value += val;
          input.focus();
        });
      });
      document.getElementById("calcClearBtn").addEventListener("click", () => {
        input.value = "";
        input.focus();
      });
    }

    // ---------------- Auth + child loading ----------------
    async function requireAuth() {
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) {
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    function getSelectedChildFromLocalStorage() {
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    async function loadChildProfile() {
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id) {
        showError("No child selected. Go to Dashboard and click Select on a child.");
        setPrompt("I can’t find a child profile yet.\n\nPlease go back to the Dashboard and select a child.");
        setFeedback("Then come back here to start the Tutor.");
        disableInput(true);
        subjectChooser.style.display = "none";
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data) {
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        disableInput(true);
        return false;
      }

      if (data.parent_user_id !== currentUser.id) {
        showError("This child profile does not belong to this account. Please re-select a child.");
        disableInput(true);
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);

      clearError();
      disableInput(false);

      // Reset UI + recap for fresh entry
      recapLines.innerHTML = "";
      setMiniStatus("");

      setPrompt(`👋 Hi ${childName}!\n\nI’ll help you in a calm, step-by-step way.\n\nWhat are we working on today?`, { showHint:false, showNext:false });
      setFeedback("Choose Maths or English below to start.");
      addRecapLine("Tutor", `Hi ${childName}!`);
      subjectChooser.style.display = "block";
      areaChooser.style.display = "none";

      return true;
    }

    // ---------------- Logout ----------------
    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    // ---------------- Buttons ----------------
    hintBtn.addEventListener("click", requestHint);
    nextBtn.addEventListener("click", handleNextQuestion);

    mathsBtn.addEventListener("click", () => selectSubject("Maths"));
    englishBtn.addEventListener("click", () => selectSubject("English"));

    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleSend();
      }
    });

    // ---------------- Init ----------------
    (async () => {
      setupCalculator();
      disableInput(false);

      const ok = await requireAuth();
      if (!ok) return;

      // Initial “app-like” state
      setPrompt("Loading…");
      setFeedback("One moment…");
      await loadChildProfile();
    })();
  })();
  </script>
