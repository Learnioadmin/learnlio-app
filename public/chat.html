<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Tutor</title>

  <link rel="stylesheet" href="/assets/css/app.css" />

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .container { max-width: 980px; margin: 0 auto; padding: 18px; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; }
    .brand img { height:34px; width:auto; display:block; }
    .links { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .links a { text-decoration:none; color:#111; padding:10px 12px; border-radius:12px; }
    .links a.active { background:#eef2ff; }
    .btn { background:#0b5cff; border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; }
    .btn.light { background:#e5e7eb; color:#111; }
    .muted { color:#6b7280; font-size: 14px; }
    .status { margin-top:10px; font-size:14px; }
    .status.bad { color:#dc2626; }
    .status.good { color:#16a34a; }

    .msg { padding:14px 16px; margin-bottom:14px; border-radius:16px; max-width:85%;
      font-size:18px; line-height:1.85; white-space:pre-wrap;
      font-family:'OpenDyslexic', Arial, sans-serif;
      overflow-wrap:break-word; display:inline-block;
    }
    .msg.user { background:#0b5cff; color:#fff; margin-left:auto; text-align:right; }
    .msg.bot  { background:#fef3c7; color:#000; }

    .bot-controls { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn-small { border:none; border-radius:10px; padding:6px 12px; font-size:14px; cursor:pointer; color:#fff; }
    .speak-btn { background:#0b5cff; }
    .hint-btn  { background:#10b981; }
    .next-btn  { background:#7c3aed; }

    /* Progress header */
    .ph-wrap{ display:none; margin-bottom:10px; }
    .ph-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .ph-kpi{ font-family:'OpenDyslexic', Arial, sans-serif; font-size:14px; color:#333; }
    .ph-bar{ height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:8px; }
    .ph-bar > div{ height:10px; width:0%; background:#10b981; }

    /* Calculator */
    .calcBtn { padding:14px; font-size:18px; border-radius:10px; border:none; background:#fff; cursor:pointer; }

    /* Small calm loading on speak button */
    .btn-small:disabled { opacity:.65; cursor:not-allowed; }
  </style>

      <div id="messages" style="

        Learnlio is typing…

      <!-- Calculator -->
      <div id="calculator" style="display:none; margin-bottom:12px; background:#eef2ff; padding:10px; border-radius:14px;">
        <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;">
          <button type="button" class="calcBtn">7</button>
          <button type="button" class="calcBtn">8</button>
          <button type="button" class="calcBtn">9</button>

          <button type="button" class="calcBtn">5</button>

  <script>
  (() => {
    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const BACKEND_URL = "https://softr-chat-backend.onrender.com";

    // ✅ Google/Vertex TTS Worker
    const TTS_WORKER_BASE = "https://learnlio-tts.falling-grass-34ab.workers.dev";
    const TTS_ENDPOINT = "/speak"; // change if your worker uses a different path
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elements
    const pageError = document.getElementById("pageError");
    const logoutBtn = document.getElementById("logoutBtn");
    const messagesDiv = document.getElementById("messages");
    const typingIndicator = document.getElementById("typing-indicator");

    const progressHeader = document.getElementById("progressHeader");
    const progressLabel  = document.getElementById("progressLabel");
    const skillLabel     = document.getElementById("skillLabel");
    const badgeLabel     = document.getElementById("badgeLabel");
    const progressBar    = document.getElementById("progressBar");

    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const calculator = document.getElementById("calculator");
    const subjectSelection = document.getElementById("subject-selection");
    const areaSelection = document.getElementById("area-selection");
    const mathsBtn = document.getElementById("mathsBtn");
    const englishBtn = document.getElementById("englishBtn");

    // Auth + child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Tutor state
    let subject = null; // "Maths" | "English"
    let area = null;

    // Session + skill tracking
    let sessionDbId = null; // UUID from sessions table
    let sessionLocalId = (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()));
    let maxQuestions = 10;
    let questionsAnswered = 0;
    let correctCount = 0;
    let badges = [];

    // Skill row (child_skill_progress)
    let skillRow = null; // { id, level, accuracy, ... }
    let difficultyLevel = 1; // derived from skillRow.level
    let streakCorrect = 0;
    let streakWrong = 0;

    // Maths question
    let currentQuestion = null; // { displayText, correctAnswer }
    let hintUsedForCurrent = false;
    let waitingForNextButton = false;
    let guided = { active:false, steps:[], idx:0 };

    // ✅ TTS audio state (so we can stop current playback cleanly)
    let ttsAudioEl = null;
    let ttsObjectUrl = null;

    // ---------------- UI helpers ----------------
    function showError(msg) {
      pageError.style.display = "block";
      pageError.textContent = msg;
    }
    function clearError() {
      pageError.style.display = "none";
      pageError.textContent = "";
    }
    function disableInput(disabled) {
      input.disabled = disabled;
      sendBtn.disabled = disabled;
      sendBtn.style.opacity = disabled ? "0.6" : "1";
      input.style.opacity = disabled ? "0.6" : "1";
    }
    function cleanBotText(t) { return String(t || "").replace(/\*\*/g, ""); }

    function addUserMessage(text) {
      const div = document.createElement("div");
      div.className = "msg user";
      div.innerText = String(text || "").trim();
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ---------------- TTS (Worker first, fallback to browser) ----------------
    function pickBestUKVoice() {
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      const preferredNames = [
        "Google UK English Female","Google UK English Male",
        "Microsoft Sonia Online","Microsoft Ryan Online","Microsoft Libby Online",
        "Samantha","Daniel"
      ];
      for (const name of preferredNames) {
        const v = voices.find(x => x.name === name);
        if (v) return v;
      }
      const uk = voices.find(v => (v.lang || "").toLowerCase().startsWith("en-gb"));
      if (uk) return uk;
      return voices.find(v => (v.lang || "").toLowerCase().startsWith("en")) || null;
    }
    let cachedVoice = null;
    window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickBestUKVoice(); };

    function speakBrowser(text) {
      try {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text || ""));
        u.lang = "en-GB";
        u.rate = 0.9;
        u.pitch = 1.0;
        const v = cachedVoice || pickBestUKVoice();
        if (v) { cachedVoice = v; u.voice = v; }
        window.speechSynthesis.speak(u);
      } catch (e) {
        console.error("browser TTS failed", e);
      }
    }

    function stopTtsAudio() {
      try {
        if (ttsAudioEl) {
          ttsAudioEl.pause();
          ttsAudioEl.src = "";
          ttsAudioEl = null;
        }
        if (ttsObjectUrl) {
          URL.revokeObjectURL(ttsObjectUrl);
          ttsObjectUrl = null;
        }
      } catch {}
    }

    async function getAccessTokenOrThrow() {
      // Uses Supabase session token to authenticate the worker
      let { data: s } = await sb.auth.getSession();
      let accessToken = s?.session?.access_token;

      if (!accessToken) {
        const refreshed = await sb.auth.refreshSession();
        accessToken = refreshed?.data?.session?.access_token;
      }
      if (!accessToken) throw new Error("No session token. Please log out and log in again.");
      return accessToken;
    }

    function base64ToBlob(b64, mime) {
      const byteChars = atob(b64);
      const byteNums = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
      return new Blob([new Uint8Array(byteNums)], { type: mime || "audio/mpeg" });
    }

    async function speakViaWorker(text) {
      const token = await getAccessTokenOrThrow();
      const res = await fetch(`${TTS_WORKER_BASE}${TTS_ENDPOINT}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "audio/*,application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ text: String(text || ""), lang: "en-GB" })
      });

      if (!res.ok) {
        const t = await res.text().catch(() => "");
        throw new Error(`TTS worker error (HTTP ${res.status}) ${t ? "- " + t.slice(0, 160) : ""}`);
      }

      const ct = (res.headers.get("content-type") || "").toLowerCase();

      // Preferred: audio bytes
      if (ct.includes("audio/")) {
        const blob = await res.blob();
        return { blob, mime: ct.split(";")[0] || "audio/mpeg" };
      }

      // Alternate: JSON base64
      const json = await res.json();
      const b64 = json.audioBase64 || json.audio || json.data;
      const mime = json.mime || json.contentType || "audio/mpeg";
      if (!b64) throw new Error("TTS worker returned JSON but no audioBase64/audio field.");
      const blob = base64ToBlob(b64, mime);
      return { blob, mime };
    }

    async function speakText(text, btnEl) {
      const safe = String(text || "").trim();
      if (!safe) return;

      // Stop any current audio + browser speech to avoid overlap
      try { window.speechSynthesis.cancel(); } catch {}
      stopTtsAudio();

      const originalLabel = btnEl ? btnEl.textContent : null;
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.textContent = "🔊 Loading…";
      }

      try {
        const { blob } = await speakViaWorker(safe);
        ttsObjectUrl = URL.createObjectURL(blob);
        ttsAudioEl = new Audio(ttsObjectUrl);
        ttsAudioEl.onended = () => {
          stopTtsAudio();
          if (btnEl) {
            btnEl.disabled = false;
            btnEl.textContent = originalLabel || "🔊 Listen";
          }
        };
        ttsAudioEl.onerror = () => {
          stopTtsAudio();
          if (btnEl) {
            btnEl.disabled = false;
            btnEl.textContent = originalLabel || "🔊 Listen";
          }
          // fallback
          speakBrowser(safe);
        };
        await ttsAudioEl.play();
      } catch (e) {
        console.warn("Worker TTS failed — falling back to browser voice.", e);
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.textContent = originalLabel || "🔊 Listen";
        }
        speakBrowser(safe);
      }
    }

    function addBotMessage(text, opts={showHint:false, showNext:false}) {
      const safeText = cleanBotText(text);
      const div = document.createElement("div");
      div.className = "msg bot";

      const content = document.createElement("div");
      content.innerText = safeText;
      div.appendChild(content);

      const controls = document.createElement("div");
      controls.className = "bot-controls";

      const speakBtn = document.createElement("button");
      speakBtn.type = "button";
      speakBtn.className = "btn-small speak-btn";
      speakBtn.innerText = "🔊 Listen";
      speakBtn.onclick = () => speakText(safeText, speakBtn);
      controls.appendChild(speakBtn);

      if (opts.showHint) {
        const hintBtn = document.createElement("button");
        hintBtn.type = "button";
        hintBtn.className = "btn-small hint-btn";
        hintBtn.innerText = "💡 Hint";
        hintBtn.onclick = () => requestHint();
        controls.appendChild(hintBtn);
      }

      if (opts.showNext) {
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn-small next-btn";
        nextBtn.innerText = "➡️ Next question";
        nextBtn.onclick = () => handleNextQuestion();
        controls.appendChild(nextBtn);
      }

      div.appendChild(controls);
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showActionButtons(buttons) {
      areaSelection.innerHTML = "";
      buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";
        btn.style.marginRight = "8px";
        btn.style.marginBottom = "8px";
        btn.innerText = b.label;
        btn.addEventListener("click", b.onClick);
        areaSelection.appendChild(btn);
      });
      areaSelection.style.display = "block";
    }

    function computeAgeFromDob(dobStr) {
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function computeMaxQuestions() {
      const a = childAge;
      if (a <= 7) return 5;
      if (a <= 10) return 8;
      if (a <= 13) return 10;
      return 12;
    }

    function updateProgressUI() {
      progressHeader.style.display = "block";
      progressLabel.innerText = `Progress: ${questionsAnswered} / ${maxQuestions}`;
      badgeLabel.innerText = `Badges: ${badges.length ? badges.join(" ") : "—"}`;

      const lvl = skillRow?.level || difficultyLevel || 1;
      const acc = (typeof skillRow?.accuracy === "number")
        ? Math.round(skillRow.accuracy * 100)
        : null;

      skillLabel.innerText = (subject && area)
        ? `${subject} • ${area} — Level ${lvl}${acc !== null ? ` • ${acc}%` : ""}`
        : "Skill: —";

      const pct = maxQuestions ? Math.min(100, Math.round((questionsAnswered / maxQuestions) * 100)) : 0;
      progressBar.style.width = pct + "%";
    }

    function resetSessionCounters() {
      sessionLocalId = (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()));
      sessionDbId = null;
      maxQuestions = computeMaxQuestions();
      questionsAnswered = 0;
      correctCount = 0;
      badges = [];
      updateProgressUI();
    }

    function sessionComplete() { return questionsAnswered >= maxQuestions; }

    function maybeAwardBadge() {
      if (correctCount === 3 && !badges.includes("⭐")) badges.push("⭐");
      if (correctCount === 5 && !badges.includes("🏅")) badges.push("🏅");
      if (correctCount === 10 && !badges.includes("🏆")) badges.push("🏆");
    }

    // ---------------- Backend (AI) ----------------
    async function callBackend(promptText) {
      try {
        typingIndicator.style.display = "block";
        const response = await axios.post(
          BACKEND_URL,
          {
            userId: currentUser?.id || "guest",
            messages: [{ role: "user", content: promptText }],
            subject,
            childName,
            childAge: String(childAge)
          }
        );
        typingIndicator.style.display = "none";
        return response.data.reply;
      } catch (err) {
        typingIndicator.style.display = "none";
        return "Sorry, I couldn’t connect right now. Please try again.";
      }
    }

    // ---------------- Database: Sessions + Items + Skill ----------------
    async function ensureSessionRow() {
      if (sessionDbId) return sessionDbId;
      if (!currentUser?.id || !child?.id || !subject) return null;

      const payload = {
        owner_id: currentUser.id,
        parent_user_id: currentUser.id,
        child_id: child.id,
        subject: subject,
        area: area || null,
        questions_done: 0,
        correct_count: 0,
        badges: badges,
        summary: null,
        raw_log: null
      };

      const { data, error } = await sb
        .from("sessions")
        .insert(payload)
        .select("id")
        .single();

      if (error) {
        console.error("sessions insert failed:", error);
        throw error;
      }

      sessionDbId = data.id;
      return sessionDbId;
    }

    async function insertSessionItem({ item_type, prompt_text=null, child_text=null, is_correct=null, meta=null }) {
      await ensureSessionRow();
      if (!sessionDbId || !currentUser?.id || !child?.id) return;

      const payload = {
        session_id: sessionDbId,
        owner_id: currentUser.id,
        child_id: child.id,
        item_type,
        prompt_text,
        child_text,
        is_correct,
        meta: meta || {}
      };

      const { error } = await sb.from("session_items").insert(payload);
      if (error) {
        console.error("session_items insert failed:", error);
        throw error;
      }
    }

    async function updateSessionRollups() {
      if (!sessionDbId) return;

      const { error } = await sb
        .from("sessions")
        .update({
          area: area || null,
          questions_done: questionsAnswered,
          correct_count: correctCount,
          badges: badges
        })
        .eq("id", sessionDbId);

      if (error) console.error("sessions update failed:", error);
    }

    async function loadOrCreateSkillRow() {
      if (!currentUser?.id || !child?.id || !subject || !area) return null;

      const { data: existing, error: selErr } = await sb
        .from("child_skill_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", subject)
        .eq("area", area)
        .maybeSingle();

      if (selErr) console.error("child_skill_progress select failed:", selErr);

      if (existing?.id) {
        skillRow = existing;
        difficultyLevel = skillRow.level || 1;
        streakCorrect = skillRow.streak_correct || 0;
        streakWrong = skillRow.streak_wrong || 0;
        updateProgressUI();
        return skillRow;
      }

      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject,
        area,
        level: 1,
        confidence: 0.5,
        accuracy: 0.0,
        total_attempts: 0,
        correct_attempts: 0,
        streak_correct: 0,
        streak_wrong: 0,
        last_session_id: sessionDbId || null,
        last_seen_at: new Date().toISOString()
      };

      const { data: up, error: upErr } = await sb
        .from("child_skill_progress")
        .upsert(payload, { onConflict: "owner_id,child_id,subject,area" })
        .select("*")
        .single();

      if (upErr) {
        console.error("child_skill_progress upsert failed:", upErr);
        throw upErr;
      }

      skillRow = up;
      difficultyLevel = skillRow.level || 1;
      streakCorrect = 0;
      streakWrong = 0;
      updateProgressUI();
      return skillRow;
    }

    function computeNewLevel({ level, accuracy, streak_correct, streak_wrong, total_attempts }) {
      let newLevel = level || 1;
      const att = total_attempts || 0;

      if (att >= 6 && streak_correct >= 3 && accuracy >= 0.70) newLevel = Math.min(10, newLevel + 1);
      if (att >= 6 && streak_wrong >= 3 && accuracy < 0.40) newLevel = Math.max(1, newLevel - 1);
      return newLevel;
    }

    async function recordAttemptToSkill({ isCorrect, meta }) {
      if (!skillRow?.id) return;

      const total_attempts = (skillRow.total_attempts || 0) + 1;
      const correct_attempts = (skillRow.correct_attempts || 0) + (isCorrect ? 1 : 0);
      const accuracy = total_attempts ? (correct_attempts / total_attempts) : 0.0;

      const newStreakCorrect = isCorrect ? (streakCorrect + 1) : 0;
      const newStreakWrong = isCorrect ? 0 : (streakWrong + 1);

      const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;
      const confidence = Math.max(0, Math.min(1, oldConf * 0.85 + accuracy * 0.15));

      const level = computeNewLevel({
        level: skillRow.level || 1,
        accuracy,
        streak_correct: newStreakCorrect,
        streak_wrong: newStreakWrong,
        total_attempts
      });

      streakCorrect = newStreakCorrect;
      streakWrong = newStreakWrong;
      difficultyLevel = level;

      const patch = {
        level,
        confidence,
        accuracy,
        total_attempts,
        correct_attempts,
        streak_correct: newStreakCorrect,
        streak_wrong: newStreakWrong,
        last_session_id: sessionDbId || null,
        last_seen_at: new Date().toISOString()
      };

      const { data, error } = await sb
        .from("child_skill_progress")
        .update(patch)
        .eq("id", skillRow.id)
        .select("*")
        .single();

      if (error) {
        console.error("child_skill_progress update failed:", error);
        throw error;
      }

      skillRow = data;
      updateProgressUI();
    }

    // ---------------- Maths generation ----------------
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function boundsForAgeAndDifficulty() {
      const age = childAge;
      const d = Math.max(1, Math.min(10, difficultyLevel || 1));
      const band = (d <= 3) ? 1 : (d <= 6) ? 2 : 3;

      if (age <= 7) {
        if (band === 1) return { min: 0, max: 10 };
        if (band === 2) return { min: 5, max: 15 };
        return { min: 10, max: 20 };
      }
      if (age <= 9) {
        if (band === 1) return { min: 5, max: 25 };
        if (band === 2) return { min: 10, max: 40 };
        return { min: 20, max: 60 };
      }
      if (age <= 11) {
        if (band === 1) return { min: 10, max: 60 };
        if (band === 2) return { min: 20, max: 120 };
        return { min: 50, max: 200 };
      }
      if (band === 1) return { min: 20, max: 120 };
      if (band === 2) return { min: 50, max: 300 };
      return { min: 100, max: 600 };
    }

    function generateMathQuestion() {
      const { min, max } = boundsForAgeAndDifficulty();

      if (area === "Addition") {
        const x = randInt(min, max);
        const y = randInt(min, max);
        return { displayText: `${x} + ${y} = ?`, correctAnswer: x + y };
      }
      if (area === "Subtraction") {
        let x = randInt(min, max);
        let y = randInt(min, max);
        if (y > x) [x, y] = [y, x];
        return { displayText: `${x} - ${y} = ?`, correctAnswer: x - y };
      }
      if (area === "Multiplication") {
        const base = (childAge <= 7) ? 5 : (childAge <= 9) ? 8 : 12;
        const band = (difficultyLevel <= 3) ? 0 : (difficultyLevel <= 6) ? 1 : 2;
        const tableMax = Math.min(12, base + band * 2);
        const x = randInt(2, tableMax);
        let y = randInt(2, tableMax);
        if (y === x) y = randInt(2, tableMax);
        return { displayText: `${x} × ${y} = ?`, correctAnswer: x * y };
      }
      if (area === "Division") {
        const base = (childAge <= 7) ? 5 : (childAge <= 9) ? 8 : 12;
        const band = (difficultyLevel <= 3) ? 0 : (difficultyLevel <= 6) ? 1 : 2;
        const divMax = Math.min(12, base + band * 2);

        const divisor = randInt(2, divMax);
        const quotient = randInt(2, divMax);
        const dividend = divisor * quotient;
        return { displayText: `${dividend} ÷ ${divisor} = ?`, correctAnswer: quotient };
      }
      return null;
    }

    function parseChildNumber(text) {
      const m = String(text || "").match(/-?\d+(\.\d+)?/);
      if (!m) return null;
      return Number(m[0]);
    }

    function showMathQuestion(q) {
      guided.active = false;
      guided.steps = [];
      guided.idx = 0;
      hintUsedForCurrent = false;
      waitingForNextButton = false;

      addBotMessage(
        `✏️ Question:\n\n${q.displayText}\n\nTake your time.\nWhat do you think the answer is?`,
        { showHint:true, showNext:false }
      );

      insertSessionItem({
        item_type: "question",
        prompt_text: q.displayText,
        child_text: null,
        is_correct: null,
        meta: { subject, area, difficultyLevel }
      }).catch(console.error);
    }

    function buildGuidedSteps(q) {
      const raw = q.displayText.replace("= ?", "").trim();
      let op = null;
      if (raw.includes("+")) op = "+";
      else if (raw.includes("-")) op = "-";
      else if (raw.includes("×")) op = "×";
      else if (raw.includes("÷")) op = "÷";
      if (!op) return [];

      const parts = raw.split(op).map(s => parseInt(s.trim(), 10));
      const a = parts[0], b = parts[1];
      if (Number.isNaN(a) || Number.isNaN(b)) return [];

      if (childAge <= 7) {
        if (op === "+") return [{ prompt: `Start at ${a}.\nCount up ${b}.\n\nWhere do you land?`, expected: a+b }];
        if (op === "-") return [{ prompt: `Start at ${a}.\nCount back ${b}.\n\nWhere do you land?`, expected: a-b }];
        if (op === "×") return [{ prompt: `${a} × ${b} means add ${a}, ${b} times.\n\nWhat do you get?`, expected: a*b }];
        if (op === "÷") return [{ prompt: `How many groups of ${b} fit into ${a}?\n\nWhat do you get?`, expected: a/b }];
      }

      return [{ prompt: `Let’s do it slowly.\n\nWork it out step by step.\n\nWhat answer do you get?`, expected: q.correctAnswer }];
    }

    async function requestHint() {
      if (!currentQuestion) { addBotMessage("I can give a hint once a question is on the screen. 😊"); return; }
      if (guided.active) { addBotMessage("We’re already doing it step by step.\n\nTry this step first. 😊"); return; }
      if (hintUsedForCurrent) { addBotMessage("You’ve already got a hint for this one.\n\nHave another try. 😊"); return; }
      hintUsedForCurrent = true;

      const hintPrompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}
Question: "${currentQuestion.displayText}"

Give ONE short hint only.
Do NOT give the final answer.
End with a gentle question.
British English.
Short lines.
`;
      const hintReply = await callBackend(hintPrompt);
      addBotMessage(hintReply);
    }

    async function giveMathFeedback_AI(q, childAnswerText) {
      const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}

Question: "${q.displayText}"
Child answered: "${childAnswerText}"
Correct answer: ${q.correctAnswer}

Write a short response:
- Praise (1 short sentence).
- One tiny explanation step (1 short sentence).
- End with: "Ready for the next one?"
Do NOT ask a new question.
British English.
Short lines.
`;
      return await callBackend(prompt);
    }

    function handleNextQuestion() {
      if (!waitingForNextButton) return;

      if (sessionComplete()) {
        waitingForNextButton = false;
        endSessionUI();
        return;
      }

      waitingForNextButton = false;
      currentQuestion = generateMathQuestion();
      if (!currentQuestion) { addBotMessage("Sorry — I couldn’t make a new question right now."); return; }
      showMathQuestion(currentQuestion);
    }

    // ---------------- Subject/Area selection ----------------
    function showAreaSelection(options) {
      areaSelection.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";
        btn.style.marginRight = "8px";
        btn.style.marginBottom = "8px";
        btn.innerText = opt.label;
        btn.addEventListener("click", async () => {
          addUserMessage(opt.label);
          areaSelection.style.display = "none";

          area = opt.area;

          resetSessionCounters();
          await ensureSessionRow();
          await loadOrCreateSkillRow();
          updateProgressUI();

          guided.active = false; guided.steps = []; guided.idx = 0;

          if (subject === "Maths") {
            calculator.style.display = "block";
            currentQuestion = generateMathQuestion();
            showMathQuestion(currentQuestion);
          } else {
            calculator.style.display = "none";
            currentQuestion = null;

            const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

Start ONE simple activity.
Keep it dyslexia-friendly.
End with a gentle question.
British English.
Short lines.
`;
            const reply = await callBackend(prompt);
            addBotMessage(reply);

            await insertSessionItem({
              item_type: "prompt",
              prompt_text: `English activity start: ${area}`,
              child_text: null,
              is_correct: null,
              meta: { subject, area, difficultyLevel }
            });
          }
        });
        areaSelection.appendChild(btn);
      });
      areaSelection.style.display = "block";
    }

    function selectSubject(selected) {
      subject = selected;
      subjectSelection.style.display = "none";
      areaSelection.style.display = "none";

      area = null;
      currentQuestion = null;
      waitingForNextButton = false;
      hintUsedForCurrent = false;
      guided.active = false; guided.steps = []; guided.idx = 0;

      calculator.style.display = "none";
      progressHeader.style.display = "none";

      addBotMessage(selected === "Maths"
        ? "✏️ Great!\n\nWhich Maths area would you like to try first?"
        : "📚 Great!\n\nWhich English area would you like to practise?"
      );

      if (selected === "Maths") {
        showAreaSelection([
          { label: "Addition ➕", area: "Addition" },
          { label: "Subtraction ➖", area: "Subtraction" },
          { label: "Multiplication ✖️", area: "Multiplication" },
          { label: "Division ➗", area: "Division" }
        ]);
      } else {
        showAreaSelection([
          { label: "Reading aloud 📖", area: "Reading" },
          { label: "Spelling 📝", area: "Spelling" },
          { label: "Sentence building ✍️", area: "Sentence building" },
          { label: "Fun word games 🎲", area: "Word games" }
        ]);
      }
    }

    // ---------------- End session ----------------
    function endSessionUI() {
      calculator.style.display = "none";
      waitingForNextButton = false;
      currentQuestion = null;
      hintUsedForCurrent = false;
      guided.active = false;
      guided.steps = [];
      guided.idx = 0;

      addBotMessage(`✅ That’s the end for today, ${childName}.\n\nYou did really well.`);

      showActionButtons([
        {
          label: "Start a new session 🔄",
          onClick: () => {
            addUserMessage("Start a new session");
            areaSelection.style.display = "none";
            resetSessionCounters();
            progressHeader.style.display = "none";
            subject = null; area = null; skillRow = null;
            disableInput(false);
            addBotMessage(`What would you like to work on now, ${childName}?`);
            subjectSelection.style.display = "block";
          }
        },
        {
          label: "Finished for today ✅",
          onClick: async () => {
            addUserMessage("Finished for today");
            areaSelection.style.display = "none";
            disableInput(true);
            await updateSessionRollups();
            addBotMessage("✅ All saved.\n\nSee you next time.");
          }
        }
      ]);

      disableInput(true);
    }

    // ---------------- Main send handler ----------------
    async function handleSend() {
      const text = input.value.trim();
      if (!text || input.disabled) return;

      addUserMessage(text);
      input.value = "";

      try {
        await insertSessionItem({
          item_type: "answer",
          prompt_text: currentQuestion?.displayText || null,
          child_text: text,
          is_correct: null,
          meta: { subject, area, difficultyLevel }
        });
      } catch (e) {
        console.error(e);
      }

      if (!subject) {
        addBotMessage("Please choose Maths or English using the buttons below.");
        subjectSelection.style.display = "block";
        return;
      }

      if (!area) {
        addBotMessage("Please choose an area first using the buttons.");
        return;
      }

      if (sessionComplete()) {
        endSessionUI();
        return;
      }

      // ---------------- Maths ----------------
      if (subject === "Maths") {
        if (!currentQuestion) {
          addBotMessage("Please choose a Maths area first.");
          return;
        }

        // Guided mode
        if (guided.active) {
          const n = parseChildNumber(text);
          const step = guided.steps[guided.idx];
          const ok = (n !== null && Math.abs(n - step.expected) < 1e-9);

          if (ok) {
            guided.idx += 1;
            if (guided.idx < guided.steps.length) {
              addBotMessage(`✅ Nice work!\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${guided.steps[guided.idx].prompt}`);
              return;
            }

            guided.active = false; guided.steps = []; guided.idx = 0;

            questionsAnswered += 1;
            correctCount += 1;
            streakCorrect += 1;
            streakWrong = 0;

            maybeAwardBadge();
            updateProgressUI();

            await insertSessionItem({
              item_type: "feedback",
              prompt_text: currentQuestion.displayText,
              child_text: "(completed via guided steps)",
              is_correct: true,
              meta: { subject, area, difficultyLevel, guided: true }
            });

            await recordAttemptToSkill({ isCorrect: true, meta: { guided: true } });
            await updateSessionRollups();

            if (sessionComplete()) { endSessionUI(); return; }

            waitingForNextButton = true;
            addBotMessage(`Brilliant, ${childName}!\n\nThat is correct.\n\nReady for the next one?`, { showNext:true });
            return;
          } else {
            streakWrong += 1;
            streakCorrect = 0;

            await insertSessionItem({
              item_type: "feedback",
              prompt_text: currentQuestion.displayText,
              child_text: text,
              is_correct: false,
              meta: { subject, area, difficultyLevel, guided: true, step: guided.idx+1 }
            });

            await recordAttemptToSkill({ isCorrect: false, meta: { guided: true, step: guided.idx+1 } });
            await updateSessionRollups();

            addBotMessage(`Good try, ${childName}.\n\nLet’s do the same step again.\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${step.prompt}`);
            return;
          }
        }

        // Normal marking
        const n = parseChildNumber(text);
        const correct = (n !== null && Math.abs(n - currentQuestion.correctAnswer) < 1e-9);

        if (correct) {
          questionsAnswered += 1;
          correctCount += 1;
          streakCorrect += 1;
          streakWrong = 0;

          maybeAwardBadge();
          updateProgressUI();

          await insertSessionItem({
            item_type: "feedback",
            prompt_text: currentQuestion.displayText,
            child_text: text,
            is_correct: true,
            meta: { subject, area, difficultyLevel }
          });

          await recordAttemptToSkill({ isCorrect: true, meta: {} });
          await updateSessionRollups();

          const reply = await giveMathFeedback_AI(currentQuestion, text);

          if (sessionComplete()) {
            addBotMessage(reply);
            endSessionUI();
            return;
          }

          waitingForNextButton = true;
          addBotMessage(reply, { showNext:true });
          return;
        }

        // Incorrect => guided steps
        streakWrong += 1;
        streakCorrect = 0;

        await insertSessionItem({
          item_type: "feedback",
          prompt_text: currentQuestion.displayText,
          child_text: text,
          is_correct: false,
          meta: { subject, area, difficultyLevel }
        });

        await recordAttemptToSkill({ isCorrect: false, meta: {} });
        await updateSessionRollups();

        const steps = buildGuidedSteps(currentQuestion);
        if (steps.length) {
          guided.active = true;
          guided.steps = steps;
          guided.idx = 0;
          addBotMessage(`Good try, ${childName}.\n\nLet’s go slowly.\n\nStep 1 of ${guided.steps.length}:\n\n${guided.steps[0].prompt}`);
          return;
        }

        addBotMessage("Good try.\n\nLet’s try again.\n\nWhat do you think the answer is?", { showHint:true });
        return;
      }

      // ---------------- English ----------------
      if (subject === "English") {
        questionsAnswered += 1;
        updateProgressUI();

        await insertSessionItem({
          item_type: "turn",
          prompt_text: `English: ${area}`,
          child_text: text,
          is_correct: null,
          meta: { subject, area, difficultyLevel }
        });

        try {
          if (skillRow?.id) {
            const total_attempts = (skillRow.total_attempts || 0) + 1;
            const correct_attempts = (skillRow.correct_attempts || 0);
            const accuracy = total_attempts ? (correct_attempts / total_attempts) : 0.0;
            const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;
            const confidence = Math.max(0, Math.min(1, oldConf * 0.90 + 0.10 * 0.55));

            const { data } = await sb
              .from("child_skill_progress")
              .update({
                total_attempts,
                accuracy,
                confidence,
                last_session_id: sessionDbId || null,
                last_seen_at: new Date().toISOString()
              })
              .eq("id", skillRow.id)
              .select("*")
              .single();

            if (data) skillRow = data;
            updateProgressUI();
          }
        } catch (e) { console.error(e); }

        await updateSessionRollups();

        const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

The child replied: "${text}"

Respond with short, clear help.
Use very simple words.
Dyslexia-friendly spacing (short lines).
Give one next step only.
End with a gentle question.
British English.
`;
        const reply = await callBackend(prompt);
        addBotMessage(reply);

        if (sessionComplete()) endSessionUI();
      }
    }

    // ---------------- Calculator wiring ----------------
    function setupCalculator() {
      const btns = Array.from(document.querySelectorAll(".calcBtn"));
      btns.forEach(b => {
        b.addEventListener("click", () => {
          const val = b.textContent;
          if (val === "C") return;
          input.value += val;
          input.focus();
        });
      });
      document.getElementById("calcClearBtn").addEventListener("click", () => {
        input.value = "";
        input.focus();
      });
    }

    // ---------------- Auth + child loading ----------------
    async function requireAuth() {
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) {
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    function getSelectedChildFromLocalStorage() {
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    async function loadChildProfile() {
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id) {
        showError("No child selected. Go to Dashboard and click Select on a child.");
        addBotMessage("I can’t find a child profile yet.\n\nPlease go back to the Dashboard and select a child.");
        showActionButtons([{ label: "Go to Dashboard", onClick: () => window.location.href = "/dash.html" }]);
        disableInput(true);
        subjectSelection.style.display = "none";
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data) {
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        disableInput(true);
        return false;
      }

      if (data.parent_user_id !== currentUser.id) {
        showError("This child profile does not belong to this account. Please re-select a child.");
        disableInput(true);
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);

      clearError();
      disableInput(false);

      addBotMessage(`👋 Hi ${childName}!\n\nI’ll help you in a calm, step-by-step way.\n\nWhat are we working on today?`);
      subjectSelection.style.display = "block";
      return true;
    }

    // ---------------- Logout ----------------
    logoutBtn.addEventListener("click", async () => {
      stopTtsAudio();
      try { window.speechSynthesis.cancel(); } catch {}
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    // ---------------- Buttons ----------------
    mathsBtn.addEventListener("click", () => { addUserMessage("Maths"); selectSubject("Maths"); });
    englishBtn.addEventListener("click", () => { addUserMessage("English"); selectSubject("English"); });
    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keypress", e => { if (e.key === "Enter") handleSend(); });

    // ---------------- Init ----------------
    (async () => {
      if (!sb) { showError("Supabase did not load."); return; }
      setupCalculator();
      disableInput(false);

      const ok = await requireAuth();
      if (!ok) return;

      await loadChildProfile();
    })();
  })();
  </script>
</body>
</html>
