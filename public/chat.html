<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Tutor</title>

  <!-- App CSS -->
  <link rel="stylesheet" href="/assets/css/app.css" />

  <!-- Minimal fallback styles (if app.css path breaks) -->
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .container { max-width: 980px; margin: 0 auto; padding: 18px; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; }
    .brand img { height:34px; width:auto; display:block; }
    .links { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .links a { text-decoration:none; color:#111; padding:10px 12px; border-radius:12px; }
    .links a.active { background:#eef2ff; }
    .btn { background:#0b5cff; border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; }
    .btn.light { background:#e5e7eb; color:#111; }
    .muted { color:#6b7280; font-size: 14px; }
    .status { margin-top:10px; font-size:14px; }
    .status.bad { color:#dc2626; }
    .status.good { color:#16a34a; }

    /* Chat bubbles (kept like your current build) */
    .msg { padding:14px 16px; margin-bottom:14px; border-radius:16px; max-width:85%;
      font-size:18px; line-height:1.85; white-space:pre-wrap;
      font-family:'OpenDyslexic', Arial, sans-serif;
      overflow-wrap:break-word; display:inline-block; }
    .msg.user { background:#0b5cff; color:#fff; margin-left:auto; text-align:right; }
    .msg.bot  { background:#fef3c7; color:#000; margin-right:auto; }

    .bot-controls { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn-small { border:none; border-radius:10px; padding:6px 12px; font-size:14px; cursor:pointer; color:#fff; }
    .speak-btn { background:#0b5cff; }
    .hint-btn  { background:#10b981; }
    .next-btn  { background:#7c3aed; }

    .calcBtn { padding:14px; font-size:18px; border-radius:10px; border:none; background:#fff; cursor:pointer; }
  </style>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- OpenDyslexic font (optional) -->
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a class="active" href="/chat.html">Learnlio Tutor</a>
        <a href="/screener.html">Dyslexia Screener</a>
        <a href="/reports.html">Reports</a>
        <button id="logoutBtn" class="btn light" type="button">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div id="pageError" class="status bad" style="display:none;"></div>

      <!-- Progress header -->
      <div id="progress-header" style="display:none; margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <div id="progress-label" style="font-family:'OpenDyslexic', Arial, sans-serif; font-size:14px; color:#333;">Progress: 0 / 0</div>
          <div id="badge-label" style="font-family:'OpenDyslexic', Arial, sans-serif; font-size:14px; color:#333;">Badges: —</div>
        </div>
        <div style="height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:8px;">
          <div id="progress-bar" style="height:10px; width:0%; background:#10b981;"></div>
        </div>
      </div>

      <div id="messages" style="
        background:#fafafa; border-radius:14px; padding:12px; border:1px solid #ddd;
        max-height:520px; overflow-y:auto; margin-bottom:12px;
        display:flex; flex-direction:column; align-items:flex-start;
      "></div>

      <div id="typing-indicator" style="display:none; margin-bottom:10px; font-style:italic; color:#555;">
        Learnlio AI is typing…
      </div>

      <!-- Calculator (shows after Maths area selected) -->
      <div id="calculator" style="display:none; margin-bottom:12px; background:#eef2ff; padding:10px; border-radius:14px;">
        <div class="calc-grid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;">
          <button type="button" class="calcBtn">7</button>
          <button type="button" class="calcBtn">8</button>
          <button type="button" class="calcBtn">9</button>
          <button type="button" class="calcBtn">÷</button>

          <button type="button" class="calcBtn">4</button>
          <button type="button" class="calcBtn">5</button>
          <button type="button" class="calcBtn">6</button>
          <button type="button" class="calcBtn">×</button>

          <button type="button" class="calcBtn">1</button>
          <button type="button" class="calcBtn">2</button>
          <button type="button" class="calcBtn">3</button>
          <button type="button" class="calcBtn">−</button>

          <button type="button" class="calcBtn">0</button>
          <button type="button" id="calcClearBtn" class="calcBtn">C</button>
          <button type="button" class="calcBtn">+</button>
          <button type="button" class="calcBtn">=</button>
        </div>
      </div>

      <!-- Subject selection -->
      <div id="subject-selection" style="display:none;">
        <p class="muted" style="margin:0 0 10px;">Select a subject to start:</p>
        <button class="btn" id="mathsBtn" type="button">Maths</button>
        <button class="btn" id="englishBtn" type="button">English</button>
      </div>

      <!-- Area selection / Action buttons -->
      <div id="area-selection" style="display:none; margin-top:10px;"></div>

      <!-- Input -->
      <div id="input-container" style="display:flex; gap:10px; margin-top:10px;">
        <input id="input" placeholder="Type your answer here…"
          style="flex:1; padding:14px; font-size:16px; border-radius:12px; border:1px solid #ccc;" />
        <button id="sendBtn" type="button"
          style="padding:14px 18px; font-size:16px; border-radius:12px; border:none; background:#0b5cff; color:#fff; cursor:pointer;">
          Send
        </button>
      </div>
    </div>
  </main>

  <script>
  (() => {
    // =========================
    // CONFIG (PASTE YOUR VALUES)
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const BACKEND_URL = "https://softr-chat-backend.onrender.com";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const pageError = document.getElementById("pageError");
    const logoutBtn = document.getElementById("logoutBtn");

    const progressHeader = document.getElementById("progress-header");
    const progressLabel  = document.getElementById("progress-label");
    const badgeLabel     = document.getElementById("badge-label");
    const progressBar    = document.getElementById("progress-bar");

    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const messagesDiv = document.getElementById("messages");
    const calculator = document.getElementById("calculator");
    const subjectSelection = document.getElementById("subject-selection");
    const areaSelection = document.getElementById("area-selection");
    const typingIndicator = document.getElementById("typing-indicator");

    const mathsBtn = document.getElementById("mathsBtn");
    const englishBtn = document.getElementById("englishBtn");

    // Auth + child
    let currentUser = null;
    let child = null; // { id, child_name, child_dob, parent_user_id }
    let childName = "";
    let childAge = 10;

    // Tutor state
    let subject = null; // "Maths" | "English"
    let area = null;

    // Deterministic question checking
    let currentQuestion = null; // { displayText, correctAnswer }
    let hintUsedForCurrent = false;
    let waitingForNextButton = false;
    let guided = { active:false, steps:[], idx:0 };

    // Session/progress UI state (per session)
    let maxQuestions = 10;
    let questionsAnswered = 0; // completed questions (Maths only when correct; English counts turns)
    let correctCount = 0;      // Maths correct count
    let badges = [];
    let sessionLog = [];

    // Progress persistence (per child+subject+area)
    // difficulty_level: 1..5
    // rolling_correct: 0..10 (we store a rolling window length indicator)
    let difficultyLevel = 1;
    let rollingCorrect = 0; // 0..10
    let weakTags = [];      // text array

    // Session aggregation (persist into sessions at end)
    let sessionStartedAt = new Date();
    let attemptedThisSession = 0;
    let correctThisSession = 0;

    function showError(msg) {
      pageError.style.display = "block";
      pageError.textContent = msg;
    }
    function clearError() {
      pageError.style.display = "none";
      pageError.textContent = "";
    }

    function nowTs() { return new Date().toLocaleString("en-GB"); }

    function disableInput(disabled) {
      input.disabled = disabled;
      sendBtn.disabled = disabled;
      sendBtn.style.opacity = disabled ? "0.6" : "1";
      input.style.opacity = disabled ? "0.6" : "1";
    }

    function cleanBotText(t) {
      return String(t || "").replace(/\*\*/g, "");
    }

    function addUserMessage(text) {
      const div = document.createElement("div");
      div.className = "msg user";
      div.innerText = String(text || "").trim();
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text || ""));
      u.lang = "en-GB";
      u.rate = 0.9;
      u.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices() || [];
      const preferred = voices.find(v => (v.lang || "").toLowerCase().startsWith("en-gb")) ||
                        voices.find(v => (v.lang || "").toLowerCase().startsWith("en"));
      if (preferred) u.voice = preferred;

      window.speechSynthesis.speak(u);
    }

    function addBotMessage(text, opts={showHint:false, showNext:false}) {
      const safeText = cleanBotText(text);

      const div = document.createElement("div");
      div.className = "msg bot";

      const content = document.createElement("div");
      content.innerText = safeText;
      div.appendChild(content);

      const controls = document.createElement("div");
      controls.className = "bot-controls";

      const speakBtn = document.createElement("button");
      speakBtn.type = "button";
      speakBtn.className = "btn-small speak-btn";
      speakBtn.innerText = "🔊 Listen";
      speakBtn.onclick = () => speak(safeText);
      controls.appendChild(speakBtn);

      if (opts.showHint) {
        const hintBtn = document.createElement("button");
        hintBtn.type = "button";
        hintBtn.className = "btn-small hint-btn";
        hintBtn.innerText = "💡 Hint";
        hintBtn.onclick = () => requestHint();
        controls.appendChild(hintBtn);
      }

      if (opts.showNext) {
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn-small next-btn";
        nextBtn.innerText = "➡️ Next question";
        nextBtn.onclick = () => handleNextQuestion();
        controls.appendChild(nextBtn);
      }

      div.appendChild(controls);

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function callBackend(promptText) {
      try {
        typingIndicator.style.display = "block";
        const response = await axios.post(
          BACKEND_URL,
          {
            userId: currentUser?.id || "guest",
            messages: [{ role: "user", content: promptText }],
            subject,
            childName,
            childAge: String(childAge)
          }
        );
        typingIndicator.style.display = "none";
        return response.data.reply;
      } catch (err) {
        typingIndicator.style.display = "none";
        return "Sorry, I couldn’t connect right now. Please try again.";
      }
    }

    // --------------------------
    // Age + limits
    // --------------------------
    function computeAgeFromDob(dobStr) {
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function computeMaxQuestions() {
      const a = childAge;
      if (a <= 7) return 5;
      if (a <= 10) return 8;
      if (a <= 13) return 10;
      return 12;
    }

    function resetSessionProgress() {
      maxQuestions = computeMaxQuestions();
      questionsAnswered = 0;
      correctCount = 0;
      badges = [];
      sessionLog = [];
      attemptedThisSession = 0;
      correctThisSession = 0;
      sessionStartedAt = new Date();
      updateProgressUI();
    }

    function sessionComplete() {
      return questionsAnswered >= maxQuestions;
    }

    function updateProgressUI() {
      progressHeader.style.display = "block";
      progressLabel.innerText = `Progress: ${questionsAnswered} / ${maxQuestions}`;
      badgeLabel.innerText = `Badges: ${badges.length ? badges.join(" ") : "—"}`;
      const pct = maxQuestions ? Math.min(100, Math.round((questionsAnswered / maxQuestions) * 100)) : 0;
      progressBar.style.width = pct + "%";
    }

    function maybeAwardBadge() {
      if (correctCount === 3 && !badges.includes("⭐")) badges.push("⭐");
      if (correctCount === 5 && !badges.includes("🏅")) badges.push("🏅");
      if (correctCount === 10 && !badges.includes("🏆")) badges.push("🏆");
    }

    function maybeRewardMessage() {
      // only AFTER completing a question
      if (questionsAnswered === 1) addBotMessage("🌟 Nice start! You’re doing really well.");
      if (questionsAnswered === Math.ceil(maxQuestions/2)) addBotMessage("🔥 Halfway there! Keep going!");
      if (correctCount === 3 && badges.includes("⭐")) addBotMessage("⭐ Badge unlocked: Star Helper!");
      if (correctCount === 5 && badges.includes("🏅")) addBotMessage("🏅 Badge unlocked: Steady Learner!");
      if (correctCount === 10 && badges.includes("🏆")) addBotMessage("🏆 Badge unlocked: Learning Champion!");
    }

    // --------------------------
    // Supabase persistence helpers
    // --------------------------
    async function loadChildProgress() {
      // loads progress for current child + selected subject/area (when set)
      if (!child?.id || !subject || !area) return;

      const { data, error } = await sb
        .from("child_progress")
        .select("difficulty_level, rolling_correct, weak_tags")
        .eq("child_id", child.id)
        .eq("subject", subject)
        .eq("area", area)
        .maybeSingle();

      if (error) {
        // don't block tutor for this
        console.warn("Progress load error:", error.message);
        return;
      }

      if (data) {
        difficultyLevel = clampInt(data.difficulty_level ?? 1, 1, 5);
        rollingCorrect = clampInt(data.rolling_correct ?? 0, 0, 10);
        weakTags = Array.isArray(data.weak_tags) ? data.weak_tags : (data.weak_tags ? [String(data.weak_tags)] : []);
      } else {
        difficultyLevel = 1;
        rollingCorrect = 0;
        weakTags = [];
      }
    }

    async function saveChildProgress() {
      if (!child?.id || !subject || !area) return;

      const payload = {
        child_id: child.id,
        subject,
        area,
        difficulty_level: difficultyLevel,
        rolling_correct: rollingCorrect,
        weak_tags: weakTags,
        updated_at: new Date().toISOString()
      };

      const { error } = await sb
        .from("child_progress")
        .upsert(payload, { onConflict: "child_id,subject,area" });

      if (error) console.warn("Progress save error:", error.message);
    }

    async function saveSessionRow(finalNotes) {
      if (!child?.id || !subject) return;

      // If no activity, don’t spam sessions
      if (attemptedThisSession <= 0 && sessionLog.length <= 0) return;

      const payload = {
        child_id: child.id,
        subject,
        area: area || null,
        questions_attempted: attemptedThisSession,
        questions_correct: correctThisSession,
        notes: finalNotes || null
      };

      const { error } = await sb.from("sessions").insert(payload);
      if (error) console.warn("Session insert error:", error.message);
    }

    function clampInt(n, min, max) {
      n = parseInt(n, 10);
      if (isNaN(n)) n = min;
      return Math.max(min, Math.min(max, n));
    }

    function updateRollingCorrect(isCorrect) {
      // rolling window length capped at 10
      // simplest: treat rollingCorrect as "score out of 10" drifting up/down
      if (isCorrect) rollingCorrect = Math.min(10, rollingCorrect + 1);
      else rollingCorrect = Math.max(0, rollingCorrect - 1);
    }

    function adjustDifficultyAfterQuestion(isCorrect) {
      // Keep changes gentle and age-safe
      updateRollingCorrect(isCorrect);

      // Increase difficulty if doing well, decrease if struggling
      if (rollingCorrect >= 8 && isCorrect) {
        difficultyLevel = Math.min(5, difficultyLevel + 1);
        rollingCorrect = 5; // reset to avoid rapid jumps
      } else if (rollingCorrect <= 2 && !isCorrect) {
        difficultyLevel = Math.max(1, difficultyLevel - 1);
        rollingCorrect = 5;
      }
    }

    function addWeakTagIfNeeded() {
      // light tagging; you can refine later
      if (!area) return;
      const tag = `${subject}:${area}`;
      if (!weakTags.includes(tag)) weakTags.push(tag);
      if (weakTags.length > 10) weakTags = weakTags.slice(-10);
    }

    // --------------------------
    // Maths generation (difficulty-aware but age-safe)
    // --------------------------
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function getRangeForAgeAndDifficulty() {
      // base age range
      let min = 0, max = 10;
      if (childAge <= 7) { min = 0; max = 10; }
      else if (childAge <= 9) { min = 5; max = 30; }
      else if (childAge <= 11) { min = 10; max = 80; }
      else { min = 20; max = 200; }

      // difficulty scales within the age band (never exceeds safe max)
      const level = clampInt(difficultyLevel, 1, 5);
      const span = Math.max(5, max - min);
      const bump = Math.floor(span * (level - 1) * 0.12); // gentle
      const newMin = Math.max(0, min + Math.floor(bump * 0.4));
      const newMax = Math.max(newMin + 5, Math.min(max, max - Math.floor(bump * 0.2)));
      return { min: newMin, max: newMax };
    }

    function generateMathQuestion() {
      const { min, max } = getRangeForAgeAndDifficulty();

      if (area === "Addition") {
        const x = randInt(min, max);
        const y = randInt(min, max);
        return { displayText: `${x} + ${y} = ?`, correctAnswer: x + y };
      }

      if (area === "Subtraction") {
        let x = randInt(min, max);
        let y = randInt(min, max);
        if (y > x) [x, y] = [y, x];
        return { displayText: `${x} - ${y} = ?`, correctAnswer: x - y };
      }

      if (area === "Multiplication") {
        const tableMaxBase = childAge <= 7 ? 5 : childAge <= 9 ? 8 : 12;
        const level = clampInt(difficultyLevel, 1, 5);
        const tableMax = Math.min(12, tableMaxBase + Math.floor((level - 1) / 2)); // gentle
        const x = randInt(2, tableMax);
        let y = randInt(2, tableMax);
        if (y === x) y = randInt(2, tableMax);
        return { displayText: `${x} × ${y} = ?`, correctAnswer: x * y };
      }

      if (area === "Division") {
        const divMaxBase = childAge <= 7 ? 5 : childAge <= 9 ? 8 : 12;
        const level = clampInt(difficultyLevel, 1, 5);
        const divMax = Math.min(12, divMaxBase + Math.floor((level - 1) / 2));
        const divisor = randInt(2, divMax);
        const quotient = randInt(2, divMax);
        const dividend = divisor * quotient;
        return { displayText: `${dividend} ÷ ${divisor} = ?`, correctAnswer: quotient };
      }

      return null;
    }

    function parseChildNumber(text) {
      const m = String(text || "").match(/-?\d+(\.\d+)?/);
      if (!m) return null;
      return Number(m[0]);
    }

    function showMathQuestion(q) {
      guided.active = false;
      guided.steps = [];
      guided.idx = 0;
      hintUsedForCurrent = false;
      waitingForNextButton = false;

      const intro = (childAge <= 7)
        ? `✏️ New question:\n\n${q.displayText}\n\nTake your time.\n\nWhat do you think?`
        : `✏️ Question:\n\n${q.displayText}\n\nTake your time.\nWhat do you think the answer is?`;

      addBotMessage(intro, { showHint:true, showNext:false });
    }

    function shortLineBreaks(text) {
      return String(text || "").replace(/\.\s+/g, ".\n\n");
    }

    function buildGuidedSteps(q) {
      const raw = q.displayText.replace("= ?", "").trim();
      let op = null;
      if (raw.includes("+")) op = "+";
      else if (raw.includes("-")) op = "-";
      else if (raw.includes("×")) op = "×";
      else if (raw.includes("÷")) op = "÷";
      if (!op) return [];

      const parts = raw.split(op).map(s => parseInt(s.trim(), 10));
      const a = parts[0], b = parts[1];
      if (Number.isNaN(a) || Number.isNaN(b)) return [];

      // Younger: counting style
      if (childAge <= 7) {
        if (op === "+") return [{ prompt: shortLineBreaks(`Start at ${a}.\nCount up ${b}.\n\nWhat number do you land on?`), expected: a+b }];
        if (op === "-") return [{ prompt: shortLineBreaks(`Start at ${a}.\nCount back ${b}.\n\nWhere do you land?`), expected: a-b }];
        if (op === "×") return [{ prompt: shortLineBreaks(`${a} × ${b} means add ${a}, ${b} times.\n\nWhat do you get?`), expected: a*b }];
        if (op === "÷") return [{ prompt: shortLineBreaks(`How many groups of ${b} fit into ${a}?\n\nWhat do you get?`), expected: a/b }];
      }

      // Older: still calm, still step-by-step prompt
      return [{ prompt: shortLineBreaks(`Let’s go slowly.\n\nTry working it out.\n\nWhat answer do you get?`), expected: q.correctAnswer }];
    }

    async function requestHint() {
      if (!currentQuestion) {
        addBotMessage("I can give a hint once you have a question on the screen. 😊");
        return;
      }
      if (guided.active) {
        addBotMessage("We’re already doing this step by step.\n\nTry the step on the screen first. 😊");
        return;
      }
      if (hintUsedForCurrent) {
        addBotMessage("You’ve already got the hint for this one.\n\nHave another try! 😊");
        return;
      }
      hintUsedForCurrent = true;

      const hintPrompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}
The child wants a hint for: "${currentQuestion.displayText}"

Give ONE short hint only.
Use very simple words.
Do NOT give the final answer.
End with a gentle question.
`;
      const hintReply = await callBackend(hintPrompt);
      addBotMessage(hintReply);
    }

    async function giveMathFeedback_AI(q, childAnswerText) {
      const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
Maths area: ${area}

Question: "${q.displayText}"
Child answered: "${childAnswerText}"
Correct answer: ${q.correctAnswer}

Write a short response:
- Praise (1 short sentence).
- Give one tiny explanation step (1 short sentence).
- End with: "Ready for the next one?"
- Do NOT ask a new question.
British English.
Short sentences.
`;
      return await callBackend(prompt);
    }

    function handleNextQuestion() {
      if (!waitingForNextButton) return;
      if (sessionComplete()) {
        waitingForNextButton = false;
        endSessionUI();
        return;
      }
      waitingForNextButton = false;
      currentQuestion = generateMathQuestion();
      if (!currentQuestion) {
        addBotMessage("Sorry — I couldn’t make a new question right now. Please try again.");
        return;
      }
      showMathQuestion(currentQuestion);
    }

    function showActionButtons(buttons) {
      areaSelection.innerHTML = "";
      buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";
        btn.style.marginRight = "8px";
        btn.style.marginBottom = "8px";
        btn.innerText = b.label;
        btn.addEventListener("click", b.onClick);
        areaSelection.appendChild(btn);
      });
      areaSelection.style.display = "block";
    }

    async function endSessionUI() {
      // Save a session record before UI locks
      const notes = buildSessionNotes();
      await saveSessionRow(notes);
      await saveChildProgress();

      calculator.style.display = "none";
      waitingForNextButton = false;
      currentQuestion = null;
      hintUsedForCurrent = false;
      guided.active = false;
      guided.steps = [];
      guided.idx = 0;

      addBotMessage(`✅ That’s the end for today, ${childName}.\n\nYou did really well.`);

      const nextSubject = (subject === "Maths") ? "English" : "Maths";

      showActionButtons([
        {
          label: `Try ${nextSubject} next`,
          onClick: async () => {
            addUserMessage(`Try ${nextSubject}`);
            areaSelection.style.display = "none";
            disableInput(false);

            // Save current session before switching
            const notes = buildSessionNotes();
            await saveSessionRow(notes);
            await saveChildProgress();

            selectSubject(nextSubject);
          }
        },
        {
          label: "Finished for today ✅",
          onClick: async () => {
            addUserMessage("Finished for today");
            areaSelection.style.display = "none";

            // Save final session again (safe)
            const notes = buildSessionNotes();
            await saveSessionRow(notes);
            await saveChildProgress();

            showFinishOptions();
          }
        }
      ]);

      disableInput(true);
    }

    function showFinishOptions() {
      addBotMessage("Would you like a parent summary?");

      showActionButtons([
        {
          label: "Download parent summary (PDF) 📄",
          onClick: () => {
            addUserMessage("Download parent summary (PDF)");
            areaSelection.style.display = "none";
            downloadParentSummaryPDF();
          }
        },
        {
          label: "Start a new session 🔄",
          onClick: async () => {
            addUserMessage("Start a new session");
            areaSelection.style.display = "none";

            // save before reset
            const notes = buildSessionNotes();
            await saveSessionRow(notes);
            await saveChildProgress();

            resetSessionProgress();
            progressHeader.style.display = "none";
            subject = null; area = null;
            disableInput(false);
            addBotMessage(`What would you like to work on now, ${childName}?`);
            subjectSelection.style.display = "block";
          }
        }
      ]);
    }

    function buildSessionNotes() {
      const top = [];
      top.push(`Child: ${childName} (age ${childAge})`);
      top.push(`Subject: ${subject || "-"}`);
      top.push(`Area: ${area || "-"}`);
      top.push(`Difficulty level: ${difficultyLevel}`);
      if (subject === "Maths") {
        top.push(`Attempted: ${attemptedThisSession}, Correct: ${correctThisSession}`);
      } else {
        top.push(`Turns: ${attemptedThisSession}`);
      }
      if (weakTags?.length) top.push(`Weak tags: ${weakTags.join(", ")}`);
      if (badges?.length) top.push(`Badges: ${badges.join(" ")}`);
      return top.join(" | ");
    }

    function downloadParentSummaryPDF() {
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 14;

        doc.setFontSize(18);
        doc.text("Learnlio Parent Summary", 14, y); y += 10;

        doc.setFontSize(12);
        doc.text(`Child: ${childName}`, 14, y); y += 7;
        doc.text(`Age: ${childAge}`, 14, y); y += 7;
        doc.text(`Subject: ${subject || "-"}`, 14, y); y += 7;
        doc.text(`Area: ${area || "-"}`, 14, y); y += 7;
        doc.text(`Date: ${nowTs()}`, 14, y); y += 10;

        doc.text(`Questions completed: ${questionsAnswered} / ${maxQuestions}`, 14, y); y += 7;
        if (subject === "Maths") { doc.text(`Correct answers: ${correctCount}`, 14, y); y += 7; }
        doc.text(`Difficulty level: ${difficultyLevel}`, 14, y); y += 7;
        doc.text(`Badges: ${badges.length ? badges.join(" ") : "None"}`, 14, y); y += 10;

        doc.setFontSize(13);
        doc.text("Suggested next steps:", 14, y); y += 8;
        doc.setFontSize(12);

        const plan = (subject === "Maths")
          ? [
              "1) Practise number facts for 5 minutes (calm and slow).",
              "2) Do 3 easy questions, then 2 medium questions.",
              "3) Encourage step-by-step working."
            ]
          : [
              "1) Read together for 10 minutes (short, calm paragraphs).",
              "2) Practise 5 spellings using “look, cover, write, check”.",
              "3) Write 3 short sentences using one new word."
            ];
        plan.forEach(line => { doc.text(line, 14, y); y += 7; });

        y += 6;
        doc.text("Session notes:", 14, y); y += 7;

        const lines = [];
        for (const entry of sessionLog.slice(0, 12)) {
          const q = entry.question ? `Q: ${entry.question}` : "";
          const a = entry.childAnswer ? `A: ${entry.childAnswer}` : "";
          const c = (subject === "Maths" && entry.correct !== null) ? `(${entry.correct ? "Correct" : "Try again"})` : "";
          const line = `${q} ${a} ${c}`.trim();
          if (line) lines.push(line);
        }
        if (!lines.length) lines.push("No detailed log saved.");

        lines.forEach(line => {
          const wrapped = doc.splitTextToSize(line, 180);
          wrapped.forEach(w => {
            if (y > 280) { doc.addPage(); y = 14; }
            doc.text(w, 14, y);
            y += 6;
          });
        });

        doc.save(`Learnlio-Parent-Summary-${childName || "Child"}.pdf`);
        addBotMessage("✅ Download started.\n\nWould you like to start a new session?");
      } catch (e) {
        addBotMessage("Sorry — I couldn’t create the PDF on this device/browser.\n\nPlease try another browser.");
      }
    }

    // --------------------------
    // Selection UIs
    // --------------------------
    function showAreaSelection(options) {
      areaSelection.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";
        btn.style.marginRight = "8px";
        btn.style.marginBottom = "8px";
        btn.innerText = opt.label;

        btn.addEventListener("click", async () => {
          addUserMessage(opt.label);
          areaSelection.style.display = "none";

          // end any running session cleanly before switching area
          await saveSessionRow(buildSessionNotes());
          await saveChildProgress();

          area = opt.area;

          // load progress for this child/subject/area (important!)
          await loadChildProgress();

          resetSessionProgress();
          disableInput(false);

          guided.active = false;
          guided.steps = [];
          guided.idx = 0;

          if (subject === "Maths") {
            calculator.style.display = "block";
            currentQuestion = generateMathQuestion();
            showMathQuestion(currentQuestion);
          } else {
            calculator.style.display = "none";
            currentQuestion = null;

            const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

Start ONE simple activity (not a list).
Keep it dyslexia-friendly.
End with a gentle question to begin.
British English.
Short sentences.
`;
            const reply = await callBackend(prompt);
            addBotMessage(reply);
          }
        });

        areaSelection.appendChild(btn);
      });
      areaSelection.style.display = "block";
    }

    async function selectSubject(selected) {
      // save prior session when switching
      await saveSessionRow(buildSessionNotes());
      await saveChildProgress();

      subject = selected;
      subjectSelection.style.display = "none";
      areaSelection.style.display = "none";
      disableInput(false);

      area = null;
      currentQuestion = null;
      waitingForNextButton = false;
      hintUsedForCurrent = false;
      guided.active = false;
      guided.steps = [];
      guided.idx = 0;

      progressHeader.style.display = "none";
      calculator.style.display = "none";

      // reset session aggregation
      resetSessionProgress();

      if (selected === "Maths") {
        addBotMessage("✏️ Great!\n\nWhich Maths area would you like to try first?");
        showAreaSelection([
          { label: "Addition ➕", area: "Addition" },
          { label: "Subtraction ➖", area: "Subtraction" },
          { label: "Multiplication ✖️", area: "Multiplication" },
          { label: "Division ➗", area: "Division" }
        ]);
      } else {
        addBotMessage("📚 Great!\n\nWhich English area would you like to practise?");
        showAreaSelection([
          { label: "Reading aloud 📖", area: "Reading" },
          { label: "Spelling 📝", area: "Spelling" },
          { label: "Sentence building ✍️", area: "Sentence building" },
          { label: "Fun word games 🎲", area: "Word games" }
        ]);
      }
    }

    // --------------------------
    // Main send handler
    // --------------------------
    async function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      if (input.disabled) return;

      addUserMessage(text);
      input.value = "";

      if (!subject) {
        addBotMessage("Please choose Maths or English using the buttons below.");
        subjectSelection.style.display = "block";
        return;
      }

      // Maths
      if (subject === "Maths") {
        if (!area || !currentQuestion) {
          addBotMessage("Please choose a Maths area first using the buttons.");
          return;
        }

        if (sessionComplete()) {
          await endSessionUI();
          return;
        }

        attemptedThisSession += 1;

        // Guided steps
        if (guided.active) {
          const n = parseChildNumber(text);
          const step = guided.steps[guided.idx];
          const ok = (n !== null && Math.abs(n - step.expected) < 1e-9);

          sessionLog.push({ ts: nowTs(), subject, area, question: `[Guided step ${guided.idx+1}/${guided.steps.length}]`, childAnswer: text, correct: ok });

          if (ok) {
            guided.idx += 1;

            if (guided.idx < guided.steps.length) {
              addBotMessage(`✅ Nice work!\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${guided.steps[guided.idx].prompt}`);
              return;
            }

            // Completed guided path = correct
            guided.active = false;
            guided.steps = [];
            guided.idx = 0;

            questionsAnswered += 1;
            correctCount += 1;
            correctThisSession += 1;

            maybeAwardBadge();
            updateProgressUI();
            maybeRewardMessage();

            // difficulty adapts
            adjustDifficultyAfterQuestion(true);
            await saveChildProgress();

            sessionLog.push({ ts: nowTs(), subject, area, question: currentQuestion.displayText, childAnswer: "(completed via guided steps)", correct: true });

            if (sessionComplete()) { await endSessionUI(); return; }

            waitingForNextButton = true;
            addBotMessage(`Brilliant, ${childName}!\n\nThat is correct.\n\nReady for the next one?`, { showNext:true });
            return;
          } else {
            // incorrect guided step
            addWeakTagIfNeeded();
            adjustDifficultyAfterQuestion(false);
            await saveChildProgress();

            addBotMessage(`Good try, ${childName}.\n\nLet’s do the same step again.\n\nStep ${guided.idx+1} of ${guided.steps.length}:\n\n${step.prompt}`);
            return;
          }
        }

        // Normal marking
        const n = parseChildNumber(text);
        const isCorrect = (n !== null && Math.abs(n - currentQuestion.correctAnswer) < 1e-9);

        sessionLog.push({ ts: nowTs(), subject, area, question: currentQuestion.displayText, childAnswer: text, correct: isCorrect });

        if (isCorrect) {
          questionsAnswered += 1;
          correctCount += 1;
          correctThisSession += 1;

          maybeAwardBadge();
          updateProgressUI();
          maybeRewardMessage();

          // adapt & save
          adjustDifficultyAfterQuestion(true);
          await saveChildProgress();

          const reply = await giveMathFeedback_AI(currentQuestion, text);

          if (sessionComplete()) {
            addBotMessage(reply);
            await endSessionUI();
            return;
          }

          waitingForNextButton = true;
          addBotMessage(reply, { showNext:true });
          return;
        }

        // Incorrect -> guided steps
        addWeakTagIfNeeded();
        adjustDifficultyAfterQuestion(false);
        await saveChildProgress();

        const steps = buildGuidedSteps(currentQuestion);
        if (steps.length) {
          guided.active = true;
          guided.steps = steps;
          guided.idx = 0;

          addBotMessage(`Good try, ${childName}.\n\nLet’s go slowly.\nOne small step at a time.\n\nStep 1 of ${guided.steps.length}:\n\n${guided.steps[0].prompt}`);
          return;
        }

        addBotMessage("Good try.\n\nLet’s try again.\n\nWhat do you think the answer is?", { showHint:true });
        return;
      }

      // English
      if (subject === "English") {
        if (!area) {
          addBotMessage("Please choose an English area first using the buttons.");
          return;
        }

        if (sessionComplete()) {
          await endSessionUI();
          return;
        }

        attemptedThisSession += 1;

        questionsAnswered += 1;
        updateProgressUI();

        // For English, we don’t mark correctness, but we can still “save progress”
        // (simple: difficulty stays, rollingCorrect unchanged)
        await saveChildProgress();

        sessionLog.push({ ts: nowTs(), subject, area, question: "(English turn)", childAnswer: text, correct: null });

        const prompt = `
You are Learnlio AI, a child-safe UK tutor.
Child: ${childName}, age ${childAge}
English area: ${area}

The child replied: "${text}"

Respond with short, clear help.
Use very simple words.
Keep it dyslexia-friendly (extra spacing, short lines).
Give one next step only.
End with a gentle question.
British English.
`;
        const reply = await callBackend(prompt);
        addBotMessage(reply);

        if (sessionComplete()) await endSessionUI();
      }
    }

    // --------------------------
    // Calculator wiring
    // --------------------------
    function setupCalculator() {
      const btns = Array.from(document.querySelectorAll(".calcBtn"));
      btns.forEach(b => {
        b.addEventListener("click", () => {
          const val = b.textContent;
          if (val === "C") return;
          input.value += val;
          input.focus();
        });
      });
      document.getElementById("calcClearBtn").addEventListener("click", () => {
        input.value = "";
        input.focus();
      });
    }

    // --------------------------
    // Auth + child loading
    // --------------------------
    async function requireAuth() {
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) {
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    function getSelectedChildFromLocalStorage() {
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    async function loadChildProfile() {
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id) {
        showError("No child selected. Please go to Dashboard and click Select on a child.");
        addBotMessage("I can’t find a child profile yet.\n\nPlease go back to the Dashboard and select a child.");
        showActionButtons([{ label: "Go to Dashboard", onClick: () => window.location.href = "/dash.html" }]);
        disableInput(true);
        subjectSelection.style.display = "none";
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data) {
        showError("Could not load child profile from database. Please re-select the child on Dashboard.");
        disableInput(true);
        return false;
      }

      if (data.parent_user_id !== currentUser.id) {
        showError("This child profile does not belong to this account. Please re-select a child on Dashboard.");
        disableInput(true);
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);

      clearError();
      disableInput(false);

      addBotMessage(`👋 Hi ${childName}!\n\nI’ll help you in a calm, step-by-step way.\n\nWhat are we working on today?`);
      subjectSelection.style.display = "block";
      return true;
    }

    // --------------------------
    // Logout
    // --------------------------
    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    // --------------------------
    // Buttons
    // --------------------------
    mathsBtn.addEventListener("click", async () => { addUserMessage("Maths"); await selectSubject("Maths"); });
    englishBtn.addEventListener("click", async () => { addUserMessage("English"); await selectSubject("English"); });

    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keypress", e => { if (e.key === "Enter") handleSend(); });

    // --------------------------
    // Init
    // --------------------------
    (async () => {
      if (!sb) { showError("Supabase did not load. Check the supabase script tag."); return; }

      setupCalculator();
      disableInput(false);

      const ok = await requireAuth();
      if (!ok) return;

      await loadChildProfile();
    })();
  })();
  </script>
</body>
</html>
