<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learnlio • Tutor</title>

  <!-- Dyslexia-friendly font -->
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --border:#e5e7eb;
      --shadow: 0 10px 24px rgba(15,23,42,.08);
      --blue:#2563eb;
      --pill:#eef2ff;
      --bot:#fef3c7;
      --max:1040px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'OpenDyslexic', Arial, sans-serif;
      line-height:1.7;
    }

    /* ===== TOP NAV ===== */
    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner{
      max-width:var(--max);
      margin:0 auto;
      padding:10px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:180px;
    }
    .brand img{
      height:34px;
      width:auto;
      border-radius:8px;
    }
    .brand span{
      font-size:14px;
      color:var(--muted);
    }
    .nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .nav a{
      text-decoration:none;
      background:var(--pill);
      border:1px solid #dbeafe;
      color:var(--text);
      padding:9px 12px;
      border-radius:12px;
      font-size:14px;
    }
    .nav a.active{
      background:var(--blue);
      border-color:var(--blue);
      color:#fff;
    }

    /* ===== PAGE ===== */
    .page{
      max-width:var(--max);
      margin:18px auto;
      padding:0 16px 28px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    /* ===== CHAT ===== */
    #messages{
      background:#fafafa;
      border-radius:14px;
      padding:12px;
      border:1px solid var(--border);
      max-height:460px;
      overflow-y:auto;
      margin-bottom:12px;
      display:flex;
      flex-direction:column;
    }

    .msg{
      padding:14px 16px;
      margin-bottom:14px;
      border-radius:16px;
      max-width:85%;
      font-size:17px;
      line-height:1.8;
      white-space:pre-wrap;
    }
    .user{
      background:var(--blue);
      color:#fff;
      margin-left:auto;
      text-align:right;
    }
    .bot{
      background:var(--bot);
      color:#000;
      margin-right:auto;
    }

    .bot-controls{
      margin-top:8px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn-small{
      border:none;
      border-radius:10px;
      padding:6px 12px;
      font-size:14px;
      cursor:pointer;
      color:#fff;
    }
    .speak-btn{ background:var(--blue); }
    .hint-btn{ background:#10b981; }
    .next-btn{ background:#7c3aed; }

    #typing{
      font-style:italic;
      color:#555;
      margin-bottom:10px;
      display:none;
    }

    /* ===== INPUT ===== */
    #input-area{
      display:flex;
      gap:10px;
      margin-top:10px;
    }
    #input{
      flex:1;
      padding:14px;
      font-size:16px;
      border-radius:12px;
      border:1px solid #ccc;
    }
    #send{
      padding:14px 20px;
      border-radius:12px;
      border:none;
      background:var(--blue);
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }

    /* ===== SUBJECT BUTTONS ===== */
    #choices button{
      margin:6px 6px 0 0;
      padding:10px 16px;
      border-radius:12px;
      border:none;
      background:var(--blue);
      color:#fff;
      cursor:pointer;
    }
  </style>
</head>

<body>

<!-- NAV -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="https://assets.softr-files.com/applications/67a2863a-6210-4748-a054-0d80961b8e92/assets/383bd953-a636-47a6-8894-3e7e90d6c00c.webp">
      <span>Learnlio • Tutor</span>
    </div>
    <nav class="nav">
      <a href="/dash.html">🏠 Dash</a>
      <a href="/chat.html" class="active">💬 Learnlio Tutor</a>
      <a href="/screener.html">🧠 Dyslexia Screener</a>
      <a href="/reports.html">📄 Reports</a>
    </nav>
  </div>
</header>

<!-- PAGE -->
<main class="page">
  <div class="card">

    <div id="messages"></div>
    <div id="typing">Learnlio AI is typing…</div>

    <div id="choices" style="display:none;"></div>

    <div id="input-area">
      <input id="input" placeholder="Type your answer here…" />
      <button id="send">Send</button>
    </div>

  </div>
</main>

<script>
const BACKEND = "https://softr-chat-backend.onrender.com";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");
const typing = document.getElementById("typing");
const choices = document.getElementById("choices");

let stage = "name";
let name = localStorage.getItem("childName");
let age  = localStorage.getItem("childAge");

function addBot(text, opts={}) {
  const d = document.createElement("div");
  d.className = "msg bot";
  d.textContent = text;
  const c = document.createElement("div");
  c.className = "bot-controls";

  const speak = document.createElement("button");
  speak.className = "btn-small speak-btn";
  speak.textContent = "🔊 Listen";
  speak.onclick = ()=>speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  c.appendChild(speak);

  if(opts.hint){
    const h = document.createElement("button");
    h.className = "btn-small hint-btn";
    h.textContent = "💡 Hint";
    h.onclick = opts.hint;
    c.appendChild(h);
  }
  if(opts.next){
    const n = document.createElement("button");
    n.className = "btn-small next-btn";
    n.textContent = "➡️ Next";
    n.onclick = opts.next;
    c.appendChild(n);
  }

  d.appendChild(c);
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}

function addUser(text){
  const d = document.createElement("div");
  d.className = "msg user";
  d.textContent = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}

async function ask(prompt){
  typing.style.display="block";
  const r = await axios.post(BACKEND,{
    userId:"guest",
    messages:[{role:"user",content:prompt}],
    childName:name,
    childAge:age
  });
  typing.style.display="none";
  addBot(r.data.reply);
}

send.onclick = ()=>{
  const v = input.value.trim();
  if(!v) return;
  input.value="";
  addUser(v);

  if(stage==="name"){
    name=v;
    localStorage.setItem("childName",v);
    stage="age";
    addBot("How old are you?");
    return;
  }
  if(stage==="age"){
    age=v;
    localStorage.setItem("childAge",v);
    stage="subject";
    addBot(`Nice to meet you ${name}! What would you like to work on today?`);
    showSubjects();
    return;
  }
  ask(v);
};

function showSubjects(){
  choices.innerHTML="";
  choices.style.display="block";
  ["Maths","English"].forEach(s=>{
    const b=document.createElement("button");
    b.textContent=s;
    b.onclick=()=>{
      addUser(s);
      choices.style.display="none";
      ask(`Start ${s} for a ${age} year old using UK English and dyslexia friendly steps.`);
    };
    choices.appendChild(b);
  });
}

if(name && age){
  stage="subject";
  addBot(`Welcome back ${name}! What would you like to work on today?`);
  showSubjects();
}else{
  addBot("Hi! I’m Learnlio. What’s your name?");
}
</script>

</body>
</html>
