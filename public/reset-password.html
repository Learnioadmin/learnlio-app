<!doctype html>
<html>
  <body style="margin:0; padding:0; background:#f7f7fb; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px;">
      <tr>
        <td align="center">
          <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background:#ffffff; border-radius:12px; padding:24px;">

            <tr>
              <td style="font-size:20px; font-weight:700; padding-bottom:12px;">
                Reset your password
              </td>
            </tr>

            <tr>
              <td style="font-size:15px; line-height:1.6; color:#111;">
                We received a request to reset your Learnlio password.
                <br><br>
                You can set a new password using the button below.
              </td>
            </tr>

            <tr>
              <td style="padding:20px 0;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block; background:#0b5cff; color:#ffffff; text-decoration:none; padding:12px 18px; border-radius:8px; font-weight:600;">
                  Reset password
                </a>
              </td>
            </tr>

            <tr>
              <td style="font-size:14px; line-height:1.6; color:#555;">
                If you didn’t request this, no action is needed.
              </td>
            </tr>

            <tr>
              <td style="padding-top:24px; font-size:13px; color:#777;">
                — Learnlio Support<br>
                <a href="https://learnlio.co.uk" style="color:#777; text-decoration:none;">learnlio.co.uk</a>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
