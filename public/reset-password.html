<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Reset password</title>

  <link rel="stylesheet" href="/assets/css/app.css" />

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .container { max-width: 520px; margin: 0 auto; padding: 18px; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; }
    .brand img { height:34px; width:auto; display:block; }
    .btn { background:#0b5cff; border:none; color:#fff; padding:12px 14px; border-radius:12px; cursor:pointer; font-size:15px; width:100%; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .input { width:100%; padding:12px; border-radius:12px; border:1px solid #d6d6e3; font-size:16px; }
    .label { display:block; font-size: 13px; color:#333; margin: 10px 0 6px; }
    .muted { color:#6b7280; font-size: 14px; }
    .status { margin-top:10px; font-size:14px; }
    .status.good { color:#16a34a; }
    .status.bad { color:#dc2626; }
    .hr { height:1px; background:#ececf4; margin:14px 0; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <div class="muted">Reset password</div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1 style="margin:0 0 6px;">Set a new password</h1>
      <p class="muted" style="margin:0 0 14px;">
        Choose a strong password you’ll remember.
      </p>

      <div id="stepStatus" class="status muted">Checking your reset link…</div>
      <div class="hr"></div>

      <div id="form" style="display:none;">
        <label class="label" for="pw1">New password</label>
        <input id="pw1" class="input" type="password" autocomplete="new-password" />

        <label class="label" for="pw2">Confirm new password</label>
        <input id="pw2" class="input" type="password" autocomplete="new-password" />

        <button id="saveBtn" class="btn" type="button" style="margin-top:14px;">Update password</button>
        <div id="msg" class="status" aria-live="polite"></div>

        <p class="muted" style="margin:14px 0 0;">
          After updating, we’ll take you to your dashboard.
        </p>
      </div>
    </div>
  </main>

  <script>
  (() => {
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const stepStatus = document.getElementById("stepStatus");
    const form = document.getElementById("form");
    const pw1 = document.getElementById("pw1");
    const pw2 = document.getElementById("pw2");
    const saveBtn = document.getElementById("saveBtn");
    const msg = document.getElementById("msg");

    function setMsg(text, good=false) {
      msg.textContent = text || "";
      msg.className = "status " + (good ? "good" : "bad");
      if (!text) msg.className = "status";
    }

    function setStep(text, bad=false) {
      stepStatus.textContent = text;
      stepStatus.className = "status " + (bad ? "bad" : "muted");
    }

    async function establishRecoverySession() {
      // Supabase may send either:
      //  A) PKCE: ?code=xxxx
      //  B) Implicit: #access_token=...&refresh_token=...&type=recovery

      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");

      // PKCE flow
      if (code) {
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) throw error;
        return true;
      }

      // Implicit flow (hash tokens)
      const hash = (window.location.hash || "").replace(/^#/, "");
      const params = new URLSearchParams(hash);
      const access_token = params.get("access_token");
      const refresh_token = params.get("refresh_token");
      const type = params.get("type");

      if (type === "recovery" && access_token && refresh_token) {
        const { error } = await sb.auth.setSession({ access_token, refresh_token });
        if (error) throw error;

        // Clean hash so refresh doesn't re-run awkwardly
        window.history.replaceState({}, "", window.location.pathname);
        return true;
      }

      // If we got here, there is no usable recovery session in the URL.
      return false;
    }

    async function ensureLoggedInForRecovery() {
      const { data } = await sb.auth.getUser();
      return !!data?.user;
    }

    saveBtn.addEventListener("click", async () => {
      setMsg("");

      const a = pw1.value.trim();
      const b = pw2.value.trim();

      if (a.length < 8) { setMsg("Password should be at least 8 characters."); return; }
      if (a !== b) { setMsg("Passwords do not match."); return; }

      saveBtn.disabled = true;

      try {
        const { error } = await sb.auth.updateUser({ password: a });
        if (error) throw error;

        setMsg("Password updated ✅ Redirecting…", true);

        // Go to dashboard after a short beat
        setTimeout(() => window.location.href = "/dash.html", 700);
      } catch (e) {
        setMsg(e?.message || String(e));
      } finally {
        saveBtn.disabled = false;
      }
    });

    (async () => {
      if (!sb) { setStep("Supabase failed to load.", true); return; }

      try {
        // Try to establish a session from the reset link
        const ok = await establishRecoverySession();

        // If link didn’t contain tokens/code, maybe session already exists
        const loggedIn = await ensureLoggedInForRecovery();

        if (!ok && !loggedIn) {
          setStep("This reset link is invalid or has expired. Please request a new reset email.", true);
          return;
        }

        setStep("Link verified. Please set your new password.");
        form.style.display = "block";
      } catch (e) {
        setStep(e?.message || "Could not verify reset link.", true);
      }
    })();
  })();
  </script>
</body>
</html>
