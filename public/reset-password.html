<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Reset password</title>

  <link rel="stylesheet" href="/assets/css/app.css" />

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7fb; color:#111; }
    .container { max-width: 980px; margin: 0 auto; padding: 18px; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .nav { background:#fff; border-bottom:1px solid #ececf4; }
    .nav-inner { max-width:980px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; }
    .brand img { height:34px; width:auto; display:block; }
    .links { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .links a { text-decoration:none; color:#111; padding:10px 12px; border-radius:12px; }
    .links a.active { background:#eef2ff; }
    .btn { background:#0b5cff; border:none; color:#fff; padding:12px 14px; border-radius:12px; cursor:pointer; font-size:15px; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .btn.light { background:#e5e7eb; color:#111; }
    .muted { color:#6b7280; font-size: 14px; }
    .status { margin-top:10px; font-size:14px; }
    .status.good { color:#16a34a; }
    .status.bad { color:#dc2626; }
    .label { display:block; font-size: 13px; color:#333; margin: 10px 0 6px; }
    .input { width:100%; padding:12px; border-radius:12px; border:1px solid #d6d6e3; font-size:16px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/login.html" class="active">Reset password</a>
        <a href="/login.html">Log in</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1 style="margin:0 0 6px;">Set a new password</h1>
      <p class="muted" style="margin:0 0 14px;">
        Choose a new password for your Learnlio account.
      </p>

      <div id="msg" class="status" aria-live="polite"></div>

      <div id="formWrap" style="display:none;">
        <label class="label" for="pw1">New password</label>
        <input id="pw1" class="input" type="password" autocomplete="new-password" />

        <label class="label" for="pw2">Confirm new password</label>
        <input id="pw2" class="input" type="password" autocomplete="new-password" />

        <button id="saveBtn" class="btn" type="button" style="margin-top:14px;">Save new password</button>
        <button id="backBtn" class="btn light" type="button" style="margin-top:14px; margin-left:10px;">Back to login</button>
      </div>
    </div>
  </main>

  <script>
  (() => {
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msg = document.getElementById("msg");
    const formWrap = document.getElementById("formWrap");
    const pw1 = document.getElementById("pw1");
    const pw2 = document.getElementById("pw2");
    const saveBtn = document.getElementById("saveBtn");
    const backBtn = document.getElementById("backBtn");

    function setMsg(text, good=false) {
      msg.textContent = text || "";
      msg.className = "status " + (good ? "good" : "bad");
      if (!text) msg.className = "status";
    }

    backBtn.addEventListener("click", () => {
      window.location.href = "/login.html";
    });

    async function ensureRecoverySession() {
      // Supabase can return either:
      // - URL with ?code=... (PKCE)
      // - URL hash #access_token=...&type=recovery (implicit)
      const url = new URL(window.location.href);

      // 1) PKCE code flow
      if (url.searchParams.get("code")) {
        const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
        if (error) throw new Error(error.message);
        return;
      }

      // 2) Hash token flow
      if (window.location.hash && window.location.hash.includes("type=recovery")) {
        // supabase-js will pick this up via getSession() after load
        return;
      }

      // 3) No recovery data at all
      throw new Error("This reset link is missing the recovery token. Please request a new password reset email.");
    }

    async function init() {
      if (!sb) { setMsg("Supabase failed to load."); return; }

      // Show any Supabase errors passed back in URL
      const h = window.location.hash || "";
      if (h.includes("error=")) {
        // Example: #error=access_denied&error_code=otp_expired&error_description=...
        const params = new URLSearchParams(h.replace("#",""));
        const desc = params.get("error_description") || "Reset link error.";
        setMsg(decodeURIComponent(desc.replaceAll("+"," ")), false);
        formWrap.style.display = "none";
        return;
      }

      try {
        await ensureRecoverySession();

        // Confirm we actually have a session now (or one we can use)
        const { data } = await sb.auth.getSession();
        if (!data?.session) {
          // Sometimes needs a tick after exchangeCodeForSession
          const again = await sb.auth.getSession();
          if (!again.data?.session) throw new Error("Session not established. Please request a new reset email.");
        }

        setMsg("Link verified ✅ Please enter a new password.", true);
        formWrap.style.display = "block";
      } catch (e) {
        setMsg(String(e.message || e), false);
        formWrap.style.display = "none";
      }
    }

    saveBtn.addEventListener("click", async () => {
      setMsg("");
      const a = pw1.value.trim();
      const b = pw2.value.trim();

      if (a.length < 8) { setMsg("Password must be at least 8 characters."); return; }
      if (a !== b) { setMsg("Passwords do not match."); return; }

      saveBtn.disabled = true;
      try {
        const { error } = await sb.auth.updateUser({ password: a });
        if (error) throw new Error(error.message);

        setMsg("Password updated ✅ You can log in now.", true);

        // Optional: sign out recovery session then send to login
        await sb.auth.signOut();
        setTimeout(() => window.location.href = "/login.html", 600);
      } catch (e) {
        setMsg(String(e.message || e), false);
      } finally {
        saveBtn.disabled = false;
      }
    });

    init();
  })();
  </script>
</body>
</html>
