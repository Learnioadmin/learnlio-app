<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio  Logging out</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{ margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#f7f7fb; color:#0b1220; }
    .wrap{ max-width:720px; margin:0 auto; padding:28px 16px; }
    .card{ background:#fff; border:1px solid rgba(15,23,42,.10); border-radius:18px; padding:18px; box-shadow: 0 12px 28px rgba(2,6,23,.08); }
    .muted{ color:#64748b; line-height:1.6; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1 style="margin:0 0 8px; font-size:18px; letter-spacing:-.2px;">Logging you out</h1>
      <div class="muted">One moment. Youll be back on the homepage.</div>
    </div>
  </main>

  <script>
  (async () => {
    // Match your existing config
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

    try{
      // Always attempt sign-out even if sb isn't attached globally
      const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_ANON_KEY);
      if (sb?.auth?.signOut) await sb.auth.signOut();
    }catch(e){
      console.warn("signOut failed (continuing)", e);
    }

    try{
      localStorage.removeItem("selectedChild");
    }catch{}

    // Always redirect home with UX hint
    window.location.href = "/?logged_out=1";
  })();
  </script>
</body>
</html>
