<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio  Logged out</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#f7f7fb; color:#0b1220; }
    .wrap{ max-width:820px; margin:0 auto; padding:22px 16px; }
    .card{ background:#fff; border:1px solid rgba(15,23,42,.10); border-radius:18px; padding:16px; box-shadow:0 12px 32px rgba(12,18,32,.08); }
    .muted{ color:#5b6475; line-height:1.6; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div style="font-weight:950; font-size:18px; letter-spacing:-.2px;">Youre logged out </div>
      <div id="msg" class="muted" style="margin-top:8px;">Finishing up</div>
    </div>
  </main>

  <script>
  (async () => {
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msg = document.getElementById("msg");
    if (msg) msg.textContent = "Logging you out";

    try { await sb.auth.signOut(); } catch (e) { console.warn("signOut failed (continuing)", e); }
    try { localStorage.removeItem("selectedChild"); } catch {}

    // Redirect to homepage with a tiny logged-out hint
    window.location.replace("/?logged_out=1");
  })();
  </script>
</body>
</html>
