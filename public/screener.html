<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow">
  <meta name="googlebot" content="noindex,nofollow">
  <link rel="canonical" href="https://app.learnlio.co.uk/screener">
  <title>Learnlio Setup check</title>

  <!-- Dyslexia-friendly font -->
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --border:#e5e7eb;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      --blue:#2563eb;
      --blue2:#1d4ed8;
      --pill:#eef2ff;
      --warn:#f59e0b;
      --good:#10b981;
      --font:'OpenDyslexic', Arial, sans-serif;
      --max: 1040px;
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
      line-height:1.7;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 180px;
    }
    .brand img{
      height: 34px;       /* ✅ prevents huge logo */
      width: auto;
      display:block;
      border-radius: 8px;
    }
    .brand .title{
      font-size: 14px;
      line-height: 1.2;
      color: var(--muted);
    }


    /* --- Page layout --- */
    .wrap{
      max-width: var(--max);
      margin: 18px auto;
      padding: 0 16px 28px;
    }
    .page-head{
      margin: 12px 0 14px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1{
      margin:0;
      font-size: 22px;
      line-height:1.3;
    }
    .subtitle{
      margin:6px 0 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 780px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    /* --- Screener UI --- */
    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
    }

    .progress-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .bar{
      width:100%;
      height: 10px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow:hidden;
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: var(--good);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .question{
      margin-top: 14px;
      font-size: 18px;
      white-space: pre-wrap;
    }

    .answers{
      margin-top: 14px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .btn{
      border:none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 16px;
      cursor:pointer;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      text-align:left;
      transition: 0.12s ease;
      font-family: var(--font);
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn.primary{
      background: var(--blue);
      border-color: var(--blue);
      color:#fff;
      text-align:center;
    }
    .btn.primary:hover{ background: var(--blue2); }

    .note{
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .result{
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f8fafc;
      white-space: pre-wrap;
    }

    @media (max-width: 520px){
      .brand .title{ display:none; }
      .nav a{ padding: 9px 10px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="navMount"></div>

  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>Setup check</h1>
        <p class="subtitle">
          This is a short, child-friendly check to help get things ready.
        </p>
      </div>

      <div class="pill">⏱️ Takes about 3–5 minutes</div>
    </div>

    <section class="card" id="app">
      <div class="progress-row">
        <div id="progressText">Progress: 0 / 8</div>
        <div id="statusText" style="color:var(--muted); font-size:13px;">Choose the best answer.</div>
      </div>
      <div class="bar"><div id="barFill"></div></div>

      <div class="question" id="question"></div>

      <div class="answers" id="answers"></div>

      <div class="note" id="note">
        Tip: If you’re not sure, pick the closest answer.
      </div>

      <div class="result" id="result" style="display:none;"></div>
    </section>
  </main>
  <div id="footerMount"></div>

  <script src="/assets/js/layout-app.js?v=20260122-pin2"></script>
<script>
(function(){
  // Very lightweight “option 1” screener (no backend needed).
  // You can expand this later and save results externally.

  const questions = [
    {
      q: "When you read, do the words ever look like they move or jump?",
      a: ["Never", "Sometimes", "Often"],
      score: [0,1,2]
    },
    {
      q: "Do you find it hard to remember spellings, even after practising?",
      a: ["Not really", "A bit", "Yes, a lot"],
      score: [0,1,2]
    },
    {
      q: "Do you lose your place when reading a long line of text?",
      a: ["No", "Sometimes", "Yes, often"],
      score: [0,1,2]
    },
    {
      q: "Do you mix up letters or numbers that look similar (b/d, p/q, 6/9)?",
      a: ["No", "Sometimes", "Yes, often"],
      score: [0,1,2]
    },
    {
      q: "Is it easier to understand when someone explains it out loud?",
      a: ["Not really", "Sometimes", "Yes, much easier"],
      score: [0,1,2]
    },
    {
      q: "Do you need extra time to read questions or finish work?",
      a: ["No", "Sometimes", "Yes, often"],
      score: [0,1,2]
    },
    {
      q: "Do you avoid reading out loud at school or at home?",
      a: ["No", "Sometimes", "Yes, often"],
      score: [0,1,2]
    },
    {
      q: "Do you find it hard to write sentences without mistakes?",
      a: ["No", "Sometimes", "Yes, often"],
      score: [0,1,2]
    }
  ];

  let i = 0;
  let total = 0;
  const answers = [];

  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const resultEl = document.getElementById("result");
  const progressText = document.getElementById("progressText");
  const statusText = document.getElementById("statusText");
  const barFill = document.getElementById("barFill");

  function render(){
    resultEl.style.display = "none";
    const q = questions[i];
    progressText.textContent = `Progress: ${i} / ${questions.length}`;
    statusText.textContent = "Choose the best answer.";
    barFill.style.width = `${Math.round((i / questions.length) * 100)}%`;

    questionEl.textContent = "🧠 " + q.q;

    answersEl.innerHTML = "";
    q.a.forEach((label, idx) => {
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.type = "button";
      btn.textContent = "• " + label;
      btn.onclick = () => choose(idx);
      answersEl.appendChild(btn);
    });
  }

  async function choose(idx){
    total += questions[i].score[idx];
    answers.push({
      question: questions[i].q,
      answer: questions[i].a[idx],
      score: questions[i].score[idx]
    });
    i++;

    if(i < questions.length){
      render();
      return;
    }

    await finish();
  }

  async function finish(){
    progressText.textContent = `Progress: ${questions.length} / ${questions.length}`;
    barFill.style.width = "100%";
    statusText.textContent = "Done.";

    answersEl.innerHTML = "";

    resultEl.style.display = "block";
    resultEl.textContent = "✅ Setup check complete. You’re ready to continue.";

    let band = "";
    if (total <= 4) band = "low";
    else if (total <= 9) band = "medium";
    else band = "high";

    const takenAt = new Date().toISOString();
    const payload = { totalScore: total, band, answers, takenAt, version: "v1" };

    let childId = null;
    try {
      const selectedRaw = localStorage.getItem("selectedChild");
      const selected = selectedRaw ? JSON.parse(selectedRaw) : null;
      childId = selected?.id || selectedRaw;
    } catch {
      childId = localStorage.getItem("selectedChild");
    }

    if (!childId) {
      resultEl.textContent = "Please go back and choose a child profile first.";
      return;
    }

    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const sb = window.sb || window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (!sb) {
      resultEl.textContent = "Please try again in a moment.";
      return;
    }

    try {
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) throw error || new Error("Not signed in");

      const { error: insertError } = await sb.from("screener_results").insert({
        parent_user_id: data.user.id,
        child_id: childId,
        score: total,
        band,
        details: { version: "v1", answers, taken_at: takenAt }
      });
      if (insertError) throw insertError;

      statusText.textContent = "Saved.";
    } catch (e) {
      resultEl.textContent = "Please try again in a moment.";
    }

    // Buttons
    const maths = document.createElement("a");
    maths.className = "btn primary";
    maths.textContent = "Start a Maths session";
    maths.href = "/lessons.html";
    maths.style.textDecoration = "none";
    answersEl.appendChild(maths);

    const tutor = document.createElement("a");
    tutor.className = "btn";
    tutor.textContent = "Start Learnlio Tutor";
    tutor.href = "/chat.html";
    tutor.style.textDecoration = "none";
    answersEl.appendChild(tutor);
  }

  render();
})();
</script>

</body>
</html>
