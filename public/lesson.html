<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    /* Nav */
    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{
      background:linear-gradient(180deg, var(--brand2), var(--brand));
      border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer;
      font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22);
    }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .notice{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px 12px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    /* MCQ */
    .mcq{ display:grid; grid-template-columns: 1fr; gap:10px; margin-top:4px; }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    /* Fill blank */
    .fillWrap{
      display:flex; flex-direction:column; gap:10px;
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding:12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
    }
    .fillSentence{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
    }
    .fillOptions{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(15,23,42,.12);
      background: rgba(248,250,252,.9);
      cursor:pointer;
      font-weight:950;
    }
    .chip:hover{ border-color: rgba(11,92,255,.22); }

    /* Match pairs */
    .pairsWrap{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding:12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
    }
    @media (max-width: 520px){ .pairsWrap{ grid-template-columns: 1fr; } }
    .pairCol{ display:flex; flex-direction:column; gap:8px; }
    .pairItem{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(15,23,42,.12);
      background: rgba(248,250,252,.9);
      cursor:pointer;
      font-weight:950;
      user-select:none;
    }
    .pairItem.selected{ border-color: rgba(11,92,255,.35); background: var(--soft); }
    .pairItem.matched{
      border-color: rgba(16,185,129,.35);
      background: rgba(16,185,129,.08);
      cursor: default;
      opacity: .92;
    }

    /* Number line */
    .nlWrap{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding:12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .nlRow{
      display:flex; justify-content:space-between; gap:8px; align-items:center;
      color: var(--muted);
      font-weight:850;
      font-size: 13px;
    }
    input[type="range"]{ width:100%; }

    /* Drag step */
    .dragWrap{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding:12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .dragRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .dragToken{
      padding:10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background: rgba(248,250,252,.9);
      cursor: grab;
      font-weight:950;
      user-select:none;
    }
    .dropZone{
      border:2px dashed rgba(15,23,42,.18);
      border-radius: 16px;
      padding:14px;
      min-height: 54px;
      display:flex;
      align-items:center;
      justify-content:center;
      color: var(--muted);
      font-weight:850;
      background: rgba(248,250,252,.7);
    }
    .dropZone.active{
      border-color: rgba(11,92,255,.35);
      background: rgba(11,92,255,.06);
    }

    /* End screen */
    .endWrap{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding:14px;
      box-shadow: 0 14px 26px rgba(2,6,23,.08);
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .endTitle{ font-weight:950; font-size:16px; letter-spacing:-.2px; }
    .endActions{ display:flex; gap:10px; flex-wrap:wrap; }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>
            <div id="mcq" class="mcq" style="display:none;"></div>
            <div id="interactiveMount" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Steady effort. No pressure.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP this lesson: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // CONFIG
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev";
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    let SUBJECT = null;
    let AREA = null;

    let lesson = null;
    let steps = [];
    let idx = 0;

    let gradedCount = 0;
    let correctCount = 0;

    let xpSession = 0;
    let skillRow = null;

    let currentAudio = null;

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    async function loadOrCreateSkillRow(){
      const { data: existing, error } = await sb
        .from("child_skill_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", SUBJECT)
        .eq("area", AREA)
        .maybeSingle();

      if (error) console.warn("child_skill_progress load error", error);

      if (existing?.id){
        skillRow = existing;
        return skillRow;
      }

      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject: SUBJECT,
        area: AREA,
        level: 1,
        confidence: 0.5,
        accuracy: 0.0,
        total_attempts: 0,
        correct_attempts: 0,
        streak_correct: 0,
        streak_wrong: 0,
        last_session_id: null,
        last_seen_at: new Date().toISOString(),
        xp_total: 0,
        xp_last_earned: 0,
        xp_updated_at: new Date().toISOString()
      };

      const { data: up, error: upErr } = await sb
        .from("child_skill_progress")
        .upsert(payload, { onConflict: "owner_id,child_id,subject,area" })
        .select("*")
        .single();

      if (upErr){
        console.warn("child_skill_progress upsert error", upErr);
        return null;
      }
      skillRow = up;
      return skillRow;
    }

    async function applyLessonProgressToSkillRow(){
      if (!skillRow?.id) return;

      const totalAttempts = Number(skillRow.total_attempts || 0) + 1;

      const score = gradedCount ? (correctCount / gradedCount) : null;
      const pass = (typeof score === "number") ? (score >= 0.70) : false;

      const correctAttempts = Number(skillRow.correct_attempts || 0) + (pass ? 1 : 0);
      const accuracy = totalAttempts ? (correctAttempts / totalAttempts) : 0;

      const oldConf = (typeof skillRow.confidence === "number") ? skillRow.confidence : 0.5;
      let confDelta = 0;
      if (typeof score === "number") {
        if (score >= 0.85) confDelta = +0.06;
        else if (score >= 0.70) confDelta = +0.04;
        else if (score >= 0.50) confDelta = +0.02;
        else confDelta = -0.02;
      } else {
        confDelta = -0.01;
      }
      const confidence = Math.max(0, Math.min(1, oldConf + confDelta));

      let streakCorrect = Number(skillRow.streak_correct || 0);
      let streakWrong = Number(skillRow.streak_wrong || 0);
      if (typeof score === "number") {
        if (pass) { streakCorrect += 1; streakWrong = 0; }
        else { streakWrong += 1; streakCorrect = 0; }
      }

      let level = Number(skillRow.level || 1);
      if (totalAttempts >= 6 && confidence > 0.70) level = Math.min(10, level + 1);
      if (totalAttempts >= 6 && confidence < 0.35) level = Math.max(1, level - 1);

      const xpTotal = Number(skillRow.xp_total || 0) + Number(xpSession || 0);

      const patch = {
        total_attempts: totalAttempts,
        correct_attempts: correctAttempts,
        accuracy,
        confidence,
        level,
        streak_correct: streakCorrect,
        streak_wrong: streakWrong,
        last_seen_at: new Date().toISOString(),
        xp_total: xpTotal,
        xp_last_earned: Number(xpSession || 0),
        xp_updated_at: new Date().toISOString()
      };

      const { data: updated, error } = await sb
        .from("child_skill_progress")
        .update(patch)
        .eq("id", skillRow.id)
        .select("*")
        .single();

      if (error){
        console.warn("child_skill_progress update error", error);
        return;
      }
      skillRow = updated;
    }

    function looksLikeImageStep(step){
      const txt = (step?.prompt || step?.text || step?.sentence || "").toLowerCase();
      return Boolean(step?.requiresImage) ||
        txt.includes("in the picture") ||
        txt.includes("in this picture") ||
        txt.includes("in the image") ||
        txt.includes("in this image") ||
        txt.includes("look at the picture") ||
        txt.includes("look at the image");
    }

    function sanitizeSteps(rawSteps){
      const out = [];
      for (const s of (rawSteps || [])){
        if (!s || typeof s !== "object") continue;
        if (looksLikeImageStep(s)) continue;

        if (s.type === "fill_blank"){
          const sentence = String(s.sentence || "").trim();
          const answer = String(s.answer || "").trim();
          const options = Array.isArray(s.options) ? s.options.filter(x => typeof x === "string" && x.trim()) : [];
          if (!sentence || (!answer && options.length < 2)) continue;
        }

        if (s.type === "mcq"){
          const choices = Array.isArray(s.choices) ? s.choices.filter(x => typeof x === "string" && x.trim()) : [];
          if (choices.length < 2) continue;
        }

        if (s.type === "match_pairs"){
          const pairs = Array.isArray(s.pairs) ? s.pairs : [];
          if (pairs.length < 2) continue;
        }

        if (s.type === "number_line"){
          if (!Number.isFinite(Number(s.min)) || !Number.isFinite(Number(s.max))) continue;
          if (!Number.isFinite(Number(s.start)) || !Number.isFinite(Number(s.target))) continue;
        }

        out.push(s);
      }
      return out;
    }

    async function fetchGeneratedLesson(){
      const payload = {
        subject: SUBJECT,
        area: AREA,
        age: childAge,
        level: Number(skillRow?.level || 1),
        owner_id: currentUser.id,
        child_id: child.id,
        wantInteractive: true,
        allowedTypes: ["intro","teach","mcq","fill_blank","match_pairs","number_line","interactive_drag","finish"]
      };

      const r = await fetch(`${LESSON_GEN_URL.replace(/\/+$/,"")}/generate`, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const text = await r.text().catch(()=> "");
      let json = null;
      try{ json = text ? JSON.parse(text) : null; }catch{}

      if (!r.ok){
        const msg = json?.error || text || `Lesson generation failed (${r.status})`;
        throw new Error(msg);
      }

      const lessonObj = json?.lesson || json;
      const rawSteps = Array.isArray(lessonObj?.steps) ? lessonObj.steps : [];
      const cleanSteps = sanitizeSteps(rawSteps);

      if (!cleanSteps.length){
        throw new Error("No usable steps returned (image-only or incomplete steps were removed).");
      }

      return { title: lessonObj?.title || "", steps: cleanSteps };
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      xpLine.textContent = `XP this lesson: ${xpSession}`;
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
    }

    function showInteractive(html){
      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = html;
    }

    function awardXP(points){
      xpSession += Number(points || 0);
      setProgressUI();
    }

    function markAnswer(isCorrect){
      gradedCount += 1;
      if (isCorrect) correctCount += 1;
    }

    function scheduleAdvance(delayMs=520){
      setTimeout(() => {
        if (idx < steps.length - 1){
          idx += 1;
          renderStep();
        } else {
          renderEndScreen();
        }
      }, delayMs);
    }

    function renderEndScreen(){
      clearError();
      mcqEl.style.display = "none";
      mcqEl.innerHTML = "";
      clearInteractive();
      lessonTextEl.textContent = "";

      const title = (lesson?.title || "Lesson");

      showInteractive(`
        <div class="endWrap">
          <div class="endTitle">Nice work, ${escapeHtml(childName)}.</div>
          <div class="notice">
            You finished <b>${escapeHtml(title)}</b>.<br><br>
            XP earned today: <b>${xpSession}</b>
          </div>
          <div class="endActions">
            <button id="doneTodayBtn" class="pill primary" type="button">✅ Done for today</button>
            <button id="anotherLessonBtn" class="pill" type="button">✨ Try another lesson</button>
            <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
          </div>
        </div>
      `);

      nextBtn.disabled = true;
      backBtn.disabled = true;
      hintLine.textContent = "Choose what to do next.";

      persistAndLock();

      document.getElementById("doneTodayBtn")?.addEventListener("click", () => window.location.href = "/dash.html");
      document.getElementById("anotherLessonBtn")?.addEventListener("click", () =>
        window.location.href = `/lesson.html?subject=${encodeURIComponent(SUBJECT)}&area=${encodeURIComponent(AREA)}`
      );
    }

    let persistRan = false;
    async function persistAndLock(){
      if (persistRan) return;
      persistRan = true;
      await applyLessonProgressToSkillRow();
    }

    function disableAllButtons(root){
      if (!root) return;
      root.querySelectorAll("button").forEach(b => { b.disabled = true; });
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function makeSimpleOptions(answer){
      const a = String(answer).trim();
      if (!a) return [];
      const lower = a.toLowerCase();

      // If it's a number word or digit, try small variations
      const asNum = Number(a);
      if (Number.isFinite(asNum)){
        const opts = [String(asNum), String(asNum+1), String(Math.max(0, asNum-1)), String(asNum+2)];
        return shuffle(opts).slice(0,4);
      }

      // Otherwise: swap/nearby common confusions
      const opts = [a, a + "s", lower, a.replace(/.$/,"")];
      return shuffle(Array.from(new Set(opts))).slice(0,4);
    }

    function shuffle(arr){
      const a = arr.slice();
      for (let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    // ----- Read aloud -----
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          const t = await r.text().catch(()=> "");
          console.warn("TTS failed", r.status, t);
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };

        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    // Render step (continues in Chunk 2)
    // -------------------------
    // Step rendering + widgets
    // -------------------------
    function renderStep(){
      clearError();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";
      clearInteractive();

      if (!steps.length){
        lessonTextEl.textContent = "No lesson steps found.";
        return;
      }

      const step = steps[idx];
      setProgressUI();

      if (!step){
        renderEndScreen();
        return;
      }

      // Intro/teach
      if (step.type === "intro" || step.type === "teach"){
        lessonTextEl.textContent = step.text || "";
        nextBtn.textContent = "➡️ Next";
        nextBtn.disabled = false;
        return;
      }

      // Finish
      if (step.type === "finish"){
        lessonTextEl.textContent = step.text || "Nice work. You are done.";
        nextBtn.textContent = "✅ Finish";
        nextBtn.disabled = false;
        return;
      }

      // MCQ
      if (step.type === "mcq"){
        lessonTextEl.textContent = step.prompt || "";
        mcqEl.style.display = "grid";

        const letters = ["A","B","C","D","E","F"];
        const choices = Array.isArray(step.choices) ? step.choices : [];

        choices.forEach((choice, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-opt";
          btn.innerHTML = `<span class="mcq-letter">${letters[i] || ""}</span><span class="mcq-text">${escapeHtml(String(choice))}</span>`;
          btn.addEventListener("click", () => {
            const correctIndex = Number(step.correctIndex);
            const isCorrect = (i === correctIndex);
            awardXP(isCorrect ? 10 : 6);
            markAnswer(isCorrect);
            hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
            disableAllButtons(mcqEl);
            scheduleAdvance(520);
          });
          mcqEl.appendChild(btn);
        });

        nextBtn.textContent = "➡️ Next";
        nextBtn.disabled = false;
        return;
      }

      // Fill blank
      if (step.type === "fill_blank"){
        const sentence = String(step.sentence || "").trim();
        const prompt = String(step.prompt || "").trim();
        const answer = String(step.answer || "").trim();
        let options = Array.isArray(step.options) ? step.options : [];
        if (!options.length && answer) options = makeSimpleOptions(answer);
        options = options.filter(x => typeof x === "string" && x.trim()).slice(0, 6);

        // Safety: if still broken, skip silently
        if (!sentence || options.length < 2){
          scheduleAdvance(10);
          return;
        }

        lessonTextEl.textContent = prompt || "Choose the missing word:";
        showInteractive(`
          <div class="fillWrap">
            <div class="fillSentence">${escapeHtml(sentence)}</div>
            <div class="fillOptions" id="fillOpts"></div>
          </div>
        `);

        const wrap = document.getElementById("fillOpts");
        options.forEach(opt => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.textContent = opt;
          chip.addEventListener("click", () => {
            const isCorrect = answer ? (opt.trim().toLowerCase() === answer.trim().toLowerCase()) : true;
            awardXP(isCorrect ? 10 : 6);
            markAnswer(isCorrect);
            hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
            disableAllButtons(interactiveMount);
            scheduleAdvance(520);
          });
          wrap.appendChild(chip);
        });

        nextBtn.textContent = "➡️ Next";
        nextBtn.disabled = false;
        return;
      }

      // Match pairs
      if (step.type === "match_pairs"){
        const prompt = String(step.prompt || "Match the pairs.").trim();
        const pairs = Array.isArray(step.pairs) ? step.pairs : [];
        if (pairs.length < 2){
          scheduleAdvance(10);
          return;
        }

        lessonTextEl.textContent = prompt;

        // Build left list and right list (shuffled)
        const left = pairs.map(p => String(p.left ?? "")).filter(Boolean);
        const right = shuffle(pairs.map(p => String(p.right ?? "")).filter(Boolean));
        const map = new Map(pairs.map(p => [String(p.left ?? ""), String(p.right ?? "")]));

        let selectedLeft = null;
        let matched = new Set();
        let totalToMatch = Math.min(left.length, right.length);

        showInteractive(`
          <div class="pairsWrap">
            <div class="pairCol" id="leftCol"></div>
            <div class="pairCol" id="rightCol"></div>
          </div>
        `);

        const leftCol = document.getElementById("leftCol");
        const rightCol = document.getElementById("rightCol");

        function renderCols(){
          leftCol.innerHTML = "";
          rightCol.innerHTML = "";

          left.forEach(lv => {
            const btn = document.createElement("div");
            btn.className = "pairItem" + (matched.has("L:"+lv) ? " matched" : (selectedLeft === lv ? " selected" : ""));
            btn.textContent = lv;
            if (!matched.has("L:"+lv)){
              btn.addEventListener("click", () => {
                selectedLeft = lv;
                renderCols();
              });
            }
            leftCol.appendChild(btn);
          });

          right.forEach(rv => {
            const btn = document.createElement("div");
            btn.className = "pairItem" + (matched.has("R:"+rv) ? " matched" : "");
            btn.textContent = rv;

            if (!matched.has("R:"+rv)){
              btn.addEventListener("click", () => {
                if (!selectedLeft) return;
                const correctRight = map.get(selectedLeft);
                const isCorrect = (rv === correctRight);

                if (isCorrect){
                  matched.add("L:"+selectedLeft);
                  matched.add("R:"+rv);
                  awardXP(8);
                  hintLine.textContent = "Nice ✅";
                } else {
                  awardXP(4);
                  hintLine.textContent = "Good try 💛";
                }

                markAnswer(isCorrect);

                selectedLeft = null;
                renderCols();

                // Completed?
                const matchedPairs = Array.from(matched).filter(x => x.startsWith("L:")).length;
                if (matchedPairs >= totalToMatch){
                  hintLine.textContent = "All matched ✅";
                  disableAllButtons(interactiveMount);
                  scheduleAdvance(650);
                }
              });
            }
            rightCol.appendChild(btn);
          });
        }

        renderCols();

        nextBtn.textContent = "➡️ Next";
        nextBtn.disabled = false;
        return;
      }

      // Number line
      if (step.type === "number_line"){
        const prompt = String(step.prompt || "Use the number line.").trim();
        const min = Number(step.min);
        const max = Number(step.max);
        const start = Number(step.start);
        const target = Number(step.target);

        if (![min,max,start,target].every(n => Number.isFinite(n))){
          scheduleAdvance(10);
          return;
        }

        lessonTextEl.textContent = prompt;

        showInteractive(`
          <div class="nlWrap">
            <div class="nlRow">
              <span>Min: ${min}</span>
              <span><b>Move to: ${target}</b></span>
              <span>Max: ${max}</span>
            </div>
            <input id="nlRange" type="range" min="${min}" max="${max}" value="${start}" step="1" />
            <div class="nlRow">
              <span>Start: ${start}</span>
              <span id="nlVal"><b>Now: ${start}</b></span>
              <span>Target: ${target}</span>
            </div>
            <button id="nlSubmit" class="pill primary" type="button">✅ Check</button>
          </div>
        `);

        const range = document.getElementById("nlRange");
        const val = document.getElementById("nlVal");
        const submit = document.getElementById("nlSubmit");

        range.addEventListener("input", () => {
          val.innerHTML = `<b>Now: ${range.value}</b>`;
        });

        submit.addEventListener("click", () => {
          const picked = Number(range.value);
          const isCorrect = picked === target;
          awardXP(isCorrect ? 10 : 6);
          markAnswer(isCorrect);
          hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
          submit.disabled = true;
          range.disabled = true;
          scheduleAdvance(650);
        });

        nextBtn.textContent = "➡️ Next";
        nextBtn.disabled = false;
        return;
      }

      // Drag (simple token -> zone)
      if (step.type === "interactive_drag"){
        const prompt = String(step.prompt || "Drag the token into the box.").trim();
        const items = Array.isArray(step.items) ? step.items : [];
        if (!items.length){
          scheduleAdvance(10);
          return;
        }

        lessonTextEl.textContent = prompt;

        // We treat "items[0].label" as the correct token for now.
        const correct = String(items[0]?.label ?? "").trim();
        const tokens = shuffle(items.map(i => String(i.label ?? "")).filter(Boolean));
        if (!correct || !tokens.length){
          scheduleAdvance(10);
          return;
        }

        showInteractive(`
          <div class="dragWrap">
            <div class="dragRow" id="dragRow"></div>
            <div class="dropZone" id="dropZone">Drop here</div>
          </div>
        `);

        const row = document.getElementById("dragRow");
        const zone = document.getElementById("dropZone");

        tokens.forEach(t => {
          const el = document.createElement("div");
          el.className = "dragToken";
          el.draggable = true;
          el.textContent = t;
          el.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", t);
          });
          row.appendChild(el);
        });

        zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("active"); });
        zone.addEventListener("dragleave", () => zone.classList.remove("active"));
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          zone.classList.remove("active");
          const t = e.dataTransfer.getData("text/plain");
          const isCorrect = (t === correct);
          awardXP(isCorrect ? 10 : 6);
          markAnswer(isCorrect);
          hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
          zone.textContent = `Dropped: ${t}`;
          disableAllButtons(interactiveMount);
          scheduleAdvance(700);
        });

        nextBtn.textContent = "➡️ Next";
        nextBtn.disabled = false;
        return;
      }

      // Unknown: skip
      scheduleAdvance(10);
    }

    // Controls
    backBtn.addEventListener("click", () => {
      if (idx > 0){
        idx -= 1;
        renderStep();
      }
    });

    nextBtn.addEventListener("click", async () => {
      const step = steps[idx];
      if (!step){
        renderEndScreen();
        return;
      }

      if (step.type === "finish"){
        renderEndScreen();
        return;
      }

      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      } else {
        renderEndScreen();
      }
    });

    finishBtn.addEventListener("click", async () => {
      await persistAndLock();
      window.location.href = "/lessons.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Tap answers to move on automatically\n" +
        "• Use Read aloud if you want it\n" +
        "• No pressure — you can finish any time\n\n" +
        "Tip: If something feels tricky, try your best and keep going."
      );
    });

    speakBtn.addEventListener("click", speakCurrent);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      contextLine.textContent = `Preparing a lesson for ${childName}…`;

      await loadOrCreateSkillRow();

      try{
        lesson = await fetchGeneratedLesson();
      }catch(e){
        console.error(e);
        showError("Could not load a lesson right now.");
        lessonTextEl.textContent =
          "We couldn’t load a lesson.\n\n" +
          "Please try again in a moment.\n\n" +
          "If this keeps happening, the lesson generator worker may be offline.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      steps = lesson.steps || [];
      if (!steps.length){
        showError("Lesson returned no steps.");
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      idx = 0;
      xpSession = 0;
      gradedCount = 0;
      correctCount = 0;

      const title = lesson.title ? ` — ${lesson.title}` : "";
      contextLine.textContent = `${SUBJECT} • ${AREA}${title}`;
      nextBtn.disabled = false;
      backBtn.disabled = false;

      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
</body>
