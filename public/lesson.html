<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    /* Logged-in nav (same as Tutor) */
    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:4px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    .notice{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px 12px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>

            <div id="mcq" class="mcq" style="display:none;"></div>

            <!-- Placeholder area for future interactive step types -->
            <div id="interactiveMount" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Just steady effort. No pressure.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // Auth/child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Context (from URL)
    let SUBJECT = null;
    let AREA = null;
    let RESUME_ATTEMPT_ID = null;

    // Lesson runtime
    let lessonRow = null;      // row from lessons_catalog
    let steps = [];            // steps_json.steps
    let idx = 0;
    let attemptId = null;
    let stepAnswers = {};      // stepIndex -> {pickedIndex,isCorrect}
    let xp = 0;

    // Audio
    let currentAudio = null;

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
      RESUME_ATTEMPT_ID = u.searchParams.get("attempt");

      // If missing, we can fall back later from localStorage once we know child id
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;

      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    function normalizeStepsJson(row){
      // steps_json in DB might be:
      // - an object {steps:[...]}
      // - a stringified JSON
      if (!row?.steps_json) return [];
      if (typeof row.steps_json === "object" && row.steps_json.steps) return row.steps_json.steps;

      if (typeof row.steps_json === "string"){
        try{
          const parsed = JSON.parse(row.steps_json);
          return parsed?.steps || [];
        }catch{
          return [];
        }
      }
      return [];
    }

    async function pickNextLessonFromCatalog(){
      // Load all active lessons for this subject/area and filter by age
      const { data: lessons, error } = await sb
        .from("lessons_catalog")
        .select("id, subject, area, title, age_min, age_max, difficulty, steps_json, is_active")
        .eq("subject", SUBJECT)
        .eq("area", AREA)
        .eq("is_active", true);

      if (error) throw error;
      if (!lessons?.length) return null;

      const ageFit = lessons.filter(l => childAge >= (l.age_min ?? 0) && childAge <= (l.age_max ?? 99));
      if (!ageFit.length) return null;

      // Try to avoid repeats if lesson_attempts exists (fail-safe)
      let doneSet = new Set();
      try{
        const { data: attempts, error: aErr } = await sb
          .from("lesson_attempts")
          .select("lesson_id")
          .eq("owner_id", currentUser.id)
          .eq("child_id", child.id);

        if (!aErr && attempts?.length){
          doneSet = new Set(attempts.map(a => a.lesson_id));
        }
      }catch{}

      const available = ageFit.filter(l => !doneSet.has(l.id));
      if (!available.length) return null;

      // For now: pick lowest difficulty first (simple + predictable)
      available.sort((a,b) => Number(a.difficulty||1) - Number(b.difficulty||1));
      return available[0];
    }

    async function startOrResumeAttempt(lessonId){
      // If resume attempt id present, use it (but do not crash if it doesn’t exist)
      if (RESUME_ATTEMPT_ID){
        attemptId = RESUME_ATTEMPT_ID;
        return attemptId;
      }

      // Try create an attempt row if table exists & policy allows.
      try{
        const { data, error } = await sb
          .from("lesson_attempts")
          .insert({
            owner_id: currentUser.id,
            child_id: child.id,
            lesson_id: lessonId,
            meta: { subject: SUBJECT, area: AREA, childAge, startedFrom: "lesson.html" }
          })
          .select("id")
          .single();

        if (!error && data?.id){
          attemptId = data.id;
          return attemptId;
        }
      }catch(e){
        console.warn("lesson_attempts insert not available yet", e);
      }

      attemptId = null; // still allow lesson to run
      return null;
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      xpLine.textContent = `XP: ${xp}`;
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
    }

    function renderStep(){
      clearError();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";
      clearInteractive();

      if (!steps.length){
        lessonTextEl.textContent = "No lesson steps found.";
        return;
      }

      const step = steps[idx];
      setProgressUI();

      if (!step){
        lessonTextEl.textContent = "Finished.";
        return;
      }

      // Plain text steps
      if (step.type === "intro" || step.type === "teach" || step.type === "finish"){
        lessonTextEl.textContent = step.text || "";
        if (step.type === "finish"){
          nextBtn.textContent = "✅ Complete";
          hintLine.textContent = "Tap complete to save your progress.";
        } else {
          nextBtn.textContent = "➡️ Next";
        }
        return;
      }

      // MCQ
      if (step.type === "mcq"){
        lessonTextEl.textContent = step.prompt || "";
        mcqEl.style.display = "grid";

        const letters = ["A","B","C","D","E","F"];
        (step.choices || []).forEach((choice, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-opt";
          btn.innerHTML = `<span class="mcq-letter">${letters[i] || ""}</span><span class="mcq-text">${choice}</span>`;
          btn.addEventListener("click", () => chooseMCQ(i));
          mcqEl.appendChild(btn);
        });

        const saved = stepAnswers[idx];
        if (saved){
          hintLine.textContent = saved.isCorrect ? "Nice — that was correct ✅" : "That one was tricky — keep going 💛";
        }

        nextBtn.textContent = "➡️ Next";
        return;
      }

      // Future step types (placeholders for now)
      if (["fill_blank","match_pairs","number_line","interactive_drag"].includes(step.type)){
        lessonTextEl.textContent = step.prompt || "Interactive step (coming next).";
        interactiveMount.style.display = "block";
        interactiveMount.innerHTML = `
          <div class="notice">
            <b>Interactive content coming next:</b><br>
            This lesson step type is ready in the data format, but the UI component isn’t switched on yet.<br><br>
            Step type: <b>${step.type}</b>
          </div>
        `;
        nextBtn.textContent = "➡️ Next";
        return;
      }

      lessonTextEl.textContent = "Unknown step type.";
    }

    async function safeInsertStepResult(payload){
      // Don’t crash if table/schema/policies aren’t ready.
      try{
        // Your earlier errors referenced lesson_step_results_attempt_id_fkey / run_id.
        // Here we insert ONLY attempt_id if we have it.
        if (!attemptId) return;
        await sb.from("lesson_step_results").insert(payload);
      }catch(e){
        console.warn("lesson_step_results insert failed (safe to ignore for now)", e);
      }
    }

    async function chooseMCQ(pickedIndex){
      const step = steps[idx];
      if (!step || step.type !== "mcq") return;

      const correctIndex = Number(step.correctIndex);
      const isCorrect = pickedIndex === correctIndex;

      // Gentle XP
      xp += isCorrect ? 10 : 6;

      stepAnswers[idx] = { pickedIndex, isCorrect };
      hintLine.textContent = isCorrect ? "Nice work ✅" : "Good try 💛";

      await safeInsertStepResult({
        attempt_id: attemptId,
        step_index: idx,
        item_type: "mcq",
        is_correct: isCorrect,
        response: { pickedIndex }
      });

      setProgressUI();
    }

    async function completeLesson(){
      // Basic scoring on MCQ steps
      const mcqIndexes = steps.map((s,i) => s.type === "mcq" ? i : null).filter(v => v !== null);
      const graded = mcqIndexes.length || 0;
      let correct = 0;
      mcqIndexes.forEach(i => { if (stepAnswers[i]?.isCorrect) correct += 1; });
      const score = graded ? (correct / graded) : null;

      // Mark attempt complete (safe)
      try{
        if (attemptId){
          await sb.from("lesson_attempts")
            .update({
              completed_at: new Date().toISOString(),
              score,
              meta: { xp, correct, graded, subject: SUBJECT, area: AREA }
            })
            .eq("id", attemptId);
        }
      }catch(e){
        console.warn("lesson_attempts update failed (safe to ignore for now)", e);
      }

      contextLine.textContent = `Saved ✅ ${childName} finished "${lessonRow?.title || "Lesson"}".`;
      lessonTextEl.textContent =
        `Nice work, ${childName}.\n\nThat lesson is saved.\n\nNext time, you can do another short lesson.`;
      mcqEl.style.display = "none";
      clearInteractive();

      nextBtn.disabled = true;
      backBtn.disabled = true;
      hintLine.textContent = "You can go back to Lessons or Dashboard.";
    }

    // ----- Read aloud (Google TTS Worker) -----
    function stripEmojis(text){
      // Remove most emoji + symbol ranges (keeps normal punctuation/letters).
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        // stop previous
        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({
            text,
            languageCode: "en-GB",
            // Worker chooses defaults; you can override here later if you want.
          })
        });

        if (!r.ok){
          const t = await r.text().catch(()=> "");
          console.warn("TTS failed", r.status, t);
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };

        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        // If play throws before onended, restore button
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    // Navigation
    backBtn.addEventListener("click", () => {
      if (idx > 0){ idx -= 1; renderStep(); }
    });

    nextBtn.addEventListener("click", async () => {
      const step = steps[idx];

      // If MCQ, require answer
      if (step?.type === "mcq" && !stepAnswers[idx]){
        hintLine.textContent = "Tap an answer first 💛";
        return;
      }

      // Finish step completes
      if (step?.type === "finish"){
        await completeLesson();
        return;
      }

      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      }
    });

    finishBtn.addEventListener("click", async () => {
      // End early (safe)
      try{
        if (attemptId){
          await sb.from("lesson_attempts")
            .update({ completed_at: new Date().toISOString(), meta: { endedEarly: true, xp, subject: SUBJECT, area: AREA } })
            .eq("id", attemptId);
        }
      }catch{}
      window.location.href = "/lessons.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Read the step\n" +
        "• Tap an answer (if shown)\n" +
        "• Press Next\n\n" +
        "No pressure. You can finish any time.\n\n" +
        "Tip: Read aloud plays only when you press the button."
      );
    });

    speakBtn.addEventListener("click", speakCurrent);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      contextLine.textContent = `Loading a lesson for ${childName}…`;

      // 1) Pick a lesson from catalog
      lessonRow = await pickNextLessonFromCatalog();

      if (!lessonRow){
        contextLine.textContent = `${SUBJECT} • ${AREA}`;
        lessonTextEl.textContent =
          "No suitable lessons found for this area yet.\n\n" +
          "Add lessons to lessons_catalog (age band + steps_json), then try again.";
        mcqEl.style.display = "none";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      // 2) Start attempt (optional)
      await startOrResumeAttempt(lessonRow.id);

      // 3) Load steps
      steps = normalizeStepsJson(lessonRow);
      if (!steps.length){
        contextLine.textContent = `${SUBJECT} • ${AREA} — ${lessonRow.title || "Lesson"}`;
        lessonTextEl.textContent = "This lesson has no steps yet.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      // Init runtime
      idx = 0;
      xp = 0;
      stepAnswers = {};

      contextLine.textContent = `${SUBJECT} • ${AREA} — ${lessonRow.title || "Lesson"}`;
      nextBtn.disabled = false;
      backBtn.disabled = false;
      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
</body>
</html>
