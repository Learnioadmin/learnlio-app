<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15,23,42,.10); --shadow:0 20px 45px rgba(2,6,23,.10);
      --shadow2:0 10px 25px rgba(2,6,23,.08);
      --brand:#0b5cff; --soft:#eef2ff;
      --radius:20px; --radius2:16px; --vh:1vh;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--ink);
    }
    @media(min-width:981px){body{overflow:hidden}}

    .nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .nav-inner{max-width:1140px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    .brand{display:flex;gap:10px;font-weight:900;text-decoration:none;color:inherit}
    .brand img{height:34px}
    .links a{padding:9px 10px;border-radius:12px;text-decoration:none;color:inherit}
    .links a.active{background:var(--soft)}
    .btn{padding:10px 12px;border-radius:12px;border:none;cursor:pointer;font-weight:800}
    .btn.ghost{background:transparent;border:1px solid var(--border)}
    .btn.light{background:#e5e7eb}

    .container{max-width:1140px;margin:0 auto;padding:16px}
    .shell{display:grid;grid-template-columns:1fr 360px;gap:14px;height:calc(var(--vh)*100 - 78px - 36px)}
    @media(max-width:980px){.shell{grid-template-columns:1fr;height:auto}}

    .panel{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
    .panel-head{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .stage{padding:12px;flex:1;display:flex;flex-direction:column;min-height:0}
    .cardbox{flex:1;overflow:auto;background:#f8fafc;border-radius:var(--radius2);padding:12px}

    .lessonText{font-family:'OpenDyslexic',Arial,sans-serif;font-size:16px;line-height:1.75;white-space:pre-wrap}
    .mcq{display:grid;gap:10px;margin-top:12px}
    .mcq button{padding:12px;border-radius:16px;border:1px solid var(--border);background:#fff;font-weight:800;text-align:left}

    .controls{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--border)}
    .pill{padding:10px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:800;cursor:pointer}

    .side{padding:14px;display:flex;flex-direction:column;gap:12px}
    .sideCard{background:#fff;border-radius:var(--radius);padding:12px;border:1px solid var(--border);box-shadow:var(--shadow2)}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/dash.html">
      <img src="/assets/img/logo.webp" alt="">
      <span>Learnlio</span>
    </a>
    <nav class="links">
      <a href="/dash.html">Dashboard</a>
      <a href="/chat.html">Tutor</a>
      <a class="active" href="/lessons.html">Lessons</a>
      <button id="logoutBtn" class="btn light">Log out</button>
    </nav>
  </div>
</header>

<main class="container">
  <div class="shell">

    <section class="panel">
      <div class="panel-head">
        <div>
          <strong id="contextLine">Loading lesson…</strong>
        </div>
        <button id="speakBtn" class="btn ghost">🔊 Read aloud</button>
      </div>

      <div class="stage">
        <div id="cardbox" class="cardbox">
          <div id="lessonText" class="lessonText"></div>
          <div id="mcq" class="mcq"></div>
        </div>

        <div class="controls">
          <button id="backBtn" class="pill">⬅ Back</button>
          <button id="nextBtn" class="pill">Next ➡</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <strong>✨ Progress</strong>
      </div>
      <div class="side">
        <div class="sideCard">
          <div id="stepKpi">Step 1</div>
          <div id="xpLine">XP: 0</div>
        </div>
        <div class="sideCard">
          Calm progress. No pressure.
        </div>
      </div>
    </aside>

  </div>
</main>

<script>
(() => {

  const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
  const SUPABASE_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
  const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev/";
  const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const lessonText = document.getElementById("lessonText");
  const mcq = document.getElementById("mcq");
  const nextBtn = document.getElementById("nextBtn");
  const backBtn = document.getElementById("backBtn");
  const speakBtn = document.getElementById("speakBtn");
  const stepKpi = document.getElementById("stepKpi");
  const xpLine = document.getElementById("xpLine");
  const contextLine = document.getElementById("contextLine");

  let steps = [];
  let idx = 0;
  let xp = 0;

  function render(){
    const step = steps[idx];
    stepKpi.textContent = `Step ${idx+1} of ${steps.length}`;
    lessonText.textContent = step.text || step.prompt || "";
    mcq.innerHTML = "";

    if(step.type === "mcq"){
      step.choices.forEach((c,i)=>{
        const b=document.createElement("button");
        b.textContent = c;
        b.onclick=()=>{
          xp+=8;
          xpLine.textContent=`XP: ${xp}`;
          nextBtn.disabled=false;
        };
        mcq.appendChild(b);
      });
      nextBtn.disabled=true;
    }else{
      nextBtn.disabled=false;
    }
  }

  async function loadLesson(){
    const params = new URLSearchParams(location.search);
    const subject = params.get("subject");
    const area = params.get("area");

    contextLine.textContent = `${subject} • ${area}`;

    const res = await fetch(LESSON_GEN_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ subject, area })
    });

    const data = await res.json();
    steps = data.steps || [];
    render();
  }

  nextBtn.onclick=()=>{ if(idx<steps.length-1){idx++;render()} };
  backBtn.onclick=()=>{ if(idx>0){idx--;render()} };

  speakBtn.onclick=async()=>{
    const text = lessonText.textContent.replace(/[\u{1F300}-\u{1FAFF}]/gu,"");
    const r = await fetch(TTS_URL,{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const b = await r.arrayBuffer();
    new Audio(URL.createObjectURL(new Blob([b],{type:"audio/mpeg"}))).play();
  };

  loadLesson();

})();
</script>
</body>
</html>
