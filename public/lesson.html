<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    /* Logged-in nav (same as Tutor) */
    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:4px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    .notice{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px 12px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    /* Interactive widgets */
    .widget{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.05);
    }
    .widget h4{
      margin:0 0 8px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }

    /* Fill blank */
    .fb-line{ font-size: 16px; line-height: 1.7; font-weight: 900; }
    .fb-blank{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width: 110px;
      padding: 6px 10px;
      border-radius: 12px;
      border:1px dashed rgba(15,23,42,.25);
      background: rgba(248,250,252,.9);
      margin: 0 6px;
    }
    .fb-options{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .optChip{
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      border-radius: 999px;
      padding: 10px 12px;
      font-weight:950;
      cursor:pointer;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .optChip:hover{ border-color: rgba(11,92,255,.25); }

    /* Number line */
    .nl-wrap{ margin-top:10px; }
    .nl-track{
      position:relative;
      height: 16px;
      border-radius: 999px;
      background: rgba(15,23,42,.08);
      overflow:hidden;
    }
    .nl-fill{
      position:absolute; left:0; top:0; bottom:0;
      width:0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
    }
    .nl-marker{
      position:absolute;
      top:-10px;
      width: 10px; height: 36px;
      border-radius: 8px;
      background: rgba(11,92,255,.35);
      border:1px solid rgba(11,92,255,.30);
      transform: translateX(-50%);
      pointer-events:none;
    }
    .nl-nums{
      display:flex;
      justify-content:space-between;
      margin-top:8px;
      font-size: 12px;
      color: var(--muted);
      font-weight:850;
    }
    .nl-buttons{
      display:flex; gap:10px; flex-wrap:wrap;
      margin-top:10px;
    }

    /* Match pairs */
    .mp-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 540px){
      .mp-grid{ grid-template-columns: 1fr; }
    }
    .mp-col{ display:flex; flex-direction:column; gap:10px; min-width:0; }
    .mp-btn{
      width:100%;
      text-align:left;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      font-weight:950;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      min-height: 48px;
    }
    .mp-btn:hover{ border-color: rgba(11,92,255,.25); }
    .mp-btn.sel{ border-color: rgba(11,92,255,.55); box-shadow: 0 14px 24px rgba(2,6,23,.10); }
    .mp-btn.done{ opacity:.55; cursor:not-allowed; }
    .mp-status{ margin-top:10px; }

    /* End screen */
    .endActions{
      display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;
    }
    .endBtn{
      border:none;
      border-radius: 12px;
      padding: 10px 12px;
      cursor:pointer;
      font-size:14px;
      font-weight:950;
    }
    .endBtn.primary{
      background: linear-gradient(180deg, var(--brand2), var(--brand));
      color:#fff;
      box-shadow: 0 10px 18px rgba(11,92,255,.22);
    }
    .endBtn.light{
      background:#e5e7eb;
      color:#111;
    }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }

    .hide{ display:none !important; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>

            <div id="mcq" class="mcq" style="display:none;"></div>

            <!-- Mount for interactive step types -->
            <div id="interactiveMount" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Just steady effort. No pressure.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

    // Lesson generation Worker
    const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev/generate";

    // Google TTS Worker
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";

    // IMPORTANT: For now we explicitly DISABLE image questions.
    // If the worker returns image-required steps anyway, we skip them safely.
    const ALLOW_IMAGE_STEPS = false;
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // Auth/child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Context
    let SUBJECT = null;
    let AREA = null;

    // Lesson runtime
    let lesson = null;         // from worker
    let steps = [];
    let idx = 0;

    // Answer state
    let stepAnswers = {};      // stepIndex -> { kind, ... }
    let xp = 0;

    // History for Back button
    let visited = [];          // stack of indices visited (for deterministic back even with auto-advance)

    // Audio
    let currentAudio = null;

    // ---------- helpers ----------
    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return clamp(age, 4, 18);
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      xpLine.textContent = `XP: ${xp}`;
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
    }

    function isSkippableBrokenStep(step){
      if (!step || !step.type) return true;

      // Image steps: not shipping yet
      if (!ALLOW_IMAGE_STEPS && (step.image || step.imageKey || step.image_url || step.imageUrl)){
        return true;
      }

      // Fill blank needs a sentence AND options OR an answer
      if (step.type === "fill_blank"){
        const sentence = String(step.sentence || "").trim();
        const opts = Array.isArray(step.options) ? step.options : (Array.isArray(step.choices) ? step.choices : []);
        const answer = String(step.answer || "").trim();
        // Must have something to show + a way to answer
        if (!sentence) return true;
        if (!opts.length && !answer) return true;
      }

      // Match pairs needs at least 2 pairs
      if (step.type === "match_pairs"){
        const pairs = Array.isArray(step.pairs) ? step.pairs : [];
        if (pairs.length < 2) return true;
      }

      // Number line needs range and target
      if (step.type === "number_line"){
        const min = Number(step.min); const max = Number(step.max);
        const start = Number(step.start); const target = Number(step.target);
        if (![min,max,start,target].every(Number.isFinite)) return true;
        if (min >= max) return true;
      }

      return false;
    }

    function findNextValidIndex(fromIndex){
      for (let i = fromIndex; i < steps.length; i++){
        if (!isSkippableBrokenStep(steps[i])) return i;
      }
      return steps.length; // end
    }

    function findPrevValidIndex(fromIndex){
      for (let i = fromIndex; i >= 0; i--){
        if (!isSkippableBrokenStep(steps[i])) return i;
      }
      return 0;
    }

    function autoAdvance(ms=500){
      // Move to next step after a short pause (feels natural)
      window.setTimeout(() => {
        goNext(true);
      }, ms);
    }

    function awardXP(kind, isCorrect){
      // gentle, effort-based, no “level/accuracy” shown to child
      if (kind === "mcq") xp += isCorrect ? 10 : 6;
      else xp += 8; // interactive steps award for completing
    }

    // ---------- lesson gen ----------
    async function fetchGeneratedLesson(){
      // IMPORTANT: match worker expects: owner_id / child_id (your worker uses those)
      // Also ask worker to avoid images for now.
      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject: SUBJECT,
        area: AREA,
        age: childAge,
        level: await getSkillLevelSafe(SUBJECT, AREA),
        no_images: true,
        allowed_types: ["intro","teach","mcq","fill_blank","number_line","match_pairs","interactive_drag","finish"]
      };

      const r = await fetch(LESSON_GEN_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const text = await r.text().catch(()=> "");
      let json = null;
      try{ json = text ? JSON.parse(text) : null; }catch{}

      if (!r.ok){
        const msg = json?.error || text || `Lesson generation failed (${r.status})`;
        throw new Error(msg);
      }

      const lessonObj = json?.lesson || json; // your worker sometimes wraps as {lesson: ...}
      if (!lessonObj?.steps || !Array.isArray(lessonObj.steps) || !lessonObj.steps.length){
        throw new Error("Lesson worker returned no steps.");
      }

      return lessonObj;
    }

    async function getSkillLevelSafe(subject, area){
      // Pull from child_skill_progress if present; else default 1
      try{
        const { data, error } = await sb
          .from("child_skill_progress")
          .select("level, confidence")
          .eq("owner_id", currentUser.id)
          .eq("child_id", child.id)
          .eq("subject", subject)
          .eq("area", area)
          .maybeSingle();

        if (error) return 1;
        const lvl = Number(data?.level || 1);
        // slight nudge based on confidence (kept calm)
        const conf = typeof data?.confidence === "number" ? data.confidence : 0.5;
        if (conf > 0.75) return clamp(lvl + 1, 1, 10);
        if (conf < 0.35) return clamp(lvl - 1, 1, 10);
        return clamp(lvl, 1, 10);
      }catch{
        return 1;
      }
    }

    // ---------- render ----------
    function renderStep(){
      clearError();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";
      clearInteractive();

      // Ensure current index is valid (skip broken steps)
      const fixed = findNextValidIndex(idx);
      if (fixed !== idx){
        idx = fixed;
      }
      if (idx >= steps.length){
        renderEndScreen();
        return;
      }

      const step = steps[idx];
      setProgressUI();

      // Make Next less necessary:
      // - intro/teach: Next still available
      // - answer steps: auto-advance on answer
      nextBtn.disabled = false;

      if (step.type === "intro"){
        lessonTextEl.textContent = step.text || `Hello ${childName}. We will go slowly, one step at a time.`;
        nextBtn.textContent = "Start";
        hintLine.textContent = "When you’re ready, press Start.";
        return;
      }

      if (step.type === "teach"){
        lessonTextEl.textContent = step.text || "";
        nextBtn.textContent = "Next step";
        hintLine.textContent = step.hint ? String(step.hint) : "Ready? Let’s do the next step.";
        return;
      }

      if (step.type === "finish"){
        // Turn finish into proper end screen (instead of a dead-end)
        renderEndScreen(true);
        return;
      }

      if (step.type === "mcq"){
        lessonTextEl.textContent = step.prompt || "";
        mcqEl.style.display = "grid";

        const letters = ["A","B","C","D","E","F"];
        (step.choices || []).forEach((choice, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-opt";
          btn.innerHTML = `<span class="mcq-letter">${letters[i] || ""}</span><span class="mcq-text">${choice}</span>`;
          btn.addEventListener("click", () => chooseMCQ(i));
          mcqEl.appendChild(btn);
        });

        nextBtn.textContent = "Next";
        // Make Next optional: we auto-advance once answered
        return;
      }

      if (step.type === "fill_blank"){
        renderFillBlank(step);
        nextBtn.textContent = "Next";
        return;
      }

      if (step.type === "number_line"){
        renderNumberLine(step);
        nextBtn.textContent = "Next";
        return;
      }

      if (step.type === "match_pairs"){
        renderMatchPairs(step);
        nextBtn.textContent = "Next";
        return;
      }

      if (step.type === "interactive_drag"){
        // “Drag” without complex drag: we make it a tap-to-place mini interaction.
        renderInteractiveDrag(step);
        nextBtn.textContent = "Next";
        return;
      }

      // Unknown => skip safely
      hintLine.textContent = "Skipping this step.";
      idx = findNextValidIndex(idx + 1);
      renderStep();
    }

    function renderEndScreen(fromFinishStep=false){
      const total = steps.length;
      const completed = Object.keys(stepAnswers).length;
      lessonTextEl.textContent =
        `Nice work, ${childName}.\n\n` +
        `You have finished this lesson.\n` +
        `Steps completed: ${completed}.\n\n` +
        `What would you like to do now?`;

      mcqEl.style.display = "none";
      clearInteractive();

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Next</h4>
          <div class="endActions">
            <button id="doneBtn" class="endBtn primary" type="button">Done for today</button>
            <button id="anotherBtn" class="endBtn light" type="button">Try another lesson</button>
            <button id="backLessonsBtn" class="endBtn light" type="button">Back to Lessons</button>
          </div>
          <div class="tiny" style="margin-top:10px;">
            Your effort points (XP) today: <b>${xp}</b>
          </div>
        </div>
      `;

      // Lock navigation buttons (end screen is the end)
      nextBtn.disabled = true;
      backBtn.disabled = true;
      hintLine.textContent = "You can choose what to do next.";

      document.getElementById("doneBtn").onclick = () => window.location.href = "/dash.html";
      document.getElementById("anotherBtn").onclick = () => window.location.href = "/lessons.html";
      document.getElementById("backLessonsBtn").onclick = () => window.location.href = "/lessons.html";
    }

    // ---------- MCQ ----------
    function chooseMCQ(pickedIndex){
      const step = steps[idx];
      if (!step || step.type !== "mcq") return;

      const correctIndex = Number(step.correctIndex);
      const isCorrect = Number.isFinite(correctIndex) ? (pickedIndex === correctIndex) : true;

      stepAnswers[idx] = { kind:"mcq", pickedIndex, isCorrect };
      awardXP("mcq", isCorrect);

      // feedback
      hintLine.textContent = isCorrect ? "Nice work. ✅" : "Good try. Keep going. 💛".replace("💛",""); // no emoji in UI text
      setProgressUI();

      // Auto move on
      autoAdvance(500);
    }

    // ---------- Fill blank ----------
    function renderFillBlank(step){
      // Normalise fields
      let sentence = String(step.sentence || "").trim();
      const prompt = String(step.prompt || "Complete the sentence.").trim();

      // If sentence missing, treat as broken and skip
      if (!sentence){
        hintLine.textContent = "Skipping a broken step.";
        idx = findNextValidIndex(idx + 1);
        renderStep();
        return;
      }

      // Ensure it contains ___
      if (!sentence.includes("___")){
        // If model returned {before,after} etc, try salvage
        if (step.before || step.after){
          sentence = `${String(step.before||"").trim()} ___ ${String(step.after||"").trim()}`.replace(/\s+/g," ").trim();
        } else {
          // force placeholder (best effort)
          sentence = sentence + " ___";
        }
      }

      const options = Array.isArray(step.options) ? step.options
                    : (Array.isArray(step.choices) ? step.choices : []);
      let answer = String(step.answer || "").trim();

      // If no options but we have an answer, create a small set
      let opts = options.slice(0, 6).map(String);
      if (!opts.length && answer){
        const distractors = makeWordDistractors(answer);
        opts = shuffle([answer, ...distractors]).slice(0, 4);
      }

      // If still no options, skip
      if (!opts.length){
        hintLine.textContent = "Skipping a broken step.";
        idx = findNextValidIndex(idx + 1);
        renderStep();
        return;
      }

      // Choose correct value
      if (!answer){
        // If correctIndex exists, use it
        const ci = Number(step.correctIndex);
        if (Number.isFinite(ci) && opts[ci] != null) answer = String(opts[ci]);
      }
      if (!answer){
        // fallback: first option is treated as correct (not ideal but prevents dead ends)
        answer = String(opts[0]);
      }

      lessonTextEl.textContent = prompt;

      interactiveMount.style.display = "block";

      const displayLine = sentence.split("___").join(`<span class="fb-blank" id="fbBlank">___</span>`);
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Fill in</h4>
          <div class="fb-line">${displayLine}</div>
          <div class="fb-options" id="fbOptions"></div>
          <div class="tiny" id="fbHint">${step.hint ? String(step.hint) : "Choose the word that fits best."}</div>
        </div>
      `;

      const fbBlank = document.getElementById("fbBlank");
      const fbOptions = document.getElementById("fbOptions");

      opts.forEach(word => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "optChip";
        btn.textContent = word;
        btn.onclick = () => {
          const isCorrect = String(word).trim().toLowerCase() === String(answer).trim().toLowerCase();
          stepAnswers[idx] = { kind:"fill_blank", chosen: word, isCorrect };
          awardXP("fill_blank", isCorrect);

          fbBlank.textContent = word;
          hintLine.textContent = isCorrect ? "Good. ✅" : "Nice try. Let’s keep going.";
          setProgressUI();

          autoAdvance(650);
        };
        fbOptions.appendChild(btn);
      });
    }

    function makeWordDistractors(answer){
      // simple distractors (safe): similar length variations
      const a = String(answer).trim();
      const lower = a.toLowerCase();
      const variants = new Set();

      if (lower === "two") variants.add("to").add("too");
      if (lower === "their") variants.add("there").add("they're");
      if (lower === "there") variants.add("their").add("they're");
      if (lower === "they're") variants.add("their").add("there");

      // generic: add "a", "the", plural, etc
      if (a.length >= 3){
        variants.add(a + "s");
        variants.add(a.slice(0, Math.max(1, a.length-1)));
        variants.add(a + "ing");
      }
      variants.delete(a);

      const arr = Array.from(variants).filter(v => v && v.length <= 10);
      while (arr.length < 3){
        arr.push(randomSafeWord());
      }
      return arr.slice(0, 3);
    }

    function randomSafeWord(){
      const words = ["the","a","some","many","few","three","four","five","blue","red"];
      return words[Math.floor(Math.random()*words.length)];
    }

    // ---------- Number line ----------
    function renderNumberLine(step){
      const prompt = String(step.prompt || "Move along the number line.").trim();
      const min = Number(step.min);
      const max = Number(step.max);
      const start = Number(step.start);
      const target = Number(step.target);

      if (![min,max,start,target].every(Number.isFinite) || min >= max){
        hintLine.textContent = "Skipping a broken step.";
        idx = findNextValidIndex(idx + 1);
        renderStep();
        return;
      }

      lessonTextEl.textContent = prompt;

      let cur = clamp(start, min, max);

      function pct(v){ return ((v - min) / (max - min)) * 100; }

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Number line</h4>
          <div class="tiny">Start: <b>${start}</b> • Target: <b>${target}</b></div>
          <div class="nl-wrap">
            <div class="nl-track">
              <div class="nl-fill" id="nlFill"></div>
              <div class="nl-marker" id="nlMarker"></div>
            </div>
            <div class="nl-nums">
              <span>${min}</span><span>${max}</span>
            </div>
            <div class="nl-buttons">
              <button id="nlMinus" class="pill" type="button">-1</button>
              <button id="nlPlus" class="pill primary" type="button">+1</button>
              <button id="nlCheck" class="pill" type="button">Check</button>
            </div>
            <div class="tiny" id="nlHint">${step.hint ? String(step.hint) : "Use +1 and -1 until you reach the target."}</div>
          </div>
        </div>
      `;

      const nlFill = document.getElementById("nlFill");
      const nlMarker = document.getElementById("nlMarker");

      function paint(){
        const p = pct(cur);
        nlFill.style.width = p + "%";
        nlMarker.style.left = p + "%";
      }
      paint();

      document.getElementById("nlMinus").onclick = () => { cur = clamp(cur - 1, min, max); paint(); };
      document.getElementById("nlPlus").onclick = () => { cur = clamp(cur + 1, min, max); paint(); };
      document.getElementById("nlCheck").onclick = () => {
        const isCorrect = (cur === target);
        stepAnswers[idx] = { kind:"number_line", value: cur, isCorrect };
        awardXP("number_line", isCorrect);

        hintLine.textContent = isCorrect ? "Yes. ✅" : "Nearly. Keep going.";
        setProgressUI();

        if (isCorrect) autoAdvance(650);
      };
    }

    // ---------- Match pairs ----------
    function renderMatchPairs(step){
      const prompt = String(step.prompt || "Match the pairs.").trim();
      const pairs = Array.isArray(step.pairs) ? step.pairs : [];
      if (pairs.length < 2){
        hintLine.textContent = "Skipping a broken step.";
        idx = findNextValidIndex(idx + 1);
        renderStep();
        return;
      }

      // Normalise to strings
      const leftItems = pairs.map(p => String(p.left ?? "").trim()).filter(Boolean);
      const rightItems = pairs.map(p => String(p.right ?? "").trim()).filter(Boolean);
      if (leftItems.length !== pairs.length || rightItems.length !== pairs.length){
        hintLine.textContent = "Skipping a broken step.";
        idx = findNextValidIndex(idx + 1);
        renderStep();
        return;
      }

      const rightShuffled = shuffle(rightItems.slice());

      lessonTextEl.textContent = prompt;

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Match pairs</h4>
          <div class="mp-grid">
            <div class="mp-col" id="mpLeft"></div>
            <div class="mp-col" id="mpRight"></div>
          </div>
          <div class="tiny mp-status" id="mpStatus">${step.hint ? String(step.hint) : "Tap one on the left, then one on the right."}</div>
        </div>
      `;

      const mpLeft = document.getElementById("mpLeft");
      const mpRight = document.getElementById("mpRight");
      const mpStatus = document.getElementById("mpStatus");

      // State
      let selectedLeft = null;
      let selectedRight = null;
      const solvedLeft = new Set();
      const solvedRight = new Set();
      let correctCount = 0;

      function makeBtn(text, side){
        const b = document.createElement("button");
        b.type = "button";
        b.className = "mp-btn";
        b.textContent = text;
        b.dataset.side = side;
        b.dataset.val = text;
        return b;
      }

      leftItems.forEach(t => mpLeft.appendChild(makeBtn(t, "L")));
      rightShuffled.forEach(t => mpRight.appendChild(makeBtn(t, "R")));

      function clearSelections(){
        selectedLeft = null;
        selectedRight = null;
        [...mpLeft.children, ...mpRight.children].forEach(btn => btn.classList.remove("sel"));
      }

      function markDone(leftVal, rightVal){
        // mark buttons as done
        [...mpLeft.children].forEach(btn => {
          if (btn.dataset.val === leftVal){
            btn.classList.remove("sel");
            btn.classList.add("done");
            btn.disabled = true;
          }
        });
        [...mpRight.children].forEach(btn => {
          if (btn.dataset.val === rightVal){
            btn.classList.remove("sel");
            btn.classList.add("done");
            btn.disabled = true;
          }
        });
      }

      function checkPair(){
        if (!selectedLeft || !selectedRight) return;

        const l = selectedLeft;
        const r = selectedRight;

        // find correct right for this left
        const idxPair = pairs.findIndex(p => String(p.left).trim() === l);
        const correctRight = idxPair >= 0 ? String(pairs[idxPair].right).trim() : null;

        if (correctRight && correctRight === r){
          solvedLeft.add(l); solvedRight.add(r);
          correctCount += 1;
          mpStatus.textContent = "Good match. Keep going.";
          markDone(l, r);
        } else {
          mpStatus.textContent = "Not that pair. Try another.";
        }

        clearSelections();

        if (correctCount === pairs.length){
          stepAnswers[idx] = { kind:"match_pairs", correct: correctCount, total: pairs.length, isCorrect: true };
          awardXP("match_pairs", true);
          hintLine.textContent = "All matched. ✅";
          setProgressUI();
          autoAdvance(650);
        }
      }

      // Event delegation
      mpLeft.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn || btn.disabled) return;

        // select
        [...mpLeft.children].forEach(b => b.classList.remove("sel"));
        btn.classList.add("sel");
        selectedLeft = btn.dataset.val;

        // attempt check if right already selected
        if (selectedRight) checkPair();
      });

      mpRight.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn || btn.disabled) return;

        [...mpRight.children].forEach(b => b.classList.remove("sel"));
        btn.classList.add("sel");
        selectedRight = btn.dataset.val;

        if (selectedLeft) checkPair();
      });

      // Fix: ensure last box clickable on mobile
      // (touch/scroll + overlay issues)
      interactiveMount.style.pointerEvents = "auto";
    }

    // ---------- interactive_drag (tap-to-place) ----------
    function renderInteractiveDrag(step){
      const prompt = String(step.prompt || "Do the next step.").trim();
      // Expect items: [{label:"+3", to:"12"}] etc — if missing, we degrade gracefully.
      const items = Array.isArray(step.items) ? step.items : [];
      lessonTextEl.textContent = prompt;

      interactiveMount.style.display = "block";

      // Simple: show 2–4 choice chips; the “correct” is first or matching step.answer
      let options = items.map(it => String(it.label || "").trim()).filter(Boolean);
      if (!options.length){
        options = Array.isArray(step.options) ? step.options.map(String) : [];
      }
      if (!options.length){
        hintLine.textContent = "Skipping a broken step.";
        idx = findNextValidIndex(idx + 1);
        renderStep();
        return;
      }

      let answer = String(step.answer || "").trim();
      if (!answer) answer = options[0];

      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Try this</h4>
          <div class="notice">${step.hint ? String(step.hint) : "Tap the best choice."}</div>
          <div class="fb-options" id="dragOpts"></div>
        </div>
      `;

      const mount = document.getElementById("dragOpts");
      shuffle(options.slice()).slice(0, 6).forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "optChip";
        btn.textContent = opt;
        btn.onclick = () => {
          const isCorrect = String(opt).trim().toLowerCase() === String(answer).trim().toLowerCase();
          stepAnswers[idx] = { kind:"interactive_drag", chosen: opt, isCorrect };
          awardXP("interactive_drag", isCorrect);
          hintLine.textContent = isCorrect ? "Nice. ✅" : "Good try. Let’s keep going.";
          setProgressUI();
          autoAdvance(650);
        };
        mount.appendChild(btn);
      });
    }

    // ---------- navigation ----------
    function goNext(fromAuto=false){
      // If at end, show end screen
      if (idx >= steps.length){
        renderEndScreen();
        return;
      }

      const step = steps[idx];

      // If step is answer-type and not answered yet, block manual Next
      if (!fromAuto){
        if (["mcq","fill_blank","number_line","match_pairs","interactive_drag"].includes(step?.type)){
          if (!stepAnswers[idx]){
            hintLine.textContent = "Have a go at this step first.";
            return;
          }
        }
      }

      // push history
      visited.push(idx);

      idx = findNextValidIndex(idx + 1);
      renderStep();
    }

    function goBack(){
      if (!visited.length){
        // fallback to previous valid
        idx = findPrevValidIndex(idx - 1);
        renderStep();
        return;
      }
      idx = visited.pop();
      idx = findPrevValidIndex(idx);
      renderStep();
    }

    backBtn.addEventListener("click", goBack);

    nextBtn.addEventListener("click", () => goNext(false));

    finishBtn.addEventListener("click", () => {
      window.location.href = "/lessons.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How Lessons work:\n\n" +
        "• Do one small step at a time.\n" +
        "• Most steps move on automatically when you answer.\n" +
        "• You can use Read aloud if you want.\n\n" +
        "No pressure. You can finish any time."
      );
    });

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    // ---------- read aloud ----------
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function extractSpeakText(step){
      if (!step) return "";
      if (step.type === "mcq") return step.prompt || "";
      if (step.type === "fill_blank"){
        const sentence = String(step.sentence || "").trim();
        return sentence ? `${step.prompt ? step.prompt + " " : ""}${sentence.replace("___", "blank")}` : (step.prompt || "");
      }
      return step.text || step.prompt || "";
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        let text = stripEmojis(extractSpeakText(step));
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };

        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    speakBtn.addEventListener("click", speakCurrent);

    // ---------- utils ----------
    function shuffle(arr){
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ---------- boot ----------
    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      contextLine.textContent = `Loading a lesson for ${childName}…`;

      // Fetch generated lesson
      try{
        lesson = await fetchGeneratedLesson();
      }catch(e){
        console.error(e);
        showError("Could not load a lesson right now.");
        lessonTextEl.textContent =
          "We couldn’t load a lesson.\n\n" +
          "Please try again in a moment.\n\n" +
          "If this keeps happening, the lesson generator worker may be offline.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      steps = Array.isArray(lesson.steps) ? lesson.steps : [];
      if (!steps.length){
        showError("Lesson returned no steps.");
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      // Skip any broken steps up front
      steps = steps.filter(s => !!s); // remove nulls

      idx = findNextValidIndex(0);
      visited = [];
      xp = 0;
      stepAnswers = {};

      const title = lesson.title ? ` — ${lesson.title}` : "";
      contextLine.textContent = `${SUBJECT} • ${AREA}${title}`;

      nextBtn.disabled = false;
      backBtn.disabled = false;

      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
</body>
</html>
