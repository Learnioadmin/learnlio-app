<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh:1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width:981px){ body{ overflow:hidden; } }

    /* Logged-in nav (same as Tutor) */
    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width:980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height:unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .hintBadge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:900;
      font-size:13px;
      color:var(--muted);
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: 999px;
      padding: 8px 10px;
      box-shadow: 0 10px 14px rgba(2,6,23,.05);
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
      transition: width .25s ease;
    }

    /* Common answer tiles */
    .grid1{ display:grid; grid-template-columns: 1fr; gap:10px; }
    .opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
      user-select:none;
    }
    .opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .opt.disabled{ opacity:.6; cursor:not-allowed; transform:none; }
    .opt.good{ border-color: rgba(16,185,129,.45); box-shadow: 0 14px 24px rgba(16,185,129,.14); }
    .opt.bad{ border-color: rgba(239,68,68,.45); box-shadow: 0 14px 24px rgba(239,68,68,.10); }

    .letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }

    .notice{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px 12px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }

    /* Fill blank */
    .sentenceBox{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.05);
      line-height:1.75;
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
    }
    .blank{
      display:inline-flex;
      min-width: 72px;
      padding: 0 10px;
      border-radius: 12px;
      border: 2px dashed rgba(11,92,255,.35);
      background: rgba(11,92,255,.06);
      font-weight:950;
      justify-content:center;
      align-items:center;
      height: 34px;
      vertical-align: middle;
    }

    /* Number line */
    .numLineWrap{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.05);
    }
    .line{
      position: relative;
      height: 44px;
      margin-top: 10px;
      border-radius: 999px;
      background: rgba(15,23,42,.06);
      border: 1px solid rgba(15,23,42,.10);
      overflow:hidden;
    }
    .tick{
      position:absolute;
      top:0; bottom:0;
      width:1px;
      background: rgba(15,23,42,.20);
    }
    .tickLbl{
      position:absolute;
      top: -18px;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
      font-weight: 850;
      user-select:none;
    }
    .dot{
      position:absolute;
      top:50%;
      transform: translate(-50%, -50%);
      width: 18px; height: 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--brand2), var(--brand));
      box-shadow: 0 10px 16px rgba(11,92,255,.25);
      border: 2px solid rgba(255,255,255,.95);
      cursor:pointer;
      transition: transform .08s ease;
    }
    .dot:hover{ transform: translate(-50%, -50%) scale(1.05); }

    /* Match pairs */
    .pairGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width:520px){ .pairGrid{ grid-template-columns: 1fr; } }
    .pairCol{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 18px rgba(2,6,23,.05);
      min-height: 140px;
    }
    .pairTitle{
      font-size: 12px;
      font-weight: 950;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing:.2px;
      margin: 2px 0 8px;
    }
    .chip{
      border:1px solid rgba(15,23,42,.12);
      border-radius: 14px;
      padding: 10px 10px;
      margin: 8px 0;
      cursor:pointer;
      background: #fff;
      font-weight: 950;
      box-shadow: 0 10px 16px rgba(2,6,23,.05);
      user-select:none;
    }
    .chip.active{ outline: 3px solid rgba(11,92,255,.22); background: rgba(11,92,255,.06); }
    .chip.matched{ opacity:.55; cursor:default; }
    .pairStatus{
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Interactive drag (simple tap-to-place version) */
    .dragZone{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.05);
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .slots{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .slot{
      min-width: 92px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 2px dashed rgba(15,23,42,.18);
      background: rgba(15,23,42,.03);
      font-weight: 950;
      color: var(--muted);
      cursor:pointer;
      user-select:none;
    }
    .slot.filled{
      border-style: solid;
      background: rgba(11,92,255,.06);
      border-color: rgba(11,92,255,.22);
      color: var(--ink);
    }
    .tokens{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .token{
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.12);
      background:#fff;
      font-weight: 950;
      cursor:pointer;
      box-shadow: 0 10px 16px rgba(2,6,23,.05);
      user-select:none;
    }
    .token.used{ opacity:.55; cursor:default; }
    .selected{
      outline: 3px solid rgba(11,92,255,.22);
      background: rgba(11,92,255,.06);
    }

    /* End screen */
    .endCard{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
    }
    .endTitle{
      font-weight: 950;
      font-size: 16px;
      margin: 0 0 6px;
    }
    .endSub{
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 10px;
      font-size: 14px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div class="row" style="justify-content:space-between;">
              <span id="flowHint" class="hintBadge">👆 Tap an answer to continue</span>
              <button id="skipBtn" class="btn ghost" type="button" style="display:none;">Skip step</button>
            </div>

            <div id="lessonText" class="lessonText"></div>

            <div id="mount" class="grid1" style="display:none;"></div>

            <div id="endMount" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Steady effort. Calm steps.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

    const LESSON_GEN_BASE = "https://learnlio-lessons.falling-grass-34ab.workers.dev";
    const LESSON_GEN_ENDPOINT = `${LESSON_GEN_BASE.replace(/\/+$/,"")}/generate`;

    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mount = document.getElementById("mount");
    const endMount = document.getElementById("endMount");
    const hintLine = document.getElementById("hintLine");
    const flowHint = document.getElementById("flowHint");
    const skipBtn = document.getElementById("skipBtn");

    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // State
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    let SUBJECT = null;
    let AREA = null;

    let lesson = null;
    let steps = [];
    let idx = 0;

    let stepAnswers = {}; // idx -> payload
    let xp = 0;

    let currentAudio = null;
    let autoAdvanceTimer = null;

    // For match_pairs
    let mp_leftSelected = null;
    let mp_rightSelected = null;
    let mp_matches = {}; // leftIndex -> rightIndex
    let mp_done = new Set();

    // For interactive_drag
    let drag_selectedToken = null;
    let drag_slots = []; // value or null
    let drag_used = new Set();

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try{
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    function normalizeLessonResponse(json){
      if (!json) return null;
      if (json.ok === false) throw new Error(json.error || "Lesson worker returned ok:false");
      if (json.lesson && typeof json.lesson === "object"){
        const L = json.lesson;
        return { title: L.title || json.title, steps: L.steps || L.steps_json?.steps || L.steps_json || L.steps };
      }
      return { title: json.title, steps: json.steps };
    }

    async function fetchGeneratedLesson(){
      const payload = {
        ownerId: currentUser.id,
        childId: child.id,
        childName,
        age: childAge,
        subject: SUBJECT,
        area: AREA,
        wantInteractive: true,
        allowedTypes: ["intro","teach","mcq","fill_blank","match_pairs","number_line","interactive_drag","finish"]
      };

      let lastErr = null;
      for (let attempt=1; attempt<=2; attempt++){
        try{
          const r = await fetch(LESSON_GEN_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type":"application/json" },
            body: JSON.stringify(payload)
          });

          const text = await r.text().catch(()=> "");
          let json = null;
          try{ json = text ? JSON.parse(text) : null; }catch{}

          if (!r.ok){
            throw new Error((json && (json.error || json.message)) || text || `Lesson generation failed (${r.status})`);
          }

          const L = normalizeLessonResponse(json);
          const st = Array.isArray(L?.steps) ? L.steps : [];
          if (!st.length) throw new Error("Lesson worker returned no steps.");
          return { title: L.title || null, steps: st };
        }catch(e){
          lastErr = e;
          await new Promise(res => setTimeout(res, attempt === 1 ? 250 : 0));
        }
      }
      throw lastErr || new Error("Lesson generation failed.");
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      xpLine.textContent = `XP: ${xp}`;
    }

    function clearMount(){
      mount.style.display = "none";
      mount.innerHTML = "";
      endMount.style.display = "none";
      endMount.innerHTML = "";
      skipBtn.style.display = "none";
      flowHint.style.display = "inline-flex";
      hintLine.textContent = "";
      clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = null;

      // reset per-step helpers
      mp_leftSelected = null;
      mp_rightSelected = null;
      mp_matches = {};
      mp_done = new Set();
      drag_selectedToken = null;
      drag_slots = [];
      drag_used = new Set();
    }

    function isAnswered(i){ return stepAnswers[i] != null; }

    function setFlowHintForStep(step){
      // Reduce reliance on Next for interactive steps
      if (!step) { flowHint.textContent = "—"; return; }
      if (step.type === "intro" || step.type === "teach"){
        flowHint.textContent = "➡️ Press Next when ready";
      } else if (step.type === "finish"){
        flowHint.textContent = "✅ You’re at the end";
      } else {
        flowHint.textContent = "👆 Tap an answer to continue";
      }
    }

    function safeAutoAdvance(delayMs=650){
      clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = setTimeout(() => {
        // Move forward unless already finished
        if (idx < steps.length - 1){
          idx += 1;
          renderStep();
        } else {
          // if last step isn't finish, show end screen
          showEndScreen();
        }
      }, delayMs);
    }

    function disableNavWhileAuto(){
      // Prevent “double next”
      nextBtn.disabled = true;
      setTimeout(() => { nextBtn.disabled = false; }, 650);
    }

    // ---------- Step renderers ----------
    function renderIntroTeachFinish(step){
      lessonTextEl.textContent = step.text || "";
      mount.style.display = "none";

      setFlowHintForStep(step);

      if (step.type === "finish"){
        nextBtn.textContent = "✅ Complete";
        hintLine.textContent = "Nice work. Tap complete.";
      } else {
        nextBtn.textContent = "➡️ Next";
        hintLine.textContent = step.type === "intro" ? "We’ll go step by step." : "Take your time.";
      }
    }

    function renderMCQ(step){
      const prompt = step.prompt || "";
      const choices = Array.isArray(step.choices) ? step.choices : [];
      if (!prompt || choices.length < 2){
        return renderBrokenStep("This question didn’t load properly.");
      }

      lessonTextEl.textContent = prompt;
      mount.style.display = "block";
      mount.innerHTML = "";
      nextBtn.textContent = "➡️ Next";
      setFlowHintForStep(step);

      const letters = ["A","B","C","D","E","F"];
      choices.forEach((choice, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt";
        btn.innerHTML = `<span class="letter">${letters[i] || ""}</span><span style="line-height:1.45;">${choice}</span>`;
        btn.addEventListener("click", () => {
          if (isAnswered(idx)) return;
          const correctIndex = Number(step.correctIndex);
          const isCorrect = (i === correctIndex);

          stepAnswers[idx] = { type:"mcq", pickedIndex:i, isCorrect };
          xp += isCorrect ? 10 : 6;

          // feedback
          btn.classList.add(isCorrect ? "good" : "bad");
          hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
          disableAllOpts(mount);
          disableNavWhileAuto();
          safeAutoAdvance();
          setProgressUI();
        });
        mount.appendChild(btn);
      });

      // If already answered (going back)
      if (isAnswered(idx)){
        hintLine.textContent = stepAnswers[idx].isCorrect ? "Nice ✅" : "Good try 💛";
      }
    }

    function renderFillBlank(step){
      // Expected formats we handle:
      // A) step.sentence contains "___" or "{blank}"
      // B) step.prompt is the sentence
      // Options: step.choices or step.options
      const sentence = (step.sentence || step.prompt || "").trim();
      const opts = (Array.isArray(step.choices) ? step.choices : (Array.isArray(step.options) ? step.options : []));
      const correctIndex = Number(step.correctIndex);

      if (!sentence || opts.length < 2){
        return renderBrokenStep("This fill-in step didn’t include a sentence or options.");
      }

      // Ensure there is a visible blank
      let displaySentence = sentence;
      const hasBlank = displaySentence.includes("___") || displaySentence.includes("{blank}") || displaySentence.includes("[blank]");
      if (!hasBlank){
        // If worker forgot the blank marker, we inject one at the end
        displaySentence = displaySentence + " ___";
      }
      displaySentence = displaySentence
        .replaceAll("{blank}", "___")
        .replaceAll("[blank]", "___");

      lessonTextEl.textContent = "Complete the sentence:";
      mount.style.display = "block";
      mount.innerHTML = "";

      const box = document.createElement("div");
      box.className = "sentenceBox";
      box.innerHTML = escapeHtml(displaySentence).replaceAll("___", `<span class="blank" id="blankSpot">___</span>`);
      mount.appendChild(box);

      const grid = document.createElement("div");
      grid.className = "grid1";
      grid.style.marginTop = "10px";

      const letters = ["A","B","C","D","E","F"];
      opts.forEach((o, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt";
        btn.innerHTML = `<span class="letter">${letters[i] || ""}</span><span style="line-height:1.45;">${o}</span>`;
        btn.addEventListener("click", () => {
          if (isAnswered(idx)) return;

          const isCorrect = (i === correctIndex);
          stepAnswers[idx] = { type:"fill_blank", pickedIndex:i, isCorrect, chosen:o };
          xp += isCorrect ? 10 : 6;

          // show chosen in blank
          const blankSpot = document.getElementById("blankSpot");
          if (blankSpot){
            blankSpot.textContent = o;
            blankSpot.style.borderStyle = "solid";
            blankSpot.style.borderColor = isCorrect ? "rgba(16,185,129,.45)" : "rgba(239,68,68,.45)";
            blankSpot.style.background = isCorrect ? "rgba(16,185,129,.10)" : "rgba(239,68,68,.06)";
          }

          btn.classList.add(isCorrect ? "good" : "bad");
          hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
          disableAllOpts(grid);
          disableNavWhileAuto();
          safeAutoAdvance();
          setProgressUI();
        });
        grid.appendChild(btn);
      });

      mount.appendChild(grid);

      nextBtn.textContent = "➡️ Next";
      setFlowHintForStep(step);

      // if already answered (going back)
      if (isAnswered(idx)){
        hintLine.textContent = stepAnswers[idx].isCorrect ? "Nice ✅" : "Good try 💛";
      }
    }

    function renderNumberLine(step){
      // Expected:
      // step.min, step.max, step.target OR step.correctValue
      // Optional prompt
      const prompt = (step.prompt || "Tap the correct number on the number line.").trim();
      const min = Number(step.min ?? step.start ?? 0);
      const max = Number(step.max ?? step.end ?? 10);
      const target = Number(step.target ?? step.correctValue ?? step.answer);

      if (!Number.isFinite(min) || !Number.isFinite(max) || !Number.isFinite(target) || max <= min){
        return renderBrokenStep("This number line step didn’t include valid numbers.");
      }

      lessonTextEl.textContent = prompt;
      mount.style.display = "block";
      mount.innerHTML = "";

      const wrap = document.createElement("div");
      wrap.className = "numLineWrap";

      const meta = document.createElement("div");
      meta.className = "tiny";
      meta.textContent = `Pick the number between ${min} and ${max}.`;
      wrap.appendChild(meta);

      const line = document.createElement("div");
      line.className = "line";

      const count = (max - min);
      for (let i=0;i<=count;i++){
        const v = min + i;
        const xPct = (i / count) * 100;

        const t = document.createElement("div");
        t.className = "tick";
        t.style.left = `${xPct}%`;
        line.appendChild(t);

        if (i % Math.max(1, Math.round(count/5)) === 0 || v===min || v===max){
          const lbl = document.createElement("div");
          lbl.className = "tickLbl";
          lbl.style.left = `${xPct}%`;
          lbl.textContent = String(v);
          line.appendChild(lbl);
        }

        // make each number clickable by placing transparent button area
        const hit = document.createElement("div");
        hit.style.position = "absolute";
        hit.style.left = `${xPct}%`;
        hit.style.top = "0";
        hit.style.bottom = "0";
        hit.style.width = `${100/count}%`;
        hit.style.transform = "translateX(-50%)";
        hit.style.cursor = "pointer";
        hit.title = `Select ${v}`;
        hit.addEventListener("click", () => {
          if (isAnswered(idx)) return;

          const isCorrect = (v === target);
          stepAnswers[idx] = { type:"number_line", chosen:v, isCorrect };
          xp += isCorrect ? 10 : 6;

          // place dot where tapped
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.left = `${xPct}%`;
          dot.style.background = isCorrect
            ? "linear-gradient(180deg, rgba(16,185,129,.95), rgba(34,197,94,.95))"
            : "linear-gradient(180deg, rgba(239,68,68,.95), rgba(239,68,68,.85))";
          line.appendChild(dot);

          hintLine.textContent = isCorrect ? "Nice ✅" : `Good try 💛 (Answer was ${target})`;
          disableNavWhileAuto();
          safeAutoAdvance();
          setProgressUI();
        });
        line.appendChild(hit);
      }

      wrap.appendChild(line);
      mount.appendChild(wrap);

      nextBtn.textContent = "➡️ Next";
      setFlowHintForStep(step);

      if (isAnswered(idx)){
        hintLine.textContent = stepAnswers[idx].isCorrect ? "Nice ✅" : "Good try 💛";
      }
    }

    function renderMatchPairs(step){
      // Expected:
      // step.pairs = [{left,right},...]
      // OR step.leftItems + step.rightItems (and a mapping)
      const prompt = (step.prompt || "Match the pairs.").trim();
      const pairs = Array.isArray(step.pairs) ? step.pairs : null;

      let leftItems = [];
      let rightItems = [];
      let answerMap = {}; // leftIndex -> rightIndex

      if (pairs && pairs.length >= 2){
        leftItems = pairs.map(p => String(p.left));
        rightItems = pairs.map(p => String(p.right));
        // shuffle right but keep mapping
        const rightShuf = rightItems.map((v,i)=>({v,i}));
        shuffleInPlace(rightShuf);
        rightItems = rightShuf.map(x=>x.v);
        // mapping: for each left i, find where its correct right landed
        pairs.forEach((p, li) => {
          const correctRight = String(p.right);
          const ri = rightItems.indexOf(correctRight);
          answerMap[li] = ri;
        });
      } else {
        // alternate format
        if (Array.isArray(step.leftItems) && Array.isArray(step.rightItems) && step.leftItems.length>=2){
          leftItems = step.leftItems.map(String);
          rightItems = step.rightItems.map(String);
          // if mapping provided as indices
          if (step.mapping && typeof step.mapping === "object"){
            answerMap = step.mapping;
          } else {
            // can't grade without mapping; still allow matching but mark ungraded
            answerMap = null;
          }
        } else {
          return renderBrokenStep("This match step didn’t include pairs to match.");
        }
      }

      lessonTextEl.textContent = prompt;
      mount.style.display = "block";
      mount.innerHTML = "";

      const grid = document.createElement("div");
      grid.className = "pairGrid";

      const colL = document.createElement("div");
      colL.className = "pairCol";
      colL.innerHTML = `<div class="pairTitle">Left</div>`;

      const colR = document.createElement("div");
      colR.className = "pairCol";
      colR.innerHTML = `<div class="pairTitle">Right</div>`;

      const status = document.createElement("div");
      status.className = "pairStatus";
      status.textContent = "Tap one on the left, then tap its match on the right.";

      // Build chips
      const leftChips = leftItems.map((txt, i) => {
        const c = document.createElement("div");
        c.className = "chip";
        c.textContent = txt;
        c.addEventListener("click", () => {
          if (mp_done.has(i)) return;
          mp_leftSelected = i;
          // UI
          leftChips.forEach((x,ix)=> x.classList.toggle("active", ix===i && !mp_done.has(ix)));
          status.textContent = "Now tap the matching one on the right.";
        });
        colL.appendChild(c);
        return c;
      });

      const rightChips = rightItems.map((txt, i) => {
        const c = document.createElement("div");
        c.className = "chip";
        c.textContent = txt;
        c.addEventListener("click", () => {
          if (mp_leftSelected == null) return;
          if (mp_done.has(mp_leftSelected)) return;

          mp_rightSelected = i;
          const li = mp_leftSelected;
          mp_matches[li] = i;
          mp_done.add(li);

          // lock chosen left and right visually
          leftChips[li].classList.remove("active");
          leftChips[li].classList.add("matched");
          rightChips[i].classList.add("matched");

          mp_leftSelected = null;
          mp_rightSelected = null;

          const total = leftItems.length;
          const done = mp_done.size;

          status.textContent = done < total
            ? `Nice. ${done}/${total} matched. Keep going.`
            : "All matched ✅";

          // When all matched, score & auto-advance
          if (done === total && !isAnswered(idx)){
            let isCorrect = true;
            if (answerMap){
              for (let k=0;k<total;k++){
                if (mp_matches[k] !== Number(answerMap[k])) { isCorrect = false; break; }
              }
            } else {
              isCorrect = true; // ungraded mode
            }

            stepAnswers[idx] = { type:"match_pairs", matches: mp_matches, isCorrect };
            xp += isCorrect ? 12 : 8;
            hintLine.textContent = isCorrect ? "Nice matching ✅" : "Good try 💛";
            disableNavWhileAuto();
            safeAutoAdvance(800);
            setProgressUI();
          }
        });
        colR.appendChild(c);
        return c;
      });

      grid.appendChild(colL);
      grid.appendChild(colR);

      mount.appendChild(grid);
      mount.appendChild(status);

      nextBtn.textContent = "➡️ Next";
      setFlowHintForStep(step);

      // Important: your “last box not clickable” bug usually happens when an element overlays it.
      // This layout avoids overlays: no absolute elements above the chips.
    }

    function renderInteractiveDrag(step){
      // We implement a simple “tap a token, then tap a slot” (mobile-friendly, no HTML5 drag bugs).
      // Expected:
      // step.tokens: [...]
      // step.slots: [...]
      // step.correct: array mapping slotIndex -> tokenValue  OR step.answerMap object
      const prompt = (step.prompt || "Place the items into the right spots.").trim();
      const tokens = Array.isArray(step.tokens) ? step.tokens.map(String) : [];
      const slots = Array.isArray(step.slots) ? step.slots.map(String) : [];

      if (tokens.length < 2 || slots.length < 1){
        return renderBrokenStep("This drag step didn’t include tokens and slots.");
      }

      // Determine correct map
      let correct = null;
      if (Array.isArray(step.correct)) correct = step.correct.map(String);
      if (!correct && step.answerMap && typeof step.answerMap === "object"){
        // expects { slot0:"x", slot1:"y" } or {0:"x"}
        correct = [];
        for (let i=0;i<slots.length;i++){
          correct[i] = String(step.answerMap[i] ?? step.answerMap[`slot${i}`] ?? "");
        }
      }

      lessonTextEl.textContent = prompt;
      mount.style.display = "block";
      mount.innerHTML = "";

      drag_slots = new Array(slots.length).fill(null);
      drag_used = new Set();
      drag_selectedToken = null;

      const zone = document.createElement("div");
      zone.className = "dragZone";

      const slotsWrap = document.createElement("div");
      slotsWrap.className = "slots";

      const slotEls = slots.map((label, i) => {
        const s = document.createElement("div");
        s.className = "slot";
        s.textContent = label + ": ___";
        s.addEventListener("click", () => {
          if (!drag_selectedToken) return;
          if (drag_slots[i] != null) return;

          const token = drag_selectedToken;
          drag_slots[i] = token;
          drag_used.add(token);
          drag_selectedToken = null;

          s.classList.add("filled");
          s.textContent = label + ": " + token;

          renderTokens();

          // if all filled, score + auto-advance
          if (drag_slots.every(v => v != null) && !isAnswered(idx)){
            let isCorrect = true;
            if (correct){
              for (let k=0;k<correct.length;k++){
                if (String(drag_slots[k] || "") !== String(correct[k] || "")) { isCorrect = false; break; }
              }
            }
            stepAnswers[idx] = { type:"interactive_drag", placed: drag_slots, isCorrect };
            xp += isCorrect ? 12 : 8;
            hintLine.textContent = isCorrect ? "Nice placing ✅" : "Good try 💛";
            disableNavWhileAuto();
            safeAutoAdvance(800);
            setProgressUI();
          }
        });
        slotsWrap.appendChild(s);
        return s;
      });

      const tokensWrap = document.createElement("div");
      tokensWrap.className = "tokens";

      function renderTokens(){
        tokensWrap.innerHTML = "";
        tokens.forEach(t => {
          const el = document.createElement("div");
          el.className = "token";
          if (drag_used.has(t)) el.classList.add("used");
          if (drag_selectedToken === t) el.classList.add("selected");
          el.textContent = t;
          el.addEventListener("click", () => {
            if (drag_used.has(t)) return;
            drag_selectedToken = (drag_selectedToken === t) ? null : t;
            renderTokens();
          });
          tokensWrap.appendChild(el);
        });
      }

      const tip = document.createElement("div");
      tip.className = "tiny";
      tip.textContent = "Tap a token, then tap where it goes.";

      const reset = document.createElement("button");
      reset.type = "button";
      reset.className = "btn ghost";
      reset.textContent = "Reset";
      reset.addEventListener("click", () => {
        drag_slots = new Array(slots.length).fill(null);
        drag_used = new Set();
        drag_selectedToken = null;
        slotEls.forEach((s, i) => {
          s.className = "slot";
          s.textContent = slots[i] + ": ___";
        });
        renderTokens();
        hintLine.textContent = "";
      });

      const topRow = document.createElement("div");
      topRow.className = "row";
      topRow.style.justifyContent = "space-between";
      topRow.appendChild(tip);
      topRow.appendChild(reset);

      zone.appendChild(topRow);
      zone.appendChild(slotsWrap);
      zone.appendChild(tokensWrap);
      mount.appendChild(zone);

      renderTokens();

      nextBtn.textContent = "➡️ Next";
      setFlowHintForStep(step);
    }

    function renderBrokenStep(message){
      lessonTextEl.textContent = "";
      mount.style.display = "block";
      mount.innerHTML = `
        <div class="notice">
          <b>Hmm…</b><br>
          ${escapeHtml(message)}<br><br>
          You can skip this step and keep going.
        </div>
      `;
      skipBtn.style.display = "inline-flex";
      skipBtn.onclick = () => {
        // mark as skipped but allow forward
        if (!isAnswered(idx)){
          stepAnswers[idx] = { type:"skipped", isCorrect:true };
        }
        safeAutoAdvance(200);
        setProgressUI();
      };
      hintLine.textContent = "This one didn’t generate properly — skip is fine 💛";
      flowHint.textContent = "➡️ Tap Skip step";
      nextBtn.textContent = "➡️ Next";
    }

    function disableAllOpts(container){
      const buttons = container.querySelectorAll("button, .opt");
      buttons.forEach(b => {
        if (b.tagName === "BUTTON") b.disabled = true;
        b.classList.add("disabled");
      });
    }

    function showEndScreen(){
      clearMount();
      lessonTextEl.textContent = "";
      mount.style.display = "none";
      endMount.style.display = "block";

      const correctCount = Object.values(stepAnswers).filter(a => a && a.isCorrect).length;
      const answeredCount = Object.keys(stepAnswers).length;

      endMount.innerHTML = `
        <div class="endCard">
          <div class="endTitle">✅ Lesson finished</div>
          <div class="endSub">
            Nice steady work, ${escapeHtml(childName)}.<br>
            You earned <b>${xp}</b> XP today.
          </div>
          <div class="row" style="margin-top:10px;">
            <button id="doneTodayBtn" class="btn light" type="button">Done for today</button>
            <button id="anotherBtn" class="btn" type="button">Try another lesson</button>
            <a class="btn ghost" href="/lessons.html" style="text-decoration:none;">Back to Lessons</a>
          </div>
          <div class="tiny" style="margin-top:12px;">
            Score (soft): ${correctCount} good answers out of ${answeredCount} steps you completed.
          </div>
        </div>
      `;

      document.getElementById("doneTodayBtn").onclick = () => window.location.href = "/dash.html";
      document.getElementById("anotherBtn").onclick = () => window.location.href = "/lessons.html";

      nextBtn.disabled = true;
      backBtn.disabled = true;
      flowHint.style.display = "none";
      hintLine.textContent = "Pick what you’d like to do next.";
      setProgressUI();
    }

    function renderStep(){
      clearError();
      clearMount();
      setProgressUI();

      const step = steps[idx];
      if (!step){
        return showEndScreen();
      }

      setFlowHintForStep(step);

      // Determine if this step is answer-tap flow or Next flow
      const needsTapAnswer = ["mcq","fill_blank","number_line","match_pairs","interactive_drag"].includes(step.type);
      nextBtn.disabled = false;
      nextBtn.textContent = needsTapAnswer ? "➡️ Next" : "➡️ Next";

      if (step.type === "intro" || step.type === "teach" || step.type === "finish"){
        return renderIntroTeachFinish(step);
      }
      if (step.type === "mcq"){
        return renderMCQ(step);
      }
      if (step.type === "fill_blank"){
        return renderFillBlank(step);
      }
      if (step.type === "number_line"){
        return renderNumberLine(step);
      }
      if (step.type === "match_pairs"){
        return renderMatchPairs(step);
      }
      if (step.type === "interactive_drag"){
        return renderInteractiveDrag(step);
      }

      // Unknown type -> broken step safe fallback
      return renderBrokenStep(`Unknown step type: ${step.type}`);
    }

    // ----- Read aloud -----
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          const t = await r.text().catch(()=> "");
          console.warn("TTS failed", r.status, t);
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };
        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    // Controls
    backBtn.addEventListener("click", () => {
      if (idx > 0){
        idx -= 1;
        renderStep();
      }
    });

    nextBtn.addEventListener("click", async () => {
      const step = steps[idx];

      // If this is an answer-step, don’t force next (we prefer auto).
      // But allow Next as a fallback only if answered or it’s a text step.
      const needsAnswer = ["mcq","fill_blank","number_line","match_pairs","interactive_drag"].includes(step?.type);

      if (needsAnswer && !isAnswered(idx)){
        hintLine.textContent = "Tap an answer first 💛";
        return;
      }

      if (step?.type === "finish"){
        showEndScreen();
        return;
      }

      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      } else {
        showEndScreen();
      }
    });

    finishBtn.addEventListener("click", () => {
      window.location.href = "/lessons.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Read the step\n" +
        "• Tap an answer (if shown)\n" +
        "• It will move on automatically\n\n" +
        "Tip: Use Read aloud if you want it spoken."
      );
    });

    speakBtn.addEventListener("click", speakCurrent);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    // Utilities
    function shuffleInPlace(arr){
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    function escapeHtml(str){
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      contextLine.textContent = `Creating a lesson for ${childName}…`;

      try{
        lesson = await fetchGeneratedLesson();
      }catch(e){
        console.error("Lesson gen error:", e);
        showError(`Lesson generator error: ${e?.message || "Unknown error"}`);
        lessonTextEl.textContent =
          "We couldn’t load a lesson.\n\n" +
          "Please try again in a moment.\n\n" +
          "If this keeps happening, the lesson generator worker may be offline.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      steps = Array.isArray(lesson.steps) ? lesson.steps : [];
      if (!steps.length){
        showError("Lesson returned no steps.");
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      idx = 0;
      xp = 0;
      stepAnswers = {};

      const title = lesson.title ? ` — ${lesson.title}` : "";
      contextLine.textContent = `${SUBJECT} • ${AREA}${title}`;

      nextBtn.disabled = false;
      backBtn.disabled = false;
      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
</body>
</html>
