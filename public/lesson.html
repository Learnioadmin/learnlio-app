<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    /* Logged-in nav (same as Tutor) */
    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:4px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    .notice{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px 12px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    /* Fill blank */
    .fillWrap{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .fillSentence{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.75;
    }
    .fillOptions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .chipBtn{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(15,23,42,.12);
      background: rgba(248,250,252,.95);
      cursor:pointer;
      font-weight:950;
      box-shadow: 0 10px 14px rgba(2,6,23,.05);
    }
    .chipBtn:hover{ border-color: rgba(11,92,255,.22); }

    /* Match pairs */
    .pairsGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width: 520px){
      .pairsGrid{ grid-template-columns: 1fr; }
    }
    .pairCol{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      min-height: 80px;
    }
    .pairColTitle{
      font-size: 12px;
      color: var(--muted);
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .2px;
      margin: 4px 4px 10px;
    }
    .pairBtn{
      width:100%;
      text-align:left;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(15,23,42,.12);
      background: rgba(248,250,252,.95);
      cursor:pointer;
      font-weight: 950;
      box-shadow: 0 10px 14px rgba(2,6,23,.05);
      margin-bottom:8px;
    }
    .pairBtn:last-child{ margin-bottom:0; }
    .pairBtn:hover{ border-color: rgba(11,92,255,.22); }
    .pairBtn.selected{
      outline: 2px solid rgba(11,92,255,.35);
      border-color: rgba(11,92,255,.35);
      background: rgba(11,92,255,.08);
    }
    .pairBtn.matched{
      opacity: .55;
      cursor: default;
    }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>

            <div id="mcq" class="mcq" style="display:none;"></div>

            <!-- Interactive mount (NO IMAGES) -->
            <div id="interactiveMount" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Small steps. You’re doing great.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Next</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Done for today</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev/generate";
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // Auth/child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Context
    let SUBJECT = null;
    let AREA = null;

    // Lesson runtime
    let lesson = null;
    let steps = [];
    let idx = 0;
    let stepAnswers = {};
    let xp = 0;

    // Audio
    let currentAudio = null;

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      xpLine.textContent = `XP: ${xp}`;
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
    }

    function looksLikeImageQuestion(step){
      const t = (step?.prompt || step?.text || step?.sentence || "").toLowerCase();
      // remove anything that implies a picture, image, diagram etc
      return (
        t.includes("picture") ||
        t.includes("image") ||
        t.includes("diagram") ||
        t.includes("shown") ||
        t.includes("in the photo") ||
        t.includes("in the image")
      );
    }

    function sanitiseLesson(raw){
      const safe = { ...(raw || {}) };
      let s = Array.isArray(safe.steps) ? safe.steps.slice() : [];

      // Drop any image/picture steps entirely for now
      s = s.filter(step => !looksLikeImageQuestion(step));

      // Keep only supported types
      const allowed = new Set(["intro","teach","mcq","fill_blank","match_pairs","finish"]);
      s = s.filter(step => allowed.has(String(step?.type || "").trim()));

      // Fix/validate each step; invalid ones become null and are removed.
      s = s.map(step => {
        const type = String(step.type || "").trim();

        if (type === "intro" || type === "teach" || type === "finish"){
          const text = String(step.text || "").trim();
          if (!text) return null;
          return { type, text };
        }

        if (type === "mcq"){
          const prompt = String(step.prompt || "").trim();
          const choices = Array.isArray(step.choices) ? step.choices.map(x => String(x)).filter(Boolean) : [];
          const ci = Number(step.correctIndex);
          if (!prompt || choices.length < 2 || !Number.isFinite(ci) || ci < 0 || ci >= choices.length) return null;
          return {
            type,
            prompt,
            choices: choices.slice(0, 6),
            correctIndex: ci,
            hint: String(step.hint || "").trim(),
            explainCorrect: String(step.explainCorrect || "").trim()
          };
        }

        if (type === "fill_blank"){
          const sentence = String(step.sentence || "").trim();
          // allow either options[] OR answer
          const answer = String(step.answer || "").trim();
          const options = Array.isArray(step.options) ? step.options.map(x => String(x)).filter(Boolean) : [];
          const prompt = String(step.prompt || "Complete the sentence.").trim();

          // Must have sentence that includes ___
          if (!sentence || !sentence.includes("___")) return null;

          // If options missing, create 4 options from answer (simple) so UI has choices
          let finalOptions = options.slice(0, 6);
          if (!finalOptions.length && answer){
            // create gentle distractors for single-word answers
            const a = answer.toLowerCase();
            const distract = [
              a,
              a + "s",
              a.replace(/s$/,""),
              a === "a" ? "the" : "a"
            ].filter((v,i,arr)=>arr.indexOf(v)===i);
            finalOptions = distract.slice(0,4);
          }

          if (!answer && !finalOptions.length) return null;

          return { type, prompt, sentence, answer, options: finalOptions, hint: String(step.hint || "").trim() };
        }

        if (type === "match_pairs"){
          const prompt = String(step.prompt || "Match the pairs.").trim();
          const pairs = Array.isArray(step.pairs) ? step.pairs : [];
          const cleaned = pairs
            .map(p => ({ left: String(p.left||"").trim(), right: String(p.right||"").trim() }))
            .filter(p => p.left && p.right)
            .slice(0, 6);
          if (cleaned.length < 2) return null;
          return { type, prompt, pairs: cleaned, hint: String(step.hint || "").trim() };
        }

        return null;
      }).filter(Boolean);

      // Guarantee finish step
      const hasFinish = s.some(x => x.type === "finish");
      if (!hasFinish) s.push({ type:"finish", text:"Nice work. You kept going, step by step." });

      safe.steps = s;
      return safe;
    }

    async function fetchGeneratedLesson(){
      const payload = {
        subject: SUBJECT,
        area: AREA,
        age: childAge,
        level: 1,
        owner_id: currentUser.id,
        child_id: child.id,

        // Important: remove image-related types
        wantInteractive: true,
        allowedTypes: ["intro","teach","mcq","fill_blank","match_pairs","finish"],

        // Also hint to generator to avoid image questions
        noImages: true
      };

      const r = await fetch(LESSON_GEN_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const text = await r.text().catch(()=> "");
      let json = null;
      try{ json = text ? JSON.parse(text) : null; }catch{}

      if (!r.ok){
        const msg = json?.error || text || `Lesson generation failed (${r.status})`;
        throw new Error(msg);
      }

      const lessonObj = json?.lesson || json;
      const fixed = sanitiseLesson(lessonObj);

      if (!fixed?.steps?.length) throw new Error("Lesson had no usable steps.");

      return fixed;
    }

    function autoAdvanceSoon(ms=650){
      setTimeout(() => {
        if (idx < steps.length - 1){
          idx += 1;
          renderStep();
        } else {
          // already at end
          renderStep();
        }
      }, ms);
    }

    // -------------------------
    // RENDER
    // -------------------------
    function renderStep(){
      clearError();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";
      clearInteractive();

      nextBtn.disabled = false;
      backBtn.disabled = false;

      if (!steps.length){
        lessonTextEl.textContent = "No lesson steps found.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      const step = steps[idx];
      setProgressUI();

      if (!step){
        lessonTextEl.textContent = "Finished.";
        return;
      }

      // Text
      if (step.type === "intro" || step.type === "teach"){
        lessonTextEl.textContent = step.text || "";
        nextBtn.textContent = "➡️ Next";
        // Make it feel less “clicky”: if it’s a short intro/teach, auto-advance after a moment (but still allow control)
        if ((step.text || "").length < 90) {
          hintLine.textContent = "Take a moment. Then we’ll continue.";
        }
        return;
      }

      // Finish = end screen
      if (step.type === "finish"){
        nextBtn.textContent = "✅ Finish lesson";
        lessonTextEl.textContent = (step.text || `Nice work, ${childName}.`) + "\n\nWhat would you like to do next?";
        interactiveMount.style.display = "block";
        interactiveMount.innerHTML = `
          <div class="fillWrap">
            <button class="pill primary" id="doneTodayBtn" type="button">✅ Done for today</button>
            <button class="pill" id="anotherBtn" type="button">✨ Try another lesson</button>
            <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center; justify-content:center;">📘 Back to Lessons</a>
          </div>
        `;
        const doneTodayBtn = document.getElementById("doneTodayBtn");
        const anotherBtn = document.getElementById("anotherBtn");
        doneTodayBtn.onclick = () => window.location.href = "/dash.html";
        anotherBtn.onclick = () => window.location.href = `/lesson.html?subject=${encodeURIComponent(SUBJECT)}&area=${encodeURIComponent(AREA)}&t=${Date.now()}`;
        return;
      }

      // MCQ
      if (step.type === "mcq"){
        lessonTextEl.textContent = step.prompt || "";
        mcqEl.style.display = "grid";
        nextBtn.textContent = "➡️ Next";

        const letters = ["A","B","C","D","E","F"];
        (step.choices || []).forEach((choice, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-opt";
          btn.innerHTML = `<span class="mcq-letter">${letters[i] || ""}</span><span class="mcq-text">${choice}</span>`;
          btn.addEventListener("click", () => chooseMCQ(i));
          mcqEl.appendChild(btn);
        });

        const saved = stepAnswers[idx];
        if (saved){
          hintLine.textContent = saved.isCorrect ? "Nice — that was correct ✅" : "Good try 💛";
        }
        return;
      }

      // Fill blank (chip options)
      if (step.type === "fill_blank"){
        const sentence = step.sentence || "";
        const options = Array.isArray(step.options) ? step.options : [];

        if (!sentence || !sentence.includes("___") || (!options.length && !step.answer)){
          // Should not happen after sanitise, but safe fallback
          lessonTextEl.textContent = "Let’s skip this one and keep going.";
          hintLine.textContent = "That step didn’t load properly.";
          autoAdvanceSoon(500);
          return;
        }

        lessonTextEl.textContent = step.prompt || "Complete the sentence.";
        interactiveMount.style.display = "block";
        interactiveMount.innerHTML = `
          <div class="fillWrap">
            <div class="fillSentence">${escapeHtml(sentence)}</div>
            <div class="fillOptions" id="fillOptions"></div>
            <div class="tiny" id="fillHint">${escapeHtml(step.hint || "Pick the word that fits best.")}</div>
          </div>
        `;

        const host = document.getElementById("fillOptions");
        (options.length ? options : [step.answer]).slice(0,6).forEach(opt => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chipBtn";
          b.textContent = opt;
          b.onclick = () => chooseFillBlank(opt);
          host.appendChild(b);
        });

        nextBtn.textContent = "➡️ Next";
        return;
      }

      // Match pairs
      if (step.type === "match_pairs"){
        const pairs = Array.isArray(step.pairs) ? step.pairs : [];
        if (pairs.length < 2){
          lessonTextEl.textContent = "Let’s skip this one and keep going.";
          autoAdvanceSoon(500);
          return;
        }

        lessonTextEl.textContent = step.prompt || "Match the pairs.";

        const lefts = pairs.map(p => p.left);
        const rights = shuffle(pairs.map(p => p.right));

        let selectedLeft = null;
        let selectedRight = null;
        const matchedLeft = new Set();
        const matchedRight = new Set();

        interactiveMount.style.display = "block";
        interactiveMount.innerHTML = `
          <div class="notice">${escapeHtml(step.hint || "Tap one on the left, then one on the right.")}</div>
          <div class="pairsGrid">
            <div class="pairCol">
              <div class="pairColTitle">Left</div>
              <div id="leftCol"></div>
            </div>
            <div class="pairCol">
              <div class="pairColTitle">Right</div>
              <div id="rightCol"></div>
            </div>
          </div>
        `;

        const leftCol = document.getElementById("leftCol");
        const rightCol = document.getElementById("rightCol");

        lefts.forEach(val => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "pairBtn";
          b.textContent = val;
          b.onclick = () => {
            if (matchedLeft.has(val)) return;
            selectedLeft = val;
            refresh();
            tryMatch();
          };
          leftCol.appendChild(b);
        });

        rights.forEach(val => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "pairBtn";
          b.textContent = val;
          b.onclick = () => {
            if (matchedRight.has(val)) return;
            selectedRight = val;
            refresh();
            tryMatch();
          };
          rightCol.appendChild(b);
        });

        function refresh(){
          [...leftCol.children].forEach(btn => {
            const v = btn.textContent;
            btn.classList.toggle("selected", v === selectedLeft);
            btn.classList.toggle("matched", matchedLeft.has(v));
            btn.disabled = matchedLeft.has(v);
          });
          [...rightCol.children].forEach(btn => {
            const v = btn.textContent;
            btn.classList.toggle("selected", v === selectedRight);
            btn.classList.toggle("matched", matchedRight.has(v));
            btn.disabled = matchedRight.has(v);
          });
        }

        function tryMatch(){
          if (!selectedLeft || !selectedRight) return;

          const correctRight = pairs.find(p => p.left === selectedLeft)?.right;
          const ok = (selectedRight === correctRight);

          if (ok){
            matchedLeft.add(selectedLeft);
            matchedRight.add(selectedRight);
            xp += 10;
            hintLine.textContent = "Nice match ✅";
            selectedLeft = null;
            selectedRight = null;
            refresh();

            if (matchedLeft.size === pairs.length){
              // Completed: auto-advance
              stepAnswers[idx] = { done:true, isCorrect:true };
              autoAdvanceSoon(650);
            }
          } else {
            xp += 4;
            hintLine.textContent = "Good try — have another go 💛";
            // clear selection but keep unlocked
            selectedLeft = null;
            selectedRight = null;
            refresh();
          }

          setProgressUI();
        }

        nextBtn.textContent = "➡️ Next";
        return;
      }

      // Any other type should not exist now
      lessonTextEl.textContent = "Let’s keep going.";
      autoAdvanceSoon(400);
    }

    async function chooseMCQ(pickedIndex){
      const step = steps[idx];
      if (!step || step.type !== "mcq") return;

      const correctIndex = Number(step.correctIndex);
      const isCorrect = pickedIndex === correctIndex;

      xp += isCorrect ? 10 : 6;
      stepAnswers[idx] = { pickedIndex, isCorrect };

      hintLine.textContent = isCorrect
        ? (step.explainCorrect ? `Correct ✅ ${step.explainCorrect}` : "Correct ✅")
        : (step.hint ? `Good try 💛 Hint: ${step.hint}` : "Good try 💛");

      setProgressUI();

      // Auto move on (premium feel)
      autoAdvanceSoon(isCorrect ? 700 : 900);
    }

    async function chooseFillBlank(chosen){
      const step = steps[idx];
      if (!step || step.type !== "fill_blank") return;

      const answer = String(step.answer || "").trim().toLowerCase();
      const chosenNorm = String(chosen || "").trim().toLowerCase();

      const isCorrect = answer ? (chosenNorm === answer) : true; // if no answer provided, accept
      xp += isCorrect ? 10 : 6;
      stepAnswers[idx] = { chosen, isCorrect };

      hintLine.textContent = isCorrect ? "Nice ✅" : (step.hint ? `Good try 💛 ${step.hint}` : "Good try 💛");
      setProgressUI();

      autoAdvanceSoon(isCorrect ? 700 : 900);
    }

    // Controls
    backBtn.addEventListener("click", () => {
      if (idx > 0){ idx -= 1; renderStep(); }
    });

    nextBtn.addEventListener("click", () => {
      const step = steps[idx];

      // Don’t block flow hard; if a step is interactive, allow next anyway.
      if (step?.type === "mcq" && !stepAnswers[idx]){
        hintLine.textContent = "Tap an answer first 💛";
        return;
      }

      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      }
    });

    finishBtn.addEventListener("click", () => {
      window.location.href = "/dash.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Read the step\n" +
        "• Tap an answer (if shown)\n\n" +
        "It’s okay to go slowly.\n\n" +
        "Tip: Read aloud plays only when you press the button."
      );
    });

    // ----- Read aloud -----
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.type === "fill_blank") text = (step.prompt || "") + ". " + (step.sentence || "");
        else if (step.type === "match_pairs") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };
        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    speakBtn.addEventListener("click", speakCurrent);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    function escapeHtml(s){
      return String(s || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function shuffle(arr){
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      contextLine.textContent = `Creating a lesson for ${childName}…`;

      try{
        lesson = await fetchGeneratedLesson();
      }catch(e){
        console.error(e);
        showError("Could not load a lesson right now.");
        lessonTextEl.textContent =
          "We couldn’t load a lesson.\n\n" +
          "Please try again in a moment.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      steps = lesson.steps || [];
      idx = 0;
      xp = 0;
      stepAnswers = {};

      const title = lesson.title ? ` — ${lesson.title}` : "";
      contextLine.textContent = `${SUBJECT} • ${AREA}${title}`;
      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
