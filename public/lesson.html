<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:4px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    .notice{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px 12px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

    // Lesson generation Worker
    const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev/generate";

    // Google TTS Worker
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const xpTodayLine = document.getElementById("xpTodayLine");
    const xpNextRewardLine = document.getElementById("xpNextRewardLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // Auth/child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Context
    let SUBJECT = null;
    let AREA = null;

    // Skill row (for XP storage)
    let skillRow = null;

    // Lesson runtime
    let lesson = null;
    let steps = [];
    let idx = 0;
    let stepAnswers = {};
    let xpEarnedThisLesson = 0;

    // Audio
    let currentAudio = null;

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    // ---------- XP helpers ----------
    function isToday(isoStr){
      if (!isoStr) return false;
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return false;
      const now = new Date();
      return d.getFullYear() === now.getFullYear()
        && d.getMonth() === now.getMonth()
        && d.getDate() === now.getDate();
    }

    function nextRewardInfo(xpTotal){
      const milestones = [50, 100, 200, 350, 500, 750, 1000];
      const next = milestones.find(m => xpTotal < m) || (xpTotal + 250);
      return { next, remaining: Math.max(0, next - xpTotal) };
    }

    function renderXpUIFromSkillRow(row){
      const total = Number(row?.xp_total || 0);
      const last = Number(row?.xp_last_earned || 0);
      const updatedAt = row?.xp_updated_at || null;

      xpLine.textContent = `XP: ${total}`;

      const today = (updatedAt && isToday(updatedAt)) ? last : 0;
      xpTodayLine.textContent = `Today: ${today}`;

      const { remaining } = nextRewardInfo(total);
      xpNextRewardLine.textContent = remaining === 0
        ? "Next reward: ready 🎁"
        : `Next reward: ${remaining} XP to go`;
    }

    async function loadOrCreateSkillRow(){
      // child_skill_progress: id owner_id child_id subject area level confidence accuracy ...
      // plus your XP fields: xp_total xp_last_earned xp_updated_at
      const { data: existing, error } = await sb
        .from("child_skill_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", SUBJECT)
        .eq("area", AREA)
        .maybeSingle();

      if (error){
        console.warn("skill progress load failed", error);
        return null;
      }

      if (existing?.id){
        skillRow = existing;
        renderXpUIFromSkillRow(skillRow);
        return skillRow;
      }

      // baseline row (no UI uses level/accuracy)
      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject: SUBJECT,
        area: AREA,
        level: 1,
        confidence: 0.5,
        accuracy: 0.0,
        total_attempts: 0,
        correct_attempts: 0,
        streak_correct: 0,
        streak_wrong: 0,
        last_session_id: null,
        last_seen_at: new Date().toISOString(),
        xp_total: 0,
        xp_last_earned: 0,
        xp_updated_at: null
      };

      const { data: up, error: upErr } = await sb
        .from("child_skill_progress")
        .upsert(payload, { onConflict: "owner_id,child_id,subject,area" })
        .select("*")
        .single();

      if (upErr){
        console.warn("skill progress upsert failed", upErr);
        return null;
      }

      skillRow = up;
      renderXpUIFromSkillRow(skillRow);
      return skillRow;
    }

    async function applyXpToSkillRow(deltaXp){
      if (!deltaXp || deltaXp <= 0) return;
      if (!skillRow?.id) return;

      const newTotal = Number(skillRow.xp_total || 0) + deltaXp;

      const { data: updated, error } = await sb
        .from("child_skill_progress")
        .update({
          xp_total: newTotal,
          xp_last_earned: deltaXp,
          xp_updated_at: new Date().toISOString(),
          last_seen_at: new Date().toISOString()
        })
        .eq("id", skillRow.id)
        .select("*")
        .single();

      if (error){
        console.warn("xp update failed", error);
        return;
      }

      skillRow = updated;
      renderXpUIFromSkillRow(skillRow);
    }

    // ---------- Lesson generation ----------
    async function fetchGeneratedLesson(){
      const payload = {
        subject: SUBJECT,
        area: AREA,
        age: childAge,
        level: 1, // not shown; worker uses it as “difficulty hint”
        owner_id: currentUser.id,
        child_id: child.id
      };

      const r = await fetch(LESSON_GEN_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const text = await r.text().catch(()=> "");
      let j = null;
      try{ j = text ? JSON.parse(text) : null; }catch{}

      if (!r.ok){
        throw new Error(j?.error || text || `Lesson generation failed (${r.status})`);
      }

      const lessonObj = j?.lesson || j; // supports either {lesson:{...}} or direct
      if (!lessonObj?.steps || !Array.isArray(lessonObj.steps) || !lessonObj.steps.length){
        throw new Error("Lesson returned no steps.");
      }

      return lessonObj;
    }

    // ---------- Render ----------
    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
    }

    function renderStep(){
      clearError();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";
      clearInteractive();

      if (!steps.length){
        lessonTextEl.textContent = "No lesson steps found.";
        return;
      }

      const step = steps[idx];
      setProgressUI();

      if (!step){
        lessonTextEl.textContent = "Finished.";
        return;
      }

      if (step.type === "intro" || step.type === "teach" || step.type === "finish"){
        lessonTextEl.textContent = step.text || "";
        nextBtn.textContent = (step.type === "finish") ? "✅ Complete" : "➡️ Next";
        if (step.type === "finish") hintLine.textContent = "Tap complete to finish.";
        return;
      }

      if (step.type === "mcq"){
        lessonTextEl.textContent = step.prompt || "";
        mcqEl.style.display = "grid";

        const letters = ["A","B","C","D","E","F"];
        (step.choices || []).forEach((choice, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-opt";
          btn.innerHTML = `<span class="mcq-letter">${letters[i] || ""}</span><span class="mcq-text">${choice}</span>`;
          btn.addEventListener("click", () => chooseMCQ(i));
          mcqEl.appendChild(btn);
        });

        const saved = stepAnswers[idx];
        if (saved){
          hintLine.textContent = saved.isCorrect ? "Nice — that was correct ✅" : "Good try — keep going 💛";
        }

        nextBtn.textContent = "➡️ Next";
        return;
      }

      // Everything else: skip gracefully (keeps customer experience smooth)
      lessonTextEl.textContent = step.prompt || "This step is not available yet.";
      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="notice">
          This activity is coming soon. You can press Next to keep going.
        </div>
      `;
      nextBtn.textContent = "➡️ Next";
    }

    async function chooseMCQ(pickedIndex){
      const step = steps[idx];
      if (!step || step.type !== "mcq") return;

      const correctIndex = Number(step.correctIndex);
      const isCorrect = pickedIndex === correctIndex;

      // gentle XP
      const delta = isCorrect ? 10 : 6;
      xpEarnedThisLesson += delta;

      stepAnswers[idx] = { pickedIndex, isCorrect };
      hintLine.textContent = isCorrect ? "Nice work ✅" : "Good try 💛";

      // Auto-move on (small delay feels natural)
      setTimeout(() => {
        if (idx < steps.length - 1){
          idx += 1;
          renderStep();
        } else {
          // If last step is MCQ, let Next handle finish if needed
        }
      }, 450);
    }

    async function completeLesson(){
      // Apply XP to Supabase (persists)
      await applyXpToSkillRow(xpEarnedThisLesson);

      contextLine.textContent = `Saved ✅ ${childName} finished "${lesson?.title || "Lesson"}".`;
      lessonTextEl.textContent =
        `Nice work, ${childName}.\n\n` +
        `You earned ${xpEarnedThisLesson} XP.\n\n` +
        `What would you like to do now?`;

      mcqEl.style.display = "none";
      clearInteractive();

      // Replace controls with end options
      nextBtn.disabled = true;
      backBtn.disabled = true;

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="row" style="margin-top:10px;">
          <a class="pill primary" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Try another lesson</a>
          <a class="pill" href="/chat.html" style="display:inline-flex; align-items:center;">🎓 Go to Tutor</a>
          <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Done for today</a>
        </div>
      `;

      hintLine.textContent = "You can choose what to do next.";
    }

    // ----- Read aloud -----
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };

        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    // Controls
    backBtn.addEventListener("click", () => {
      if (idx > 0){ idx -= 1; renderStep(); }
    });

    nextBtn.addEventListener("click", async () => {
      const step = steps[idx];

      if (step?.type === "mcq" && !stepAnswers[idx]){
        hintLine.textContent = "Tap an answer first 💛";
        return;
      }

      if (step?.type === "finish"){
        await completeLesson();
        return;
      }

      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      }
    });

    finishBtn.addEventListener("click", async () => {
      // Early exit still saves XP earned so far
      await applyXpToSkillRow(xpEarnedThisLesson);
      window.location.href = "/lessons.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Read the step\n" +
        "• Tap an answer (if shown)\n\n" +
        "No pressure. You can finish any time.\n\n" +
        "Read aloud plays only when you press the button."
      );
    });

    speakBtn.addEventListener("click", speakCurrent);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      contextLine.textContent = `Loading a lesson for ${childName}…`;

      // Load XP + ensure row exists
      await loadOrCreateSkillRow();

      // Get a generated lesson
      try{
        lesson = await fetchGeneratedLesson();
      }catch(e){
        console.error(e);
        showError("Could not load a lesson right now.");
        lessonTextEl.textContent =
          "We couldn’t load a lesson.\n\nPlease try again in a moment.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      steps = lesson.steps || [];
      if (!steps.length){
        showError("Lesson returned no steps.");
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      idx = 0;
      stepAnswers = {};
      xpEarnedThisLesson = 0;

      const title = lesson.title ? ` — ${lesson.title}` : "";
      contextLine.textContent = `${SUBJECT} • ${AREA}${title}`;

      nextBtn.disabled = false;
      backBtn.disabled = false;

      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
</body>
</html>
