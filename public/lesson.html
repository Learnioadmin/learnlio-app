<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
      position: relative;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:4px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-opt:disabled{ opacity:.7; cursor:not-allowed; }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
      transition: width .2s ease;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    /* XP UI (prominent & child friendly) */
    .xpWrap{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .xpTopRow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .xpBadge{
      display:inline-flex; gap:8px; align-items:center;
      padding:10px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(47,123,255,.18), rgba(11,92,255,.10));
      border:1px solid rgba(11,92,255,.20);
      box-shadow: 0 12px 22px rgba(11,92,255,.14);
      font-weight: 950;
      font-size: 14px;
    }
    .xpBadge span{ font-size: 18px; letter-spacing:-.2px; }

    .xpToday{
      display:inline-flex; gap:8px; align-items:center;
      padding:10px 12px;
      border-radius: 999px;
      background: rgba(16,185,129,.10);
      border:1px solid rgba(16,185,129,.18);
      box-shadow: 0 10px 18px rgba(16,185,129,.10);
      font-weight: 950;
      font-size: 13px;
      color: #064e3b;
    }
    .xpToday span{ font-size: 16px; }

    .xpNext{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
    }
    .xpNextText{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
      margin-bottom: 8px;
    }
    .xpNextBar{
      height: 12px;
      border-radius: 999px;
      background: rgba(15,23,42,.08);
      overflow:hidden;
    }
    .xpNextBar > div{
      height: 12px;
      width: 0%;
      background: linear-gradient(90deg, #2f7bff, #10b981);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .xpHint{
      margin-top:8px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Interactive mounts */
    #interactiveMount{ display:none; }

    /* Match pairs widget */
    .pairsWrap{ display:grid; grid-template-columns: 1fr; gap:10px; }
    .pairCols{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    @media (max-width: 520px){ .pairCols{ grid-template-columns: 1fr; } }
    .pairColTitle{ font-weight:950; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.2px; margin:2px 0 6px; }
    .pairItem{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 14px;
      padding: 10px 10px;
      cursor:pointer;
      font-weight:900;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      user-select:none;
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }
    .pairItem:hover{ border-color: rgba(11,92,255,.22); }
    .pairItem.selected{ outline: 2px solid rgba(11,92,255,.35); background: rgba(238,242,255,.75); }
    .pairItem.matched{ opacity:.6; cursor:default; text-decoration: line-through; }

    /* Number line widget */
    .nlBox{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .nlTrack{
      position: relative;
      height: 12px;
      border-radius: 999px;
      background: rgba(15,23,42,.08);
      overflow: visible;
    }
    .nlFill{
      position:absolute; left:0; top:0; height:12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2f7bff, #10b981);
      width:0%;
      transition: width .2s ease;
    }
    .nlKnob{
      position:absolute; top:50%;
      transform: translate(-50%, -50%);
      width:28px; height:28px;
      border-radius: 999px;
      background: #fff;
      border:1px solid rgba(15,23,42,.18);
      box-shadow: 0 10px 18px rgba(2,6,23,.10);
      cursor: pointer;
      touch-action: none;
    }
    .nlTicks{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
    .nlBtnRow{ display:flex; gap:10px; flex-wrap:wrap; }
    .nlValuePill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      font-weight:950;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }

    /* End screen */
    .endCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 14px 26px rgba(2,6,23,.08);
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .endTitle{ font-weight:950; font-size:16px; letter-spacing:-.2px; }
    .endHint{ color:var(--muted); font-size:14px; line-height:1.65; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>

            <div id="mcq" class="mcq" style="display:none;"></div>

            <div id="interactiveMount"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Just steady effort. No pressure.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>

            <!-- NEW XP UI -->
            <div class="xpWrap">
              <div class="xpTopRow">
                <div class="xpBadge" title="Your XP">✨ <span id="xpTotalBig">0</span></div>
                <div class="xpToday" title="XP earned today">Today <span id="xpTodayBig">0</span></div>
              </div>

              <div class="xpNext">
                <div class="xpNextText">
                  <span style="font-weight:950;">Next reward</span>
                  <span class="muted" id="xpToGoText">—</span>
                </div>
                <div class="xpNextBar">
                  <div id="xpNextFill"></div>
                </div>
                <div class="xpHint" id="xpHintText">Small steps still count.</div>
              </div>
            </div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
    const LESSON_GEN_BASE = "https://learnlio-lessons.falling-grass-34ab.workers.dev";
    const LESSON_GEN_URL = LESSON_GEN_BASE.replace(/\/+$/,"") + "/generate";
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const practiceLine = document.getElementById("practiceLine");

    // XP UI
    const xpTotalBig = document.getElementById("xpTotalBig");
    const xpTodayBig = document.getElementById("xpTodayBig");
    const xpToGoText = document.getElementById("xpToGoText");
    const xpNextFill = document.getElementById("xpNextFill");
    const xpHintText = document.getElementById("xpHintText");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // Auth/child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Context
    let SUBJECT = null;
    let AREA = null;

    // Lesson runtime
    let lesson = null;         // worker response lesson
    let steps = [];
    let idx = 0;
    let xpEarnedThisLesson = 0;

    // XP persisted
    let xpTotal = 0;
    let xpToday = 0;
    let nextRewardTarget = 0;

    // Audio
    let currentAudio = null;

    // Match pairs state
    let mpSelectedLeft = null;
    let mpSelectedRight = null;
    let mpMatched = new Set(); // store "L{i}-R{j}"

    // Number line state
    let nlValue = null;
    let nlMin = 0, nlMax = 20, nlTarget = 0;

    // Supported types only (ship-ready)
    const SUPPORTED_TYPES = new Set(["intro","teach","mcq","match_pairs","number_line","finish"]);

    // Heuristic: block image/picture prompts for now
    const IMAGE_HINT = /(picture|image|shown|in the picture|in the image|look at|see the picture|how many.*(shown|see))/i;

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    function todayKey(){
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    function rewardTargetForXp(total){
      // “next reward every 100 XP” (simple, predictable)
      const step = 100;
      return Math.ceil((total + 1) / step) * step;
    }

    function updateXpUI(){
      xpTotalBig.textContent = String(xpTotal);
      xpTodayBig.textContent = String(xpToday);

      nextRewardTarget = rewardTargetForXp(xpTotal);
      const toGo = Math.max(0, nextRewardTarget - xpTotal);
      xpToGoText.textContent = `${toGo} XP to go`;

      const prevTarget = nextRewardTarget - 100;
      const span = 100;
      const pct = Math.max(0, Math.min(100, Math.round(((xpTotal - prevTarget) / span) * 100)));
      xpNextFill.style.width = pct + "%";

      if (toGo === 0){
        xpHintText.textContent = "Reward unlocked! Nice work.";
      } else if (toGo <= 20){
        xpHintText.textContent = "So close — keep going.";
      } else {
        xpHintText.textContent = "Small steps still count.";
      }
    }

    async function loadOrCreateChildSkill(){
      // Store XP inside child_skill_progress for subject+area
      const { data: existing, error } = await sb
        .from("child_skill_progress")
        .select("*")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", SUBJECT)
        .eq("area", AREA)
        .maybeSingle();

      if (error) console.warn(error);

      if (existing?.id){
        xpTotal = Number(existing.xp_total || 0);
        const updatedAt = existing.xp_updated_at ? String(existing.xp_updated_at) : "";
        const today = todayKey();
        // If last update is today, keep today xp; else reset
        const sameDay = updatedAt.startsWith(today);
        xpToday = sameDay ? Number(existing.xp_last_earned || 0) : 0;
        updateXpUI();
        return existing;
      }

      const payload = {
        owner_id: currentUser.id,
        child_id: child.id,
        subject: SUBJECT,
        area: AREA,
        level: 1,
        confidence: 0.5,
        accuracy: 0,
        total_attempts: 0,
        correct_attempts: 0,
        streak_correct: 0,
        streak_wrong: 0,
        last_session_id: null,
        last_seen_at: new Date().toISOString(),
        xp_total: 0,
        xp_last_earned: 0,
        xp_updated_at: new Date().toISOString(),
      };

      const { data: up, error: upErr } = await sb
        .from("child_skill_progress")
        .upsert(payload, { onConflict: "owner_id,child_id,subject,area" })
        .select("*")
        .single();

      if (upErr){
        console.warn("xp row create failed", upErr);
      } else {
        xpTotal = 0;
        xpToday = 0;
        updateXpUI();
      }
      return up || null;
    }

    async function persistXpEarned(){
      if (!xpEarnedThisLesson) return;

      // Re-load current to avoid race
      const { data: row } = await sb
        .from("child_skill_progress")
        .select("id,xp_total,xp_last_earned,xp_updated_at,total_attempts,last_seen_at")
        .eq("owner_id", currentUser.id)
        .eq("child_id", child.id)
        .eq("subject", SUBJECT)
        .eq("area", AREA)
        .maybeSingle();

      const currentTotal = Number(row?.xp_total || 0);
      const updatedAt = row?.xp_updated_at ? String(row.xp_updated_at) : "";
      const today = todayKey();
      const sameDay = updatedAt.startsWith(today);

      const newTotal = currentTotal + xpEarnedThisLesson;
      const newToday = (sameDay ? Number(row?.xp_last_earned || 0) : 0) + xpEarnedThisLesson;

      const { data: updated, error } = await sb
        .from("child_skill_progress")
        .update({
          xp_total: newTotal,
          xp_last_earned: newToday,
          xp_updated_at: new Date().toISOString(),
          total_attempts: (row?.total_attempts || 0) + 1,
          last_seen_at: new Date().toISOString()
        })
        .eq("id", row?.id)
        .select("*")
        .single();

      if (error){
        console.warn("xp persist failed", error);
      } else {
        xpTotal = Number(updated.xp_total || newTotal);
        const updAt = String(updated.xp_updated_at || "");
        xpToday = updAt.startsWith(todayKey()) ? Number(updated.xp_last_earned || newToday) : newToday;
        updateXpUI();
      }

      xpEarnedThisLesson = 0;
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      updateXpUI();
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
      mpSelectedLeft = null;
      mpSelectedRight = null;
      mpMatched = new Set();
      nlValue = null;
    }

    function autoAdvanceSoon(){
      setTimeout(() => {
        if (idx < steps.length - 1){
          idx += 1;
          renderStep();
        } else {
          // If last step isn't finish, show end anyway
          showEndScreen();
        }
      }, 650);
    }

    function stepTextBlob(step){
      const parts = [];
      if (step?.prompt) parts.push(step.prompt);
      if (step?.text) parts.push(step.text);
      if (Array.isArray(step?.choices)) parts.push(step.choices.join(" "));
      return parts.join(" ").trim();
    }

    function sanitizeAndFilterSteps(rawSteps){
      if (!Array.isArray(rawSteps)) return [];
      // remove unsupported + image/picture steps
      const cleaned = rawSteps.filter(s => {
        if (!s || typeof s !== "object") return false;
        if (!SUPPORTED_TYPES.has(String(s.type||"").trim())) return false;
        const blob = stepTextBlob(s);
        if (IMAGE_HINT.test(blob)) return false;
        // Also filter “complete the sentence” style which often breaks without assets
        if (/complete the sentence/i.test(blob) && String(s.type||"") !== "mcq") return false;
        return true;
      });

      // Ensure there is a finish step at end
      const hasFinish = cleaned.some(s => s.type === "finish");
      if (!hasFinish){
        cleaned.push({ type:"finish", text:`Nice work, ${childName}. You stayed calm and kept going.` });
      }
      return cleaned;
    }

    async function fetchGeneratedLesson(){
      const payload = {
        subject: SUBJECT,
        area: AREA,
        age: childAge,
        level: 1,
        owner_id: currentUser.id,
        child_id: child.id,
        // hard restrict to supported types only
        allowedTypes: ["intro","teach","mcq","match_pairs","number_line","finish"],
        wantImages: false
      };

      const r = await fetch(LESSON_GEN_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const text = await r.text().catch(()=> "");
      let json = null;
      try{ json = text ? JSON.parse(text) : null; }catch{}

      if (!r.ok){
        throw new Error(json?.error || text || `Lesson generation failed (${r.status})`);
      }
      const lessonObj = json?.lesson || json;
      if (!lessonObj?.steps || !Array.isArray(lessonObj.steps)){
        throw new Error("Lesson worker returned no steps.");
      }
      return lessonObj;
    }

    // ----- Read aloud -----
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };

        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }
<script>
(() => {
  function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
  setVh(); window.addEventListener('resize', setVh);

  /* ================= CONFIG ================= */
  const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";
  const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev/generate";
  const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ================= UI ================= */
  const lessonTextEl = document.getElementById("lessonText");
  const mcqEl = document.getElementById("mcq");
  const interactiveMount = document.getElementById("interactiveMount");
  const backBtn = document.getElementById("backBtn");
  const nextBtn = document.getElementById("nextBtn");
  const contextLine = document.getElementById("contextLine");
  const hintLine = document.getElementById("hintLine");

  const stepKpi = document.getElementById("stepKpi");
  const barFill = document.getElementById("barFill");

  const xpTotalBig = document.getElementById("xpTotalBig");
  const xpTodayBig = document.getElementById("xpTodayBig");
  const xpToGoText = document.getElementById("xpToGoText");
  const xpNextFill = document.getElementById("xpNextFill");
  const xpHintText = document.getElementById("xpHintText");

  /* ================= STATE ================= */
  let steps = [];
  let idx = 0;
  let xpSession = 0;
  let xpTotal = 0;
  let child = null;
  let SUBJECT = null;
  let AREA = null;

  const REWARD_STEP = 180; // XP per reward

  /* ================= HELPERS ================= */
  function autoNext(){
    setTimeout(() => {
      if (idx < steps.length - 1) {
        idx++;
        renderStep();
      }
    }, 650);
  }

  function updateXPUI(){
    xpTotalBig.textContent = xpTotal;
    xpTodayBig.textContent = xpSession;

    const nextTarget = Math.ceil(xpTotal / REWARD_STEP) * REWARD_STEP;
    const toGo = Math.max(0, nextTarget - xpTotal);

    xpToGoText.textContent = `${toGo} XP to go`;
    xpNextFill.style.width = `${Math.min(100, (xpTotal % REWARD_STEP) / REWARD_STEP * 100)}%`;

    xpHintText.textContent =
      toGo === 0
        ? "🎉 Reward unlocked!"
        : "Keep going — you're doing great.";
  }

  async function saveXP(){
    if (!child) return;

    await sb.from("child_skill_progress")
      .upsert({
        owner_id: child.parent_user_id,
        child_id: child.id,
        subject: SUBJECT,
        area: AREA,
        xp_total: xpTotal,
        xp_last_earned: xpSession,
        xp_updated_at: new Date().toISOString()
      }, { onConflict: "owner_id,child_id,subject,area" });
  }

  function clearUI(){
    lessonTextEl.textContent = "";
    mcqEl.innerHTML = "";
    mcqEl.style.display = "none";
    interactiveMount.innerHTML = "";
    interactiveMount.style.display = "none";
    hintLine.textContent = "";
  }

  /* ================= RENDER ================= */
  function renderStep(){
    clearUI();

    if (!steps[idx]) {
      idx++;
      if (idx < steps.length) renderStep();
      return;
    }

    stepKpi.textContent = `${idx + 1} / ${steps.length}`;
    barFill.style.width = `${(idx / steps.length) * 100}%`;

    const step = steps[idx];

    /* ---- INTRO / TEACH / FINISH ---- */
    if (["intro","teach","finish"].includes(step.type)) {
      lessonTextEl.textContent = step.text || "";
      nextBtn.textContent = step.type === "finish" ? "Done" : "Next";
      return;
    }

    /* ---- MCQ ---- */
    if (step.type === "mcq" && step.prompt && Array.isArray(step.choices)) {
      lessonTextEl.textContent = step.prompt;
      mcqEl.style.display = "grid";

      step.choices.forEach((choice, i) => {
        const btn = document.createElement("button");
        btn.className = "mcq-opt";
        btn.innerHTML = `<span class="mcq-letter">${String.fromCharCode(65+i)}</span><span>${choice}</span>`;
        btn.onclick = () => {
          xpSession += 10;
          xpTotal += 10;
          updateXPUI();
          autoNext();
        };
        mcqEl.appendChild(btn);
      });
      return;
    }

    /* ---- MATCH PAIRS ---- */
    if (step.type === "match_pairs" && Array.isArray(step.pairs)) {
      lessonTextEl.textContent = step.prompt || "Match the pairs";

      interactiveMount.style.display = "block";
      const wrap = document.createElement("div");
      wrap.className = "pairCols";

      const leftCol = document.createElement("div");
      const rightCol = document.createElement("div");

      let selected = null;
      let remaining = step.pairs.length;

      step.pairs.forEach(p => {
        const l = document.createElement("div");
        l.className = "pairItem";
        l.textContent = p.left;

        const r = document.createElement("div");
        r.className = "pairItem";
        r.textContent = p.right;

        l.onclick = () => {
          selected = { l, p };
          l.classList.add("selected");
        };

        r.onclick = () => {
          if (!selected) return;
          if (selected.p.right === p.right) {
            selected.l.classList.add("matched");
            r.classList.add("matched");
            selected.l.onclick = null;
            r.onclick = null;
            remaining--;
            if (remaining === 0) {
              xpSession += 12;
              xpTotal += 12;
              updateXPUI();
              autoNext();
            }
          }
          selected?.l.classList.remove("selected");
          selected = null;
        };

        leftCol.appendChild(l);
        rightCol.appendChild(r);
      });

      wrap.append(leftCol, rightCol);
      interactiveMount.appendChild(wrap);
      return;
    }

    /* ---- NUMBER LINE ---- */
    if (step.type === "number_line" && Number.isFinite(step.target)) {
      lessonTextEl.textContent = step.prompt || "Choose the number";

      interactiveMount.style.display = "block";
      const input = document.createElement("input");
      input.type = "range";
      input.min = step.min ?? 0;
      input.max = step.max ?? 20;
      input.value = step.start ?? step.min ?? 0;

      const label = document.createElement("div");
      label.style.fontWeight = "900";
      label.textContent = input.value;

      input.oninput = () => label.textContent = input.value;
      input.onchange = () => {
        xpSession += 8;
        xpTotal += 8;
        updateXPUI();
        autoNext();
      };

      interactiveMount.append(label, input);
      return;
    }

    /* ---- ANYTHING ELSE: SILENT SKIP ---- */
    idx++;
    renderStep();
  }

  /* ================= BOOT ================= */
  async function boot(){
    const { data: auth } = await sb.auth.getUser();
    if (!auth?.user) return location.href = "/login.html";

    const storedChild = JSON.parse(localStorage.getItem("selectedChild") || "null");
    if (!storedChild) return;

    const { data: childRow } = await sb
      .from("children")
      .select("*")
      .eq("id", storedChild.id)
      .single();

    child = childRow;

    const url = new URL(location.href);
    SUBJECT = url.searchParams.get("subject");
    AREA = url.searchParams.get("area");

    const r = await fetch(LESSON_GEN_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        subject: SUBJECT,
        area: AREA,
        age: 10
      })
    });

    const j = await r.json();
    steps = (j.lesson?.steps || []).filter(s =>
      ["intro","teach","mcq","match_pairs","number_line","finish"].includes(s.type)
    );

    xpTotal = (await sb.from("child_skill_progress")
      .select("xp_total")
      .eq("child_id", child.id)
      .eq("subject", SUBJECT)
      .eq("area", AREA)
      .maybeSingle()).data?.xp_total || 0;

    updateXPUI();
    renderStep();
  }

  window.addEventListener("beforeunload", saveXP);
  nextBtn.onclick = () => { idx++; renderStep(); };
  backBtn.onclick = () => { if (idx > 0) idx--; renderStep(); };

  boot();
})();
</script>
