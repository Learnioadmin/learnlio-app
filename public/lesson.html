<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    /* Logged-in nav (same as Tutor) */
    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }
    .status.warn{ color:var(--warn); font-weight:850; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:4px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    .notice{
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      border-radius: 16px;
      padding:12px 12px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    /* ===== Interactive components ===== */

    .ibox{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* Fill blank */
    .blankLine{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
    }
    .blankInput{
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border:1px solid rgba(15,23,42,.14);
      font-size: 15px;
      outline: none;
    }
    .blankInput:focus{
      border-color: rgba(11,92,255,.35);
      box-shadow: 0 0 0 4px rgba(11,92,255,.10);
    }

    /* Match pairs */
    .pairsGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width: 520px){
      .pairsGrid{ grid-template-columns: 1fr; }
    }
    .pairCol{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .pairBtn{
      text-align:left;
      padding:12px 12px;
      border-radius: 16px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      box-shadow: 0 8px 14px rgba(2,6,23,.06);
      cursor:pointer;
      font-weight:900;
    }
    .pairBtn.selected{
      border-color: rgba(11,92,255,.35);
      box-shadow: 0 0 0 4px rgba(11,92,255,.10);
      background: rgba(11,92,255,.06);
    }
    .pairBtn.matched{
      border-color: rgba(16,185,129,.35);
      background: rgba(16,185,129,.08);
      cursor: default;
      opacity:.95;
    }
    .matchLine{
      font-size: 13px;
      color: var(--muted);
      line-height:1.5;
    }

    /* Number line */
    .lineWrap{
      padding: 8px 6px 4px;
    }
    .numLine{
      position: relative;
      height: 64px;
      border-radius: 16px;
      background: rgba(238,242,255,.65);
      border:1px solid rgba(15,23,42,.10);
      overflow:hidden;
    }
    .numTrack{
      position:absolute;
      left: 14px; right: 14px;
      top: 34px;
      height: 6px;
      border-radius: 999px;
      background: rgba(15,23,42,.10);
    }
    .numMarker{
      position:absolute;
      top: 18px;
      width: 34px;
      height: 34px;
      border-radius: 14px;
      background: #fff;
      border:1px solid rgba(15,23,42,.14);
      box-shadow: 0 10px 16px rgba(2,6,23,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:950;
      cursor: grab;
      user-select:none;
      touch-action:none;
    }
    .numLabels{
      display:flex;
      justify-content:space-between;
      font-size: 13px;
      color: var(--muted);
      margin-top:8px;
      padding: 0 4px;
      font-weight:850;
    }
    .sliderRow{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .slider{
      width: 100%;
      accent-color: var(--brand);
    }

    /* Drag drop */
    .dragGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width: 720px){
      .dragGrid{ grid-template-columns: 1fr; }
    }
    .dragBank, .dropZoneWrap{
      border:1px solid rgba(15,23,42,.10);
      border-radius: 18px;
      background: rgba(248,250,252,.95);
      padding: 10px;
    }
    .dragItem{
      padding: 10px 12px;
      border-radius: 14px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      box-shadow: 0 8px 14px rgba(2,6,23,.06);
      cursor: grab;
      font-weight: 950;
      margin-bottom: 8px;
    }
    .dropZone{
      min-height: 46px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 2px dashed rgba(15,23,42,.18);
      background: rgba(255,255,255,.9);
      margin-bottom: 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .dropZone.over{
      border-color: rgba(11,92,255,.35);
      background: rgba(11,92,255,.06);
    }
    .dzLabel{
      font-weight: 950;
      color: var(--ink);
      font-size: 14px;
    }
    .dzValue{
      font-weight: 950;
      color: var(--muted);
      font-size: 14px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
            <div id="pageWarn" class="status warn" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>

            <div id="mcq" class="mcq" style="display:none;"></div>

            <div id="interactiveMount" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Just steady effort. No pressure.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

    // IMPORTANT: worker says routes are /health and /generate (POST)
    const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev/generate";

    // Google TTS Worker
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const pageWarn = document.getElementById("pageWarn");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }
    function showWarn(msg){ pageWarn.style.display="block"; pageWarn.textContent = msg; }
    function clearWarn(){ pageWarn.style.display="none"; pageWarn.textContent = ""; }

    // Auth/child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Context
    let SUBJECT = null;
    let AREA = null;

    // Lesson runtime
    let lesson = null;         // returned by worker
    let steps = [];
    let idx = 0;
    let stepAnswers = {};      // stepIndex -> { kind, isCorrect, data }
    let xp = 0;

    // Audio
    let currentAudio = null;

    // Per-step gate: must be true to allow Next
    function stepIsAnswered(stepIndex){
      return !!stepAnswers[stepIndex];
    }

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      xpLine.textContent = `XP: ${xp}`;
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
    }

    // -------------------------
    // LESSON GEN (Worker)
    // -------------------------
    async function fetchGeneratedLesson(){
      const payload = {
        ownerId: currentUser.id,
        childId: child.id,
        childName,
        age: childAge,
        subject: SUBJECT,
        area: AREA,
        wantInteractive: true,
        allowedTypes: ["intro","teach","mcq","fill_blank","match_pairs","number_line","interactive_drag","finish"]
      };

      const r = await fetch(LESSON_GEN_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const raw = await r.text().catch(()=> "");
      let json = null;
      try{ json = raw ? JSON.parse(raw) : null; }catch{}

      if (!r.ok){
        const msg = json?.error || raw || `Lesson generation failed (${r.status})`;
        throw new Error(msg);
      }

      // accept either {steps:[...]} or {lesson:{steps:[...]}}
      const out = json?.steps ? json : (json?.lesson ? json.lesson : json);

      if (!out?.steps || !Array.isArray(out.steps) || !out.steps.length){
        throw new Error("Lesson worker returned no steps.");
      }

      return out;
    }

    // -------------------------
    // Helpers for correctness
    // -------------------------
    function norm(s){ return String(s ?? "").trim().toLowerCase(); }
    function safeNum(v, fallback){
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    // -------------------------
    // Renderers
    // -------------------------
    function renderTextStep(step){
      lessonTextEl.textContent = step.text || "";
      nextBtn.textContent = (step.type === "finish") ? "✅ Complete" : "➡️ Next";
      if (step.type === "finish") hintLine.textContent = "Tap complete to finish this lesson.";
    }

    function renderMCQ(step){
      lessonTextEl.textContent = step.prompt || "";
      mcqEl.style.display = "grid";

      const letters = ["A","B","C","D","E","F"];
      const choices = Array.isArray(step.choices) ? step.choices : [];

      if (!choices.length){
        mcqEl.innerHTML = `<div class="notice">This question has no choices.</div>`;
        return;
      }

      choices.forEach((choice, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mcq-opt";
        btn.innerHTML = `<span class="mcq-letter">${letters[i] || ""}</span><span class="mcq-text">${choice}</span>`;
        btn.addEventListener("click", () => {
          const correctIndex = safeNum(step.correctIndex, -1);
          const isCorrect = i === correctIndex;

          xp += isCorrect ? 10 : 6;
          stepAnswers[idx] = { kind:"mcq", isCorrect, data:{ pickedIndex:i } };

          hintLine.textContent = isCorrect ? "Nice work ✅" : "Good try 💛";
          setProgressUI();
        });
        mcqEl.appendChild(btn);
      });
    }

    function renderFillBlank(step){
      // Supported shapes:
      // A) { type:"fill_blank", prompt:"...", answer:"15" }
      // B) { type:"fill_blank", text:"12 + 3 = ____", answers:["15"] }
      const prompt = step.prompt || step.text || "Fill in the blank:";
      const expected = (step.answer != null) ? [String(step.answer)]
                     : (Array.isArray(step.answers) ? step.answers.map(String) : []);

      lessonTextEl.textContent = prompt;

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = "";

      const box = document.createElement("div");
      box.className = "ibox";

      const line = document.createElement("div");
      line.className = "blankLine";
      line.textContent = step.sentence || step.line || step.example || "";

      const input = document.createElement("input");
      input.className = "blankInput";
      input.type = "text";
      input.inputMode = "text";
      input.placeholder = "Type your answer…";

      const tip = document.createElement("div");
      tip.className = "matchLine";
      tip.textContent = "Tip: it’s okay to try. You can change your answer.";

      const checkBtn = document.createElement("button");
      checkBtn.className = "pill primary";
      checkBtn.type = "button";
      checkBtn.textContent = "✅ Check";

      checkBtn.addEventListener("click", () => {
        const val = String(input.value || "").trim();
        if (!val){
          hintLine.textContent = "Type an answer first 💛";
          return;
        }

        let isCorrect = null;
        if (expected.length){
          isCorrect = expected.some(a => norm(a) === norm(val));
        } else if (step.correct != null) {
          isCorrect = !!step.correct; // not ideal but supports weird payloads
        } else {
          // If worker didn’t supply answers, accept any and score as effort
          isCorrect = true;
          showWarn("This step didn’t include an answer key, so we’re treating it as practice.");
        }

        xp += isCorrect ? 10 : 6;
        stepAnswers[idx] = { kind:"fill_blank", isCorrect, data:{ value: val, expected } };

        hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
        setProgressUI();
      });

      box.appendChild(line);
      box.appendChild(input);
      box.appendChild(checkBtn);
      box.appendChild(tip);

      interactiveMount.appendChild(box);
    }

    function renderMatchPairs(step){
      // Supported shapes:
      // A) { type:"match_pairs", prompt:"Match…", pairs:[{left:"12+3", right:"15"}, ...] }
      // B) { type:"match_pairs", pairs:[["12+3","15"], ...] }
      const prompt = step.prompt || "Match the pairs:";
      lessonTextEl.textContent = prompt;

      let pairs = [];
      if (Array.isArray(step.pairs)){
        pairs = step.pairs.map(p => {
          if (Array.isArray(p) && p.length >= 2) return { left:String(p[0]), right:String(p[1]) };
          if (p && typeof p === "object") return { left:String(p.left), right:String(p.right) };
          return null;
        }).filter(Boolean);
      }

      if (!pairs.length){
        interactiveMount.style.display = "block";
        interactiveMount.innerHTML = `<div class="notice">This match step has no pairs.</div>`;
        return;
      }

      // shuffle rights
      const rights = pairs.map(p => p.right);
      for (let i = rights.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [rights[i], rights[j]] = [rights[j], rights[i]];
      }

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = "";

      const box = document.createElement("div");
      box.className = "ibox";

      const grid = document.createElement("div");
      grid.className = "pairsGrid";

      const leftCol = document.createElement("div");
      leftCol.className = "pairCol";
      const rightCol = document.createElement("div");
      rightCol.className = "pairCol";

      const usedLeft = new Set();
      const usedRight = new Set();
      let selectedLeft = null;

      const matches = {}; // left -> right
      function updateState(){
        const done = Object.keys(matches).length === pairs.length;
        if (done){
          // check correctness
          const map = new Map(pairs.map(p => [p.left, p.right]));
          let correct = 0;
          for (const l of Object.keys(matches)){
            if (map.get(l) === matches[l]) correct++;
          }
          const isCorrect = correct === pairs.length;
          xp += isCorrect ? 12 : 8;
          stepAnswers[idx] = { kind:"match_pairs", isCorrect, data:{ matches, correct, total:pairs.length } };
          hintLine.textContent = isCorrect ? "Perfect matching ✅" : "Nice effort 💛";
          setProgressUI();
        }
      }

      // left buttons
      pairs.forEach(p => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pairBtn";
        b.textContent = p.left;
        b.addEventListener("click", () => {
          if (usedLeft.has(p.left)) return;
          // select this left
          selectedLeft = p.left;
          // re-render selection highlight
          [...leftCol.querySelectorAll(".pairBtn")].forEach(x => x.classList.remove("selected"));
          b.classList.add("selected");
          hintLine.textContent = "Now tap the matching answer on the right.";
        });
        leftCol.appendChild(b);
      });

      // right buttons
      rights.forEach(r => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pairBtn";
        b.textContent = r;
        b.addEventListener("click", () => {
          if (usedRight.has(r)) return;
          if (!selectedLeft){
            hintLine.textContent = "Tap something on the left first 💛";
            return;
          }
          matches[selectedLeft] = r;
          usedLeft.add(selectedLeft);
          usedRight.add(r);

          // mark left matched
          [...leftCol.querySelectorAll(".pairBtn")].forEach(x => {
            if (x.textContent === selectedLeft){
              x.classList.remove("selected");
              x.classList.add("matched");
              x.textContent = `${selectedLeft}  →  ${r}`;
            }
          });
          // mark right matched
          b.classList.add("matched");

          selectedLeft = null;
          hintLine.textContent = "Nice. Keep going.";
          updateState();
        });
        rightCol.appendChild(b);
      });

      const tip = document.createElement("div");
      tip.className = "matchLine";
      tip.textContent = "Tap one on the left, then tap the matching one on the right.";

      grid.appendChild(leftCol);
      grid.appendChild(rightCol);

      box.appendChild(grid);
      box.appendChild(tip);

      interactiveMount.appendChild(box);
    }

    function renderNumberLine(step){
      // Supported shapes:
      // { type:"number_line", prompt:"Put the marker on 7", min:0, max:10, target:7 }
      // If target missing, accept any as practice.
      const prompt = step.prompt || "Move the marker on the number line:";
      lessonTextEl.textContent = prompt;

      const min = safeNum(step.min, 0);
      const max = safeNum(step.max, 10);
      const target = (step.target != null) ? safeNum(step.target, null) : null;

      let value = safeNum(step.start, min);

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = "";

      const box = document.createElement("div");
      box.className = "ibox";

      const lineWrap = document.createElement("div");
      lineWrap.className = "lineWrap";

      const nl = document.createElement("div");
      nl.className = "numLine";

      const track = document.createElement("div");
      track.className = "numTrack";

      const marker = document.createElement("div");
      marker.className = "numMarker";
      marker.textContent = value;

      nl.appendChild(track);
      nl.appendChild(marker);
      lineWrap.appendChild(nl);

      const labels = document.createElement("div");
      labels.className = "numLabels";
      labels.innerHTML = `<span>${min}</span><span>${max}</span>`;

      const sliderRow = document.createElement("div");
      sliderRow.className = "sliderRow";

      const slider = document.createElement("input");
      slider.className = "slider";
      slider.type = "range";
      slider.min = String(min);
      slider.max = String(max);
      slider.step = "1";
      slider.value = String(value);

      function setMarkerFromValue(v){
        value = v;
        marker.textContent = v;
        slider.value = String(v);

        // position marker
        const leftPad = 14;
        const rightPad = 14;
        const w = nl.clientWidth - leftPad - rightPad;
        const pct = (max === min) ? 0 : (v - min) / (max - min);
        const x = leftPad + (w * pct);
        marker.style.left = (x - (marker.offsetWidth/2)) + "px";
      }

      // drag marker (touch + mouse)
      let dragging = false;

      function pointerToValue(clientX){
        const rect = nl.getBoundingClientRect();
        const leftPad = 14;
        const rightPad = 14;
        const x = Math.max(rect.left + leftPad, Math.min(clientX, rect.right - rightPad));
        const pct = (x - (rect.left + leftPad)) / (rect.width - leftPad - rightPad);
        const raw = min + pct * (max - min);
        return Math.round(raw);
      }

      marker.addEventListener("pointerdown", (e) => {
        dragging = true;
        marker.setPointerCapture(e.pointerId);
        marker.style.cursor = "grabbing";
      });

      marker.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const v = pointerToValue(e.clientX);
        setMarkerFromValue(v);
      });

      marker.addEventListener("pointerup", () => {
        dragging = false;
        marker.style.cursor = "grab";
      });

      slider.addEventListener("input", () => {
        setMarkerFromValue(Number(slider.value));
      });

      const checkBtn = document.createElement("button");
      checkBtn.className = "pill primary";
      checkBtn.type = "button";
      checkBtn.textContent = "✅ Check";

      checkBtn.addEventListener("click", () => {
        let isCorrect = true;
        if (target != null) isCorrect = (value === target);

        xp += isCorrect ? 10 : 6;
        stepAnswers[idx] = { kind:"number_line", isCorrect, data:{ value, target, min, max } };

        hintLine.textContent = isCorrect ? "Nice ✅" : "Good try 💛";
        setProgressUI();
      });

      const tip = document.createElement("div");
      tip.className = "matchLine";
      tip.textContent = "Drag the marker or use the slider.";

      box.appendChild(lineWrap);
      box.appendChild(labels);
      box.appendChild(sliderRow);
      box.appendChild(slider);
      box.appendChild(checkBtn);
      box.appendChild(tip);

      interactiveMount.appendChild(box);

      // ensure positioned after layout
      setTimeout(() => setMarkerFromValue(value), 0);
      window.addEventListener("resize", () => setMarkerFromValue(value));
    }

    function renderInteractiveDrag(step){
      // Supported shapes:
      // { type:"interactive_drag", prompt:"Put each number in the right box", items:["2","7"], targets:[{label:"Even", accept:["2"]},{label:"Odd", accept:["7"]}] }
      const prompt = step.prompt || "Drag the items into the boxes:";
      lessonTextEl.textContent = prompt;

      const items = Array.isArray(step.items) ? step.items.map(String) : [];
      const targets = Array.isArray(step.targets) ? step.targets : [];

      if (!items.length || !targets.length){
        interactiveMount.style.display = "block";
        interactiveMount.innerHTML = `<div class="notice">This drag step is missing items or targets.</div>`;
        return;
      }

      // Map of targetLabel -> droppedItem
      const placed = {};
      const remaining = new Set(items);

      function isAllPlaced(){
        return Object.keys(placed).length === targets.length;
      }

      function computeCorrect(){
        // If no accept rules, treat as practice
        let hasRules = false;
        let correct = 0;

        targets.forEach(t => {
          const label = String(t.label ?? "Box");
          const accept = Array.isArray(t.accept) ? t.accept.map(String) : null;
          if (accept && accept.length) hasRules = true;

          const v = placed[label];
          if (!v) return;
          if (!accept || !accept.length) correct++;
          else if (accept.includes(v)) correct++;
        });

        if (!hasRules) return { isCorrect:true, hasRules:false, correct, total: targets.length };
        return { isCorrect: correct === targets.length, hasRules:true, correct, total: targets.length };
      }

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = "";

      const box = document.createElement("div");
      box.className = "ibox";

      const grid = document.createElement("div");
      grid.className = "dragGrid";

      const bank = document.createElement("div");
      bank.className = "dragBank";

      const bankTitle = document.createElement("div");
      bankTitle.className = "matchLine";
      bankTitle.textContent = "Drag from here:";
      bank.appendChild(bankTitle);

      const zonesWrap = document.createElement("div");
      zonesWrap.className = "dropZoneWrap";

      const zonesTitle = document.createElement("div");
      zonesTitle.className = "matchLine";
      zonesTitle.textContent = "Drop into the right box:";
      zonesWrap.appendChild(zonesTitle);

      function renderBank(){
        // clear existing items except title
        bank.querySelectorAll(".dragItem").forEach(n => n.remove());
        items.forEach(it => {
          if (!remaining.has(it)) return;
          const d = document.createElement("div");
          d.className = "dragItem";
          d.textContent = it;
          d.draggable = true;
          d.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", it);
          });
          bank.appendChild(d);
        });
      }

      function createZone(t){
        const label = String(t.label ?? "Box");
        const z = document.createElement("div");
        z.className = "dropZone";
        z.dataset.label = label;

        const left = document.createElement("div");
        left.className = "dzLabel";
        left.textContent = label;

        const right = document.createElement("div");
        right.className = "dzValue";
        right.textContent = "Drop here";

        z.appendChild(left);
        z.appendChild(right);

        z.addEventListener("dragover", (e) => {
          e.preventDefault();
          z.classList.add("over");
        });
        z.addEventListener("dragleave", () => z.classList.remove("over"));
        z.addEventListener("drop", (e) => {
          e.preventDefault();
          z.classList.remove("over");
          const it = e.dataTransfer.getData("text/plain");
          if (!it || !remaining.has(it)) return;

          // if zone already had something, put it back
          const current = placed[label];
          if (current){
            remaining.add(current);
          }

          placed[label] = it;
          remaining.delete(it);
          right.textContent = it;
          renderBank();

          if (isAllPlaced()){
            const res = computeCorrect();
            xp += res.isCorrect ? 12 : 8;
            stepAnswers[idx] = { kind:"interactive_drag", isCorrect: res.isCorrect, data:{ placed, ...res } };
            hintLine.textContent = res.isCorrect ? "Nice sorting ✅" : "Good try 💛";
            setProgressUI();
          } else {
            hintLine.textContent = "Nice. Keep going.";
          }
        });

        return z;
      }

      targets.forEach(t => zonesWrap.appendChild(createZone(t)));

      const tip = document.createElement("div");
      tip.className = "matchLine";
      tip.textContent = "If you want to change one, just drop a different item into the box.";

      const checkBtn = document.createElement("button");
      checkBtn.className = "pill primary";
      checkBtn.type = "button";
      checkBtn.textContent = "✅ Check";
      checkBtn.addEventListener("click", () => {
        if (!isAllPlaced()){
          hintLine.textContent = "Fill all boxes first 💛";
          return;
        }
        const res = computeCorrect();
        xp += res.isCorrect ? 10 : 6;
        stepAnswers[idx] = { kind:"interactive_drag", isCorrect: res.isCorrect, data:{ placed, ...res } };
        hintLine.textContent = res.isCorrect ? "Nice ✅" : "Good try 💛";
        setProgressUI();
      });

      renderBank();

      grid.appendChild(bank);
      grid.appendChild(zonesWrap);

      box.appendChild(grid);
      box.appendChild(checkBtn);
      box.appendChild(tip);

      interactiveMount.appendChild(box);
    }

    function renderUnknown(step){
      lessonTextEl.textContent = step.prompt || step.text || "This step type is not supported yet.";
      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="notice">
          <b>Unsupported step type:</b> ${String(step.type)}<br><br>
          Ask the generator to only use types:
          intro, teach, mcq, fill_blank, match_pairs, number_line, interactive_drag, finish
        </div>
      `;
      // Treat as “seen” so they can move on
      stepAnswers[idx] = { kind:"unknown", isCorrect:true, data:{} };
    }

    function renderStep(){
      clearError();
      clearWarn();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";
      clearInteractive();

      if (!steps.length){
        lessonTextEl.textContent = "No lesson steps found.";
        return;
      }

      const step = steps[idx];
      setProgressUI();

      if (!step){
        lessonTextEl.textContent = "Finished.";
        return;
      }

      // Always clear any pre-answer unless user already answered
      if (stepAnswers[idx]){
        // keep hint
        hintLine.textContent = stepAnswers[idx].isCorrect ? "Nice ✅" : "Good try 💛";
      }

      const type = String(step.type || "").trim();

      if (type === "intro" || type === "teach" || type === "finish"){
        renderTextStep(step);
        return;
      }

      if (type === "mcq"){
        renderMCQ(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      if (type === "fill_blank"){
        renderFillBlank(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      if (type === "match_pairs"){
        renderMatchPairs(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      if (type === "number_line"){
        renderNumberLine(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      if (type === "interactive_drag"){
        renderInteractiveDrag(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      renderUnknown(step);
      nextBtn.textContent = "➡️ Next";
    }

    async function completeLesson(){
      contextLine.textContent = `Saved ✅ ${childName} finished "${lesson?.title || "Lesson"}".`;
      lessonTextEl.textContent =
        `Nice work, ${childName}.\n\nThat lesson is finished.\n\nNext time, you can do another short lesson.`;
      mcqEl.style.display = "none";
      clearInteractive();
      nextBtn.disabled = true;
      backBtn.disabled = true;
      hintLine.textContent = "You can go back to Lessons or Dashboard.";
    }

    // ----- Read aloud -----
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          const t = await r.text().catch(()=> "");
          console.warn("TTS failed", r.status, t);
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };

        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    // Controls
    backBtn.addEventListener("click", () => {
      if (idx > 0){
        idx -= 1;
        renderStep();
      }
    });

    nextBtn.addEventListener("click", async () => {
      const step = steps[idx];
      const type = String(step?.type || "");

      // gate interactive and mcq
      const needsAnswer = ["mcq","fill_blank","match_pairs","number_line","interactive_drag"].includes(type);
      if (needsAnswer && !stepIsAnswered(idx)){
        hintLine.textContent = "Do this step first 💛";
        return;
      }

      if (type === "finish"){
        await completeLesson();
        return;
      }

      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      }
    });

    finishBtn.addEventListener("click", () => {
      window.location.href = "/lessons.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Read the step\n" +
        "• Do the activity\n" +
        "• Press Next\n\n" +
        "No pressure. You can finish any time.\n\n" +
        "Tip: Read aloud plays only when you press the button."
      );
    });

    speakBtn.addEventListener("click", speakCurrent);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      clearWarn();
      contextLine.textContent = `Loading a lesson for ${childName}…`;

      // fetch generated lesson
      try{
        lesson = await fetchGeneratedLesson();
      }catch(e){
        console.error(e);
        showError("Could not load a lesson: " + (e?.message || e));
        lessonTextEl.textContent =
          "We couldn’t load a lesson.\n\n" +
          "Try again in a moment.\n\n" +
          "If it keeps failing, the generator worker may be rejecting the request.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      steps = lesson.steps || [];
      if (!steps.length){
        showError("Lesson returned no steps.");
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      // reset runtime
      idx = 0;
      xp = 0;
      stepAnswers = {};

      const title = lesson.title ? ` — ${lesson.title}` : "";
      contextLine.textContent = `${SUBJECT} • ${AREA}${title}`;
      nextBtn.disabled = false;
      backBtn.disabled = false;
      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong: " + (err?.message || err));
    });
  })();
  </script>
</body>
</html>
