<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learnlio — Lesson</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/open-dyslexic.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#f6f7ff; --bg2:#f9fafb; --card:#fff; --ink:#0f172a; --muted:#64748b;
      --border:rgba(15, 23, 42, .10);
      --shadow: 0 20px 45px rgba(2, 6, 23, .10);
      --shadow2: 0 10px 25px rgba(2, 6, 23, .08);
      --brand:#0b5cff; --brand2:#2f7bff;
      --soft:#eef2ff; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
      --radius:20px; --radius2:16px;
      --vh: 1vh;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 10% 0%, rgba(47,123,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(16,185,129,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (min-width: 981px){ body{ overflow:hidden; } }

    /* Logged-in nav (same as Tutor) */
    .nav{ background:#fff; border-bottom:1px solid rgba(15,23,42,.08); position:sticky; top:0; z-index:50; }
    .nav-inner{ max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:900; letter-spacing:.2px; }
    .brand img{ height:34px; width:auto; display:block; }
    .links{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .links a{ text-decoration:none; color:var(--ink); padding:9px 10px; border-radius:12px; font-size:14px; }
    .links a.active{ background:var(--soft); }
    .btn{ background:linear-gradient(180deg, var(--brand2), var(--brand)); border:none; color:#fff; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; box-shadow: 0 10px 18px rgba(11,92,255,.22); }
    .btn.light{ background:#e5e7eb; color:#111; box-shadow:none; }
    .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,.12); color:var(--ink); box-shadow:none; }

    .container{ max-width:1140px; margin:0 auto; padding:16px 16px 20px; }

    .shell{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      align-items:stretch;
      height: calc((var(--vh) * 100) - 78px - 36px);
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .shell{ grid-template-columns: 1fr; height:auto; min-height: unset; }
    }

    .panel{
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel-head{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title{ font-weight:950; letter-spacing:-.2px; font-size: 16px; display:flex; gap:8px; align-items:center; }
    .subtitle{ color:var(--muted); font-size: 12.5px; line-height:1.4; margin-top:2px; }
    .status{ margin-top:6px; font-size:12.5px; }
    .status.bad{ color:var(--bad); font-weight:800; }

    .stage{
      padding:12px;
      flex: 1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      overflow:hidden;
    }

    .cardbox{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248,250,252,.88);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius2);
      padding: 12px;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lessonText{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: clamp(15px, 1.2vw, 17px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .mcq{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:4px;
    }
    .mcq-opt{
      background:#fff;
      border:1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      text-align:left;
      display:flex;
      gap:10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      font-weight:900;
    }
    .mcq-opt:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(2,6,23,.10);
      border-color: rgba(11,92,255,.22);
    }
    .mcq-letter{
      width:28px; height:28px; border-radius: 10px;
      background: var(--soft);
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;
      font-weight:950;
    }
    .mcq-text{ line-height:1.45; }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(15,23,42,.08);
      background: rgba(255,255,255,.92);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      color:var(--ink);
      cursor:pointer;
      font-weight:950;
      font-size: 13px;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
    }
    .pill.primary{
      background: var(--soft);
      border-color: rgba(11,92,255,.18);
    }
    .pill:disabled{ opacity:.55; cursor:not-allowed; }

    /* Side panel */
    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
    .sideCard{
      background: rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 12px;
    }
    .sideCard h3{
      margin:0 0 6px;
      font-size: 13px;
      letter-spacing:.2px;
      color: var(--muted);
      font-weight:950;
      text-transform: uppercase;
    }
    .kpi{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:8px; }
    .kpi strong{ font-size: 16px; font-weight:950; }
    .kpi span{ font-size: 13px; color:var(--muted); font-weight:850; }

    .bar{
      height: 10px;
      background: rgba(15,23,42,.08);
      border-radius: 999px;
      overflow:hidden;
      margin-top:10px;
    }
    .bar > div{
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 999px;
    }

    .tiny{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    /* ===== Interactive widgets ===== */
    .widget{
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
    }
    .widget h4{
      margin:0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing:.25px;
      color: var(--muted);
      font-weight: 950;
    }
    .widget .prompt{
      font-family:'OpenDyslexic', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .inputRow{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .textInput{
      flex: 1 1 180px;
      border:1px solid rgba(15,23,42,.14);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 15px;
      outline:none;
    }

    /* Number line */
    .numline{
      margin-top:12px;
      background: rgba(248,250,252,.95);
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
    }
    .ticks{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-top:8px;
      font-weight:950;
      color: var(--muted);
      font-size: 12.5px;
      user-select:none;
    }
    .lineRow{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:10px;
    }
    .lineBtn{
      width:44px; height:44px;
      border-radius: 16px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
      cursor:pointer;
      font-weight:950;
      font-size: 18px;
    }
    .lineBtn:disabled{ opacity:.45; cursor:not-allowed; }
    .lineTrack{
      flex:1 1 auto;
      height: 12px;
      border-radius: 999px;
      background: rgba(15,23,42,.10);
      position:relative;
      overflow:hidden;
    }
    .lineFill{
      height:12px;
      width:0%;
      background: linear-gradient(90deg, rgba(47,123,255,.65), rgba(11,92,255,.85));
      border-radius:999px;
    }
    .lineBubble{
      margin-top:10px;
      padding:10px 12px;
      border-radius: 16px;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      font-weight:950;
      box-shadow: 0 10px 18px rgba(2,6,23,.06);
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    /* Match pairs */
    .pairs{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 520px){
      .pairs{ grid-template-columns: 1fr; }
    }
    .pairCol{
      background: rgba(248,250,252,.95);
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
    }
    .pairCol h5{
      margin:0 0 10px;
      font-size:12.5px;
      color: var(--muted);
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing:.2px;
    }
    .pairItem{
      width:100%;
      text-align:left;
      border-radius: 16px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      padding: 12px 12px;
      cursor:pointer;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
      font-weight:950;
      margin-bottom:10px;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .pairItem:last-child{ margin-bottom:0; }
    .pairDot{
      width:28px; height:28px;
      border-radius: 12px;
      background: var(--soft);
      border:1px solid rgba(15,23,42,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:950;
      flex:0 0 auto;
    }
    .pairItem.selected{
      border-color: rgba(11,92,255,.30);
      box-shadow: 0 16px 26px rgba(2,6,23,.10);
      transform: translateY(-1px);
    }
    .pairItem.done{
      opacity:.65;
      cursor:default;
    }
    .pairSummary{
      margin-top:10px;
      color: var(--muted);
      font-size: 13px;
      line-height:1.6;
    }

    /* Drag & drop */
    .dragWrap{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      align-items:start;
    }
    @media (max-width: 720px){
      .dragWrap{ grid-template-columns: 1fr; }
    }
    .dragBank, .dropZones{
      background: rgba(248,250,252,.95);
      border:1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      padding: 12px;
    }
    .dragBank h5, .dropZones h5{
      margin:0 0 10px;
      font-size:12.5px;
      color: var(--muted);
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing:.2px;
    }
    .dragItem{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
      cursor:grab;
      font-weight:950;
      margin: 0 10px 10px 0;
      user-select:none;
    }
    .dropZone{
      border:2px dashed rgba(15,23,42,.18);
      border-radius: 16px;
      padding: 12px;
      background:#fff;
      margin-bottom:10px;
      min-height: 60px;
      box-shadow: 0 10px 14px rgba(2,6,23,.05);
    }
    .dropZone:last-child{ margin-bottom:0; }
    .dropTitle{
      color: var(--muted);
      font-size: 13px;
      font-weight: 950;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing:.2px;
    }
    .droppedPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius: 999px;
      border:1px solid rgba(15,23,42,.12);
      background: rgba(11,92,255,.08);
      box-shadow: 0 10px 14px rgba(2,6,23,.06);
      font-weight:950;
      user-select:none;
      margin-right:10px;
      margin-bottom:10px;
    }
    .zoneOver{
      border-color: rgba(11,92,255,.45);
      background: rgba(11,92,255,.05);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/dash.html" aria-label="Learnlio home">
        <img src="/assets/img/logo.webp" alt="Learnlio" onerror="this.style.display='none'">
        <span>Learnlio</span>
      </a>
      <nav class="links">
        <a href="/dash.html">Dashboard</a>
        <a href="/chat.html">Tutor</a>
        <a class="active" href="/lessons.html">Lessons</a>
        <a class="btn light" id="logoutBtn" href="javascript:void(0)">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="shell">
      <!-- Lesson -->
      <section class="panel" aria-label="Learnlio Lesson">
        <div class="panel-head">
          <div>
            <div class="title">📘 Lesson</div>
            <div id="contextLine" class="subtitle">Loading your lesson…</div>
            <div id="pageError" class="status bad" style="display:none;"></div>
          </div>
          <div class="row">
            <button id="speakBtn" class="btn ghost" type="button">🔊 Read aloud</button>
            <button id="helpBtn" class="btn ghost" type="button">Help</button>
          </div>
        </div>

        <div class="stage">
          <div id="cardbox" class="cardbox">
            <div id="lessonText" class="lessonText"></div>
            <div id="mcq" class="mcq" style="display:none;"></div>
            <div id="interactiveMount" style="display:none;"></div>
          </div>

          <div class="controls">
            <button id="backBtn" class="pill" type="button">⬅️ Back</button>
            <button id="nextBtn" class="pill primary" type="button">➡️ Next</button>
            <span id="hintLine" class="tiny" style="margin-left:auto;"></span>
          </div>
        </div>
      </section>

      <!-- Progress -->
      <aside class="panel" aria-label="Lesson progress">
        <div class="panel-head">
          <div>
            <div class="title">✨ Your progress</div>
            <div class="subtitle">Just steady effort. No pressure.</div>
          </div>
        </div>

        <div class="side">
          <div class="sideCard">
            <h3>Lesson</h3>
            <div class="kpi">
              <strong id="stepKpi">0 / 0</strong>
              <span id="topicKpi">—</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="tiny" id="xpLine">XP: 0</div>
          </div>

          <div class="sideCard">
            <h3>What we’re practising</h3>
            <div class="tiny" id="practiceLine">—</div>
          </div>

          <div class="sideCard">
            <h3>Quick actions</h3>
            <div class="row" style="margin-top:10px;">
              <button id="finishBtn" class="pill" type="button">✅ Finish</button>
              <a class="pill" href="/lessons.html" style="display:inline-flex; align-items:center;">📘 Lessons</a>
              <a class="pill" href="/dash.html" style="display:inline-flex; align-items:center;">🏠 Dashboard</a>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (() => {
    // iOS vh fix
    function setVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
    setVh(); window.addEventListener('resize', setVh);

    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = "https://jesuzdpivwsprkmqmoab.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7y2jcI_sLwLG-8IHMI3WMw_7Y8IFUdL";

    // Lesson generation Worker
    const LESSON_GEN_URL = "https://learnlio-lessons.falling-grass-34ab.workers.dev/generate";

    // Google TTS Worker
    const TTS_URL = "https://learnlio-tts.falling-grass-34ab.workers.dev/speak";
    // =========================

    const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI
    const pageError = document.getElementById("pageError");
    const contextLine = document.getElementById("contextLine");
    const lessonTextEl = document.getElementById("lessonText");
    const mcqEl = document.getElementById("mcq");
    const interactiveMount = document.getElementById("interactiveMount");
    const hintLine = document.getElementById("hintLine");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const helpBtn = document.getElementById("helpBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const speakBtn = document.getElementById("speakBtn");

    const stepKpi = document.getElementById("stepKpi");
    const topicKpi = document.getElementById("topicKpi");
    const barFill = document.getElementById("barFill");
    const xpLine = document.getElementById("xpLine");
    const practiceLine = document.getElementById("practiceLine");

    function showError(msg){ pageError.style.display="block"; pageError.textContent = msg; }
    function clearError(){ pageError.style.display="none"; pageError.textContent = ""; }

    // Auth/child
    let currentUser = null;
    let child = null;
    let childName = "Child";
    let childAge = 10;

    // Context
    let SUBJECT = null;
    let AREA = null;

    // Lesson runtime
    let lesson = null;         // { title, steps }
    let steps = [];
    let idx = 0;
    let stepAnswers = {};      // stepIndex -> {type, ...}
    let xp = 0;

    // Per-step “done” flag for interactive types
    let stepReadyForNext = false;

    // Audio
    let currentAudio = null;

    function computeAgeFromDob(dobStr){
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return 10;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return Math.max(4, Math.min(18, age));
    }

    function getSelectedChildFromLocalStorage(){
      try {
        const raw = localStorage.getItem("selectedChild");
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function lessonCtxKey(childId){
      return childId ? `learnlio_lesson_ctx_${childId}` : `learnlio_lesson_ctx`;
    }

    function loadCtxFromLocalStorage(childId){
      try{
        const raw = localStorage.getItem(lessonCtxKey(childId));
        if (!raw) return null;
        return JSON.parse(raw);
      }catch{ return null; }
    }

    function parseUrlContext(){
      const u = new URL(window.location.href);
      SUBJECT = u.searchParams.get("subject");
      AREA = u.searchParams.get("area");
    }

    async function requireAuth(){
      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user){
        window.location.href = "/login.html";
        return false;
      }
      currentUser = data.user;
      return true;
    }

    async function loadChildProfile(){
      const selected = getSelectedChildFromLocalStorage();
      if (!selected?.id){
        showError("No child selected. Go to Dashboard and click Select on a child.");
        return false;
      }

      const { data, error } = await sb
        .from("children")
        .select("id, parent_user_id, child_name, child_dob")
        .eq("id", selected.id)
        .single();

      if (error || !data){
        showError("Could not load child profile. Please re-select the child on Dashboard.");
        return false;
      }
      if (data.parent_user_id !== currentUser.id){
        showError("This child profile does not belong to this account.");
        return false;
      }

      child = data;
      childName = child.child_name || "Child";
      childAge = computeAgeFromDob(child.child_dob);
      return true;
    }

    function ensureSubjectAreaFromStorageIfMissing(){
      if (SUBJECT && AREA) return;
      const ctx = loadCtxFromLocalStorage(child?.id);
      if (ctx?.subject && ctx?.area){
        SUBJECT = SUBJECT || ctx.subject;
        AREA = AREA || ctx.area;
      }
    }

    function setProgressUI(){
      const total = steps.length || 0;
      stepKpi.textContent = `${Math.min(idx+1,total)} / ${total}`;
      topicKpi.textContent = `${SUBJECT} • ${AREA}`;
      practiceLine.textContent = `${SUBJECT} practice: ${AREA}`;
      const pct = total ? Math.round(((idx) / total) * 100) : 0;
      barFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      xpLine.textContent = `XP: ${xp}`;
    }

    function clearInteractive(){
      interactiveMount.style.display = "none";
      interactiveMount.innerHTML = "";
      stepReadyForNext = false;
    }

    // -------------------------
    // LESSON GEN (Worker)
    // -------------------------
    async function fetchGeneratedLesson(){
      const payload = {
        ownerId: currentUser.id,
        childId: child.id,
        childName,
        age: childAge,
        subject: SUBJECT,
        area: AREA,
        wantInteractive: true,
        allowedTypes: ["intro","teach","mcq","fill_blank","match_pairs","number_line","interactive_drag","finish"]
      };

      const r = await fetch(LESSON_GEN_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const text = await r.text().catch(()=> "");
      let json = null;
      try{ json = text ? JSON.parse(text) : null; }catch{}

      if (!r.ok){
        const msg = json?.error || text || `Lesson generation failed (${r.status})`;
        throw new Error(msg);
      }

      if (!json?.steps || !Array.isArray(json.steps) || !json.steps.length){
        throw new Error("Lesson worker returned no steps.");
      }

      return json;
    }

    // -------------------------
    // Helpers
    // -------------------------
    function norm(s){
      return String(s ?? "").trim().toLowerCase();
    }
    function letters(i){
      return String.fromCharCode("A".charCodeAt(0) + i);
    }
    function markStepDone(answerObj, isCorrect = null){
      stepAnswers[idx] = { ...answerObj, isCorrect };
      stepReadyForNext = true;
      // gentle XP: reward completion more than correctness
      if (isCorrect === true) xp += 10;
      else if (isCorrect === false) xp += 6;
      else xp += 8;
      setProgressUI();
    }

    // -------------------------
    // INTERACTIVE WIDGETS
    // -------------------------
    function renderFillBlank(step){
      // Expected step shape:
      // { type:"fill_blank", prompt:"2 + __ = 7", answer:"5", accept:["5","five"], caseSensitive:false }
      const corrects = new Set(
        (Array.isArray(step.accept) ? step.accept : [step.answer])
          .filter(Boolean)
          .map(v => step.caseSensitive ? String(v).trim() : norm(v))
      );

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Fill the blank</h4>
          <div class="prompt">${escapeHtml(step.prompt || "Type your answer.")}</div>
          <div class="inputRow">
            <input id="fbInput" class="textInput" inputmode="text" autocomplete="off" placeholder="Type here…" />
            <button id="fbCheck" class="pill primary" type="button">✅ Check</button>
          </div>
          <div id="fbMsg" class="tiny"></div>
        </div>
      `;

      const input = document.getElementById("fbInput");
      const btn = document.getElementById("fbCheck");
      const msg = document.getElementById("fbMsg");

      const prev = stepAnswers[idx];
      if (prev?.type === "fill_blank"){
        input.value = prev.value || "";
        if (typeof prev.isCorrect === "boolean"){
          msg.textContent = prev.isCorrect ? "Nice — that works ✅" : "Good try 💛 Have another go, or press Next if you want to move on.";
          stepReadyForNext = true;
        }
      }

      function check(){
        const raw = input.value ?? "";
        const v = step.caseSensitive ? String(raw).trim() : norm(raw);

        if (!String(raw).trim()){
          msg.textContent = "Type something first 💛";
          return;
        }

        const ok = corrects.size ? corrects.has(v) : false;
        msg.textContent = ok ? "Nice — that works ✅" : "Good try 💛";
        markStepDone({ type:"fill_blank", value:String(raw).trim() }, ok);
        hintLine.textContent = ok ? "Nice work ✅" : "Good try 💛";
      }

      btn.addEventListener("click", check);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") check();
      });
    }

    function renderNumberLine(step){
      // Expected step shape:
      // { type:"number_line", prompt:"Move to 15", min:10, max:20, start:12, target:15, step:1 }
      const min = Number.isFinite(+step.min) ? +step.min : 0;
      const max = Number.isFinite(+step.max) ? +step.max : (min + 10);
      const inc = Number.isFinite(+step.step) ? +step.step : 1;
      const target = Number.isFinite(+step.target) ? +step.target : min;
      let pos = Number.isFinite(+step.start) ? +step.start : min;

      pos = Math.max(min, Math.min(max, pos));

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Number line</h4>
          <div class="prompt">${escapeHtml(step.prompt || `Move to ${target}.`)}</div>

          <div class="numline">
            <div class="ticks">
              <span>${min}</span><span>${Math.round((min+max)/2)}</span><span>${max}</span>
            </div>

            <div class="lineRow">
              <button id="nlMinus" class="lineBtn" type="button">−</button>
              <div class="lineTrack"><div id="nlFill" class="lineFill"></div></div>
              <button id="nlPlus" class="lineBtn" type="button">+</button>
            </div>

            <div class="lineBubble">
              <span>You're on:</span>
              <span id="nlPos">${pos}</span>
              <span style="color:var(--muted); font-weight:950;">•</span>
              <span>Target:</span>
              <span>${target}</span>
              <button id="nlCheck" class="pill primary" type="button" style="margin-left:auto;">✅ Check</button>
            </div>

            <div id="nlMsg" class="tiny"></div>
          </div>
        </div>
      `;

      const minus = document.getElementById("nlMinus");
      const plus = document.getElementById("nlPlus");
      const fill = document.getElementById("nlFill");
      const posEl = document.getElementById("nlPos");
      const checkBtn = document.getElementById("nlCheck");
      const msg = document.getElementById("nlMsg");

      const prev = stepAnswers[idx];
      if (prev?.type === "number_line" && Number.isFinite(+prev.pos)){
        pos = Math.max(min, Math.min(max, +prev.pos));
      }

      function update(){
        posEl.textContent = String(pos);
        const pct = (max === min) ? 0 : ((pos - min) / (max - min)) * 100;
        fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
        minus.disabled = (pos <= min);
        plus.disabled = (pos >= max);
      }

      function check(){
        const ok = pos === target;
        msg.textContent = ok ? "Nice — you landed on the target ✅" : "Not quite — try moving a little more 💛";
        markStepDone({ type:"number_line", pos }, ok);
        hintLine.textContent = ok ? "Nice work ✅" : "Good try 💛";
      }

      minus.addEventListener("click", () => { pos = Math.max(min, pos - inc); update(); });
      plus.addEventListener("click", () => { pos = Math.min(max, pos + inc); update(); });
      checkBtn.addEventListener("click", check);

      update();
    }

    function renderMatchPairs(step){
      // Expected step shape:
      // { type:"match_pairs", prompt:"Match the pairs", pairs:[{left:"7+2", right:"9"}, ...] }
      const pairs = Array.isArray(step.pairs) ? step.pairs : [];
      const leftItems = pairs.map((p, i) => ({ i, text: String(p.left ?? "") }));
      const rightItems = pairs.map((p, i) => ({ i, text: String(p.right ?? "") }));

      // shuffle rights for game feel
      shuffleInPlace(rightItems);

      let selectedLeft = null;
      let selectedRight = null;

      // track matches by left index -> right index
      const matches = new Map();

      const prev = stepAnswers[idx];
      if (prev?.type === "match_pairs" && prev.matches && typeof prev.matches === "object"){
        try{
          Object.entries(prev.matches).forEach(([k, v]) => {
            const li = Number(k);
            const ri = Number(v);
            if (Number.isFinite(li) && Number.isFinite(ri)) matches.set(li, ri);
          });
        }catch{}
      }

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Match pairs</h4>
          <div class="prompt">${escapeHtml(step.prompt || "Tap one from the left, then one from the right.")}</div>

          <div class="pairs">
            <div class="pairCol">
              <h5>Left</h5>
              <div id="leftList"></div>
            </div>

            <div class="pairCol">
              <h5>Right</h5>
              <div id="rightList"></div>
            </div>
          </div>

          <div id="mpMsg" class="pairSummary"></div>
          <div class="inputRow" style="margin-top:10px;">
            <button id="mpCheck" class="pill primary" type="button">✅ Check</button>
            <button id="mpReset" class="pill" type="button">↩ Reset</button>
          </div>
        </div>
      `;

      const leftList = document.getElementById("leftList");
      const rightList = document.getElementById("rightList");
      const msg = document.getElementById("mpMsg");
      const checkBtn = document.getElementById("mpCheck");
      const resetBtn = document.getElementById("mpReset");

      function renderLists(){
        leftList.innerHTML = "";
        rightList.innerHTML = "";

        leftItems.forEach((it, idxL) => {
          const isDone = matches.has(it.i);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pairItem" + (selectedLeft === it.i ? " selected" : "") + (isDone ? " done" : "");
          btn.innerHTML = `<span class="pairDot">${idxL+1}</span><span>${escapeHtml(it.text)}</span>`;
          btn.disabled = isDone;
          btn.addEventListener("click", () => {
            selectedLeft = it.i;
            renderLists();
          });
          leftList.appendChild(btn);
        });

        rightItems.forEach((it, idxR) => {
          const isUsed = [...matches.values()].includes(it.i);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pairItem" + (selectedRight === it.i ? " selected" : "") + (isUsed ? " done" : "");
          btn.innerHTML = `<span class="pairDot">${letters(idxR)}</span><span>${escapeHtml(it.text)}</span>`;
          btn.disabled = isUsed;
          btn.addEventListener("click", () => {
            selectedRight = it.i;
            renderLists();
          });
          rightList.appendChild(btn);
        });

        // if both selected, commit match
        if (selectedLeft !== null && selectedRight !== null){
          matches.set(selectedLeft, selectedRight);
          selectedLeft = null;
          selectedRight = null;
          renderLists();
        }

        const total = pairs.length;
        const done = matches.size;
        msg.textContent = total ? `Matched ${done} of ${total}.` : "No pairs provided.";
      }

      function check(){
        const total = pairs.length;
        if (!total){
          msg.textContent = "No pairs to match.";
          markStepDone({ type:"match_pairs", matches: {} }, null);
          return;
        }
        if (matches.size < total){
          msg.textContent = "Match them all first 💛";
          hintLine.textContent = "Match them all first 💛";
          return;
        }

        // score: correct if the matched right index equals the same pair index
        let correct = 0;
        pairs.forEach((p, i) => {
          const ri = matches.get(i);
          if (ri === i) correct += 1;
        });

        const score = correct / total;
        const ok = score >= 0.75; // gentle threshold
        msg.textContent = ok
          ? "Nice — those matches look good ✅"
          : "Good try 💛 Some pairs might be swapped.";

        const out = {};
        matches.forEach((v,k)=> out[String(k)] = v);
        markStepDone({ type:"match_pairs", matches: out, correct, total }, ok);
        hintLine.textContent = ok ? "Nice work ✅" : "Good try 💛";
      }

      function reset(){
        matches.clear();
        selectedLeft = null;
        selectedRight = null;
        renderLists();
        msg.textContent = "Reset. Start again when you’re ready.";
        stepReadyForNext = false;
      }

      checkBtn.addEventListener("click", check);
      resetBtn.addEventListener("click", reset);

      renderLists();
      // If already answered, allow next
      if (prev?.type === "match_pairs" && prev.matches){
        stepReadyForNext = true;
      }
    }

    function renderInteractiveDrag(step){
      // Expected step shape:
      // {
      //   type:"interactive_drag",
      //   prompt:"Drag each answer into the right box",
      //   items:[{id:"a", text:"5"}, ...],
      //   zones:[{id:"z1", label:"7+?=12", accept:["a"]}, ...]
      // }
      const items = Array.isArray(step.items) ? step.items.map(x => ({ id:String(x.id), text:String(x.text ?? "") })) : [];
      const zones = Array.isArray(step.zones) ? step.zones.map(z => ({
        id:String(z.id),
        label:String(z.label ?? "Drop here"),
        accept: Array.isArray(z.accept) ? z.accept.map(String) : []
      })) : [];

      const prev = stepAnswers[idx];
      // placements: zoneId -> itemId
      const placements = new Map();
      if (prev?.type === "interactive_drag" && prev.placements && typeof prev.placements === "object"){
        try{
          Object.entries(prev.placements).forEach(([z, it]) => placements.set(String(z), String(it)));
        }catch{}
      }

      interactiveMount.style.display = "block";
      interactiveMount.innerHTML = `
        <div class="widget">
          <h4>Drag and drop</h4>
          <div class="prompt">${escapeHtml(step.prompt || "Drag items into the boxes.")}</div>

          <div class="dragWrap">
            <div class="dragBank">
              <h5>Drag these</h5>
              <div id="dragItems"></div>
              <div class="tiny">Tip: On mobile, you can tap an item, then tap a box.</div>
            </div>

            <div class="dropZones">
              <h5>Drop into</h5>
              <div id="zones"></div>
            </div>
          </div>

          <div class="inputRow" style="margin-top:10px;">
            <button id="dragCheck" class="pill primary" type="button">✅ Check</button>
            <button id="dragReset" class="pill" type="button">↩ Reset</button>
          </div>

          <div id="dragMsg" class="tiny"></div>
        </div>
      `;

      const dragItemsEl = document.getElementById("dragItems");
      const zonesEl = document.getElementById("zones");
      const checkBtn = document.getElementById("dragCheck");
      const resetBtn = document.getElementById("dragReset");
      const msg = document.getElementById("dragMsg");

      // Mobile-friendly fallback: tap item then tap zone
      let tapSelectedItemId = null;

      function placedItemIds(){
        return new Set([...placements.values()]);
      }

      function render(){
        dragItemsEl.innerHTML = "";
        zonesEl.innerHTML = "";

        const used = placedItemIds();

        items.forEach(it => {
          if (used.has(it.id)) return; // already placed
          const pill = document.createElement("div");
          pill.className = "dragItem";
          pill.textContent = it.text;
          pill.draggable = true;

          pill.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", it.id);
          });

          pill.addEventListener("click", () => {
            tapSelectedItemId = it.id;
            msg.textContent = `Selected: ${it.text}. Now tap a box.`;
          });

          dragItemsEl.appendChild(pill);
        });

        zones.forEach(z => {
          const zone = document.createElement("div");
          zone.className = "dropZone";
          zone.dataset.zone = z.id;

          zone.innerHTML = `
            <div class="dropTitle">${escapeHtml(z.label)}</div>
            <div class="zoneBody"></div>
          `;

          const body = zone.querySelector(".zoneBody");
          const placed = placements.get(z.id);
          if (placed){
            const it = items.find(x => x.id === placed);
            const chip = document.createElement("div");
            chip.className = "droppedPill";
            chip.textContent = it ? it.text : placed;
            chip.title = "Click to remove";
            chip.addEventListener("click", () => {
              placements.delete(z.id);
              render();
              msg.textContent = "Removed. You can try a different one.";
              stepReadyForNext = false;
            });
            body.appendChild(chip);
          } else {
            body.innerHTML = `<span class="tiny" style="display:inline-block; margin-top:4px;">Drop here</span>`;
          }

          // Drag-over behavior
          zone.addEventListener("dragover", (e) => {
            e.preventDefault();
            zone.classList.add("zoneOver");
          });
          zone.addEventListener("dragleave", () => zone.classList.remove("zoneOver"));
          zone.addEventListener("drop", (e) => {
            e.preventDefault();
            zone.classList.remove("zoneOver");
            const itemId = e.dataTransfer.getData("text/plain");
            if (!itemId) return;
            placements.set(z.id, itemId);
            render();
            stepReadyForNext = false;
          });

          // Tap-to-place behavior
          zone.addEventListener("click", () => {
            if (!tapSelectedItemId) return;
            placements.set(z.id, tapSelectedItemId);
            tapSelectedItemId = null;
            render();
            msg.textContent = "Placed. You can select another item.";
            stepReadyForNext = false;
          });

          zonesEl.appendChild(zone);
        });

        const total = zones.length;
        const done = placements.size;
        msg.textContent = msg.textContent || `Placed ${done} of ${total}.`;
      }

      function check(){
        if (!zones.length){
          markStepDone({ type:"interactive_drag", placements: {} }, null);
          msg.textContent = "No boxes were provided.";
          return;
        }
        if (placements.size < zones.length){
          msg.textContent = "Fill every box first 💛";
          hintLine.textContent = "Fill every box first 💛";
          return;
        }

        let correct = 0;
        zones.forEach(z => {
          const placed = placements.get(z.id);
          if (z.accept.includes(placed)) correct += 1;
        });

        const score = correct / zones.length;
        const ok = score >= 0.75;
        msg.textContent = ok ? "Nice — those look right ✅" : "Good try 💛 Some items might be in the wrong box.";

        const out = {};
        placements.forEach((v,k)=> out[k] = v);
        markStepDone({ type:"interactive_drag", placements: out, correct, total: zones.length }, ok);
        hintLine.textContent = ok ? "Nice work ✅" : "Good try 💛";
      }

      function reset(){
        placements.clear();
        tapSelectedItemId = null;
        msg.textContent = "Reset. Start again when you’re ready.";
        stepReadyForNext = false;
        render();
      }

      checkBtn.addEventListener("click", check);
      resetBtn.addEventListener("click", reset);

      render();
      if (prev?.type === "interactive_drag" && prev.placements){
        stepReadyForNext = true;
      }
    }

    // -------------------------
    // RENDER
    // -------------------------
    function renderStep(){
      clearError();
      hintLine.textContent = "";
      mcqEl.innerHTML = "";
      mcqEl.style.display = "none";
      clearInteractive();

      if (!steps.length){
        lessonTextEl.textContent = "No lesson steps found.";
        return;
      }

      const step = steps[idx];
      setProgressUI();

      if (!step){
        lessonTextEl.textContent = "Finished.";
        return;
      }

      // default: allow next for text steps
      stepReadyForNext = (step.type === "intro" || step.type === "teach" || step.type === "finish");

      // Text
      if (step.type === "intro" || step.type === "teach" || step.type === "finish"){
        lessonTextEl.textContent = step.text || "";
        nextBtn.textContent = (step.type === "finish") ? "✅ Complete" : "➡️ Next";
        if (step.type === "finish") hintLine.textContent = "Tap complete to finish this lesson.";
        return;
      }

      // MCQ
      if (step.type === "mcq"){
        lessonTextEl.textContent = step.prompt || "";
        mcqEl.style.display = "grid";
        const lettersArr = ["A","B","C","D","E","F"];
        (step.choices || []).forEach((choice, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-opt";
          btn.innerHTML = `<span class="mcq-letter">${lettersArr[i] || ""}</span><span class="mcq-text">${escapeHtml(choice)}</span>`;
          btn.addEventListener("click", () => chooseMCQ(i));
          mcqEl.appendChild(btn);
        });

        const saved = stepAnswers[idx];
        if (saved && saved.type === "mcq"){
          hintLine.textContent = saved.isCorrect ? "Nice — that was correct ✅" : "That one was tricky — keep going 💛";
          stepReadyForNext = true;
        } else {
          stepReadyForNext = false;
        }
        nextBtn.textContent = "➡️ Next";
        return;
      }

      // Interactive step types
      lessonTextEl.textContent = step.prompt || "";

      if (step.type === "fill_blank"){
        renderFillBlank(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      if (step.type === "number_line"){
        renderNumberLine(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      if (step.type === "match_pairs"){
        renderMatchPairs(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      if (step.type === "interactive_drag"){
        renderInteractiveDrag(step);
        nextBtn.textContent = "➡️ Next";
        return;
      }

      lessonTextEl.textContent = "Unknown step type.";
    }

    function chooseMCQ(pickedIndex){
      const step = steps[idx];
      if (!step || step.type !== "mcq") return;

      const correctIndex = Number(step.correctIndex);
      const isCorrect = pickedIndex === correctIndex;

      xp += isCorrect ? 10 : 6;
      stepAnswers[idx] = { type:"mcq", pickedIndex, isCorrect };
      stepReadyForNext = true;

      hintLine.textContent = isCorrect ? "Nice work ✅" : "Good try 💛";
      setProgressUI();
    }

    async function completeLesson(){
      contextLine.textContent = `Saved ✅ ${childName} finished "${lesson?.title || "Lesson"}".`;
      lessonTextEl.textContent =
        `Nice work, ${childName}.\n\nThat lesson is finished.\n\nNext time, you can do another short lesson.`;
      mcqEl.style.display = "none";
      clearInteractive();

      nextBtn.disabled = true;
      backBtn.disabled = true;
      hintLine.textContent = "You can go back to Lessons or Dashboard.";
    }

    // ----- Read aloud -----
    function stripEmojis(text){
      return String(text || "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{26FF}]/gu, "")
        .replace(/[\u{2700}-\u{27BF}]/gu, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    async function speakCurrent(){
      try{
        const step = steps[idx];
        if (!step) return;

        let text = "";
        if (step.type === "mcq") text = step.prompt || "";
        else if (step.text) text = step.text;
        else if (step.prompt) text = step.prompt;
        else text = lessonTextEl.textContent || "";

        text = stripEmojis(text);
        if (!text) return;

        if (currentAudio){
          try{ currentAudio.pause(); }catch{}
          currentAudio = null;
        }

        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking…";

        const r = await fetch(TTS_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ text, languageCode: "en-GB" })
        });

        if (!r.ok){
          const t = await r.text().catch(()=> "");
          console.warn("TTS failed", r.status, t);
          hintLine.textContent = "Read aloud isn’t available right now.";
          return;
        }

        const buf = await r.arrayBuffer();
        const blob = new Blob([buf], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        currentAudio = audio;

        audio.onended = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
        };

        audio.onerror = () => {
          try{ URL.revokeObjectURL(url); }catch{}
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊 Read aloud";
          hintLine.textContent = "Read aloud isn’t available right now.";
        };

        await audio.play();
      } finally {
        setTimeout(() => {
          if (speakBtn.disabled && (!currentAudio || currentAudio.paused)){
            speakBtn.disabled = false;
            speakBtn.textContent = "🔊 Read aloud";
          }
        }, 600);
      }
    }

    // Controls
    backBtn.addEventListener("click", () => {
      if (idx > 0){ idx -= 1; renderStep(); }
    });

    nextBtn.addEventListener("click", async () => {
      const step = steps[idx];

      // Require completion for MCQ + interactive types
      const needsAnswer = ["mcq","fill_blank","match_pairs","number_line","interactive_drag"].includes(step?.type);
      if (needsAnswer && !stepReadyForNext){
        hintLine.textContent = "Do this step first 💛";
        return;
      }

      if (step?.type === "finish"){
        await completeLesson();
        return;
      }

      if (idx < steps.length - 1){
        idx += 1;
        renderStep();
      }
    });

    finishBtn.addEventListener("click", () => {
      window.location.href = "/lessons.html";
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "How lessons work:\n\n" +
        "• Read the step\n" +
        "• Do the activity (if shown)\n" +
        "• Press Next\n\n" +
        "No pressure. You can finish any time.\n\n" +
        "Tip: Read aloud plays only when you press the button."
      );
    });

    speakBtn.addEventListener("click", speakCurrent);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      localStorage.removeItem("selectedChild");
      window.location.href = "/login.html";
    });

    function escapeHtml(s){
      return String(s ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function shuffleInPlace(arr){
      for (let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function boot(){
      if (!sb){ showError("Supabase did not load."); return; }

      parseUrlContext();

      const ok = await requireAuth();
      if (!ok) return;

      const childOk = await loadChildProfile();
      if (!childOk) return;

      ensureSubjectAreaFromStorageIfMissing();

      if (!SUBJECT || !AREA){
        showError("Missing lesson context. Please go to Lessons and choose a subject + area.");
        contextLine.textContent = "Go back to Lessons to choose what to practise.";
        lessonTextEl.textContent = "We couldn’t see which subject/area you chose.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      clearError();
      contextLine.textContent = `Loading a lesson for ${childName}…`;

      try{
        lesson = await fetchGeneratedLesson();
      }catch(e){
        console.error(e);
        showError("Could not load a lesson right now.");
        lessonTextEl.textContent =
          "We couldn’t load a lesson.\n\n" +
          "Please try again in a moment.\n\n" +
          "If this keeps happening, the lesson generator worker may be offline.";
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      steps = lesson.steps || [];
      if (!steps.length){
        showError("Lesson returned no steps.");
        nextBtn.disabled = true;
        backBtn.disabled = true;
        return;
      }

      idx = 0;
      xp = 0;
      stepAnswers = {};
      stepReadyForNext = false;

      const title = lesson.title ? ` — ${lesson.title}` : "";
      contextLine.textContent = `${SUBJECT} • ${AREA}${title}`;
      nextBtn.disabled = false;
      backBtn.disabled = false;
      renderStep();
    }

    boot().catch(err => {
      console.error(err);
      showError("Something went wrong loading the lesson.");
    });
  })();
  </script>
</body>
</html>
